<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}svg{display:block}</style></head><body>
<svg width="1200" height="700" viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="700" fill="#fff"/>
<text x="60" y="58" fill="#0f7b6c" font-size="15" font-family="-apple-system,Helvetica,sans-serif" font-weight="600" letter-spacing="2.6">ONE CARD, TWO, OR THREE</text>
<text x="60" y="102" fill="#242424" font-size="34" font-family="-apple-system,Helvetica,sans-serif" font-weight="700" letter-spacing="-.8">More cards buy capability, not speed</text>
<line x1="60" y1="132" x2="1140" y2="132" stroke="#e8e8ea"/>
<rect x="60" y="160" width="340" height="330" rx="8" fill="#f7f7f8" stroke="#d9d9de"/>
<text x="230" y="196" text-anchor="middle" fill="#242424" font-size="19" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">1 card</text>
<rect x="196" y="214" width="68" height="42" rx="5" fill="#fff" stroke="#9a9a9a"/>
<text x="230" y="240" text-anchor="middle" fill="#5c5c5c" font-size="13" font-family="SF Mono,Menlo,monospace">8 GB</text>
<text x="230" y="294" text-anchor="middle" fill="#9a9a9a" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">HOLDS</text>
<text x="230" y="322" text-anchor="middle" fill="#242424" font-size="24" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">~40,000 tokens</text>
<text x="230" y="362" text-anchor="middle" fill="#9a9a9a" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">SO YOU GET</text>
<text x="230" y="390" text-anchor="middle" fill="#5c5c5c" font-size="16" font-family="-apple-system,Helvetica,sans-serif">15 s at 480p</text>
<text x="230" y="414" text-anchor="middle" fill="#5c5c5c" font-size="16" font-family="-apple-system,Helvetica,sans-serif">or 5 s at 720p</text>
<text x="230" y="440" text-anchor="middle" fill="#8f2020" font-size="16" font-family="-apple-system,Helvetica,sans-serif" font-weight="600">never both</text>
<text x="230" y="472" text-anchor="middle" fill="#0f7b6c" font-size="15" font-family="SF Mono,Menlo,monospace" font-weight="700">193 s / step</text>
<rect x="430" y="160" width="340" height="330" rx="8" fill="#ecf1fa" stroke="#2b5fa8"/>
<text x="600" y="196" text-anchor="middle" fill="#1c3f73" font-size="19" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">2 cards — ring</text>
<rect x="530" y="214" width="60" height="42" rx="5" fill="#fff" stroke="#2b5fa8"/>
<rect x="610" y="214" width="60" height="42" rx="5" fill="#fff" stroke="#2b5fa8"/>
<path d="M594,235 L606,235" stroke="#2b5fa8" stroke-width="2"/>
<text x="600" y="294" text-anchor="middle" fill="#3f5c8c" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">EACH HOLDS HALF</text>
<text x="600" y="322" text-anchor="middle" fill="#1c3f73" font-size="24" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">the sequence ÷ 2</text>
<text x="600" y="362" text-anchor="middle" fill="#3f5c8c" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">PROVEN BY</text>
<text x="600" y="390" text-anchor="middle" fill="#1c3f73" font-size="16" font-family="-apple-system,Helvetica,sans-serif">rendering the same scene</text>
<text x="600" y="414" text-anchor="middle" fill="#1c3f73" font-size="16" font-family="-apple-system,Helvetica,sans-serif">as a single card, and</text>
<text x="600" y="438" text-anchor="middle" fill="#1c3f73" font-size="16" font-family="-apple-system,Helvetica,sans-serif" font-weight="600">getting the same picture</text>
<text x="600" y="472" text-anchor="middle" fill="#3f5c8c" font-size="14" font-family="-apple-system,Helvetica,sans-serif">only attention crosses the wire</text>
<rect x="800" y="160" width="340" height="330" rx="8" fill="#e8f4f1" stroke="#0f7b6c"/>
<text x="970" y="196" text-anchor="middle" fill="#0b5a4f" font-size="19" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">3 cards</text>
<rect x="872" y="214" width="56" height="42" rx="5" fill="#fff" stroke="#0f7b6c"/>
<rect x="942" y="214" width="56" height="42" rx="5" fill="#fff" stroke="#0f7b6c"/>
<rect x="1012" y="214" width="56" height="42" rx="5" fill="#fff" stroke="#0f7b6c"/>
<path d="M932,235 L938,235 M1002,235 L1008,235" stroke="#0f7b6c" stroke-width="2"/>
<text x="970" y="294" text-anchor="middle" fill="#3b7d72" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">EACH HOLDS A THIRD</text>
<text x="970" y="322" text-anchor="middle" fill="#0b5a4f" font-size="24" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">29,920 tokens</text>
<text x="970" y="362" text-anchor="middle" fill="#3b7d72" font-size="13" font-family="-apple-system,Helvetica,sans-serif" letter-spacing="1.4">SO YOU GET</text>
<text x="970" y="390" text-anchor="middle" fill="#0b5a4f" font-size="17" font-family="-apple-system,Helvetica,sans-serif" font-weight="600">15 s at native 720p</text>
<text x="970" y="416" text-anchor="middle" fill="#3b7d72" font-size="15" font-family="-apple-system,Helvetica,sans-serif">89,760 tokens, divided</text>
<text x="970" y="440" text-anchor="middle" fill="#3b7d72" font-size="15" font-family="-apple-system,Helvetica,sans-serif">— which no card can hold</text>
<text x="970" y="472" text-anchor="middle" fill="#c53030" font-size="15" font-family="SF Mono,Menlo,monospace" font-weight="700">6,849 s / step</text>
<line x1="60" y1="522" x2="1140" y2="522" stroke="#e8e8ea"/>
<text x="60" y="558" fill="#242424" font-size="20" font-family="-apple-system,Helvetica,sans-serif" font-weight="700">The bill for dividing it</text>
<text x="60" y="592" fill="#5c5c5c" font-size="16.5" font-family="-apple-system,Helvetica,sans-serif">2.26× the tokens took <tspan fill="#c53030" font-weight="700">34× the wall-clock</tspan>. Quadratic attention predicts about 5×.</text>
<text x="60" y="620" fill="#5c5c5c" font-size="16.5" font-family="-apple-system,Helvetica,sans-serif">The extra ~7× is what the division itself costs: ring traffic every attention layer, three processes each streaming weights, sync barriers.</text>
<text x="60" y="656" fill="#0b5a4f" font-size="17" font-family="-apple-system,Helvetica,sans-serif" font-weight="600">"8 GB" stopped meaning per render and started meaning per device. That is the whole unlock.</text>
<text x="60" y="686" fill="#9a9a9a" font-size="14" font-family="-apple-system,Helvetica,sans-serif">MiniMax-H3 (33B) · 3 × RTX 3060 Ti, 8 GB each · every timing measured</text>
<text x="1140" y="686" text-anchor="end" fill="#0f7b6c" font-size="14" font-family="-apple-system,Helvetica,sans-serif" font-weight="600">github.com/Kmassidik/Selfhost-GenAI</text>
</svg></body></html>
