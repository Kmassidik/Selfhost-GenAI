# Pushing Past 8 GB — What the Papers Actually Say

<p class="lede">The research says the 8 GB ceiling on video generation is set by <b>activations</b> — the temporary working data a render creates — and not by the weights everyone tries to shrink. That diagnosis was correct, it was confirmed by profiling on this box, and it made a prediction about native 720p that this project later disproved without ever contradicting the physics.</p>

There is a specific moment worth describing, because it is where this chapter began. A memory snapshot of a single denoising step came back with 272 live allocations, and the largest one was **2,240 MB — a single temporary tensor** created by the quantization kernel that was supposed to be *saving* memory. Nothing about the model architecture was in the top five. The weights were not the problem. The arithmetic *about* the weights was.

<div class="callout truth"><span class="t">The one lesson that governs everything below</span>
<p>A big model has two kinds of memory cost: the <b>weights</b> (the model's stored numbers, fixed for the life of the file) and the <b>activations</b> (the temporary working data that exists only during a forward pass). <b>Quantization shrinks the weights. It does almost nothing for activations.</b> For video, where attention runs over hundreds of frames at once, the activations are the wall. Every paper below says so; so did our own profiler.</p></div>

## Two budgets that look like one number

`nvidia-smi` reports a single figure, which is why the distinction is so easy to miss. A useful structural analogy: a workshop has a **stock room** of raw material and a **workbench** where a part is being cut. Buying thinner stock (quantization) fills the stock room with more parts. It does not make the bench bigger, and it does nothing about the pile of offcuts, jigs and scrap that accumulate on the bench while a single part is being machined. On this build the bench is 8 GB, and the offcuts are enormous.

## What the profiler found, before any paper was read

The order matters. Measurement came first, and it killed two plausible ideas before a line of optimisation was written.

**E-0 — does peak VRAM scale with the problem?** Running the same scene at several sizes with two steps produced peaks of 6,570 MB at 73 frames, **6,570 MB again at 181 frames** — identical — and 7,834 MB at 362 frames. Resolution barely registered: 512×288 and 576×320 at 362 frames peaked at 7,834 and 7,832 MB. The conclusion was a **fixed floor of roughly 6.5 GB** that had nothing to do with how big the video was.

**E-1 — which phase owns the peak?** Sampling at 5 Hz across one 576×320 × 362-frame run and aligning the samples to phase markers gave: encoder phase 2,996 MB, sampling phase **7,832 MB**, decode phase 7,578 MB. The hypothesis that the 26 GB text encoder was squatting in VRAM was rejected outright — it never exceeded 3 GB. (The decode figure was later corrected: wrapping the decoder directly showed an allocated peak of only **1,162 MB**. The 7,578 was leftover *reserved* pool from sampling, not consumption. A near-miss that would have sent the whole project chasing the VAE.)

**E-3 — chunk the FFN, the "obvious" fix.** Every survey names the 4×D feed-forward intermediate as the largest transient in a transformer block. Sweeping a chunked-FFN implementation over 2, 4, 8 and 16 chunks gave peaks of 7,832 · 7,832 · 7,162 · 7,832 MB. Flat, except one non-monotonic dip that did not hold when the chunk count doubled — allocator noise, not an effect. **The received wisdom was wrong for this stack**, and only a sweep could have shown it.

**E-3b — the snapshot.** Recording the allocator's history and replaying it to the moment of maximum total gave the breakdown that ended the guessing.

<div class="callout truth"><span class="t">The finding that redirected the project</span>
<p><b>Roughly 88% of the real peak was int8 quantization and GEMM working buffers</b> — <code>fast_int8_mm</code>, <code>int8_linear</code>, activation rotation, rounding. Not the FFN intermediate. Not attention. Not resident weights. That single fact explains every earlier negative result: FFN-chunking and attention-splitting could not help because the memory was never in the tensors they partition. It was in the arithmetic that made int8 possible in the first place.</p></div>

Around the 5.9 GB of real tensors sat about 0.5–0.7 GB of allocator slack and 1.2–1.4 GB of CUDA context and driver overhead, which together explain the 7.8 GB the meter reported. A later experiment tried to reclaim the gap with `empty_cache()` between phases: 7,568 MB against 7,578 MB. Noise. That overhead is fixed cost, not stranded cache.

## The fix that followed directly from the measurement

`int8_linear` already chunked its *scaling* loop, but it first materialised the complete int32 `[M, N]` matmul result — the 2,240 MB. Because each output row uses only its own row of the input and its own scale factor, the rows are independent, so the matmul can be moved *inside* the row-chunk loop and written into a pre-allocated output buffer. No full intermediate ever exists.

The result was **2,038 MB freed during sampling, a 34% reduction, proven bit-identical** — `torch.equal(original, chunked)` returned `True`, maximum absolute difference 0.0, with the rotation path both on and off. Not "close enough". Equal.

That freed memory bought resolution. At 362 frames with two steps, the ceiling moved:

| Native resolution | Peak | Before the patch | After |
|---|---|---|---|
| 576×320 | 7,832 MB | the ceiling | comfortable |
| 640×384 | 7,618 MB | OOM | works |
| 704×384 | 7,594 MB | OOM | works — the reliable choice, ~600 MB margin |
| **768×448** | **7,828 MB** | OOM, hard | works — the hard ceiling, ~360 MB margin |
| 832×480 | — | OOM | still OOM |

<div class="callout truth"><span class="t">1.87x the pixels, for free, on the same card</span>
<p>768×448 against 576×320 is <b>1.87x the pixels</b> at 15 s, with zero quality cost, no new hardware, and no move to 4-bit weights. A systems optimisation converted directly into picture quality. This was the headline result of the entire single-card phase — and it came from a profiler, not from an idea.</p></div>

## The three papers, in plain words

Only after the box had been measured did reading the literature become useful, because the papers could then be checked against something.

| Paper | What it does | What it teaches this build |
|---|---|---|
| **ViDiT-Q** (2024) | Post-training **W4A8 / W8A8** quantization built for Diffusion Transformers. 2–2.5× memory saving, 1.4–1.7× speedup, "negligible" quality loss. | W4A8 on a DiT is **proven near-lossless** — 4-bit weights are a real option, not a gamble. |
| **QuantSparse** (2025) | W4A8 **plus attention sparsification** (keep 15% of attention) on Wan2.1-14B and HunyuanVideo. Storage **26.6 → 7.0 GB**. | The number that matters: peak inference memory only fell **42 → 28 GB**. Weights shrank 3.8×; **activations barely moved.** |
| **Native INT8 GEMM for Consumer GPUs** (2026) | A fused **Triton INT8 kernel** that actually engages Ampere's INT8 tensor cores instead of silently falling back to bf16. | Independently published confirmation of what the snapshot found here: the production int8 path dequantizes and never touches the fast datapath. |

The third paper is the uncomfortable one. It describes, in a peer-reviewed venue, almost exactly the bottleneck that E-3b found by accident — which is both a validation of the method and a reminder that this ground was already claimed. It also killed an idea outright: the paper reports that **"torch.compile graph-breaks at the custom [int8] linears — zero gain."** A speculative ~20% speedup from compilation was struck off the plan before a day was spent on it.

<div class="callout danger"><span class="t">The number that ended the "native 720p on one 8 GB card" dream</span>
<p>QuantSparse quantized a 14B video model to 4 bits <em>and</em> discarded 85% of its attention — the most aggressive compression in the literature — and still needed <b>28 GB</b> of peak memory for a high-resolution clip. H3 is bigger. The paper's own words: 8 GB is <b>"likely infeasible without aggressive resolution/frame reduction."</b></p></div>

## The prediction — kept, quoted, and then overtaken

This chapter was written when the project ran on one card. It concluded:

> *"Translation: no known technique fits native 720p, 15-second video into 8 GB. The wall is real, and it's activations, not weights."*

And the plan it proposed was modest:

> *"The realistic win: W4A8 weights → free ~8-9 GB → raise native resolution a notch → sharper source. Modest but real."*

Here is what happened instead.

<div class="callout truth"><span class="t">What actually rendered</span>
<table>
<tr><th></th><th>Predicted here</th><th>Measured later</th></tr>
<tr><td>Native 1280×704 × 345 frames (14.4 s)</td><td>"no known technique fits" it</td><td><b>Rendered.</b> 23 steps, ~44 h</td></tr>
<tr><td>The route</td><td>W4A8 weights, freeing 8–9 GB</td><td><b>W4A8 was never used.</b> The sequence was split across three cards</td></tr>
<tr><td>Hardware</td><td>implicitly, a bigger card</td><td>a third RTX 3060 Ti — <b>8 GB, same as the others</b></td></tr>
<tr><td>Cost of being wrong about the route</td><td>—</td><td>the sharded path is <b>34×</b> slower than 832×480, where the maths predicts ~5×</td></tr>
</table>
<p>Read the first row carefully, because the prediction was not refuted — it was <em>side-stepped</em>. Nothing here fits native 720p × 15 s into 8 GB. It fits into <b>three</b> 8 GB cards, none of which ever holds the whole activation.</p></div>

The mechanism is worth drawing, because it is the difference between the chapter's framing and reality. The chapter asked "how do we make the working set small enough for one card?" The answer that worked asked a different question: "why does one card have to hold all of it?"

<div class="callout warn"><span class="t">The bill still came</span>
<p>Splitting the sequence is not free. Going from 832×480 × 345 to 1280×704 × 345 is <b>2.26× the tokens</b>; quadratic attention predicts about <b>5×</b> the time; the measured figure is <b>34×</b>. The three-card path therefore carries roughly a <b>7× overhead beyond the mathematics</b> — hand-rolled ring attention in Python loops, and a copy of every block to every card on every step. It buys memory and sells speed, and the exchange rate is bad ([ch.45](45-three-gpu-sequence-parallelism.html)).</p></div>

## What survived from the original chapter, and what did not

<div class="callout spec"><span class="t">Scoring the chapter against what happened</span>
<table>
<tr><th>Claim made here</th><th>Verdict</th></tr>
<tr><td>Quantization shrinks weights, not activations</td><td>✅ <b>Confirmed on the box.</b> The snapshot showed the weights were never the peak</td></tr>
<tr><td>The activation wall is fundamental to long video</td><td>✅ <b>Still true.</b> It was divided, never removed</td></tr>
<tr><td><code>torch.compile</code> gives zero gain through custom int8 linears</td><td>✅ Confirmed by the published result; never contradicted here</td></tr>
<tr><td>"No known technique fits native 720p, 15 s into 8 GB"</td><td>⚠️ <b>True per card, wrong as a project ceiling</b></td></tr>
<tr><td>W4A8 is the realistic route to more native resolution</td><td>❌ <b>Never used.</b> The 1.87× resolution gain came from an <em>exact</em> chunk patch instead — no precision was traded at all</td></tr>
<tr><td>Native resolution would rise "a notch", 576×320 → 704×384</td><td>⚠️ <b>Understated.</b> 768×448 at 15 s on one card; 1280×704 at 15 s on three</td></tr>
</table></div>

The pattern is consistent enough to name. Both times this chapter was wrong, it was wrong in the same direction: it assumed the *shape* of the solution — fewer bits — because that was the shape the literature was optimising. The wins that arrived were about **arrangement**: the same arithmetic in a different order (the row-chunk patch), and the same sequence on a different number of devices. Neither threw away a single bit of information.

<div class="callout warn"><span class="t">Honesty rule for anything published from this project</span>
<p>Every claim — bit-identical, VRAM freed, resolution gained — must be <b>re-measured on the box and reproducible</b>. Where a number here has been superseded, both versions stay on the page with their dates and their hardware. No overclaiming, and no quiet deletions.</p></div>
