# How MiniMax-H3 Works

<p class="lede">The first surprise when you download MiniMax-H3 is that there is no MiniMax-H3. There are four separate files, and none of them is "the model" — they are four specialists that only produce video when wired together.</p>

The second surprise is which one is biggest.

You would expect the heavyweight to be the part that paints the picture. It isn't. The largest file — **26 GB** — is the part that *reads your sentence*. The generator that actually makes the video is smaller, at 20 GB. Six extra gigabytes are spent understanding what you asked for, before a single frame is imagined.

That ratio is not an accident, and it explains a great deal about why these systems behave the way they do.

## What H3 is, and what it is not

H3 is an **omni-modal generative system**: give it text — and optionally images, audio, or reference video — and it produces **video with synchronised stereo sound**. Not video that gets a soundtrack afterwards; the two are generated together.

<div class="callout spec"><span class="t">Official capabilities</span>
<table>
<tr><td>Output duration</td><td><b>4–15 seconds</b> — the range it was trained on</td></tr>
<tr><td>Resolution</td><td>shorter side 768 by default; up to 2K with a separate module</td></tr>
<tr><td>Frame rate</td><td>24 fps</td></tr>
<tr><td>Audio</td><td>32 kHz stereo, synchronised</td></tr>
<tr><td>Languages</td><td>11, including English, Chinese, Japanese, Korean and Arabic</td></tr>
</table></div>

<div class="callout warn"><span class="t">The 15-second ceiling is the model's, not the hardware's</span>
<p>Asking for 30 seconds does not fail because of VRAM. It fails because H3 never learned what 30 seconds looks like. Past its trained range it drifts, loops, or quietly loses the thread — the subject wanders off, the scene resets, the motion stops meaning anything.</p>
<p>This distinction matters for the rest of the guide. Almost every other wall here is an <em>engineering</em> wall we eventually pushed through. This one is not. <b>10–15 seconds is the honest maximum</b>, and no amount of hardware changes it. Longer films get made by cutting clips together, not by asking for longer clips (<a href="33-long-video-small-card.html">ch.33</a>).</p></div>

## The four parts

<table>
<tr><th>Part</th><th>Job</th><th>Size</th></tr>
<tr><td><b>Text/Vision Encoder</b><br/>(Qwen3-VL-32B)</td><td>Reads the prompt and any images, and turns them into a rich representation of meaning the generator can follow</td><td><b>26 GB</b></td></tr>
<tr><td><b>Omni-Transformer</b><br/>(the "DiT", 33B)</td><td>The actual generator. Denoises the joint video+audio latent across the sampling steps</td><td><b>20 GB</b></td></tr>
<tr><td><b>Visual VAE</b></td><td>Translates between real pixels and the compact latent the transformer works in — 16× smaller in space, ~4× in time</td><td>4.9 GB</td></tr>
<tr><td><b>Audio VAE</b></td><td>The same idea for sound: compresses and expands 32 kHz stereo to and from latents</td><td>0.6 GB</td></tr>
</table>

<div class="callout truth"><span class="t">A VAE in one sentence</span>
<p>A <b>VAE</b> (variational autoencoder) is a translator between the messy real world — pixels, sound waves — and a small coded form, the <em>latent</em>, that is cheap to compute on. The transformer never touches a pixel. It works entirely in latent space, and a VAE converts back to something watchable at the very end (<a href="01-what-is-genai.html">ch.01</a>).</p></div>

### Why the reader is bigger than the painter

Twenty-six gigabytes to process a sentence sounds absurd until you consider what the sentence has to carry.

*"A lone figure walks away down a rain-slick neon street, camera following gently."* A generator needs to know that "rain-slick" implies reflections, that neon implies coloured light spilling onto wet ground, that "walks away" fixes the camera behind the subject, that "gently" rules out a handheld shake. None of that is in the words. It is in the *understanding* of the words.

So H3 does not use a simple text encoder. It uses a full 32-billion-parameter vision-language model — one that could hold a conversation on its own — and uses it purely as a reading comprehension engine.

There is a nice detail in how it does that. H3 does not take the encoder's **final output**. It reaches inside and taps the hidden states at its **50th layer**.

<div class="callout spec"><span class="t">Why layer 50 and not the end</span>
<p>A language model's last layer is specialised for its own task — predicting the next word. Its <em>middle</em> layers hold something more useful to an outsider: a general representation of meaning, before it gets narrowed toward producing text.</p>
<p>So H3 stops the encoder halfway and steals its understanding rather than its conclusion. This is a common trick when one model borrows comprehension from another — and it is why the encoder file must match exactly. Tap a different layer and the numbers are meaningless to the generator.</p></div>

Notice the shape of the cost. The encoder and the transformer are the two heavyweights — **26 GB and 20 GB** — and the VAEs together are barely 5.5 GB and run only once, at the end.

<div class="callout truth"><span class="t">This is why the pipeline runs in two phases</span>
<p>26 GB plus 20 GB does not comfortably coexist in memory alongside everything else a render needs. So we never let them meet.</p>
<p>The encoder runs <b>first, in its own process</b>, reads the prompt, writes its understanding to a file, and exits. Only then does a second process start and load the transformer. The encoder is never in memory at the same time as the generator — a decision forced directly by the two numbers in that table, and the backbone of the architecture in <a href="48-the-pipeline-without-comfyui.html">ch.48</a>.</p>
<p>It has a pleasant side effect: prompt understanding is <em>reusable</em>. Encode a scene once and you can re-render it at any resolution, any step count, any seed, without paying the 26 GB encoder again.</p></div>

## Inside the transformer — the real numbers

These are not estimates. They are read straight from `transformer/config.json` on our own machine.

<div class="callout spec"><span class="t">The generator's actual configuration</span>
<table>
<tr><th>Field</th><th>Value</th><th>What it means</th></tr>
<tr><td><code>num_layers</code></td><td><b>50</b></td><td>Fifty stacked blocks. This is the "block 0/50 … block 49/50" in every render log</td></tr>
<tr><td><code>hidden_size</code></td><td><b>5376</b></td><td>Every token is a vector of 5,376 numbers as it travels the stack</td></tr>
<tr><td><code>num_attention_heads</code></td><td><b>56</b></td><td>Attention is computed 56 ways in parallel, each looking for different relationships</td></tr>
<tr><td><code>attention_head_dim</code></td><td>128</td><td>56 × 128 = 7,168 — the width attention works at</td></tr>
<tr><td><code>ffn_dim</code></td><td><b>14336</b></td><td>The feed-forward network expands 5,376 → 14,336 → 5,376 inside every block</td></tr>
<tr><td><code>in_channels</code></td><td><b>24</b></td><td>Video latent channels</td></tr>
<tr><td><code>audio_in_channels</code></td><td>32</td><td>Audio latent channels — carried through the same blocks</td></tr>
<tr><td><code>patch_size</code></td><td><b>[1, 2, 2]</b></td><td>Latents are grouped 2×2 spatially before entering the stack</td></tr>
<tr><td><code>num_refiner_layers</code></td><td>2</td><td>Two extra layers that condition the text embedding before generation</td></tr>
</table></div>

Two of those deserve a closer look, because each one shows up as something you can observe.

### `in_channels: 24` — and the latent we read off disk

When a render crashed mid-flight, the saved latent had shape `(1, 24, 37, 30, 52)`. That second number is the 24 from this config. One clip, **24 channels**, 37 latent frames, 30 tall, 52 wide.

So the config file and the crash dump agree. A latent is not an image with red, green and blue — it is a **24-channel** grid whose channels mean nothing to a human. Only the VAE knows how to turn them back into colours.

Audio rides alongside with its own 32 channels, through the same 50 blocks. That is what "omni-modal" means concretely: not two models glued together, but one stack carrying both.

### `patch_size: [1, 2, 2]` — and a bug it caused

Before entering the blocks, the model groups latents into patches of **1 frame × 2 × 2**. Four neighbouring latent cells become one token, which cuts the sequence length by four.

That innocuous number has a sharp edge. If a latent grid has an **odd** width or height, it cannot be tiled by 2×2 patches.

<div class="callout warn"><span class="t">The 848-pixel trap</span>
<p>Latents are 16× smaller than pixels, so a width of 848 gives 848 ÷ 16 = <b>53</b> latent cells — an odd number. Patching fails with a shape error deep inside the model that says nothing about resolution.</p>
<p>832 pixels gives 52, which is even, and works. <b>Choose resolutions where width ÷ 16 and height ÷ 16 are both even.</b> 832×480, 1024×576 and 1280×704 all qualify; 848 is the trap. This cost real debugging time, and the cause was this one config value.</p></div>

### Where the 20 GB goes

The config lets you count the parameters yourself, per block:

<table>
<tr><th>Component</th><th>Arithmetic</th><th>Parameters</th></tr>
<tr><td>Attention (Q, K, V, output)</td><td>4 × 5376 × 7168</td><td>~154 M</td></tr>
<tr><td>Feed-forward (up + down)</td><td>2 × 5376 × 14336</td><td>~154 M</td></tr>
<tr><td>Adaptive-norm modulation</td><td>2688 × 6 × 5376</td><td>~87 M</td></tr>
<tr><td><b>One block</b></td><td></td><td><b>~395 M</b></td></tr>
<tr><td><b>All 50 blocks</b></td><td>395 M × 50</td><td><b>≈ 20 billion</b></td></tr>
</table>

Twenty billion parameters at one byte each — which is exactly what int8 quantization gives — is **20 GB**, the size of the file on disk. The arithmetic closes.

<div class="callout truth"><span class="t">What this means for every render</span>
<p>Twenty billion parameters spread over 50 blocks is roughly <b>0.4 GB per block</b>. That is the size of the slice copied from RAM into VRAM for every block, of every step (<a href="02-your-hardware.html">ch.02</a>).</p>
<p>One step reads all 50 blocks — the whole 20 GB model. A 23-step render therefore drags about <b>460 GB</b> across the PCIe bus: the entire model, pulled over from system memory <b>23 times over</b>, once per step. The card never holds more than 0.4 GB of it at a time.</p>
<p>That ratio — 20 GB of weights, 460 GB of traffic — is the real cost of the offload trick, and the reason renders are measured in hours rather than minutes.</p></div>

## Two variants: FL2VA and Ref2VA

H3 ships the transformer in two versions, and they take different inputs — which means different downloads.

<table>
<tr><th>Variant</th><th>Takes in</th><th>Good for</th></tr>
<tr><td><b>FL2VA</b> — the one this project uses</td><td>Text, plus optionally a first and/or last frame image</td><td>Text→video, image→video, frame-chaining</td></tr>
<tr><td><b>Ref2VA</b></td><td>Multiple reference images (up to 9), reference audio, even reference video</td><td>Locking a specific character's appearance; driving video from an existing audio track</td></tr>
</table>

<div class="callout warn"><span class="t">The distinction that costs 20 GB to get wrong</span>
<p>If you want a specific person to stay recognisably themselves across shots, or you want video generated to fit an existing piece of music, that is <b>Ref2VA</b> work. FL2VA cannot accept a reference audio track at all.</p>
<p>This is not a settings toggle. It is a different 20 GB transformer file. The encoder and both VAEs are shared between them, so the marginal cost is one more download — but you cannot get there from FL2VA by changing parameters. It also explains a limitation found the hard way in <a href="33-long-video-small-card.html">ch.33</a>: chaining FL2VA clips holds a <em>scene</em> together well, but a photoreal human face visibly drifts between clips, because nothing is anchoring identity. That anchor is exactly what Ref2VA provides.</p></div>

## What to carry into the next chapter

<div class="callout spec"><span class="t">Four parts, two heavyweights, one latent</span>
<ol>
<li><b>The encoder reads</b> — 26 GB, tapped mid-way at layer 50, runs once per prompt.</li>
<li><b>The transformer generates</b> — 20 GB, runs 50 blocks per step, for every step. This is where the hours go.</li>
<li><b>The VAEs translate</b> — 5.5 GB combined, run once at the end, one for picture and one for sound.</li>
<li><b>Everything in the middle is latent</b> — never pixels until the final moment.</li>
</ol></div>
