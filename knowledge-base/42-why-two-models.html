# Why Two Models? Sharing the Recipe

<p class="lede"><b>H3 is two large models — a 26 GB encoder that reads the sentence and a 20 GB transformer that draws the video — and on hardware this size that separation is not a complication, it is the thing that makes a render possible at all.</b> Two models can be run one after the other, each loaded only while it is needed. One 46 GB model could not have been.</p>

That is the good kind of two. There is a second kind, and it is the wall this project is currently standing at: when a render is split across three graphics cards, the *same* transformer gets loaded into memory three separate times — byte-for-byte identical copies that no amount of cleverness has yet persuaded the operating system to merge. The first half of this chapter is why two models are a gift. The second half is why two copies are a curse, and the two halves turn out to be the same problem approached from opposite ends.

<div class="callout truth"><span class="t">The one-line version</span>
<p>H3's two models never coexist because <b>the pipeline is deliberately cut in half</b>: the encoder runs first in its own process, writes its output to a file, and exits before the transformer is loaded. The duplicated copies exist because <b>multi-GPU work runs as separate processes</b>, and an operating system gives every process private memory that no other process may touch. Getting to <b>one copy, three cards</b> is the single biggest lever this build has left.</p></div>

## 1 · Four parts, two of them enormous

Downloading MiniMax-H3 does not produce a model. It produces four files, and none of them makes video alone ([ch.03](03-how-h3-works.html)).

| Part | Job | Size |
|---|---|---|
| **Text/Vision Encoder** (Qwen3-VL-32B, tapped at layer 50) | reads the prompt and any reference images, and turns them into a representation of *meaning* | **26 GB** |
| **Omni-Transformer** (the DiT), int8, pruned | the generator — denoises the joint video+audio latent, 50 blocks per step | **20 GB** |
| **Visual VAE** | translates between pixels and the latent grid, 16× smaller in space | 4.9 GB |
| **Audio VAE** | the same for 32 kHz stereo | 0.6 GB |

The first surprise is that the reader is bigger than the painter. The second, and the one this chapter is about, is that the two big ones add to **46 GB of weights** — and that number is what the whole engine architecture is bent around.

For context on how tight that was: the box this project began on had **60 GB of RAM**. Loading both large models at once would have consumed most of it before a single tensor of working memory existed. The current box has **125 GB**, which sounds like room to breathe until section 5, where a three-card run climbed past 118 GB and was killed.

## 2 · Why they never have to be in memory at once

The reason the split works is not a memory trick. It is a property of the *relationship* between the two models.

The encoder's entire contribution to a render is a block of numbers — the prompt embeddings, plus a few small tensors describing the shape of the job. Once those exist, **the transformer never asks the encoder anything again.** All fifty blocks, all twenty-three steps, read the same fixed conditioning. Nothing flows backward.

That is a much stronger property than "they run in order". Consider the alternative: if the transformer had to consult the encoder at each denoise step — re-reading the prompt against the partially-formed image, say — both models would have to be resident for the whole render, and 46 GB of weights would be a hard floor before any activations existed at all.

<div class="callout truth"><span class="t">The rule underneath</span>
<p>The structural picture is a translator and a painter working for a client who speaks a language the painter does not. The translator meets the client, understands the brief, and writes a specification. Then the translator <b>goes home</b> — because the painter works from the specification, not from the conversation.</p>
<p>The general form: <b>a pipeline stage can be evicted from memory exactly when its output is a value rather than a conversation.</b> Value in, value out, no back-channel. Every stage of this pipeline that satisfies that test can be given its own process, its own lifetime, and its own memory budget. Every stage that does not must stay resident. That single test decides the shape of the entire engine.</p></div>

## 3 · The two-phase pipeline, and the technique that made it slicable

Knowing the split is legal is not the same as being able to perform it. The obstacle was that asking a pipeline for only its text embeddings **still runs the whole graph, transformer included** — a lesson the project's own source notes record as learned the expensive way: `output=` chooses what to *return*, not what to *execute*.

The fix comes from `diffusers`' modular pipelines: assemble a partial pipeline containing only the blocks actually needed.

```python
base = ModularPipeline.from_pretrained(ROOT)
sub  = {k: v for k, v in base.blocks.sub_blocks.items() if k in ["denoise", "decode"]}
pipe = SequentialPipelineBlocks.from_blocks_dict(sub).init_pipeline(ROOT)
```

Once the graph can be sliced, the render can be split across **separate processes** — and that is what buys the memory ([ch.48](48-the-pipeline-without-comfyui.html)).

<div class="callout spec"><span class="t">The split, concretely</span>
<p><b>Phase A</b> starts, builds a partial pipeline of <code>before_encode + text_encoder</code> with the int8 encoder, walks every scene, writes <code>embeds/&lt;scene&gt;.pt</code> — prompt embeddings, token tags, height, width, frame count — and <b>exits</b>.</p>
<p><b>Phase B</b> starts as a <em>fresh process</em>, loads only the transformer, reads that file, denoises and decodes. The 26 GB encoder never enters phase B's memory; the source says so in as many words.</p></div>

### The payoff nobody predicted

The split was built for memory. In daily use its larger benefit turned out to be something else: **encode once, render many.**

A scene's embeddings are fixed. Steps, resolution, engine, seed and driver are not. So phase A's output is a cache — more than forty `.pt` files sit in `h3-lab/embeds/` and get re-rendered constantly without the 26 GB encoder ever being loaded again. Given that step count is a property of the *scene* — 4 for a tight close-up, 23 for a character mid-shot, 49 for a wide vista with a small distant subject — and that finding the right one means re-rendering, this matters. An architectural decision made for one reason paid off mostly for another. That happens more often than clean write-ups admit.

## 4 · The other two: the same model, twice

Now the second sense of "two models", where the same virtue becomes a wall.

Splitting one render across several cards is done here with **context parallelism**: the weights stay whole and the *video* is split. The packed token sequence — every frame, every audio slice, the text — is cut into equal pieces, one per card, and each card runs the entire fifty-block model on its own piece ([ch.36](36-splitting-the-video-cp.html)).

The title's metaphor is exact and worth keeping. Picture the 50 transformer blocks as a **recipe book** and a fifteen-second clip as a very large dish:

- Cut the **dish** into thirds. Each chef cooks one third.
- But **every step in the book applies to every third.** So each chef needs the *whole* book.

Three chefs, three thirds of one dish, three complete copies of the recipe. The win is that each card holds only a third of the activations, which is how a clip that overflows one card fits across three. The cost is the duplicated recipe.

### Why the copies cannot simply be merged

The copies are identical. Not similar — identical, the same file read three times. So why does the machine keep three of them?

Because `torchrun --nproc_per_node=3` does not start one program that uses three GPUs. It starts **three complete, separate processes**, as if the same application had been launched three times from three terminals ([ch.41](41-python-is-the-glue.html)). And an operating system enforces one iron law about processes.

<div class="callout spec"><span class="t">The OS law of memory isolation</span>
<p><b>Every process gets its own private address space and cannot, by design, see any other process's memory.</b> This is not an oversight to be worked around — it is <em>protection</em>. It is the reason one crashing application cannot corrupt another, and the reason a malicious program cannot read a password out of a browser's memory.</p>
<p>So when process 0 loads the weights into "its" RAM and process 1 loads the same bytes into "its" RAM, the kernel places them in <b>two separate physical locations</b>. Identical contents are irrelevant; they are different programs, and the kernel will not let either peek at the other. <b>That is the real reason there are multiple copies</b> — not a bug in the framework, but the security model of the machine working exactly as intended.</p></div>

Back in the kitchen: two chefs in **two separate locked kitchens**. Neither is allowed through the other's door, so each buys their own book. The duplication is not waste through carelessness. It is the price of a wall that exists for good reasons.

## 5 · The measured wall

The three-card run is worth reporting precisely, because what failed and what succeeded were not the same thing at all.

**What worked.** Context parallelism initialised on H3 with a hand-authored plan, the collective library came up green on all three ranks, and the sequence genuinely split: **5,022 tokens per GPU**, down from about **15,067** on a single card. Per-card VRAM sat at roughly **5.2 GB** — comfortably inside 8 GB. The attention mathematics, the ring, the online softmax, the composition with block-streaming offload: all correct ([ch.34](34-open-use-close-flashattention.html)).

<div class="callout danger"><span class="t">It is not the file size — and that is the important part</span>
<p>The transformer on disk is <b>20 GB</b>. Three private copies of 20 GB is 60 GB, which fits inside 125 GB with room to spare. The run died anyway, at <b>118 GB</b>.</p>
<p>Earlier planning arithmetic in this project budgeted <b>33 GB</b> per copy and predicted 99 GB for three ranks — the figure that was current when the multi-GPU design was written. Both numbers point at the same conclusion from different directions: <b>what runs out is not the weights, it is what the offloading machinery does to the weights, per process, during the forward pass.</b> Group offload does not hand a block to the GPU; it <em>copies</em> one, and it keeps a per-process CPU-side copy to copy back to.</p>
<p>The framework's own documentation is candid about the size of this effect: a transformer that should need about <b>20 GB</b> can sit at about <b>50 GB</b> under group offload. Multiply that by three processes and 125 GB was never going to be enough.</p></div>

## 6 · The escape hatch: `mmap`, or the public library

The operating system does offer one legitimate way for two processes to share memory, and it is not a loophole — it is how every program on the machine already works.

**Memory-mapping.** If two processes map the *same file* read-only, the kernel loads its pages into physical RAM **once** and points both address spaces at those same pages. This is entirely ordinary: the C library, `libc`, is loaded once and shared by every running program on the box. Nobody thinks of that as a trick.

In the kitchen, it is the **public library**. Both chefs read the *same* book. Neither buys a copy, and the library does not mind how many readers a book has.

<div class="callout truth"><span class="t">And it worked</span>
<p>A custom shared loader (<code>h3_shared_load_test.py</code>) did exactly this on the box: memory-map the int8 weights, <b>638 tensors</b>, and point every rank at the same pages. It came up in about <b>4 seconds</b> from the page cache — one copy, all ranks reading it. <b>At load time, the problem was solved.</b></p></div>

## 7 · Why it collapses: the photocopy problem

A library book can be read. It cannot be written in.

The weights on disk are a pristine reference. To *use* them, the framework has to make **working copies** — dequantizing, reshaping, and above all **streaming each block onto the GPU** during the forward pass and staging it back afterwards. The moment a chef needs working notes, they **photocopy** the page and scribble on the copy — and that photocopy is private, back in their own kitchen, counted against their own memory.

<div class="callout warn"><span class="t">The exact bug, verified on hardware</span>
<p>Group offload <b>re-copies each block per process</b> as it onloads it to the GPU, so the sharing that existed at load collapses the moment denoising starts. This is a known, tracked incompatibility — <b>diffusers #12533, "Hooks conflicts: Context Parallelism and CPU Offload"</b> — and it is the same mechanism behind group offload's high host-RAM use in general. Copies, not shares.</p>
<p>The measurement matched the diagnosis exactly: the loader shared one copy in four seconds, and then per-process RAM climbed through the forward pass to 118 GB and the kernel killed it. Nothing about the sharing was wrong. It was simply undone, block by block, by the layer above it.</p></div>

## 8 · The two doors

Both are real engineering, and both are open.

<div class="callout spec"><span class="t">Door 1 — read-only all the way down</span>
<p>Make the <em>entire</em> forward path read straight from the shared mapped pages and never photocopy: a <b>custom offload hook</b> that streams each block from the mapping directly to the GPU and, when the block is finished, simply <b>drops the GPU copy</b> — never writing it back to a per-process CPU buffer, which is the exact step that killed the run.</p>
<p>The difficulty is that the existing offload machinery was built to copy; the copy-back is not incidental to it. Upstream is moving in this direction (<a href="https://github.com/huggingface/diffusers/pull/11106">diffusers PR #11106</a> reduces CPU RAM in group offload), but the version needed here is narrower and has to be owned locally.</p></div>

<div class="callout spec"><span class="t">Door 2 — one kitchen, three stoves</span>
<p>Run a <b>single process</b> that drives all three GPUs itself. One process is one address space, so the model loads <b>once</b> and is shared by construction — the operating-system law of section 4 simply never applies, because there is only one program. Each card is handed its slice of the sequence directly.</p>
<p>The costs are explicit. The parallelism has to be hand-authored — no <code>torchrun</code> doing it. And Python's Global Interpreter Lock means one interpreter cannot run Python bytecode for three cards simultaneously (<a href="41-python-is-the-glue.html">ch.41</a>) — though the GPU kernels themselves are launched asynchronously, so in a workload this GPU-bound it is often not the constraint it sounds like.</p></div>

<div class="callout truth"><span class="t">And the blunt third option, stated because it is honest</span>
<p>Buy more RAM. Three copies plus the offload machinery's overhead wants somewhere around <b>150 GB</b> to be comfortable against the <b>125 GB</b> installed — roughly one more DDR3 stick, no code at all. It is worth naming plainly: a substantial engineering project and a cheap piece of hardware are solving the identical problem, and only one of them is interesting.</p></div>

## 9 · Why this is the endgame rather than a footnote

Two cards work today. Three cards would change what is possible.

<div class="callout truth"><span class="t">What one shared copy unlocks</span>
<p>Three cards split the sequence <b>÷3</b> instead of ÷2, and per-card activations shrink accordingly — enough to hold a full <b>15-second take at native 832×480 across all three cards</b>. Long <em>and</em> sharp, in one coherent render with no seams and no chaining (<a href="33-long-video-small-card.html">ch.33</a>).</p>
<p>And the fix pays twice: with one shared copy the two-card configuration halves its own host RAM for free, which buys back headroom that is currently spent on a duplicate nobody wanted.</p></div>

There is a symmetry here worth naming, because it is the reason both halves of this chapter belong in one place.

**Section 3 solved this problem already, for a different pair of models.** The encoder and the transformer never coexist because the pipeline was cut at a point where one stage's output is a value rather than a conversation — and each stage was given its own process and its own lifetime. That worked because the cut was *between* two forward passes.

The remaining problem is the same trick applied *inside* one forward pass. The three ranks are not sequential stages; they run simultaneously and must exchange key/value shards at every attention layer. There is no point to cut, so the memory cannot be reclaimed by scheduling. It has to be reclaimed by **sharing**, which is a harder guarantee than sequencing — and that is precisely why it is still open while the two-phase split has been working for weeks.

<div class="callout spec"><span class="t">The chapter in six lines</span>
<ol>
<li><b>H3 is two large models</b> — a 26 GB encoder and a 20 GB transformer — and they never coexist, because phase A writes a file and exits before phase B loads anything.</li>
<li><b>The split is legal because the coupling is a value, not a conversation.</b> That test decides which pipeline stages can be evicted and which must stay resident.</li>
<li><b>Context parallelism splits the video, replicates the model</b> — each card cooks a third of the dish but needs the whole recipe book.</li>
<li><b>The copies exist because the ranks are separate processes,</b> and an OS gives every process private memory by law. That is protection, not waste.</li>
<li><b><code>mmap</code> is the escape hatch and it worked at load</b> — 638 tensors, ~4 s, one shared copy — but group offload re-copies each block per process and the sharing is gone by the first step (diffusers #12533). Measured: RAM climbed to 118 GB against 125 GB installed, and the kernel killed it. The GPUs were fine at ~5.2 GB each.</li>
<li><b>Two doors, one shortcut:</b> a custom read-only offload hook, a single process driving all three cards, or about 32 GB more RAM. Crack it and 15 seconds at native 832×480 across three cards becomes reachable.</li>
</ol></div>
