# The Math, From Scratch

<p class="lede">The mathematics of a video render is five equations, none of which is harder than arithmetic once every symbol has been named — and this chapter names all of them, builds the calculus behind $d\mathbf{x}/dt$ from zero, and works each formula through with real numbers.</p>

Start with the smallest possible piece of evidence for that claim. Here is a complete denoise step, applied to one number out of the roughly 1.4 million in a five-second latent:

$$3.0 \;-\; 0.1 \times 11.0 \;=\; 1.9$$

That is it. A subtraction. Fifty transformer blocks and 143 seconds of a graphics card's life go into computing the `11.0`, and every remaining hour of a render goes into doing that same subtraction to every number in the grid, twenty-three times over. The hard part of this subject is not the algebra. It is knowing what each symbol stands for, and that is entirely learnable in one sitting.

<div class="callout truth"><span class="t">The mindset</span>
<p>An equation is a <b>very short sentence</b> written in a compressed alphabet. Once each symbol has a spoken name, the sentence can be read out loud in plain English — and every equation below is then <b>worked with real numbers</b>, because plugging values in is how mathematics stops being intimidating and starts being arithmetic.</p>
<p>Nothing here assumes prior mathematics. <a href="22-pipeline-in-detail.html">Chapter 22</a> showed where each equation sits in the pipeline; this one takes them apart.</p></div>

<p>Anything written as <b>name(inputs)</b> is a <b>machine</b>: feed it whatever sits inside the parentheses, and it hands back an answer. So <code>v_θ(x_t, t, c)</code> reads: <em>"the model θ, given the current noisy latent, given how noisy it is, and given the prompt, returns a velocity."</em></p>
<p>That is a twenty-billion-parameter transformer, fifty blocks deep, compressed into eleven characters. The parentheses hide the whole machine — which is exactly what notation is for.</p></div>

## Part 2 · Shapes, dot products, and what a matrix multiply is

Two ideas underpin everything above and are almost never explained: what a **shape** describes, and what it means to multiply two grids.

### Reading a shape

A shape is a set of nesting instructions. Take the real one from a crashed render, `(1, 24, 37, 30, 52)`, and read it outside-in:

<table>
<tr><th>Number</th><th>Means</th></tr>
<tr><td>1</td><td>one clip in this batch — a single video, not a stack of them</td></tr>
<tr><td>24</td><td>each position carries <b>24 channels</b> — not red, green, blue, but 24 learned quantities</td></tr>
<tr><td>37</td><td>37 latent frames along the time axis</td></tr>
<tr><td>30</td><td>30 cells tall</td></tr>
<tr><td>52</td><td>52 cells wide</td></tr>
</table>

Multiplying them out gives $1 \times 24 \times 37 \times 30 \times 52 = 1{,}385{,}280$ — the "about 1.4 million numbers" quoted everywhere in this guide. Nothing mystical is happening: a tensor is a list of lists of lists, and the shape says how deep the nesting goes and how long each level is.

The single most useful habit when reading model code is to track shapes rather than values. A shape mismatch is the most common failure mode there is, and the [848-pixel trap](22-pipeline-in-detail.html) — where a width gives an odd number of latent cells and 2×2 patching becomes impossible — is exactly a shape error wearing a disguise.

### The dot product — similarity as arithmetic

Take two lists of the same length and multiply them slot by slot, then add the results up. That is a **dot product**:

$$[1,\;3,\;-2] \cdot [4,\;0,\;5] = (1)(4) + (3)(0) + (-2)(5) = 4 + 0 - 10 = \mathbf{-6}$$

Why anyone cares: the dot product is large and positive when two lists have big values in the *same* places, near zero when their patterns are unrelated, and negative when they oppose each other. It is, in one operation, a **measure of agreement**.

That is the whole reason attention works. When a query vector meets a key vector, the dot product between them asks: *do these two tokens have matching patterns?* A big answer means "yes, look here". The entire mechanism of a transformer paying attention to the right word is this multiply-and-add, run over every pair.

### Matrix multiply — many dot products at once

A matrix multiply is nothing more than a full table of dot products. Every row of the left grid meets every column of the right grid, and the answer goes in the corresponding cell:

$$\begin{bmatrix}1 & 2\\ 3 & 4\end{bmatrix}\begin{bmatrix}5 & 6\\ 7 & 8\end{bmatrix} = \begin{bmatrix}1(5)+2(7) & 1(6)+2(8)\\ 3(5)+4(7) & 3(6)+4(8)\end{bmatrix} = \begin{bmatrix}19 & 22\\ 43 & 50\end{bmatrix}$$

Check the top-left cell by hand: 5 + 14 = 19. Every entry is one dot product, and there is no other content to the operation.

<div class="callout truth"><span class="t">Why this one operation is the whole story</span>
<p>$QK^{\top}$ in the attention formula is a matrix multiply, so it produces a table with <b>one entry for every pair of tokens</b>. That is where $\mathcal{O}(N^2)$ comes from — it is not a metaphor for complexity, it is literally the size of that table.</p>
<p>On a real render with 14,430 tokens, that table has about <b>208 million entries</b>, and it is built fifty times per step, every step. Meanwhile a feed-forward layer multiplying a 5,376-wide token by a 5,376 × 14,336 weight matrix is doing 77 million multiply-adds for <em>one token</em>.</p>
<p>A GPU is, to a first approximation, a machine for doing enormous numbers of independent multiply-and-adds at once. That is the entire reason this hardware exists and the reason it is the right hardware for this job.</p></div>

## Part 3 · What dx/dt actually means

This is the symbol that looks frightening and is not. **A derivative is a rate: how fast one thing changes as another changes.**

$$\frac{dx}{dt}\;=\;\text{"how much } x \text{ changes for a tiny change in } t\text{"}$$

Say it as **"d-x by d-t"**. The lowercase **d** means *a tiny bit of*. So $dx/dt$ is *(a tiny bit of x) divided by (a tiny bit of t)* — a rate of change, which drawn on a graph is a **slope**.

**The everyday version is a speedometer.** Let $x$ be a car's position and $t$ be the time. Then $dx/dt$ is its velocity — literally the number on the dial.

<div class="callout spec"><span class="t">Worked example — a speedometer read as dx/dt</span>
<p>A car at <b>t = 2.0 s</b> is at position <b>x = 20 m</b>. At <b>t = 2.1 s</b> it is at <b>x = 21 m</b>. Then:</p>
$$\frac{dx}{dt}\;\approx\;\frac{21 - 20}{2.1 - 2.0}\;=\;\frac{1\ \text{m}}{0.1\ \text{s}}\;=\;10\ \text{m/s}$$
<p>One metre in a tenth of a second is ten metres per second. <b>That fraction — change in x over change in t — <em>is</em> the derivative.</b> Making the gap smaller and smaller gives the exact instantaneous rate rather than an average over the interval; that limiting process is the only thing calculus adds to the arithmetic above.</p></div>

**Why a video model lives on this.** As $t$ slides from 1 (noise) down to 0 (clean), the latent $\mathbf{x}$ *changes* — it morphs from static into something watchable. So there is a velocity: how fast, and in which direction, the latent is moving toward its final form. That velocity is exactly $d\mathbf{x}/dt$, and predicting it is the transformer's whole job:

$$\mathbf{v}_\theta(\mathbf{x}_t, t, c)\;\approx\;\frac{d\mathbf{x}_t}{dt}$$

Read aloud: *"the velocity the model predicts is approximately the rate at which the latent is changing."*

One thing to hold onto: $\mathbf{x}$ here is not a single number. It is a grid of about 1.4 million of them, and $\mathbf{v}_\theta$ returns a grid of exactly the same shape. Every one of those numbers gets its own velocity. The bold type is the only thing distinguishing "a number moving" from "a million numbers each moving independently", and the arithmetic is identical either way.

**The step that uses it** is the "distance equals speed times time" from school physics, run backwards:

$$\mathbf{x}_{t-\Delta t}\;=\;\mathbf{x}_t\;-\;\underbrace{\Delta t}_{\text{tiny time}}\cdot\underbrace{\mathbf{v}_\theta}_{\text{speed}}$$

*"To move one small step, travel (speed × small time), in the cleaning direction."* That is an **Euler step**, named after Leonhard Euler, and it is the entire generation loop.

The dashed grey line is the trajectory the model's velocity field defines. Each solid segment is one Euler step — a straight chord across a curve. Straight chords across a curve accumulate error, and the error is proportional to how long each chord is:

$$\text{error} \sim \mathcal{O}(\Delta t), \qquad \Delta t = \frac{1}{\text{number of steps}}$$

Halve the steps, roughly double the error. This is not an abstract bound. The render logged as `g4k` was given **3 steps** at 1280×704 across 345 frames, ran for about five and a half hours, and produced mud — not a blurry version of the right video, but a video whose large-scale structure had been decided by three badly-aimed chords.

### Where the velocity field came from

Training is worth one paragraph, because it explains why this is a **regression** problem rather than anything more exotic.

Take a real video's latent $\mathbf{z}_0$ and a sample of noise $\mathbf{z}_1$. Draw the straight line between them and pick a point on it at fraction $t$. Then ask the model to predict the direction from one end to the other, and penalise it by how far off it is:

$$\mathcal{L} = \mathbb{E}\Big\|\, \mathbf{v}_\theta(\mathbf{z}_t, t, c) - (\mathbf{z}_1 - \mathbf{z}_0)\,\Big\|^2$$

Read aloud: *"on average, over many videos, many noises and many values of t, how far is the predicted velocity from the true one, squared."* The model is being taught to point in a direction. Nothing here classifies anything, nothing here rolls dice — the only randomness in generation is the noise that gets fed in at the start, which is why a fixed seed reproduces a video exactly.

### Solver order, and the trick that changes the question

Euler is a **first-order** method: one evaluation of $\mathbf{v}_\theta$ per step, error proportional to $\Delta t$. Better methods exist. A **second-order** solver evaluates twice per step (or reuses history) and has error proportional to $\Delta t^2$ — square a small number and it gets much smaller.

That sets up a real trade, and the useful unit for reasoning about it is **NFE**, the number of function evaluations:

$$\text{NFE} = \text{steps} \times \text{solver order}$$

Six Euler steps and three second-order steps both cost six evaluations. Which produces the better video? Higher order cuts the error per step but pays for two evaluations to get it, and for a trajectory that is already fairly straight the extra accuracy may buy nothing. **This was never A/B tested on this build.** It is written down here as an open question rather than dressed up as a finding.

The more interesting move does not improve the solver at all. **Distillation** — the technique behind "Turbo" variants — retrains the velocity field itself so that the trajectory is *straight enough* for a coarse solver to follow accurately.

<div class="callout truth"><span class="t">The mental shift worth having</span>
<p>A distilled model is not integrating the same equation badly with fewer steps. It has been trained to define a <b>different, straighter path</b> between noise and data — one that a four-step Euler walk can follow without falling off. The mathematics moved, not just the step count.</p>
<p>That is why four distilled steps can look like twenty base steps instead of looking like garbage, and it is a genuinely different kind of optimisation from anything else in this guide: it changes the problem rather than solving it faster.</p></div>

## Part 5 · The formulas, worked with real numbers

### A · One Euler step

Formula: $\;\mathbf{x}_{t-\Delta t}=\mathbf{x}_t-\Delta t\cdot\mathbf{v}$. Take one number out of the latent, $x_t = 3.0$; the model predicts velocity $v = 4.0$; the step size is $\Delta t = 0.1$:

$$x_{t-\Delta t}=3.0-0.1\times 4.0 = 3.0 - 0.4 = \mathbf{2.6}$$

**Meaning:** that number moved from 3.0 to 2.6 this step. The identical arithmetic happens to all 1.4 million numbers in the grid simultaneously — which is precisely what a GPU is for. That is all a "step" ever is.

### B · Softmax

Softmax turns arbitrary scores into weights that are positive and add to one:

$$\text{softmax}(z)_i = \frac{e^{z_i}}{\sum_j e^{z_j}}$$

Take scores $z = [2,\,1,\,0]$:

$$e^2\approx 7.39,\quad e^1\approx 2.72,\quad e^0 = 1,\qquad \text{total} \approx 11.11$$

$$\text{softmax} \approx \left[\tfrac{7.39}{11.11},\ \tfrac{2.72}{11.11},\ \tfrac{1}{11.11}\right] = [\,0.665,\ 0.245,\ 0.090\,]$$

**Check:** 0.665 + 0.245 + 0.090 = 1.000. The largest score took the largest share, but nothing was thrown away — the "soft" in softmax is exactly that. This is the mechanism by which attention decides what to look at most.

### C · Attention, in miniature

Formula: $\;\text{softmax}\!\big(\tfrac{QK^\top}{\sqrt{d_k}}\big)V$. Suppose one token's query matched three tokens with raw scores $QK^\top = [4,\,2,\,0]$, and the head dimension is $d_k = 4$ so $\sqrt{d_k}=2$:

$$\frac{QK^\top}{\sqrt{d_k}} = [2,\,1,\,0]\ \xrightarrow{\ \text{softmax}\ }\ [0.665,\,0.245,\,0.090]$$

Now blend the three value vectors by those weights. Taking $V=[\,10,\,20,\,30\,]$:

$$0.665(10)+0.245(20)+0.090(30)=6.65+4.90+2.70=\mathbf{14.25}$$

**Meaning:** this token's new value is a weighted mix of what the others hold, mostly the first. That is the whole of attention — a lookup where every key matches a little and the best match matches most.

The $\sqrt{d_k}$ in the denominator is housekeeping. Dot products of long vectors grow with their length, and large scores push softmax toward putting all its weight on one entry, which stops the model learning nuance. Dividing by $\sqrt{d_k}$ keeps the scores in a sane range. In the actual model $d_k = 128$, so the divisor is $\sqrt{128} \approx 11.3$, and this happens 56 times in parallel — one per attention head.

### D · Classifier-free guidance

Formula: $\;\mathbf{v}=\mathbf{v}_\varnothing+s(\mathbf{v}_c-\mathbf{v}_\varnothing)$. Say the velocity *with* the prompt is $v_c=5$, *without* it is $v_\varnothing=2$, and the guidance scale is $s=3$:

$$v = 2 + 3(5-2) = 2 + 9 = \mathbf{11}$$

**Meaning:** the prompt's contribution — the difference between 5 and 2 — is amplified threefold and added back. At $s=1$ the result is exactly $v_c$; at $s=0$ the prompt is ignored entirely; typical working values are 2.5 to 3. Push it much higher and the exaggerated velocity overshoots every step, which is what burnt colours and plastic skin actually are.

Note the cost hidden in the notation: $v_c$ and $v_\varnothing$ are two separate evaluations of a twenty-billion-parameter stack. Guidance is why a "step" can be two full passes rather than one.

### E · Sigma-shift

Formula: $\;t' = \dfrac{s\,t}{1+(s-1)t}$. At $t=0.5$ with shift $s=6$:

$$t' = \frac{6(0.5)}{1+(6-1)(0.5)} = \frac{3}{1+2.5} = \frac{3}{3.5} \approx \mathbf{0.857}$$

A step that would have landed at 0.5 lands at 0.857 instead — deeper into the noisy end. Applying the same formula to nine evenly spaced steps shows what it does to the whole schedule:

**Meaning:** the step count is not the only dial. *Where* the steps land matters as much as how many there are, and moving them costs nothing at all. A sampler can even run two clocks — one schedule for the video latent, another for the audio latent — because the two have different curvature, and stepping audio on the video's schedule at low step counts corrupts the sound.

### F · Float to pixel

Formula: $\;\text{pixel}=\big\lfloor (x+1)\cdot 127.5 \big\rceil$. The decoder emits a float in $[-1,1]$; take $x=0.6$:

$$\lfloor (0.6+1)\times 127.5 \rceil = \lfloor 1.6 \times 127.5 \rceil = \lfloor 204 \rceil = \mathbf{204}$$

The endpoints check out: $x=-1$ gives 0 (black), $x=+1$ gives 255 (white). **Meaning:** the model's real output is the float. The 0-to-255 byte is a rescale performed after all the intelligence has happened — no probability distribution over colours, no sampling. Audio gets the same treatment with a factor of 32,767 instead of 127.5.

### G · Sampling the noise

$\mathbf{x}_1 \sim \mathcal{N}(0,1)$ says: fill the latent with numbers drawn from the bell curve. A handful might look like

$$[\,0.31,\ -1.20,\ 0.05,\ 0.88,\ -0.42,\ \ldots\,]$$

Most land near 0, few beyond ±3. **Meaning:** "pure noise" is a grid of about 1.4 million of these. The seed is what picks exactly which ones — the same seed produces the same grid, the same trajectory, and the same video.

## Part 6 · The cost model, and how well it holds

Two equations describe what a render costs. The first is almost embarrassingly simple:

$$T_{\text{sampling}} = \text{NFE} \times T_{\text{forward}}$$

**NFE** is the number of function evaluations — the number of times the transformer is run. $T_{\text{forward}}$ is how long one run takes, which depends on the sequence length and therefore on resolution and frame count.

That equation is testable against every render this project has logged.

The second equation says why the *forward* pass costs what it does. Attention compares every token with every other token, so:

$$\text{attention cost} \sim \mathcal{O}(N^2), \qquad N \propto \text{width} \times \text{height} \times \text{frames}$$

That $N$ is countable for a real render. The measured latent for 832×480 across 124 frames was `(1, 24, 37, 30, 52)`; patching by 2×2 gives $37 \times 15 \times 26 = 14{,}430$ tokens, so attention is comparing on the order of 208 million pairs, in every one of 50 blocks, on every step.

<div class="callout warn"><span class="t">Where the model stops predicting — an honest disagreement</span>
<p>Going from 832×480 to 1280×704 at 345 frames multiplies the token count by <b>2.26×</b>. Quadratic scaling therefore predicts about $2.26^2 \approx 5\times$ the time.</p>
<p>The measured cost was <b>34×</b>.</p>
<p>The mathematics is not wrong; it is incomplete. The larger sequence no longer fits the single-card path, so it was run split across three cards, and that path carries roughly <b>7× overhead</b> beyond what the arithmetic predicts — overhead that lives in the wire between the cards rather than in any equation here. Quantifying that gap is the whole of <a href="24-pcie-nvlink-interconnect.html">ch.24</a>.</p></div>

### Amdahl's law — why making one part faster does less than expected

A render is sampling plus fixed costs: encoding, decoding, muxing, writing files. Speeding up only the sampling has a ceiling, and the ceiling has a formula:

$$\text{speedup} = \frac{1}{(1-p) + \dfrac{p}{s}}$$

where $p$ is the fraction of total time that *was* the part being sped up, and $s$ is how much faster that part became. Work it with numbers: if sampling was 60% of the time and it is made **five times** faster,

$$\text{speedup} = \frac{1}{0.4 + \frac{0.6}{5}} = \frac{1}{0.52} \approx 1.9\times$$

Five times faster at the expensive part bought less than twice overall. **Meaning:** an optimisation cannot be evaluated without knowing what fraction of the time it touches. Optimising something that is 10% of the runtime cannot ever return more than about 11%, no matter how brilliant it is.

This has a corollary that reordered the work on this project: **measure the phase breakdown before optimising anything.** The intuitive suspect is rarely the largest term. When the memory profile was finally measured, the peak turned out not to be resident weights at all but a single temporary buffer inside an int8 matrix multiplication, 2.24 GB on its own — and blocking that one operation over rows freed two gigabytes with a result proven bit-identical by `torch.equal`.

## Part 7 · One full step, end to end

Follow a single latent number through one complete step, with every number visible:

$$\text{start:} \quad x_t = 3.0, \qquad t = 0.5$$
$$\text{the model runs twice:} \quad v_c = 5.0 \ \text{(with the prompt)}, \qquad v_\varnothing = 2.0 \ \text{(without)}$$
$$\text{guidance, } s=3: \quad v = 2.0 + 3(5.0-2.0) = 11.0$$
$$\text{Euler step, } \Delta t = 0.1: \quad x_{t-\Delta t} = 3.0 - 0.1\times 11.0 = \mathbf{1.9}$$

One number went from 3.0 to 1.9. Do that to 1.4 million numbers at once, twenty-three times in a row, with fifty blocks of streamed weights behind each `v`, and static becomes a five-second film with a soundtrack.

<div class="callout truth"><span class="t">The whole pipeline, now readable</span>
<p>$\mathbf{v}_\theta(\mathbf{x}_t,t,c)\approx \frac{d\mathbf{x}}{dt}$ — "the model predicts how fast the latent is changing." $\mathbf{x}_{t-\Delta t}=\mathbf{x}_t-\Delta t\,\mathbf{v}$ — "step a little that way." $\text{softmax}(QK^\top/\sqrt{d_k})V$ — "decide what to look at, then blend it." $\mathbf{v}_\varnothing+s(\mathbf{v}_c-\mathbf{v}_\varnothing)$ — "amplify what the prompt changed." $\lfloor(x+1)\cdot127.5\rceil$ — "turn the float into a pixel." $\text{NFE}\times T_{\text{forward}}$ — "and here is the bill."</p>
<p>That is the entire model, in six sentences, every one of which has now been worked with real numbers.</p></div>
