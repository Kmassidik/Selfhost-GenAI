# The Inference Engine Landscape

<p class="lede">What runs a model is never one program: it is a stack of six rungs, from the silicon up to a serving API, and that entire stack exists separately for every hardware vendor. The honest count is not "thirteen engines" — it is six rungs with a handful of occupants each, repeated once per silicon. Learn the rungs and the map survives; learn the names and it expires.</p>

It expires fast. Half the tools named in this chapter did not exist two years ago, and at least one claim below was true when it was written and is no longer. That is not a flaw in the map — it is the most important property of the territory, and the chapter is built to survive it.

<div class="callout warn"><span class="t">Read every engine claim as dated</span>
<p>This is the fastest-moving layer in the whole project. An engine that "cannot do diffusion video" acquires a diffusion path in a point release; an offload mode that OOM-kills a process gets fixed upstream; a model that shipped on one library gets ported to three more. <b>Every specific claim below carries the date it was true.</b> The rungs are stable, the occupants are not. Before betting a build on "engine X does not support Y", check X's release notes rather than this page.</p></div>

## It is a stack, not a list

The reason a beginner drowns in engine names is that the names sit on different rungs and are being compared as though they were alternatives. vLLM and CUDA are not competitors; they are three rungs apart. ComfyUI and PyTorch are not competitors; one calls the other. Sort the names by rung and the landscape shrinks to something a person can hold.

Two phrases people use loosely now have precise meanings. **"Build from metal"** means writing at rung 1 — CUDA, ROCm, Metal, Vulkan. **"Build from AMD"** means taking the AMD column of the whole grid. They are different axes: one is a depth, the other is a vendor.

<div class="callout spec"><span class="t">The rail-gauge analogy, and where it stops</span>
<p>The vendor columns behave like rail gauges. A carriage designed for one gauge does not roll onto another without work, and the deeper the rung the less portable it is: a CUDA kernel is welded to its gauge, while a PyTorch script is cargo that any locomotive can pull.</p>
<p>The useful part of the analogy is that <b>gauge-changing bogies exist at specific rungs and nowhere else</b>. Triton compiles the same Python kernel to NVIDIA <em>and</em> AMD. ONNX Runtime re-targets an exported graph. Vulkan compute runs on almost any GPU. Those are the three places the gauge can be changed cheaply — and each one costs some performance for the privilege. Below them, nothing is portable at all.</p></div>

## Rung 1 — the metal

The lowest layer a person writes GPU code against. Kernels are born here, and every rung above is ultimately a way of avoiding it.

| API | Silicon | What it is |
|---|---|---|
| **CUDA** (with PTX/SASS, cuBLAS, cuDNN) | NVIDIA | the dominant one, and what this build targets |
| **ROCm / HIP** (with rocBLAS, MIOpen) | AMD | AMD's CUDA equivalent; HIP is near source-compatible with CUDA |
| **Metal / MPS** | Apple | Apple's GPU API — the name is literal, not a metaphor |
| Vulkan (compute) | cross-vendor | runs on nearly any GPU; the reason the post-processing binaries in [ch.48](48-the-pipeline-without-comfyui.html) are vendor-agnostic |
| SYCL / oneAPI | Intel and cross | Intel's open C++ compute layer |
| OpenCL | cross-vendor | the old portable standard, now fading |

The rung matters to this project in one concrete way. The upscaler and frame interpolator used in production are `realesrgan-ncnn-vulkan` and `rife-ncnn-vulkan` — **Vulkan** binaries with no Python and no framework underneath. That is why they survived the migration off ComfyUI untouched while everything else had to be rebuilt: they never depended on any rung above 1.

## Rung 2 — compilers and kernel languages

The job of this rung is to turn readable maths into fast device code so nobody hand-writes assembly.

| Tool | By | What it does |
|---|---|---|
| **Triton** | OpenAI | Python → PTX for NVIDIA, and an AMD backend as well |
| TensorRT | NVIDIA | compiles a whole model into one optimised NVIDIA build |
| Apache TVM | Apache | compile once, target many backends |
| XLA | Google | the compiler behind JAX and TensorFlow; drives TPUs |
| IREE / MLIR | Google, LLVM | the compiler infrastructure several of the others are built on |
| Mojo · Halide · Hidet | various | newer kernel and DSL approaches |

There is a naming trap here worth memorising, because it wastes an afternoon of searching for everyone exactly once: **OpenAI's Triton (a kernel language) and NVIDIA's Triton Inference Server (a serving layer) are unrelated projects with the same name, four rungs apart.**

## Rung 3 — frameworks

| Framework | Note |
|---|---|
| **PyTorch** | the default; runs on CUDA, ROCm, Metal (MPS) and XPU — the base of this build at 2.11 + cu128 |
| JAX / TensorFlow | Google's; XLA-compiled, TPU-first |
| **MLX** | Apple's framework for Apple Silicon |
| ggml / GGUF | the small C tensor library beneath `llama.cpp`, and the container format that comes with it |
| tinygrad · Candle · Burn | minimalist Python and Rust frameworks |
| ONNX Runtime | runs an exported graph across many backends — CUDA, ROCm, DirectML, CoreML |

## Rung 4a — text engines

The crowded rung. All of these run autoregressive text models.

| Engine | Strength |
|---|---|
| **llama.cpp** / Ollama / llamafile / KoboldCpp / GPT4All / LocalAI | the GGUF family — quantized LLMs on CPU and almost any GPU, down to laptops and phones |
| **vLLM** / **SGLang** / TGI / LMDeploy / Aphrodite | high-throughput GPU serving, built on PagedAttention and RadixAttention |
| TensorRT-LLM · ExLlamaV2 · CTranslate2 | maximally optimised single-node inference |
| MLC-LLM | TVM-compiled, targeting browser, phone, any chip |
| PowerInfer · KTransformers · DeepSpeed-Inference | offload, sparsity and hybrid CPU-GPU tricks |
| Petals | one model distributed across volunteer machines |
| text-generation-webui | the popular local LLM interface, wrapping several of the above |

## Rung 4b — diffusion engines

Where H3 lives: iterative denoising plus VAEs.

| Engine | Strength |
|---|---|
| **🤗 diffusers** | the reference library — H3 ships here, and this build stands on it |
| ComfyUI / SwarmUI | node-graph engines for image and video — **the rung this project started on and has since left** |
| Automatic1111 / Forge / SD.Next / Fooocus / InvokeAI | Stable-Diffusion image interfaces |
| **xDiT** | multi-GPU Diffusion-Transformer engine, described by its authors as the vLLM of DiTs |
| Nunchaku (SVDQuant) | 4-bit W4A4 DiT inference, fast and low-VRAM on Ampere |
| OneDiff · stable-fast | compilation and acceleration for diffusion graphs |
| Draw Things · DiffusionKit | diffusion on Apple Silicon, via Metal and MLX |

## Why the two engine families exist — and why the line is blurring

The split between rung 4a and rung 4b is not marketing. It follows from two genuinely different generation loops, and the difference has a physical consequence for memory.

The structural difference is the one between **typesetting a page and developing a photographic plate**. A compositor sets one letter after another and keeps everything already set standing in the frame — the accumulated type *is* the KV cache, and the whole craft of an LLM engine is managing that growing frame across many concurrent jobs. A darkroom worker instead exposes the entire plate, then exposes it again, and again; nothing accumulates between passes because each pass replaces the image wholesale. That is why a diffusion engine has nothing to cache, and why its hard problems are entirely different ones: fitting a single enormous activation, and moving 50 blocks of weights past the card on every pass.

| | LLM engine | Diffusion engine |
|---|---|---|
| Loop | autoregressive, token by token | iterative denoising, 4 to 49 full passes |
| Core trick | the KV cache (PagedAttention, RadixAttention) | fitting the activation — tiling, offload, quantization — plus VAEs |
| Output | discrete tokens | continuous pixels and audio samples |
| What it moves per unit of output | one token's worth of state | the entire model, once per step |

<div class="callout truth"><span class="t">The claim that expired — and the date it expired on</span>
<p>An earlier version of this chapter stated flatly that <b>engines stay family-specific and LLM and diffusion never cross.</b> That was a clean, defensible line, and it stopped being true while the chapter sat on disk. As of <b>August 2026</b>, SGLang — built for high-throughput text serving — also officially serves H3, a diffusion video model, and vLLM was adding a diffusion path.</p>
<p>Note carefully <em>what</em> changed and what did not. The <b>architectures</b> are still different machines: a KV cache still has nothing to hold in diffusion. What converged is the <b>infrastructure around</b> the loop — schedulers, batching, memory pools, the API surface — which turns out to be reusable even when the loop is not. The right question is never "which family does this engine belong to?" but <b>"what does this engine support in the release I can install today?"</b></p></div>

## Rung 5 — serving and orchestration

| Server | Note |
|---|---|
| NVIDIA **Triton Inference Server** | the confusingly named one — a serving layer, not OpenAI's kernel language |
| Ray Serve · BentoML · KServe | general model serving and scaling |
| TGI · vLLM | act as servers as well as engines, which is why they appear twice |

This build has no rung 5 at all. There is no API in front of the renderer; a scene is a dict entry and a render is a shell command ([ch.48](48-the-pipeline-without-comfyui.html)). That is a deliberate omission rather than an oversight — a serving layer earns its keep by multiplexing many short requests over one loaded model, and a single render here occupies the machine for between two minutes and forty-four hours ([ch.47](47-the-scorecard.html)). There is nothing to multiplex.

## The vendor view — the same grid, different metal

| Vendor | Metal | Compiler | Engines that run there |
|---|---|---|---|
| **NVIDIA** | CUDA | TensorRT, Triton | effectively everything; the default target |
| **AMD** | ROCm / HIP | MIGraphX, Triton's AMD backend | llama.cpp, vLLM and PyTorch all have ROCm builds |
| **Apple** | Metal / MPS | Core ML, MLX | llama.cpp on Metal, MLX, Draw Things, DiffusionKit |
| **Intel** | oneAPI / SYCL | OpenVINO, IPEX | OpenVINO, llama.cpp on SYCL, PyTorch-XPU |
| **Google** | TPU | XLA | JAX and TensorFlow, TPU-native |
| Qualcomm and mobile | Hexagon / NPU | QNN, TFLite | on-device LLM and vision |

<div class="callout spec"><span class="t">One consequence worth keeping</span>
<p><b>Triton has an AMD backend.</b> Any kernel written for this build's sm_86 could in principle be recompiled for an AMD card without a hand rewrite in HIP. That is the concrete payoff of working one rung above raw CUDA: a measure of hardware portability arrives for free, and it is the single strongest argument for choosing rung 2 over rung 1 when both would work.</p></div>

## Where this build sits, and the rung it walked away from

The project started at rung 4 as a *user* of an engine, and ended at rung 4 as an *author* of one. That migration is the whole arc of the knowledge base compressed into one diagram.

<div class="callout truth"><span class="t">ComfyUI is gone from this box</span>
<p>The engine rung is the only one that moved, and it moved completely: <b>ComfyUI has been removed from the machine</b>. Every render described from <a href="46-the-first-15-seconds.html">ch.46</a> onward was produced by a pipeline written for this project on top of diffusers 0.40 and torchao 0.18, including the post-processing (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>). Nothing below rung 3b changed during that migration — the driver, CUDA and PyTorch were never touched — which is precisely what a well-layered stack is supposed to permit.</p>
<p>What ComfyUI gave, and it was not nothing: the node vocabulary, the loaders, and a working mental model of a generation graph. It was the right first rung and the wrong final one.</p></div>

## Why the rung you stand on decides what you can fix

Choosing a rung is not a matter of taste. It sets the boundary between "a setting I can change" and "a thing I would have to fork" — and for this project that boundary was the difference between shipping and stopping.

Both patch points sit *inside* one transformer block, which is to say inside the engine's inner loop. From rung 4 as a user, they are unreachable: a node exposes the arguments that surround the loop, not the loop. From rung 4 as an author — holding `diffusers` and `PyTorch` objects in ordinary Python — each one is a function that can be replaced before the render starts. Every parallelism strategy this project built is exactly that: a monkeypatch installed by a driver script, then a call into the same unchanged pipeline entry point ([ch.48](48-the-pipeline-without-comfyui.html)).

<div class="callout warn"><span class="t">Standing lower also means owning the bugs</span>
<p>The bill for that freedom arrives in the form of upstream defects that a higher rung would have hidden. Two paid in this project: <code>diffusers</code>' <code>use_stream=True</code> offload pins tens of gigabytes of host RAM and the kernel OOM-kills the process with no traceback, so the flag stays <code>False</code>; and the block-level group-offload path has a known upstream issue, so the pipeline owns weight movement explicitly rather than trusting the hook. Neither is visible from a node graph. Neither is avoidable once the graph is gone.</p></div>

## What this rung actually costs to run

The rung determines the mechanism, and the mechanism determines the bill. With the DiT held in system RAM and streamed block by block, roughly **0.4 GB of weights crosses PCIe per block**, 50 blocks per step — so a 23-step render moves about **460 GB** across the bus before a single frame is decoded. That number is a direct consequence of standing at rung 3 with 8 GB cards, and it is the reason so much of this knowledge base is about memory movement rather than arithmetic.

The interconnect makes the same point from the other side. Between two cards without NVLink the measured path runs at about **4.9 GB/s**, while host RAM to GPU runs at about **12 GB/s** — which is why "cache a block on an idle neighbour and fetch it over PCIe" is *slower* than simply re-reading it from RAM, and why the design study rejected peer-as-cache outright ([ch.24](24-pcie-nvlink-interconnect.html), [ch.16](16-multi-gpu-and-nvlink.html)).

<div class="callout spec"><span class="t">Rungs move too — an example with a date</span>
<p>Context parallelism used to be something a team wrote by hand. As of <b>diffusers 0.40</b> it is a two-line configuration in the library itself, with Ulysses, Ring and Unified variants, benchmarked upstream on 4 × RTX 4090 over PCIe — that is, explicitly on hardware without NVLink. This project still hand-rolled its own ring (<a href="36-splitting-the-video-cp.html">ch.36</a>, <a href="45-three-gpu-sequence-parallelism.html">ch.45</a>), for a reason that is itself a rung argument: the library's implementation is multi-process, one process per GPU, which replicates the model in RAM and hits a wall this box cannot pay (<a href="42-why-two-models.html">ch.42</a>).</p>
<p>The general lesson: <b>capabilities migrate downward over time.</b> What is a research project at rung 4 this year is a config flag at rung 3 next year. Re-check the rung below before building anything.</p></div>

## Reading the landscape without drowning in it

Four questions turn any new tool name into a position on the grid, and they are worth asking in order.

1. **Which rung is it on?** If it manages memory pools and batches requests, it is rung 5. If it owns the denoise or decode loop, rung 4. If it defines tensors, rung 3. If it emits device code, rung 2. If it talks to the driver, rung 1.
2. **Which vendor column does it live in, and does it have a bogie?** Anything written directly in CUDA is welded to NVIDIA. Anything on Triton, ONNX or Vulkan can change gauge.
3. **Which family does its loop belong to, and what does the current release actually support?** The loops still differ; the support matrix no longer follows the loop.
4. **What can be patched from there?** This is the question that decided this project. If the thing to be changed lives inside the loop, standing outside the loop will not do.
