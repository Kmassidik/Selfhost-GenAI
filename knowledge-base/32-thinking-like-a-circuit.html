# Thinking Like a Circuit

<p class="lede">A running model is a circuit: the activations are the signal, the weight matrices are the fixed elements the signal passes through, and the activation functions are the nonlinear junctions between them. Read it that way and three things that otherwise have to be memorised become derivable — which jobs a second card can help with, what "compressing a model" really is, and why compression can never be free.</p>

This is not a decorative comparison. It is the same mathematics with two vocabularies on top of it, and the test of that claim is whether the circuit reading makes correct predictions about hardware. It made two on this project. One was right and saved a month of engineering. One was wrong, and the way it was wrong is the more useful half of the chapter.

<div class="callout truth"><span class="t">The one-line version</span>
<p>An electrical engineer and a machine-learning engineer are studying the <b>same object</b>: a signal flowing through a network of linear elements with nonlinear junctions in between. Once that is visible, a graphics card stops being a mystery box and becomes something to reason about — where it will bottleneck, what a second card buys, and what shrinking a model costs.</p></div>

## The mapping

Line the two vocabularies up and they are the same nouns twice.

## Series and parallel — the exact import

This is the most useful thing the circuit reading gives, and it is exact rather than suggestive.

- **Parallel.** Add another branch and **capacity adds up**. Three resistors in parallel carry more total current; three cards running three separate renders finish three clips in the time of one. This works on this box today, needs no engine code, and scales linearly.
- **Series.** The **same current flows through every element**, impedances (and latencies) **add**, and the **slowest element sets the pace**. A chain of stages is series. Splitting a chain across more silicon does not make one pass through it faster — it spreads the same sequential work out and adds a hand-off at every boundary.

That is Kirchhoff restated for compute: **in parallel, throughputs sum; in series, latencies sum and the bottleneck dominates.**

### Two kinds of work, and only one divides

- **Parallel work** is independent and divides perfectly. Nine painters on nine walls finish in the time of one.
- **Sequential work** needs the previous result before it can start, so it cannot be split at all. Nine painters cannot apply the second coat before the first is dry.

The denoise is sequential on **two** axes at once. Step $t+1$ needs the full output of step $t$; and inside a step, block $n+1$ needs block $n$'s activation. Neither dependency can be argued away — they are what the model *is*.

And when the split is attempted *within* a step — different blocks on different cards — the cards must pass the intermediate activation across the link at every stage boundary: **0.27 GB per hand-off**, at **4.9 GB/s**, which is *slower* than fetching the same data from system RAM at ~12 GB/s. That is the **communication tax**, and on this board it frequently costs more than the compute it distributes.

### The shared rail

There is a third element in the circuit that is easy to forget because it has no fan on it: **system memory is a shared supply**. Every card streams its weights out of the same DDR3-1600 pool, which reads at roughly **25 GB/s** in total, while each card's PCIe link can accept about **12 GB/s**.

One card streaming leaves the supply comfortable. Three cards each streaming a full copy of the model would ask for something like 36 GB/s from a 25 GB/s source — and a supply that cannot deliver the demanded current simply sags, slowing every branch at once. In circuit terms the branches are not independent after all; they share a source impedance.

This is why "each process loads its own copy" is such an expensive mistake, and it is not hypothetical: the off-the-shelf three-process ring path failed here precisely because the offloading machinery re-copied the weights per process. That failure showed up first as an out-of-memory error — the capacity cost — but the bandwidth cost was queued up right behind it. **One resident copy of the model, streamed to whichever card needs it, is not merely tidier; it is the only arrangement the supply can serve.**

### The third import: the largest element sets the pace

In a series circuit, the biggest impedance dominates the current, and improving any other element barely moves the needle. Compute has the same law under a different name — Amdahl's — and it can be written as one fraction. With $p$ the fraction of the total that a fix applies to, and $s$ the factor by which that fraction improves:

$$\text{speed-up} = \frac{1}{(1-p) + \dfrac{p}{s}}$$

The consequence is unintuitive until it has happened once: **an infinite improvement to a small element yields almost nothing**, and the moment a big element is fixed, whatever was second-largest becomes the new ceiling. This project has walked into that twice, both times measured.

<div class="callout warn"><span class="t">Two measured cases of the new bottleneck appearing</span>
<p><b>The step-count fix that hit an upscale wall.</b> The Turbo variant cut sampling roughly <b>5×</b> — 20 steps down to 4–8. At 1080p output, that made the <em>upscale</em> of 362 frames the dominant cost, and the total barely improved. Rendering at 720p instead kept the tail small enough for the sampling win to survive. Killing the largest element promoted the next one.</p>
<p><b>The memory fix that hit a decode wall.</b> Chunking the int8 matmul dropped the sampling allocated peak from <b>5925 MB to 3887 MB</b> — a real 2 GB, bit-identical. The whole-run peak moved only from <b>7840 MB to 7570 MB</b>, because the VAE decode phase now capped the total. Classic series behaviour: the wall moved, it did not disappear.</p></div>

The second case has a tail worth telling, because it is a lesson about instruments rather than about circuits. When the decode phase was probed directly, its own allocated peak turned out to be only **1162 MB**. The apparent 7.6 GB decode wall was *leftover reserved pool* from the sampling phase, not decode consumption — the meter had been reporting what the allocator held rather than what the phase used, and an earlier claim in this project's notes was retracted on that basis.

<div class="callout truth"><span class="t">Series reasoning is only as good as the meter</span>
<p>Identifying "the largest element" requires a measurement that attributes cost to the right component. Reserved memory is not used memory; total step time is not kernel time. Both mistakes have been made here, and both produced a confident plan aimed at the wrong element.</p></div>

## The scheme the circuit reading found — and the study that killed it

Start with the wall, honestly stated. Three cards hold 8 GB each. That is **not** a 24 GB card, and the difference matters exactly the way it does in a circuit: capacities only sum when the work divides across the branches.

<div class="callout danger"><span class="t">Why "24 GB total" does not mean the model fits</span>
<p>The full int8 transformer the design study was written against is <b>33 GB</b> — larger than 24 GB, so it never fit. The pruned int8 file this box actually runs is <b>20 GB</b>, which is <em>smaller</em> than 24 GB, and it still does not fit. Split three ways that is about 6.7 GB of weights per card; add ~1.2 GB of CUDA context and there is nothing left for the activation, which needs several gigabytes more.</p>
<p>Aggregate VRAM is a sum on paper only. Each card must independently hold its own share <em>plus</em> the working state, and it is the working state that is decisive.</p></div>

So the circuit reading reached for a second move. A stage-pipeline is a **series** arrangement, so only one card computes at a time and the other two sit idle on free VRAM. The idea writes itself: fill that idle space with prefetched blocks, so that instead of streaming all 50 blocks per step from RAM, some are already resident on the cards. This project wrote it down as a **1.3–1.5× single-render win** and commissioned a design study to build it.

The study disproved it.

<div class="callout warn"><span class="t">The prediction, and the finding</span>
<p>Written down beforehand: <b>1.3–1.5×</b> faster on one render. The design study's honest number: <b>~1.0×, range 0.9–1.1×, possibly slightly negative</b> once pipeline bubbles and two per-step hidden-state hops are counted.</p>
<p>Three architectural facts defeat it, any one of which is close to fatal on its own — and none of them is a tuning problem.</p></div>

**One — pipelining raises throughput, not single-render latency.** Pipeline parallelism keeps every stage busy by feeding it *different* samples. One render has one latent and one active step; at any instant exactly one card computes and two idle. This is the series diagram above, and no amount of engineering changes a series arrangement into a parallel one.

**Two — the activation evicts the cache exactly when it is needed.** This is the mechanism worth drawing, because it is not obvious from the outside.

The trap in the original arithmetic was subtle and worth naming: it assumed the cache built on an idle card would still be there when that card started computing. But **the card that cached the blocks is the same card that must evict them to compute them.** The two idle caches only ever help a future phase on their own card, and that future phase is precisely the moment of eviction.

**Three — on a board without NVLink, peer-caching is slower than streaming.** The obvious fallback is to cache block *N* on a neighbour and pull it over when needed. Card-to-card runs at **4.9 GB/s**; RAM to card runs at about **12 GB/s**. Fetching from another card is strictly worse than fetching from RAM. The fallback is not merely weak; it is negative.

<div class="callout truth"><span class="t">What the circuit reading got right and wrong</span>
<p><b>Right:</b> that splitting a series chain adds a communication tax, and that on a 4.9 GB/s link the tax often exceeds the compute it distributes. That prediction has held every time it has been tested here.</p>
<p><b>Wrong:</b> that the inverse move — <em>feeding</em> the active card from idle ones — would be a free win. It is not, because the activation owns the very VRAM the cache would occupy. The circuit picture models the flow of the <em>signal</em> beautifully and says nothing about where the signal has to be <em>stored</em>. That is the boundary of the analogy, and it is worth knowing where it lies.</p></div>

### The number that was still open — and how it resolved

The study reasoned that the render was **compute-bound**, since the chip's units were pegged, which would cap even a perfect streaming fix at little. A live reading from the streamed single-card path said the opposite: about **100 W of a 200 W limit** with flickering utilisation, the signature of a job starved between blocks.

Both readings were real. They came from different workloads, which is the whole answer.

<div class="callout spec"><span class="t">Predicted versus measured, on the record</span>
<table>
<tr><th>Claim</th><th>Predicted</th><th>Measured</th></tr>
<tr><td>Idle-card block cache, single-render speed-up</td><td>1.3–1.5×</td><td><b>~1.0×</b> (0.9–1.1×), possibly negative</td></tr>
<tr><td>Bound of the render</td><td>compute-bound (chip pegged)</td><td><b>Both, depending on the clip</b> — starved at ~100 W on a small streamed render; <b>100% utilisation</b> on the working card during <code>g4final</code></td></tr>
<tr><td>Cost of 832×480×345 → 1280×704×345</td><td>~5× (quadratic attention on 2.26× the tokens)</td><td><b>34×</b> — about 7× overhead beyond the mathematics</td></tr>
</table>
<p>The third row is the communication tax made visible. The sharded path works — it produced the first native 720p fifteen seconds on this hardware — and it costs far more than the arithmetic alone predicts, which is exactly what a series arrangement with per-stage hand-offs should do.</p></div>

### What did work

- **Throughput, guaranteed, zero engine code.** Three independent renders, one per card — a linear **3× on total output**. This is the parallel branch of the circuit, and it needs nothing built. If the deliverable is a minute of finished video made of many shots and seeds, this is simply the right answer.
- **Sequence parallelism, the real single-render lever.** Split the *sequence* across the cards so all three compute the same block simultaneously on their own token shards. This is the physics-correct move: it parallelises compute *and* shrinks the activation wall, which is the actual 8 GB constraint. The study predicted the activation would fall roughly threefold and free room for several resident blocks per card.
- And it was then **built and measured** (<a href="36-splitting-the-video-cp.html">ch.36</a>, <a href="45-three-gpu-sequence-parallelism.html">ch.45</a>) — including the failure the study did not predict: the off-the-shelf ring path with three processes **ran out of memory**, because the offloading machinery re-copied the weights in every process. Three copies of a streamed model is three times the streaming, not a third.

<div class="callout truth"><span class="t">The transferable lesson</span>
<p><b>Measure the compute-versus-transfer bound before designing a multi-GPU plan.</b> The block cache attacked a streaming cost that the activation makes uncacheable and that may not even have been the bottleneck for the render in question. The instrumentation that settles it is small — separate kernel time from host-to-device copy time on one known-good render — and it is cheaper than any of the schemes it rules in or out.</p></div>

## Thévenin and compression

Now the second import, which is the reason this chapter exists in a guide about model files.

In circuits, **Thévenin's theorem** says that an arbitrary network of sources and resistances, viewed from two terminals, can be replaced by **one** source and **one** resistance — and the replacement is *exact*. Nothing downstream can tell the difference. The theorem holds because circuits made of linear elements are linear.

Model compression is the same move: replace an expensive sub-network with a smaller stand-in that does nearly the same job.

<table>
<tr><th>Technique</th><th>What it replaces</th><th>Seen in this project</th></tr>
<tr><td><b>Low-rank / SVD factorization</b></td><td>$W \approx U\,V$ — store an $m\times k$ and a $k\times n$ instead of a full $m\times n$</td><td>The mechanism behind SVDQuant (<a href="26-serving-h3-real-world.html">ch.26</a>)</td></tr>
<tr><td><b>Distillation</b></td><td>A large teacher, by a small student trained to imitate it</td><td>How step-reducing Turbo variants are made</td></tr>
<tr><td><b>Pruning</b></td><td>Weights that barely contribute, deleted outright</td><td><b>The file on this box</b> — the transformer we run is the pruned int8 build, 20 GB rather than 33</td></tr>
<tr><td><b>Quantization</b></td><td>Nothing structural — the same shape, fewer bits per number</td><td>int8 and Q4, and the grid arithmetic in <a href="29-where-numbers-live.html">ch.29</a></td></tr>
</table>

SVDQuant is the closest thing to a literal Thévenin equivalent applied to a video model: an SVD peels a **low-rank branch** out of the weights to absorb the outliers that resist quantization, so everything remaining collapses cleanly to four bits. Replace the awkward sub-network with a small exact-ish equivalent plus a clean remainder — the theorem's shape exactly, and a direct answer to the shared-scale problem from <a href="29-where-numbers-live.html">ch.29</a>, where one large weight coarsens the grid for its whole group.

## The catch — nonlinearity, and why nothing compresses for free

Here is where the analogy pays its debt. A pure stack of **linear** layers collapses into a single layer, exactly:

$$C\,(B\,(A x)) = (C B A)\,x = M x$$

All fifty weight matrices could be multiplied together into one matrix $M$, and depth would be gone with no loss whatsoever. Which means depth *by itself* is worthless — a hundred linear layers are one linear layer. This is provable, not heuristic, and it is precisely why superposition works in a linear circuit.

What saves the model is the **nonlinearity** $\sigma$ — softmax, GELU — sitting between the layers:

$$C\,\sigma(B\,\sigma(A x)) \neq M x$$

<div class="callout truth"><span class="t">The nonlinearity is both the power and the wall</span>
<p>The <b>same</b> junction that gives the model its capability — without it, depth is worthless and the entire stack is one flat matrix — is <b>exactly why it cannot be collapsed for free</b>. Thévenin's clean guarantee dies at the first nonlinearity. Past that point only <em>approximate</em>, lossy compression is on the table.</p>
<p>That is not a failure of technique. It is the reason the model works at all. Lossy compression is the only game because lossless would imply linearity, and a linear model cannot make a face.</p></div>

There is a satisfying footnote to that. The one compression this project performed that *was* exactly lossless — chunking the int8 matmul in <a href="29-where-numbers-live.html">ch.29</a>, proven bit-identical — was not a compression of the model at all. It changed the order in which the same arithmetic was carried out. The theorem is not violated: nothing about the network was replaced, so nothing about the network was lost. Every genuine free win on this box has had that character.

<div class="callout truth"><span class="t">Six things this lens gives, for free</span>
<ol>
<li><b>A model is a circuit:</b> activations are the signal, weights are the impedances, activation functions are the nonlinear junctions.</li>
<li><b>Parallel adds throughput; series adds latency.</b> Three independent renders work today; a pipeline chain cannot make one render faster.</li>
<li><b>The denoise is sequential on two axes</b> — across steps and across blocks — and splitting inside a step pays 0.27 GB per hand-off at 4.9 GB/s.</li>
<li><b>Idle cards as a weight cache does not work:</b> predicted 1.3–1.5×, found ~1.0×. The 5.70 GB activation evicts the cache the instant a card computes, and peer transfer is slower than RAM.</li>
<li><b>Thévenin ↔ compression:</b> low-rank, distillation, pruning and quantization all replace something expensive with a smaller stand-in. This box runs a pruned model, so it is living in that theorem already.</li>
<li><b>Nonlinearity blocks the free collapse</b> — which is simultaneously the reason depth is worth anything and the reason exact compression is impossible.</li>
</ol></div>
