<span class="kicker">Chapter 18 · The bits themselves</span>

# Number Formats &amp; Precision

<p class="lede">A number format is the decision of how many bits each of the model's billions of numbers gets, and that one decision sets four things simultaneously: how much space the model takes, how fast the arithmetic runs, how good the output looks, and whether the thing can be run on this hardware at all. Measured here, the same transformer is about <b>66 GB in bf16</b> and <b>20 GB in int8</b> — same model, same weights, one choice of format between them.</p>

Every render on this machine begins with two failures.

```
Failed to load .../torchao/_C_cutlass_90a.abi3.so
Failed to load .../torchao/_C_mxfp8.cpython-310-x86_64-linux-gnu.so
Unable to import `torchao` Tensor objects.
```

Nothing is wrong. Those two lines are a quantization library discovering, at import time, which decade of graphics hardware it has landed on — and they happen to name the exact two number formats this box does not have in silicon. By the end of the chapter those filenames should read as clearly as a sentence.

<div class="callout truth"><span class="t">The one idea</span>
<p><b>Precision is bits spent per number.</b> More bits mean a more faithful value, a larger file, and more traffic to move it. Fewer bits mean smaller and faster, right up until quality breaks. Self-hosting a large model on small cards is nothing but this trade, made deliberately — and the interesting part is knowing exactly where it stops paying.</p></div>

## What a "format" actually is

A single weight is a value like `0.0273`. A **format** is how that value is written down in memory. The same weight can occupy 32 bits or 8, and the difference is not rounding in the casual sense — it is a different set of representable values, laid out differently.

There are two families, and they are built on genuinely different ideas.

<div class="callout spec"><span class="t">Float vs integer — the core split</span>
<table>
<tr><th></th><th>Floating point</th><th>Integer, with a scale</th></tr>
<tr><td>Structure</td><td>sign + <b>exponent</b> + mantissa</td><td>a whole number + one <b>shared scale factor</b></td></tr>
<tr><td>The exponent buys</td><td><b>range</b> — the same 16 bits can hold 0.00001 and 60000</td><td>(no exponent; range is fixed by the scale)</td></tr>
<tr><td>The mantissa buys</td><td><b>resolution</b> — how finely the range is divided</td><td>the integer itself is the resolution: 256 steps for 8 bits</td></tr>
<tr><td>How it shrinks</td><td>spend fewer bits on exponent or mantissa</td><td>map a range of floats onto a grid of integers</td></tr>
<tr><td>Examples</td><td>fp32, fp16, bf16, fp8</td><td>int8, int4, the GGUF Q-quants</td></tr>
</table>
<p>A float carries its own scale in every value, which is flexible and expensive. An integer format factors the scale out and shares it across a whole tensor or block, which is cheap — and is precisely what the word <b>quantization</b> means: <em>squeeze a range of floats onto a grid of integers plus one shared multiplier.</em></p></div>

<div class="callout spec"><span class="t">Why bf16 and not fp16, when both are 16 bits</span>
<p><b>bf16 keeps all eight of fp32's exponent bits and sacrifices mantissa.</b> Its range is identical to fp32's, so a value that would not overflow in full precision will not overflow in bf16 — it will just be less finely resolved. fp16 does the opposite: more mantissa, far less range, and a real risk of numbers running off the top or bottom end.</p>
<p>For training and for diffusion, range matters more than resolution, which is why large models are published in bf16 and why the H3 transformer arrives that way. Its ~66 GB is 33 billion numbers at two bytes each.</p></div>

## How quantization actually works

Take a tensor of weights, find the largest magnitude in it, and set a scale so that the largest value maps to the top of the integer range:

$$s \;=\; \frac{\max |W|}{127}, \qquad q \;=\; \mathrm{round}\!\left(\frac{W}{s}\right), \qquad \hat{W} \;=\; q \cdot s$$

That is the entire idea. Store $q$ as one byte per weight, store $s$ once, and reconstruct $\hat{W}$ when needed. The error is whatever rounding threw away — at most half a step of the grid.

The catch is in $\max|W|$. **The single largest value in the tensor sets the spacing for every other value in it.** One extreme outlier stretches the grid, and the tightly clustered mass of ordinary weights near zero suddenly has far fewer distinct levels to land on. That is why real quantization schemes never use one scale for a whole tensor: they use one **per channel** or **per small block**, so an outlier only coarsens its own neighbourhood.

<p>Two things in that table are worth reading twice. <b>fp8 is not smaller than int8 here</b> — it is the same byte count with worse hardware support, which is the clearest possible case against picking a format by size alone. And <b>20 GB is less than the 33 GB that 33 billion numbers at one byte would predict</b>, because the int8 build is also <b>pruned</b>: the transformer's own config gives about 395 million parameters per block across 50 blocks, roughly 20 billion numbers, one byte each.</p></div>

<div class="callout truth"><span class="t">"Could it run in fp32?" — the exact answer</span>
<p><b>The GPU can.</b> fp32 is every NVIDIA card's native baseline, on the CUDA cores. <b>This model cannot.</b> 132 GB of weights exceeds the 125 GB of system RAM, and fp32 activations are twice the size of bf16 ones, so the working set overruns 8 GB of VRAM immediately. It is a <b>memory</b> limit, not a capability limit — and it does not go away by summing the three cards, because no single card ever holds more than its own 8 GB.</p></div>

## On a streaming design, the format *is* the clock

This is the part that people who have only run models that fit in VRAM tend to miss. Here the weights live in system RAM and are copied to a card block by block, every block, every step ([ch.02](02-your-hardware.html)). So bytes per weight is not just a storage question — **it is the size of the traffic on the slowest link in the machine**, repeated tens of thousands of times.

<div class="callout truth"><span class="t">Why the choice compounds</span>
<p>A model that fits entirely in VRAM pays for its format <b>once</b>, at load. A model that streams pays for it <b>every block of every step</b>. That is the difference between "int8 saves disk space" and "int8 is the reason the render finishes this week" — and it is why on this build the format question is inseparable from the wall-clock question ([ch.30](30-the-render-live.html)).</p></div>

## What this silicon actually implements

A format existing in the world says nothing about whether a given chip runs it quickly. **Tensor cores** — the dedicated matrix units — accelerate a fixed menu, and that menu is locked to the GPU generation.

### Reading the opening log lines

Now the two failures at the top of the chapter decode themselves:

- **`_C_cutlass_90a`** — `90a` is the compute capability **sm_90a**, which is **Hopper**. This box is **sm_86**.
- **`_C_mxfp8`** — microscaling fp8, a **Blackwell**-era format with no Ampere implementation at all.

torchao ships kernels for every generation and tries them all at import. Two of them are for silicon that is not present, they decline to load, they say so, and the library falls back to what Ampere does have — which is exactly the int8 path this build depends on. **Two error messages per render that are simply a library taking inventory of the hardware.**

<div class="callout warn"><span class="t">The lesson underneath the log lines</span>
<p>Smaller is not automatically better. A workflow that defaults to an fp4 or fp8 component <em>will run</em> on Ampere — by emulating the format in software, slowly — while a format the silicon genuinely implements runs at full speed. <b>Match the format to the GPU generation, not to the smallest file.</b> "Grab the smallest download" is how people end up with a model that fits and crawls.</p></div>

## Why quantization works at all, and where it stops

If fp32 is the faithful version, why does dropping to a quarter of the bits not ruin the output? Because of what the numbers look like in practice:

- **Weights cluster tightly around zero.** A small integer grid plus a per-block scale captures that distribution well, which is why 4-bit *weights* can be close to lossless — the ViDiT-Q result, and consistent with the int8-versus-Q4 comparison measured on this box ([ch.13](13-int8-vs-q4.html)).
- **Activations are spikier.** They carry occasional large outliers, and outliers are exactly what a shared scale handles worst. Activations are therefore far more sensitive to low bit counts than weights are.
- Which is why the schemes that work are asymmetric: **W4A8** or **W8A8** — quantize the forgiving side hard, keep the touchy side softer.
- **Diffusion breaks earlier than language models do.** An LLM can often be pushed to 2 or 3 bits and still read well, because a slightly different word choice is invisible. A diffusion model writes pixels, and a slightly different pixel is visible. Roughly 4 bits is the proven floor for image and video work.

<div class="callout warn"><span class="t">The trap: fewer weight bits do not move the real wall</span>
<p>The tempting move is "go lower and free VRAM". But the ceiling here was <b>measured</b>, and it is not the weights — the weights already stream from RAM a block at a time, so their format sets <em>traffic</em>, not <em>peak</em>. What sets peak VRAM is the <b>activations and matmul working buffers</b> ([ch.12](12-pushing-past-8gb.html)).</p>
<p>The failure that proves it: the <code>g4k</code> render died with an out-of-memory error at <code>[vae] clip 14</code>, and the cause was not capacity at all — the decode path was appending every finished pixel chunk to a list that lived on the GPU, roughly 216 MB per chunk at 1280×704. An accumulation bug, fixed by moving finished chunks to the CPU on append. No weight quantization anywhere on the ladder would have saved that render.</p></div>

## The history in this chapter, kept honest

An earlier version of this chapter recommended a GGUF `Q4_K_M` file as the default, at **11.6 GB** for the unpruned transformer, alongside the rest of the GGUF ladder:

That ladder is still an accurate picture of how the Q-quants behave, and the head-to-head against int8 is [ch.13](13-int8-vs-q4.html). What changed is the engine: GGUF is a container built for `llama.cpp`-family runtimes, and once the pipeline became diffusers plus torchao ([ch.48](48-the-pipeline-without-comfyui.html)), the format that mattered was the one torchao could quantize and stream — **int8 safetensors, 20 GB**. The measured verdict that Q4 and int8 look the same never changed. The path around it did.

## Where each format lands on this build

<table>
<tr><th>Format</th><th>On this machine</th><th>Verdict</th></tr>
<tr><td>fp32</td><td>~132 GB, larger than 125 GB of RAM</td><td>❌ unreachable — a memory limit, not a capability one</td></tr>
<tr><td>bf16</td><td>~66 GB, streams from RAM at double the traffic</td><td>the precision ceiling; slow by construction</td></tr>
<tr><td><b>int8</b></td><td><b>20 GB</b>, native tensor-core support</td><td>✅ <b>the default, and the reason renders finish</b></td></tr>
<tr><td>fp8</td><td>~21 GB, emulated in software</td><td>❌ no smaller, and much slower here</td></tr>
<tr><td>fp4 / nvfp4</td><td>~13 GB</td><td>❌ needs Blackwell</td></tr>
<tr><td>int4 / Q4</td><td>smaller still</td><td>viable for weights; does not move the activation wall</td></tr>
</table>

<div class="callout truth"><span class="t">The five things worth keeping</span>
<ol>
<li><b>Format = size × speed × quality × fit</b>, all four decided by one choice of bits per number.</li>
<li><b>The same 16 bits can be split two ways.</b> bf16 keeps range, fp16 keeps resolution — and for large models range wins.</li>
<li><b>Quantization is an integer grid plus a shared scale</b>, so the biggest weight in a block sets the resolution of every other weight in it. Per-block scales are the whole craft.</li>
<li><b>Ampere runs fp16, bf16 and int8 on tensor cores, and has no fp8 or fp4 at all</b> — which is what the two failed kernel loads announce at every import.</li>
<li><b>On a streaming design, bytes per weight is a wall-clock number</b>, not a disk number: ~0.4 GB per block, 50 blocks, 23 steps, ~460 GB across PCIe.</li>
</ol></div>
