<span class="kicker">Chapter 43 · The wall's real name — and the engine we're building to beat it</span>

# The Dalang Engine

<p class="lede">We chased a 15-second take with context parallelism and hit a wall — but the wall wasn't where we thought. It's not the pixels; it's a fixed 2.2&nbsp;GB buffer that sits on every card no matter how small we make the video. That finding points straight at building our own inference engine — one we've named the <b>Dalang</b>.</p>

<div class="callout truth"><span class="t">The one-line version</span>
<p>Dropping resolution barely moved our out-of-memory point, because ~7.5&nbsp;GB of the ~7.66&nbsp;GB we have is <b>fixed per-card overhead</b> — CUDA context plus the int8 GEMM scratch buffer — not the resolution-scaling activation. <b>The int8 buffer is the real wall.</b> The answer is our own engine: <b>one CPU process (the dalang) holding a single shared 33&nbsp;GB model, directing the GPUs (the puppets) with a hand-written ring so the split is truly ÷N end to end.</b></p></div>

## The measured finding: the wall is the buffer, not the pixels

We ran ring-2 context parallelism (see [ch.36](36-splitting-the-video-cp.html)) on a real **15-second, 345-frame** take. The results:

- **832×480 → OOM by ~36&nbsp;MB.** The process used ~**7.38&nbsp;GB** of the ~7.66&nbsp;GB usable on an 8&nbsp;GB card. Agonizingly close.
- Auto-dropped to **768×448 → ALSO OOM.** ~**7.51&nbsp;GB** used.

Read that twice. We cut the resolution ~14% and freed **almost nothing** — both attempts pinned at ~7.5&nbsp;GB. If activation memory scaled with pixels the way we assumed, 768×448 should have had hundreds of megabytes of headroom. It didn't. So the memory is *not* dominated by the picture size.

<div class="callout spec"><span class="t">Decomposing the ~7.5&nbsp;GB</span>
<p>What actually fills the card, and how each part scales:</p>
<ul>
<li><b>CUDA context</b> — ~1.2&nbsp;GB. <em>Fixed.</em> The driver's cost of using the GPU at all.</li>
<li><b>The int8 <code>convrot</code> GEMM scratch buffer</b> — ~2.2&nbsp;GB. The <code>fast_int8_mm</code> temporary from <a href="13-int8-vs-q4.html">ch.13</a>. Barely shrinks with resolution.</li>
<li><b>Resident block weights + ring K/V buffers</b> — mostly fixed / weakly scaling. One int8 block is 0.65&nbsp;GB (1.29&nbsp;GB in bf16), and only one is resident at a time.</li>
<li><b>The true resolution-scaling activation</b> — a <em>minority</em> of the total.</li>
</ul>
<p>So resolution and frame count are <b>weak levers</b>. The ~2.2&nbsp;GB int8 buffer is the real wall — and it's the same one we measured in <a href="13-int8-vs-q4.html">ch.13</a> as roughly 88% of our peak VRAM.</p></div>

<div class="callout truth"><span class="t">Three ways to kill the buffer</span>
<p>Now that we know its name, we know where to aim: <b>(1) Q4</b> dequantizes to fp16 and <em>sidesteps</em> the <code>convrot</code> buffer entirely; <b>(2) a custom memory-efficient int8 CUDA kernel</b> that never allocates the 2.2&nbsp;GB temporary ([ch.41](41-python-is-the-glue.html)); or <b>(3) true ÷N context parallelism</b> that shrinks the buffer per card because each card only runs its own slice's matmuls. Option 3 is the engine below — but first we tested all three for real.</p></div>

## The proof: three experiments, one wall

We didn't argue the wall — we ran three experiments to *prove* it. Each produced a hard pass/fail with a real VRAM number, not a claim.

| # | Experiment | Result | The fact |
|---|---|---|---|
| **1** | single-card int8, 512×288, 345 frames (15&nbsp;s) | ✅ **PASS** | exit 0, a real **14.375&nbsp;s** clip, no OOM — but 512×288 is a **~−63% pixel** cut vs 832×480. "Long + soft" works: one 8&nbsp;GB card *can* do 15&nbsp;s, but only by nuking resolution. |
| **2** | int8 ring-2, 832×480, 243 frames (10.1&nbsp;s sharp) | ❌ **FAIL** | OOM — GPU&nbsp;1 hit ~**7.28&nbsp;GB**, tried +400&nbsp;MB. Dropping frames 345→243 (−30%) moved memory only ~7.4→7.28&nbsp;GB. **Frames are a near-useless lever.** |
| **3** | Q4 — dequant to fp16, sidesteps the buffer | 🚫 **BLOCKED** | The Q4 GGUF is **absent** on the box, *and* it won't load into our engine: `MiniMaxH3Transformer3DModel.from_single_file` does not exist (H3 is too custom; GGUF only ever worked under ComfyUI, a different engine). The easy dodge is **unavailable in our pipeline.** |

<div class="callout truth"><span class="t">What the three prove together</span>
<p>The ~2.2&nbsp;GB int8 <code>convrot</code> GEMM buffer is the wall, confirmed <b>three independent ways</b>: 768×448 OOM'd, the 243-frame cut OOM'd, and only a brutal <b>−63% resolution nuke</b> fit. And the <em>free</em> dodge — Q4 — is <b>unavailable in our engine</b>: the file isn't here, and even if it were, our diffusers pipeline can't load a GGUF into H3's custom transformer (Q4 only ever lived under ComfyUI). So beating the buffer at full resolution <em>and</em> length has <b>no drop-in fix</b> — the shortcuts are eliminated, not skipped. The only doors left are <b>(1) the Dalang engine</b> — our own ÷N context parallelism that <em>truly</em> splits the buffer per card (diffusers' CP apparently doesn't, which is why ring-2 still OOM'd with the full-size buffer on every card) — or <b>(2) a custom memory-efficient int8/int4 CUDA kernel</b> that never allocates the temporary. That is exactly why we build Dalang.</p></div>

## The Dalang Engine: our own inference engine

In Indonesian *wayang*, the **dalang** is the puppet-master — one person who holds the entire story and gives every puppet its voice and its moves. That is exactly the architecture we want: the **CPU is the dalang**, holding the whole 33&nbsp;GB model and orchestrating everything; the **GPUs are the wayang** — the puppets — pure compute workers doing what they're told.

<div class="callout spec"><span class="t">What one dalang process buys us</span>
<ul>
<li><b>One shared model in RAM (~33&nbsp;GB, not 66 or 99).</b> Because it's a <em>single</em> process, the OS memory-isolation problem from <a href="42-why-two-models.html">ch.42</a> simply <em>vanishes</em> — there's only one program, so there's only one copy, shared by default. Ring-3's RAM wall (3 copies = ~99&nbsp;GB → SIGKILL) is gone.</li>
<li><b>We control the split end to end.</b> The activation <em>and</em> the int8 buffer are truly ÷N per card, because each card only runs the matmuls for its own slice. Diffusers' black-box context parallelism apparently didn't fully do this — which is why our ring-2 still OOM'd at ~7.5&nbsp;GB with the full-size buffer on each card.</li>
<li><b>It's our code, so we can attack the 2.2&nbsp;GB buffer directly</b> — chunk it, or eventually replace it with a custom CUDA kernel ([ch.41](41-python-is-the-glue.html)).</li>
</ul></div>

## The foundation: Ring Attention

We don't invent the hard part from scratch — we build on a paper. **Ring Attention** (Liu, Zaharia, Abbeel, [arXiv:2310.01889](https://arxiv.org/abs/2310.01889)) is exactly the algorithm for splitting one sequence across devices:

- **Split the sequence into $N$ blocks, one per device.** Each device holds only $1/N$ of the activations — its query slice $Q_i$ and its key/value slice $KV_i$.
- **Rotate the K/V blocks around a ring.** Each pass, device $i$ computes attention between its $Q_i$ and the $KV_j$ block that just arrived, then forwards that block to the next device.
- **After $N$ passes, every token has attended to the whole sequence** — yet no device ever held more than $1/N$ of it.
- **Overlap the transfer with the compute.** While a device computes attention on the current K/V block, the *next* block is already in flight to it — hiding the PCIe latency, which matters on a box with no NVLink.

<div class="callout warn"><span class="t">The correctness-critical requirement</span>
<p>Softmax must normalize <b>across all $N$ ring passes</b> — it cannot be taken on each block independently. Each device carries a <b>running maximum</b> and a <b>running denominator</b>, and corrects the partial attention scores as each new K/V block arrives. This is FlashAttention's online-softmax, extended around the ring. Get it even slightly wrong and the output is <em>subtly garbage</em> — plausible-looking but incorrect. So the rule is: <b>verify our attention matches the diffusers reference bit-for-bit on a tiny input before we scale anything up.</b></p></div>

## Step-1 plan (designed, not yet built)

This is a multi-session build, and honesty means saying so: at the time of writing, the Dalang Engine is **designed, not done.** The path is staged so every step is *measurable*, and correctness comes before scale:

<div class="callout spec"><span class="t">The build, in order</span>
<ol>
<li><b>One GPU, loaded once.</b> A single-process script that loads the model <em>once</em> and runs a short forward on <em>one</em> GPU — output must match our existing diffusers path. This proves the plumbing and gives us a reference.</li>
<li><b>Two GPUs, one ring block.</b> Add a second GPU and a hand-written ring attention for a <em>single</em> block; verify the online-softmax output matches the reference bit-for-bit. <b>This is the real milestone</b> — our ring, proven correct.</li>
<li><b>Scale.</b> Extend to all 50 blocks → three GPUs → chase the full-resolution 15-second take that the buffer denied us.</li>
</ol></div>

<div class="callout truth"><span class="t">What became of this plan</span>
<p>All three steps were built, in order, and each is logged with its measurements. Step 1 reproduced the reference at <b>max diff 0.000e+00</b> and step 2's two-GPU ring rendered video perceptually identical to the reference engine at <b>PSNR 37.6&nbsp;dB</b> — both in <a href="44-building-dalang.html">ch.44</a>. Step 3 became the three-card sharded forward of <a href="45-three-gpu-sequence-parallelism.html">ch.45</a>, and the full-resolution 15-second take this chapter set out to chase exists as a file in <a href="46-the-first-15-seconds.html">ch.46</a>: <b>1280×704, 345 frames, 14.375&nbsp;s</b>, rendered on three 8&nbsp;GB cards.</p></div>

## The premise this chapter got wrong

The blame above is laid squarely on the 2.2&nbsp;GB `convrot` buffer. That diagnosis was measured, it was consistent with three experiments — and when the engine was actually built it turned out to be the wrong culprit. It is worth keeping the sentence rather than quietly editing it:

<div class="callout warn"><span class="t">"The ~2.2&nbsp;GB int8 <code>convrot</code> GEMM buffer is the wall"</span>
<p>The first experiment of the new engine ([ch.44](44-building-dalang.html), E1) chunked every linear individually to shrink that buffer and the peak <b>did not move at all</b>. The reason: the 2.2&nbsp;GB <code>fast_int8_mm</code> temporary belongs to ComfyUI's old <code>convrot</code> int8 path (<a href="13-int8-vs-q4.html">ch.13</a>), and the Dalang engine quantizes with torchao <code>Int8WeightOnlyConfig</code> — <b>weight-only</b>, dequantize to bf16, with <em>no activation scratch buffer at all</em>. The real wall was <b>resident activations</b>, chiefly the feed-forward network's 14336-wide intermediate. The right lever was chunking the FFN as a unit, which the buffer theory would never have suggested.</p></div>

<div class="callout truth"><span class="t">Why the wrong premise still produced the right decision</span>
<p>Note what survived the correction. The <em>measurement</em> — 832×480 and 768×448 both pinned at ~7.5&nbsp;GB, so resolution is a weak lever — was correct and is still correct. Only the <em>attribution</em> was wrong. And the engine that the wrong attribution argued for is exactly the engine the right one needed, because both roads end at the same place: <b>stop treating the memory as a black box and own the forward.</b> A hypothesis that is measurable is useful even when it is false; it was disproved in one experiment because it had been stated precisely enough to test.</p></div>

## The takeaways

<div class="callout truth"><span class="t">The takeaways</span>
<ol>
<li><b>The wall is not the pixels.</b> 832×480 and 768×448 both OOM'd at ~7.5&nbsp;GB — cutting the resolution freed almost nothing.</li>
<li><b>~7.5&nbsp;GB is dominated by things that don't scale with the picture</b> — the CUDA context (~1.2&nbsp;GB) plus, on this pipeline, the int8 <code>convrot</code> scratch buffer (~2.2&nbsp;GB); the resolution-scaling activation is a minority. (The buffer's share of the blame did not survive <a href="44-building-dalang.html">ch.44</a>.)</li>
<li><b>The dodges are eliminated, not skipped</b> — Q4 is absent from the box and cannot load into H3's custom transformer; there is no drop-in fix.</li>
<li><b>The Dalang Engine</b> — one CPU process (the dalang) holds a single shared 33&nbsp;GB model and directs the GPUs (the wayang); one process means one copy, so ring-3's RAM wall disappears.</li>
<li><b>Ring Attention is the foundation</b> — split the sequence ÷N, rotate K/V around a ring, and normalize softmax across all passes (running max + denominator).</li>
<li><b>Correctness before scale</b> — verify our ring matches diffusers bit-for-bit on a tiny input; a wrong online-softmax is subtly garbage.</li>
</ol></div>
