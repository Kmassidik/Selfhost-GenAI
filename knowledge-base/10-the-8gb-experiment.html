# The 8 GB Experiment

<p class="lede">The research question, stated precisely: can we hold a fixed baseline quality while pushing peak VRAM lower — by changing <em>how</em> the computation is scheduled, not <em>what</em> the model computes? Here's the answer the profiler gives, and the one number still missing.</p>

## The baseline

We fix a hard baseline **B** — the 15 s woman+man duet, **576×320 × 362 frames**, peak **~7.57 GB**. It's a *good* benchmark precisely because it's hard: it stresses **identity + faces + mouth motion + long temporal context + synchronized audio** all at once. A static scene wouldn't.

The goal:

$$\Delta M < 0 \quad(\text{less VRAM}), \qquad \Delta Q \approx 0 \quad(\text{same quality}), \qquad \Delta T > 0 \text{ acceptable (time is free)}$$

## Reframe #1 — for exact levers, ΔQ = 0 (not ≈ 0)

The two levers we have are **mathematically exact** — they partition *how* the compute runs, not *what* it computes:

- **FFN-chunk** (`MiniMaxH3ChunkFeedForward`) — verified identical output (`torch.testing.assert_close`)
- **attention_split** (`--use-split-cross-attention`) — "maintains exact attention to the complete K/V"

So for these, quality isn't something to measure and hope for — it's **guaranteed bit-identical**:

$$\Delta Q = 0 \;\Rightarrow\; \text{the 3-D problem } (M,T,Q) \text{ collapses to 2-D } (M,T)$$

Quality only re-enters with *approximate* levers (sparse/tau attention, lower quant). **The exact-lever experiment is just: sweep the partition factor X, measure (VRAM, Time). Quality is free.**

## Reframe #2 — the curve asymptotes, it doesn't descend

The intuitive expectation is VRAM sliding smoothly down as you partition harder: 7.57 → 6.1 → 5.0 → 4.2 → 3.8 GB. **The profiler says no.** Here's the measured matrix:

<table>
<tr><th>Config (steps=2)</th><th>Peak VRAM</th></tr>
<tr><td>512×288 × 5f</td><td>7412 MB (warmup)</td></tr>
<tr><td>512×288 × 73f</td><td><b>6570 MB</b></td></tr>
<tr><td>512×288 × 181f</td><td><b>6570 MB</b> ← identical → flat</td></tr>
<tr><td>512×288 × 362f</td><td>7834 MB</td></tr>
<tr><td>576×320 × 362f</td><td>7832 MB ← ~same (resolution nearly free)</td></tr>
</table>

- **Fixed floor ≈ 6.5 GB** (identical at 73 and 181 frames)
- **Frame-scaling ≈ 1.3 GB** (the bump at 362 frames)

Computation-partitioning only shrinks the **scaling term** (~1 GB of activations/FFN). It **cannot touch the fixed floor** (encoder + resident weight working set). So the real curve:

```mermaid
xychart-beta
    title "Predicted X → peak VRAM (asymptotes at the floor)"
    x-axis "partition factor X" [1, 2, 4, 8, 16]
    y-axis "peak VRAM (GB)" 6 --> 8
    line [7.8, 6.8, 6.5, 6.5, 6.5]
```

<div class="callout danger"><span class="t">Evidence we already have</span>
<p>640×384 <b>still OOM'd with FFN-chunk at chunks=8.</b> If the FFN were the floor, chunking it 8× would have fit. It didn't — a strong hint the floor is <b>not</b> the partitionable part.</p></div>

## The decisive unknown: what IS the 6.5 GB floor?

We proved the floor *exists* and is *fixed*. We have **not** decomposed it into: encoder resident set / DiT weight working set / FFN transient / CUDA workspace / allocator slack. That one measurement decides everything:

- **If the floor is the encoder** (Qwen3-VL-32B) → partitioning the DiT is useless for it; the lever becomes *encode → fully evict encoder → then run DiT*, or a smaller encoder quant. `--novram` helps **only if** the floor is resident weights.
- **If the floor is a transient/workspace** → `--novram` won't help; we're near the real limit.

The tool (from research): `torch.cuda.memory._record_memory_history()` → `_dump_snapshot()` → drag the pickle into `pytorch.org/memory_viz` → the flamegraph attributes every byte by allocation site.

## The rule we must never break

<div class="callout warn"><span class="t">Partition the schedule, not the video</span>
<p>Do <b>not</b> slice 362 frames into independent clips (100+100+…). That shatters the single shared latent and destroys the temporal coherence we're measuring. We change <em>how computation is scheduled</em>, never <em>what the model computes</em>. Exact partitioning (FFN-chunk, attention_split) obeys this; independent temporal slicing violates it.</p>
</div>

## The answer, and the order

> **Yes — quality is *guaranteed* identical for exact levers, so the experiment reduces to mapping X → (VRAM, Time). But that map flattens at a ~6.5 GB floor, and whether we can break it depends entirely on *what it's made of* — which we must measure first.**

1. **Snapshot** the 6.5 GB floor → identify it (the missing number).
2. **X-sweep** with exact levers → trace the (VRAM, Time) curve, find the asymptote and the sweet spot.
3. **If the floor is the encoder** → test encode-then-evict / smaller quant as a *separate* axis from X.

Everything hinges on step 1. We know the floor exists; we don't yet know its composition. That's the one number still missing — and it's the next thing to measure.
