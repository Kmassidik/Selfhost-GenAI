# Python Is the Glue, CUDA Is the Engine

<p class="lede"><b>Python does not compute anything in this system.</b> It decides which compiled kernel should run, hands that kernel a few pointers, and then waits — sometimes for minutes — while C++ and CUDA do the arithmetic on the graphics card. That is what "glue, not engine" means, and it is why the obvious objection to the whole stack ("isn't Python slow?") turns out to be answering a question nobody here is asking.</p>

The objection is reasonable. A render of a five-second 720p clip at 23 steps took **3,295 seconds — fifty-five minutes** on this box. Watching a machine grind for that long, in a language famous for being one of the slowest in common use, invites the thought that a rewrite in something faster would help. It would not. Not by a second. This chapter is why, in enough detail that the claim is checkable rather than a slogan — and it ends with the one place where Python's design genuinely did cost this project something real, which was not its speed.

<div class="callout truth"><span class="t">The one-line version</span>
<p><b>Python is the switchboard operator, not the conversation.</b> When PyTorch runs a matrix multiply or an attention call, Python <em>dispatches</em>: it inspects the tensors, chooses a kernel written in C++/CUDA — cuBLAS, cuDNN, a FlashAttention backend — and launches it. Connecting the call takes microseconds. The call itself then lasts for a long time. Nobody measures a telephone network by how fast the operator plugs in the jack.</p></div>

Step by step:

1. **Python** calls `a.matmul(b)` — and immediately leaves Python, through **auto-generated C++ bindings**. There is no Python interpreter loop around the arithmetic; there is a Python interpreter loop around the *decision*.
2. **ATen**, PyTorch's C++ tensor library, receives the call. Every operator in PyTorch is declared in one central file, `native_functions.yaml`, with its dispatch rules per backend.
3. **The dispatcher** inspects the tensors' `DispatchKeySet` — device, dtype, layout — and selects a kernel dynamically. This is the mechanism that lets the identical line of source run on a CPU tensor, a CUDA tensor, or an Apple-MPS tensor.
4. For a CUDA tensor it calls a **hand-optimized CUDA kernel**: cuBLAS for matrix multiplies, cuDNN for convolutions, a FlashAttention backend for attention ([ch.34](34-open-use-close-flashattention.html)). These are C++ and CUDA, written by NVIDIA and by researchers, and compiled for a specific compute capability — sm_86 on this hardware ([ch.04](04-software-stack.html)).
5. **The GPU** executes. Everything above it is already finished and waiting.

<div class="callout spec"><span class="t">Where the layers in <a href="04-software-stack.html">ch.04</a> actually meet</span>
<p>The stack diagram in the software chapter shows PyTorch sitting above CUDA above the driver. This chapter is the same picture at one instant in time: the dispatcher is the exact seam where a dynamically-typed scripting language stops and a statically-compiled numerical library begins, and the <code>DispatchKeySet</code> is the passport it checks.</p></div>

## 2 · The proportion, made concrete

Abstract claims about overhead are easy to make and easy to doubt. The shapes of this model settle it.

A single denoise step pushes the latent through **50 transformer blocks**. A 23-step render therefore executes **1,150 blocks**, and each block issues on the order of a dozen tensor operations — the projections, the rotary application, attention, the feed-forward, the norms and residual adds ([ch.34](34-open-use-close-flashattention.html)). Call it somewhere in the low tens of thousands of dispatched operations for a whole render.

Now the size of one of them. Take the first feed-forward matrix multiply in one block of a five-second 480p clip, using the model's own configuration — `hidden_size` 5,376, `ffn_dim` 14,336 — and the measured sequence length of **15,129 tokens**:

$$15{,}129 \times 5{,}376 \times 14{,}336 \;\approx\; 1.17 \times 10^{12} \text{ multiply-accumulates}$$

**Over a trillion multiply-accumulate operations, from one Python function call.** And that is one of two matrices in the feed-forward, of one block, of fifty, of one step, of twenty-three.

<div class="callout truth"><span class="t">The ratio, and how it is confirmed rather than assumed</span>
<p>Python's contribution — parsing the line, crossing the binding, reading the dispatch keys, launching the kernel — is measured in <b>microseconds</b>. The kernel it launched then runs for milliseconds to minutes. The interpreter spends essentially the whole render blocked, waiting for a card.</p>
<p>This is not an estimate. Profiling on this box recorded the GPU's streaming multiprocessors at <b>100% utilisation</b> during denoise. A card pinned at 100% is a card that is never waiting for its next instruction. If Python were the constraint, the profile would show gaps — the GPU idling between kernels while the interpreter caught up. There are no gaps.</p></div>

### The second reason, which is not compute at all

Even the green bars above understate how far the bottleneck is from the interpreter. The 20 GB transformer does not fit in 8 GB of VRAM, so its blocks are **streamed from system RAM** for every step: about **0.4 GB per block**, which over 50 blocks and 23 steps is roughly **460 GB moved across PCIe** in a single render ([ch.29](29-where-numbers-live.html)).

That traffic is DMA — the memory controller and the PCIe link doing their work while the CPU is idle. There is no language in which those bytes travel faster. A rewrite would be optimizing the sign-writing while the lorries are the queue.

<div class="callout warn"><span class="t">When Python <em>would</em> be the bottleneck — and why this workload isn't it</span>
<p>The overhead is real; it is simply fixed per call. A workload made of <b>millions of tiny operations</b> — small batches, per-element loops written in Python, reinforcement-learning steps on toy tensors — genuinely is interpreter-bound, and that is where <code>torch.compile</code>, CUDA graphs and kernel fusion earn their keep by removing per-call cost.</p>
<p>The deciding question is never "is the language fast?" but <b>"how much arithmetic happens per dispatch?"</b> Here the answer is a trillion multiply-accumulates. Fixed overhead divided by that is not a number worth writing down.</p></div>

## 3 · Why Python won, specifically for this kind of work

Python is the common language of machine learning not despite being slow but because its slowness is irrelevant to work shaped like this — and three of its properties are actively load-bearing here.

**It is a front end to C++ by design.** PyTorch's architecture is "Python front end, C++ dispatcher, compiled backend kernels", with the seam drawn deliberately. That is what allows the library to be pleasant to use and fast at the same time, rather than trading one for the other.

**The ecosystem is there.** The H3 model definition, `diffusers`, `torchao`, `accelerate`, the NCCL bindings — all authored in Python, all calling compiled kernels underneath. On this box that is a specific version list: Python 3.12.3, torch 2.11.0+cu128, diffusers 0.40.0.dev0, torchao 0.18.0, transformers 5.16.1, accelerate 1.14.0.

**Dispatch makes it device-agnostic.** The same `a.matmul(b)` runs on a CPU tensor, a CUDA tensor or an Apple-MPS tensor because step 3 of section 1 decides at runtime. Code written once follows the hardware.

### The property that this project actually depended on

There is a fourth reason, and for a build like this one it outweighs the other three.

**Python can be modified while it runs.** This engine's entire driver layer is built on that. Phase B is the renderer; each driver monkeypatches the transformer to change *how* the forward pass executes and then calls straight into the renderer's `main()` ([ch.48](48-the-pipeline-without-comfyui.html)):

| Driver | What it changes about the forward pass |
|---|---|
| `05_render_ring.py` | ring / context parallelism across two cards ([ch.36](36-splitting-the-video-cp.html)) |
| `08–10_render_tiled.py` | single-card tiling — 15 s at 480p, or 5 s at 720p ([ch.44](44-building-dalang.html)) |
| `16_render_3gpu.py` | three-GPU sequence parallelism ([ch.45](45-three-gpu-sequence-parallelism.html)) |

Every one of those is a live substitution into somebody else's library, made without forking it, without recompiling it, and without waiting for an upstream release.

The same property fixed a bug that had already destroyed six hours of finished work. When a decode step resolved `_execution_device` to `cuda:0` while the sharded forward returned latents on the CPU, the repair was to copy the upstream function body and change one line ([ch.46](46-the-first-15-seconds.html)). In a compiled library that is a fork and a rebuild. Here it is a file.

<div class="callout truth"><span class="t">The trade, stated honestly in both directions</span>
<p>Runtime patchability is the reason a small operation can do kernel-adjacent surgery on a library it does not maintain. It is <em>also</em> the reason the software chapter warns about version drift: a patch that copies an upstream function body cannot be reverted by an upgrade, but it can be silently <b>outdated</b> by one (<a href="04-software-stack.html">ch.04</a>). The flexibility and the fragility are the same property seen from two sides.</p></div>

## 4 · The one place Python's design really did cost something

Everything above says Python's *speed* is free here. Its **concurrency model** was not.

CPython has a **Global Interpreter Lock**: one interpreter executes Python bytecode on one thread at a time. GPU kernels launched from Python run asynchronously and are unaffected, so for a single card this is a non-issue. For three cards driven with genuinely independent Python control flow, it is a design constraint — and the standard answer to it is not threads but **separate processes**.

That is exactly what `torchrun --nproc_per_node=3` does. It does not start one program using three GPUs. It starts **three complete, separate Python processes**, one per card.

Three processes means three private address spaces, which means three independent loads of the same weights into host RAM. Under block-streaming offload, the resident cost per process climbed until the Linux OOM-killer stepped in and the three-card run died — **not** on VRAM, which was comfortable at about 5.2 GB per card, but on system RAM ([ch.42](42-why-two-models.html), [ch.36](36-splitting-the-video-cp.html)).

<div class="callout danger"><span class="t">The honest accounting</span>
<p><b>Python's execution speed cost this project nothing.</b> Python's <b>concurrency model</b> cost it a three-GPU render — by routing multi-card work through separate processes, which is the direct cause of the memory replication that killed ring-3. That is a real, expensive consequence of a language design decision, and it has nothing whatsoever to do with the interpreter being slow.</p>
<p>It is also the reason one of the two escape routes in <a href="42-why-two-models.html">ch.42</a> is "run a single process that drives all three cards itself" — trading the GIL back for a shared address space.</p></div>

## 5 · Where a lower-level language actually would pay

There is a place where C++ and CUDA win decisively, and it is not orchestration. It is **writing new kernels** — and every deep lever this project keeps circling is kernel-level:

- a **more memory-efficient int8 matrix multiply**. The `fast_int8_mm` output buffer alone was a **2.24 GB** single allocation, and about **88%** of the real-tensor peak on the 8 GB card was working buffers of that kind rather than weights ([ch.13](13-int8-vs-q4.html));
- a **fused rotary embedding**, to stop `_apply_rotary_emb` allocating roughly four full-size temporaries per call, twice per block — the exact allocation the 345-frame render died on ([ch.34](34-open-use-close-flashattention.html));
- **chunked attention and feed-forward** over the sequence, so peak memory becomes flat in token count;
- a faster **ring-attention communication** path for a box with no NVLink ([ch.36](36-splitting-the-video-cp.html)).

Those are C++/CUDA, and that is where the remaining gains live. The catch is that correct CUDA is far harder than correct orchestration and much easier to get subtly wrong — a kernel that produces *plausible* numbers instead of *correct* ones fails silently, and video output is a poor detector of small numerical error.

<div class="callout spec"><span class="t">The order of operations this project follows</span>
<p><b>Exhaust the Python-level levers first</b> — offloading, context parallelism, tiling, sequence sharding are all pure orchestration and all reachable from the glue. <b>Drop to CUDA only for the kernel-level wins, once the easy ground is taken</b> — and hold every kernel to the same test the int8 blocking passed: verified numerically identical to the version it replaces, not merely similar.</p></div>

There is one more piece of evidence that the glue was never the problem, and it is sitting in the first two lines of every render log on this machine: torchao failing to load its Hopper and Blackwell kernels, then falling back to the ones Ampere implements ([ch.04](04-software-stack.html)). Even the *choice of which compiled kernel exists* is made below Python. The interpreter is not deciding much of consequence — which is precisely why its speed does not matter.

<div class="callout truth"><span class="t">The chapter in five lines</span>
<ol>
<li><b>Python is glue, not engine.</b> It dispatches; it does not compute.</li>
<li><b>The compute is already C++/CUDA</b> — cuBLAS, cuDNN, FlashAttention — reached through ATen's dispatcher on the basis of a tensor's device and dtype.</li>
<li><b>This render is GPU-bound and transfer-bound</b> — one Python call launches ~1.17 × 10¹² multiply-accumulates, the card profiles at 100% SM utilisation, and a 23-step render moves ~460 GB across PCIe. Rewriting the orchestration in a faster language would save nothing.</li>
<li><b>Python's speed is free here; its GIL was not.</b> Multi-card work goes through separate processes, and that replication is what killed the three-GPU render on host RAM.</li>
<li><b>The one place a lower-level language wins is custom kernels</b> — the int8 buffer, the rotary fusion, the ring comms. Squeeze the orchestration levers first.</li>
</ol></div>
