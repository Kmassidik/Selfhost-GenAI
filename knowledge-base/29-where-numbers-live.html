# Where the Numbers Live

<p class="lede">The numbers live at four addresses at once — a file on disk, a copy of that file in system RAM, a 0.4 GB slice of it on a graphics card, and, for a few nanoseconds, a handful of registers inside the chip. Everything else in this guide is that trip, repeated until a video exists.</p>

Here is the fact that makes the trip worth studying. The transformer file on this box is **20 GB**. A 23-step render moves about **460 GB** across the PCIe bus. Nothing is downloaded, nothing grows: the same 20 GB is dragged from RAM onto a card, used, thrown away, and dragged again — twenty-three times over, once per step. The model does not travel far. It travels *often*.

To understand why, it helps to stop treating "the model" as a thing and start treating it as what it physically is: a long run of bytes, with an address.

## A model file is a list, and nothing else

A `.safetensors` file has two parts. A small JSON header at the front says what tensors exist, what shape each one is, what type its numbers are, and at which byte offset it starts. After the header, there is one uninterrupted run of raw bytes — the numbers themselves, written end to end.

There is no code in the file. No graph, no logic, no instructions. Loading a model means reading that byte run into memory and pointing an array at it.

<div class="callout truth"><span class="t">What "owning a model" actually means</span>
<p>Owning a model is owning that list of numbers on a drive. Everything else — the architecture, the loop, the sampler — is ordinary Python and CUDA that anyone can rewrite (<a href="35-is-it-really-ours.html">ch.35</a>). The irreplaceable part is the list.</p>
<p><b>Quantizing</b> is therefore not a transformation of behaviour. It is a rewrite of the list, so that each number occupies fewer bytes, and the file that comes out the other side is a different length.</p></div>

The last line of that diagram is the one people skip. A weight that is "on the GPU" is also still in RAM, and still on disk. Three copies of the same number exist, and two of them are idle. Memory pressure on this hardware is never about where the truth lives — it is about how much of the truth has to be *near the chip at once*.

## One number, and how many bytes it costs

A **bit** is one switch, `0` or `1`. Eight bits make a **byte**. With $b$ bits there are $2^{b}$ distinct patterns available, so $b$ bits can name exactly $2^{b}$ different values:

$$\text{1 byte} = 8\ \text{bits} = 2^{8} = 256\ \text{possible values}$$

That is the whole mechanism of precision. More bytes per number means more available patterns, which means a **finer grid** for the number to land on. Nothing about a format makes it "smarter"; formats differ only in how many landing spots they offer and how those spots are spaced.

### The same weight, stored three ways

Take one real weight, $x = 0.0273$, and watch it survive three storage decisions.

Integer quantization stores a whole number $q$ plus one **scale** $s$ shared across a group of weights. Three lines of arithmetic define it completely:

$$s = \frac{\max|w|}{2^{\,b-1}-1}, \qquad q = \text{round}\!\left(\frac{x}{s}\right), \qquad \hat{x} = q \cdot s$$

Suppose the largest magnitude in this weight's group is $\max|w| = 0.05$.

<div class="callout spec"><span class="t">bf16 — 16 bits (2 bytes)</span>
<p>A floating-point layout: <b>1 sign + 8 exponent + 7 mantissa</b> bits.</p>
<pre>
 0   01111001   0110000
sign  exponent   mantissa      → decodes to ≈ 0.0273
</pre>
<p>$2^{16} = 65{,}536$ patterns, spread across a vast range by the exponent, so the spacing is fine near zero and coarse far from it. This is "native" precision for this model family.</p></div>

<div class="callout spec"><span class="t">int8 — 8 bits (1 byte)</span>
<p>Scale $s = \dfrac{0.05}{2^{7}-1} = \dfrac{0.05}{127} = 0.000394$.</p>
$$q=\text{round}\!\left(\frac{0.0273}{0.000394}\right)=\text{round}(69.3)=69 \;\rightarrow\; \texttt{01000101}$$
<p>Recover: $\hat{x} = 69 \times 0.000394 = 0.0272$. Only $2^{8}=256$ evenly spaced steps across the group's range — a coarser grid, and the value lands one notch off.</p></div>

<div class="callout spec"><span class="t">int4 — 4 bits (½ byte)</span>
<p>Scale $s = \dfrac{0.05}{2^{3}-1} = \dfrac{0.05}{7} = 0.00714$.</p>
$$q=\text{round}\!\left(\frac{0.0273}{0.00714}\right)=\text{round}(3.8)=4 \;\rightarrow\; \texttt{0100}$$
<p>Recover: $\hat{x} = 4 \times 0.00714 = 0.0286$. Sixteen steps for the whole group, so the nearest legal value is a visible distance away. <b>Two int4 numbers pack into one byte.</b></p></div>

### Why the scale is shared, and what that costs

The scale $s$ is not stored per weight — if it were, an int8 weight would cost one byte for $q$ plus two more for $s$, and the file would grow instead of shrinking. It is stored **once per group** of weights, so the storage cost of the scale is amortised almost to zero.

That sharing has one sharp consequence. The group's scale is set by its **largest** magnitude, $\max|w|$. One unusually large weight in a group stretches $s$ for everyone, and every small weight in that group lands on a coarser grid than it needed. This is the "outlier" problem, and it is the reason 4-bit quantization of a large transformer is genuinely hard rather than merely lossy — the fix is to peel the outliers out into a separate low-rank branch before quantizing the rest (<a href="26-serving-h3-real-world.html">ch.26</a>, and the theory behind it in <a href="32-thinking-like-a-circuit.html">ch.32</a>).

## The multiplication that turns parameters into gigabytes

File size is one product, and it has no hidden terms:

$$\text{bytes} = N_{\text{params}} \times (\text{bytes per param})$$

H3 as a whole system is roughly **65 billion** numbers — about 32 billion in the vision-language encoder and about 33 billion in the generator. Run the product for each format:

$$
\begin{aligned}
\text{bf16:}\quad & 65{,}000{,}000{,}000 \times 2\ \text{B} = 130\ \text{GB}\\
\text{int8:}\quad & 65{,}000{,}000{,}000 \times 1\ \text{B} = 65\ \text{GB}\\
\text{int4:}\quad & 65{,}000{,}000{,}000 \times 0.5\ \text{B} = 32.5\ \text{GB}
\end{aligned}
$$

<div class="callout spec"><span class="t">GB versus GiB — the reason 130 sometimes reads as 124</span>
<p>Disks count in powers of ten (1 GB = $10^{9}$ bytes); memory counts in powers of two (1 GiB = $2^{30} = 1{,}073{,}741{,}824$ bytes). So $130\times10^{9}$ bytes is 130 GB and about 121 GiB. Same pile, two rulers. Whenever two sources disagree by about 7%, this is usually why.</p></div>

That last bar is the point of the whole chapter. **The unit that has to fit is not the model. It is one block.** Twenty billion parameters spread over fifty blocks is roughly 0.4 GB each, and 0.4 GB fits on an 8 GB card with room to spare — which is why a 20 GB model runs at all (<a href="02-your-hardware.html">ch.02</a>).

<div class="callout truth"><span class="t">The traffic bill</span>
<p>One step reads every block once, so one step pulls the whole 20 GB across PCIe. A <b>23-step render therefore moves about 460 GB</b> — the entire model, fetched from system memory twenty-three times over. The card never holds more than one block of it.</p>
<p>That ratio — 20 GB of weights, 460 GB of traffic — is the price of the offload trick, and the reason renders here are measured in hours (<a href="30-the-render-live.html">ch.30</a>).</p></div>

### A number this project got wrong first, and the history worth keeping

The design study written before the three-card engine existed budgeted **0.65 GB per int8 block** and **1.29 GB per bf16 block**, against a full 33-billion-parameter transformer of about 33 GB. Those numbers are correct for that model. The file this box actually runs is the *pruned* int8 build — 20 GB, about 0.4 GB per block.

Both figures appear in this project's documents and neither is a mistake. They describe two different files, a month apart. The lesson is the one that keeps recurring here: a size is only meaningful with its subject attached.

## The numbers that are not weights

A quiet assumption runs through most memory advice: that what fills a graphics card is the model. On this build, measured rather than assumed, that is false.

During a denoise forward pass, a memory snapshot was taken and the live allocations grouped by the line of code that made them. Of the roughly **5.9 GB** of real tensors alive at the peak, about **88% were the working buffers of the int8 matmul path** — not resident weights, not attention scores, not the feed-forward intermediate.

The largest single allocation was one temporary inside the int8 matmul, and its size is not mysterious either — it is the full integer result of the multiplication, held before the scales are applied:

$$M_{\text{int8mm}} = \underbrace{M \times N}_{\text{output shape}} \times \underbrace{4\ \text{bytes}}_{\text{int32}} \;\approx\; 2.24\ \text{GB}$$

Because each output **row** depends only on its own input row, that product can be computed one block of rows at a time and written into a pre-allocated output, and the answer does not change. Not "approximately does not change" — `torch.equal` on the two results returned `True`, maximum absolute difference 0.0.

<div class="callout truth"><span class="t">What that bought, measured</span>
<table>
<tr><th></th><th>Before</th><th>After</th></tr>
<tr><td>Sampling allocated peak</td><td>5925 MB</td><td><b>3887 MB</b> (−2038 MB, −34%)</td></tr>
<tr><td>Native 15 s ceiling</td><td>576×320</td><td><b>768×448</b> — 1.87× the pixels</td></tr>
<tr><td>Quality change</td><td colspan="2"><b>Exactly zero</b> — bit-identical output</td></tr>
</table>
<p>Two gigabytes of a graphics card were recovered by changing the <em>order</em> in which numbers were produced, not by changing any number. Where a value is computed matters as much as how many bytes it occupies.</p></div>

There is a second, blunter reading of that snapshot. The remaining overhead — the gap between what the allocator reports and what `nvidia-smi` reports — decomposes into roughly 0.5–0.7 GB of allocator slack and **1.2–1.4 GB of CUDA context and driver**, which is fixed. Calling `empty_cache()` between phases recovered nothing measurable (7568 MB versus 7578 MB, which is noise). About 1.3 GB of every 8 GB card on this box is gone before a single weight arrives, and no arrangement gets it back.

## Where the video's numbers live

Weights are only half the residents. The other half is the thing being generated, and it obeys different rules.

The latent recovered from a crashed 832×480 render had shape `(1, 24, 37, 30, 52)`: one clip, **24 channels**, 37 latent frames, 30 tall, 52 wide. The 24 is `in_channels` from the config; audio rides alongside with its own 32 channels through the same 50 blocks.

<div class="callout warn"><span class="t">Latents cannot be streamed the way weights can</span>
<p>A block's weights are read, used, and discarded — the copy on the card is disposable because the original is still in RAM. The latent is not disposable. It is <em>the state of the render</em>, it changes at every block, and it must stay resident for the whole step.</p>
<p>This is why resolution and length cost so much more than model size does. A bigger model means more trips across the bus; a bigger latent means a bigger permanent resident on a card that already has only 8 GB. It is also why the lever that finally unlocked native 720p was splitting the <em>sequence</em> across three cards rather than splitting the <em>weights</em> (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>).</p></div>

## Reading a quantization claim properly

With all of the above, a sentence like *"quantize H3 to Q4"* decodes into something entirely concrete:

> Take every one of the roughly 65 billion numbers, and rewrite each from a 16-bit float onto a **16-value grid stored in 4 bits**, keeping one shared scale per group so the decimal can be recovered. The file shrinks about 4×, every value lands on a coarser grid, and — measured on one scene on this box — the output was **indistinguishable** from int8 by eye, rendered **2.05× faster** (3122 s versus 6393 s) at *higher* native resolution and *lower* peak VRAM (7.06 GB versus 7.5 GB).

That result is not the tidy story one would predict from bit-widths alone, and the reason is not in this chapter — it is in what the silicon does with those bytes once they arrive (<a href="31-what-the-gpu-does.html">ch.31</a>, measured head-to-head in <a href="13-int8-vs-q4.html">ch.13</a>).

<div class="callout truth"><span class="t">Five things that are now concrete</span>
<ol>
<li><b>A model is a list of numbers with an address</b> — header, then one run of raw bytes, copied disk → RAM → VRAM → registers, never moved.</li>
<li><b>$b$ bits name $2^{b}$ values.</b> One byte is 256 landing spots; the scale is shared across a group, and the group's largest weight sets the spacing for everyone.</li>
<li><b>Size is one product:</b> parameters × bytes per parameter. 395 M per block × 50 blocks × 1 byte = the 20 GB file, exactly.</li>
<li><b>The unit that must fit is a block, not a model</b> — 0.4 GB at a time, 50 times per step, ~460 GB of traffic per 23-step render.</li>
<li><b>The biggest thing on the card is often not a weight.</b> 88% of a measured 5.9 GB peak was int8 GEMM scratch; chunking one temporary returned 2 GB bit-identically and raised the 15 s ceiling by 1.87× in pixels.</li>
</ol></div>
