# Open, Use, Close: FlashAttention

<p class="lede"><b>FlashAttention is the "open, use, close" discipline applied to attention</b>: instead of building the enormous table of every-token-against-every-token, it opens one tile of that table at a time, folds the tile into a running total, and frees it — so the memory it needs stops depending on how long the video is. This chapter is what that mechanism actually is, why it is mathematically exact rather than an approximation, and the awkward discovery that in H3 it was already switched on before we arrived.</p>

We had a clean theory about why a fifteen-second render died. It was wrong, and the source code said so in one comment and one function call. What follows is the theory, the disproof, and the much less tidy truth underneath — which turned out to be more useful than the theory would have been.

## 1 · The prediction, written down before we opened the source

Here is the hypothesis exactly as it stood. A 124-frame clip rendered fine. A 345-frame clip — the same scene, the same resolution, fifteen seconds instead of five — ran out of VRAM. Attention compares every token with every other token, so its cost grows with the **square** of sequence length. 345 frames is about 2.8× the tokens of 124 frames, and $2.8^2 \approx 7.8$. Seven point eight times the memory on a card that was already three quarters full. Case closed: the score matrix was the wall, and FlashAttention was the fix.

<div class="callout warn"><span class="t">Then we read <code>transformer_minimax_h3.py</code></span>
<p>Inside <code>MiniMaxH3AttnProcessor.__call__</code>, attention does not build a score matrix by hand at all. It calls <code>dispatch_attention_fn(query, key, value, …)</code> — the <code>diffusers</code> attention dispatcher — which on Ampere routes straight to a memory-efficient / FlashAttention SDPA backend. And the model packs one request into a <b>single attention document with no mask</b> (the source says so in a comment), which is exactly the condition under which the flash backend stays eligible and gets chosen.</p>
<p><b>The $N\times N$ matrix is never materialized. FlashAttention was already running.</b> It was not a lever we could pull; it was a floor we were already standing on. The hypothesis was disproved by the code itself, before a single experiment was run.</p></div>

That is worth sitting with for a moment, because it is the most transferable lesson in this chapter. The quadratic story was elegant, it matched the textbook, and it was about a real property of real attention. It was also not what this program does.

## 2 · What the naïve version would actually cost

To see why FlashAttention matters at all — even as a floor rather than a lever — it helps to price the thing it refuses to build.

Attention scores every token against every other token. For $N$ tokens that is $N^2$ numbers, and the transformer has **56 attention heads** (`num_attention_heads` in `transformer/config.json`), each keeping its own full table. The arithmetic below is arithmetic, not measurement — nothing on this box ever allocated these figures, which is the point:

| Clip | Tokens $N$ | Pairs $N^2$ | Score matrix, 56 heads, bf16 |
|---|---|---|---|
| 480p × 124 frames (5 s) — **measured at 15,129 tokens** | 15,129 | 229 M | **~25.6 GB** |
| 480p × 345 frames (15 s) — single-card ceiling ~41,000 tokens | ~41,000 | 1.68 B | **~188 GB** |
| 720p × 345 frames (15 s) | ~93,000 | 8.65 B | **~969 GB** |

The five-second clip that renders comfortably on one 8 GB card would need **twenty-five gigabytes** just to hold its own scores. It peaked at **5.72 GB**. The gap between those two numbers is FlashAttention, and it is why the naïve implementation is not a slow option — it is not an option.

## 3 · Open, use, close — the discipline, not the trick

The pattern has a name in every other part of computing. A database client does not hold one connection per query for the life of the program; it **acquires, uses, releases**. A web server does not keep every uploaded file in memory; it streams. The shape is always the same: a **fixed-size working area** in front of an **arbitrarily large body of work**.

The cleanest structural picture is an archive reading room. The archive holds fifty kilometres of shelving. The reading desk holds one box. A researcher requests a box, reads it, returns it, requests the next. The desk never grows. It does not matter whether the archive is fifty kilometres or five hundred — **the size of the reading room is a property of the desk, not of the archive.**

That is the whole ambition of this chapter, stated as a target: make the peak memory of a transformer block a property of the tile size, not of the video length.

FlashAttention achieves exactly that for one operation — attention. The rest of the block does not, and section 6 is about what that cost.

## 4 · The online softmax — why tiling is exact, not approximate

The obvious objection to processing attention in tiles is that softmax is not a local operation. Softmax over a row needs the whole row: it divides each entry by the sum over *all* entries. Cut the row into pieces and no piece knows the total.

The resolution is a small identity that turns out to be the hinge of the entire field.

### The identity

Softmax is unchanged by subtracting any constant from its inputs:

$$\text{softmax}(s_1,\dots,s_n) \;=\; \text{softmax}(s_1 - c,\dots,s_n - c) \quad \text{for any } c$$

because $e^{s_i - c} / \sum_j e^{s_j - c} = (e^{-c} e^{s_i}) / (e^{-c}\sum_j e^{s_j})$ and the $e^{-c}$ cancels top and bottom. In practice $c$ is chosen to be the row maximum, so that the largest exponent is $e^0 = 1$ and nothing overflows. That is standard numerical hygiene in any softmax, tiled or not.

The insight of the **online softmax** is that $c$ does not have to be known in advance. It can be revised as the row is discovered — provided everything accumulated so far is corrected by the same factor.

### The recurrence

Process the key/value tiles one at a time. Carry three running quantities: the largest score seen so far $m$, the running denominator $\ell$, and the running weighted sum of value vectors $O$. On seeing a new tile with scores $s$ and values $v$:

$$m' = \max\!\left(m,\; \max_i s_i\right)$$

$$\ell' = e^{\,m - m'}\,\ell \;+\; \sum_i e^{\,s_i - m'}$$

$$O' = e^{\,m - m'}\,O \;+\; \sum_i e^{\,s_i - m'}\, v_i$$

and at the very end divide once: $\text{out} = O / \ell$.

The factor $e^{\,m - m'}$ is the correction. When a later tile turns out to contain a bigger score than anything seen before, the running totals were expressed in the old units; multiplying by $e^{\,m-m'}$ re-expresses them in the new ones. Nothing is discarded and nothing is approximated.

<div class="callout truth"><span class="t">The structural analogy that actually fits</span>
<p>Weighing a lorry-load of grain on a scale that holds one sack. The load cannot go on the scale, so it is weighed one sack at a time and added to a running total. The total is <b>exact</b> — addition does not care in what order it happens.</p>
<p>The softmax adds one wrinkle: partway through, a sack turns up that forces a change of unit. Every earlier weight has to be converted into the new unit before the new sack can be added. The factor $e^{\,m-m'}$ <em>is</em> that unit conversion, and a unit conversion loses nothing. That is why FlashAttention returns the same numbers as the naïve version rather than an approximation of them — and it is why the technique was adoptable everywhere, immediately, with no quality argument attached.</p></div>

<div class="callout spec"><span class="t">Tile-and-accumulate, not isolate-and-forget</span>
<p>A recurring misreading is that tiled attention lets each chunk of video attend only within itself, and that long clips therefore lose coherence. That is a different technique. Here <b>every token still sees every other token</b> — every tile's contribution lands in the same running total. What is bounded is not the <em>reach</em> of attention but the <em>memory</em> holding its intermediate arithmetic.</p></div>

## 5 · The same idea, already proven on this box, on a different buffer

Before FlashAttention became a question here, open-use-close had already been applied by hand to a completely different operation — and it worked, with a receipt.

Profiling the 8 GB single-card path showed that roughly **88%** of the real-tensor peak was not weights at all. It was working buffers inside the int8 matrix multiply. The single largest was `fast_int8_mm`'s output accumulator: an $[M,N]$ int32 tensor, **2.24 GB in one allocation**.

The rows of that multiply are independent — each has its own scale factor — so it can be computed a block of rows at a time and never materialized whole:

$$\mathbf{Y}[R_i,:] \;=\; \big(\mathbf{X}_8[R_i,:]\,W_8^\top\big)\cdot\big(s_{R_i}\, s_w\big), \qquad \bigcup_i R_i = \{1..M\}$$

<div class="callout truth"><span class="t">Measured, and bit-identical</span>
<p>Peak memory fell from <b>5.9 GB to 3.9 GB</b>, and the output was verified equal to the unblocked version — <code>torch.equal</code>, not "close enough". The two gigabytes recovered bought a resolution increase of <b>1.87×</b> in pixel count: 576×320 became 768×448.</p>
<p>The mechanism is identical to the online softmax's: a big intermediate that never has to exist all at once, computed in pieces, accumulated exactly. Different operation, same discipline, same guarantee. The cost was real too — the per-row loop added overhead, which is part of why int8 later measured slower than Q4 on this box (<a href="13-int8-vs-q4.html">ch.13</a>).</p></div>

## 6 · So where did the 8 GB actually go?

If attention is already tiled and the int8 accumulator is already blocked, the 345-frame failure has to be somewhere else. Reading the attention processor top to bottom, the resident tensors line up.

First `to_q`, `to_k`, `to_v` produce **three large tensors** — query, key and value, each shaped `[1, seq, heads, head_dim]` — and all three are alive at once. Then, before the SDPA call, rotary position embedding is applied to two of them:

```
if rotary_emb is not None:
    query = _apply_rotary_emb(query, *rotary_emb)   # runs once for Q
    key   = _apply_rotary_emb(key,   *rotary_emb)   # runs again for K
```

And `_apply_rotary_emb` is written the way ordinary readable PyTorch is written — as a chain of pure operations, each of which allocates a fresh full-size tensor:

```
x1, x2 = hidden_states_rotary.chunk(2, dim=-1)
hidden_states_rotated = torch.cat((-x2, x1), dim=-1)            # full-size temp
hidden_states_rotary  = hidden_states_rotary * cos
                      + hidden_states_rotated * sin             # full-size temp
return torch.cat((hidden_states_rotary,
                  hidden_states_pass), dim=-1).contiguous()     # full-size temp
```

That is roughly **four full-size temporaries per call**, and the call happens **twice** — once for the query, once for the key — while Q, K and V are all still resident. After attention returns, the SwiGLU feed-forward (`FeedForward(hidden_size, inner_dim=14336, activation_fn="swiglu")`) inflates every token through a **14,336-wide intermediate**, which is another large transient on a hidden size of 5,376.

<div class="callout spec"><span class="t">What is on the card, in order, inside one block</span>
<pre>
to_q / to_k / to_v    →  Q, K, V — three big [1, seq, heads, head_dim] tensors, all resident
_apply_rotary_emb(Q)  →  ~4 full-size temporaries  (cat, mul+add, cat.contiguous)
_apply_rotary_emb(K)  →  ~4 full-size temporaries  (the same work, run again)
dispatch_attention_fn →  flash / memory-efficient SDPA — NO N×N matrix built
FeedForward swiglu    →  a 14,336-wide intermediate per token
</pre>
<p>Fifty of these blocks run in sequence, one denoise step. The weights stream in and out around them (<a href="29-where-numbers-live.html">ch.29</a>); the tensors above are what the block itself creates and destroys while it computes.</p></div>

### The growth law, corrected

Every transient in that list — Q, K, V, the rotary temporaries, the SwiGLU intermediate — has a size proportional to the **number of tokens**. Not one of them is the score matrix. So:

$$\text{peak activation} \;\propto\; N \qquad(\text{not } N^2)$$

The entire earlier chapter hung on that exponent. It is one, not two. And a linear law is quite bad enough.

<div class="callout danger"><span class="t">Why 345 frames tipped over anyway</span>
<p>345 frames is about <b>2.8×</b> the sequence length of 124 frames. Linear growth means about <b>2.8×</b> the transient footprint — not 7.8×. That is still fatal on this card. The baseline was <b>15,129 tokens at 5.72 GB peak</b> on a card with <b>7.66 GB</b> usable. Multiply the activation part by 2.8 and there is no arrangement of the remainder that fits.</p>
<p>The failure landed exactly where the code predicts: an OOM on a <b>424 MiB</b> rotary temporary, with the card already about <b>7.6 GB</b> full. One redundant full-size copy, requested when there was no room left. Nothing quadratic anywhere in it.</p></div>

## 7 · Open, use, close — pointed at the right targets

The instinct in the original draft was sound. It was aimed at the wrong buffer. SDPA already tiles the score matrix; the linear transients are not tiled at all. **Those** are where the discipline still has room to pay.

| Fix | What it removes | Effort |
|---|---|---|
| **Fuse or in-place `_apply_rotary_emb`** | the ~4 redundant full-size copies per call, ×2 calls — *exactly where the OOM landed* | low effort, high leverage |
| **Chunk attention over the sequence dimension** | apply rotary and SDPA per query-block, free each block before the next | medium |
| **Chunk the SwiGLU feed-forward over tokens** | free the 14,336-wide intermediate per chunk instead of all at once | medium |
| **Offload the residual stream to CPU** | frees the packed sequence buffer if the budget is still a little short | medium |

<div class="callout truth"><span class="t">The end state this aims at</span>
<p>Process the sequence in <b>fixed-size tiles</b> — rotary, attention and feed-forward done per tile, each tile freed before the next opens — so that peak memory becomes roughly <b>independent of sequence length</b>. That is the true meaning of open-use-close here: not one clever kernel, but making the whole block's footprint flat in $N$. Reach that and 345 frames costs about what 124 frames costs at peak.</p>
<p>This is the <b>coherent</b> path to long video — one render, no seams. It is the alternative to chunk-and-chain (<a href="33-long-video-small-card.html">ch.33</a>), which splits the <em>output</em> into clips and pays in seams and re-conditioning. Chunk-and-chain is the fallback for when the kernel work is not done.</p></div>

Every one of those changes has the same acceptance test the int8 blocking had: **numerically verified against the untiled output.** Same numbers, less held. A tiling change that alters the result is not an optimization, it is a bug with a speedup attached.

## 8 · The thread that runs forward: ring attention is this mechanism, over a network

The online softmax is not only what makes attention fit on one card. It is the reason attention can be split across **three** cards at all, and it is the load-bearing idea in [ch.36](36-splitting-the-video-cp.html) and [ch.45](45-three-gpu-sequence-parallelism.html).

Look again at the recurrence in section 4. The running state — $m$, $\ell$, $O$ — does not care **where a tile came from.** It does not care in what order tiles arrive. It only requires that every tile arrives exactly once. That is an unusually forgiving contract, and it is what makes the following possible:

- Give each of the three cards **one third of the token sequence**. Each card holds its own $m$, $\ell$ and $O$ for its own rows.
- For attention, pass the key/value shards around a **ring**: card 0 hands its K/V to card 1, computes against what it received, passes again. After three hops every card has folded in every other card's tokens.
- Because the state is a running total, no card ever holds the whole sequence's scores, and no full score matrix exists on any card.

<div class="callout spec"><span class="t">Why the ring tolerates a link this slow</span>
<p>This box has <b>no NVLink</b>: card-to-card bandwidth is about <b>4.9 GB/s</b>, and for one of the three cards the path routes through the CPU. Tensor parallelism, which must all-reduce partial sums every layer, would be crushed by that. Ring attention passes only <b>a shard of K/V per hop</b>, and the budget for its communication buffers plus working set measured about <b>1.2 GB per card</b>.</p>
<p>There is a second, quieter dependency. Ring's flexible variant requires <code>attn_mask=None</code> — and H3 packs its request as a <b>single document with no mask</b>, the very same property that let SDPA choose the flash backend in section 1. One architectural decision inside the model buys both the single-card tiling and the three-card ring.</p></div>

<div class="callout truth"><span class="t">Measured on the box</span>
<p>With ring context parallelism at degree 3, the sequence genuinely split: <b>5,022 tokens per GPU</b>, down from <b>~15,067</b> on a single card, at about <b>5.2 GB per card</b> — comfortably inside 8 GB. At degree 2 it was <b>7,533 tokens per GPU</b> at about <b>5.9 GB</b>. The attention mathematics worked on the first attempt. What killed the three-card run was host RAM, not VRAM, and that story is <a href="42-why-two-models.html">ch.42</a>.</p></div>

## 9 · Honest status

<div class="callout truth"><span class="t">Where this stands</span>
<p>Attention is <b>already optimal</b> on this path. SDPA picks the flash / memory-efficient backend over a single unmasked document, so there is nothing left to add there and no credit to claim for it. The remaining work is genuine kernel surgery on the parts that are <em>not</em> handled: fusing <code>_apply_rotary_emb</code> so it stops making redundant copies, chunking attention and the SwiGLU feed-forward over the sequence, and offloading the residual stream if the budget still needs it.</p>
<p>None of that is exotic. All of it is fiddly, and all of it has to be verified numerically rather than eyeballed.</p></div>

<div class="callout warn"><span class="t">The research lesson, which cost nothing and saved a week</span>
<p>The quadratic story was clean, plausible, and matched every textbook description of attention. It was also disproved in twenty minutes by reading two lines of the model's own source. <b>Read the code before optimizing it.</b> An imagined allocation and a real one can differ by an entire exponent — and a week spent adding a feature that is already switched on is a week with nothing to show.</p></div>

<div class="callout spec"><span class="t">The chapter in five lines</span>
<ol>
<li><b>The online softmax</b> makes attention tileable and <b>exact</b>: a running max, a running sum, a running output, and a rescale factor that is a change of units, not an approximation.</li>
<li><b>H3 already uses it.</b> <code>dispatch_attention_fn</code> over a single unmasked document routes to flash / memory-efficient SDPA on Ampere. The $N\times N$ matrix — 25.6 GB for a five-second clip — is never built.</li>
<li><b>The real wall is linear transients:</b> Q/K/V resident together, <code>_apply_rotary_emb</code>'s ~4 full-size copies run twice, and the 14,336-wide SwiGLU intermediate. All $\propto N$, so 2.8× the frames means about 2.8× the footprint — and the OOM landed on a 424 MiB rotary temporary at ~7.6 GB on an 8 GB card.</li>
<li><b>The discipline works when aimed correctly</b> — proved already on the int8 accumulator: 5.9 GB → 3.9 GB, bit-identical, 1.87× more pixels.</li>
<li><b>The same recurrence scales outward</b> — ring attention across three cards is the section-4 loop with tiles arriving over a 4.9 GB/s cable: 5,022 tokens and ~5.2 GB per card.</li>
</ol></div>
