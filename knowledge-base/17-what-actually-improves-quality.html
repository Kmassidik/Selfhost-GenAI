# What Actually Improves Quality

<p class="lede">Two things measurably improve picture quality on this build: <b>how many pixels land on the subject's face</b>, and <b>rendering at the resolution the clip will be watched at</b>. A purpose-built face LoRA made the image worse, int8 against Q4 was a tie, and the step count that matters turned out to be a property of the scene rather than a setting to tune.</p>

The chase started from an insult. A friend's 4 GB laptop appeared to be producing sharper faces than a 33B model streamed through an 8 GB card, and the obvious suspects were all expensive: a better quantization, a realism LoRA, a second GPU. Two controlled renders later, none of them was the answer, and 21 GB had already been downloaded to find that out.

<div class="callout truth"><span class="t">The one-line answer</span>
<p>Quality on this box = <b>big face framing + native resolution</b>. Not a LoRA. Not a fancier quant. The base model, rendered natively on a close-up, is <em>already</em> cinematic — the failures blamed on "the model" were really <b>small faces and upscaling</b>.</p></div>

## Why framing is a resolution problem in disguise

A generated frame does not have a quality dial. It has a fixed budget of pixels, and every object in the shot spends some of them. An iris needs enough pixels to be a *shape* rather than a smear; teeth need enough to be separate objects rather than a bright band. Whether a face gets those pixels has almost nothing to do with the model and almost everything to do with where the camera is standing.

The structural analogy is a printing press with a fixed line screen. The press does not know what a face is. Print a portrait at postcard size and the eye is a dozen dots; print the same file as a poster and it is a thousand. Nothing about the press changed. This is why "the model can't do eyes" and "the eyes were 20 pixels wide" produce identical-looking complaints and require completely different fixes.

<div class="callout truth"><span class="t">The eyes were never broken by the model</span>
<p>Every "soft eyes" complaint on this project traced to one of two causes, and neither was model quality:</p>
<ol>
<li><b>Small faces.</b> A face occupying ~20–30 px cannot contain an iris. This is arithmetic, not aesthetics.</li>
<li><b>Upscaling.</b> Generating small and then enlarging <em>softens</em>, because the enlarger is inventing detail the latent never carried.</li>
</ol>
<p>Give a face real pixels and render at the target resolution, and the base model produces sharp, film-like eyes with no help at all. The fix that worked on the eye artefacts, verified by inspecting frames 60–80 of a real clip: <b>tight close-up, 20 real steps rather than distilled, 768×448 native, calmer expression.</b></p></div>

There is a corollary worth stating because it is counter-intuitive: **a single still image fits at far higher resolution than video does.** A still carries none of the temporal cost of 362 frames, so on 8 GB a **1920×1080 single frame fits and looks photoreal.** For one person, the measured ladder runs: 480p flawless, 720p magazine-grade, 1080p indistinguishable from a photograph. The wall that forces video down to 480p is frames, not pixels.

## The controlled test: does a face LoRA help?

The candidate was `fal/MiniMax-H3-Realism-People-LoRA`, purpose-built for faces, eyes, skin and hands. Its own documentation promises that "skin keeps its texture instead of smoothing out, eyes and micro-expressions stay coherent." Exactly the failure being chased.

The temptation with a tool like this is to switch it on inside a working pipeline and judge the output. That test is worthless, because a production pipeline contains an upscaler and a face restorer, either of which could account for any difference. So the ablation stripped both out.

The baseline — no LoRA, no upscale, no restore, plain Q4 at native resolution on a close-up — came back crisp, cinematic, with detailed eyes and visible catchlights. The LoRA run came back *softer*.

<div class="callout warn"><span class="t">Why a face LoRA backfires at 480p</span>
<p>The LoRA's own training notes explain it: its detail "lives in <b>high spatial frequencies</b>, and at a lower resolution the latents barely carry them." A latent at 480p does not have channels for pore-scale texture, so an adapter trained to add that texture has nothing to attach it to — and its remaining effect is a smoothing prior. It was never a compatibility problem: the LoRA <em>loads fine</em> with the Q4 GGUF. It simply had no resolution to work with.</p>
<p>(A footnote for anyone reproducing the run: this ablation used <b>848</b>×480 under the ComfyUI-era engine. In the pipeline built later, 848 is a trap — 848 ÷ 16 = 53, an odd number, which breaks 2×2 patching with a shape error that never mentions resolution. Use 832, where 832 ÷ 16 = 52.)</p></div>

## How many steps a scene needs

The other lever nobody expects is the step count, and the reason it surprises people is that it is usually presented as a model setting. It is not. It is a property of **the scene being rendered**.

A denoising step removes a fixed slice of noise from the whole frame at once. A frame whose content is one large, smoothly varying object reaches its final state quickly. A frame full of small independent details — a distant figure, a horizon of separate structures — needs many more passes before every one of those details has resolved, because each of them is competing for the same denoising budget.

<div class="callout spec"><span class="t">The rule</span>
<p><b>Fine detail everywhere plus a small subject means more steps.</b> A face filling the frame converges in 4. Floating islands with a hero standing tiny on a distant cliff needs 49. Budget steps by looking at the shot, never by habit — and never assume a higher resolution rescues an under-sampled one. A well-sampled 512×288 beat an under-sampled 1280×704 outright.</p></div>

An older finding from the same family: the Turbo distillation, which compresses sampling to 4–6 steps, was measured as the main culprit behind badly formed teeth. Its distillation under-renders the finest detail, and teeth are the finest thing in a face. Full 20-step euler formed them properly. Turbo remains the right tool for drafts and motion tests; it is the wrong tool for a hero shot.

## Native resolution against the upscaler

The second measured lever is subtler, because upscaling is not simply bad — it is bad *relative to native*, and by an amount that depends on the ratio.

Three separate measurements pin this down. First, the upscaler was cleared of a crime it did not commit: it contributes only **1.02× the temporal change** between frames, so it is not the source of flicker. Second, motion judder was fixed by frame interpolation, measured at **1.8× smoother** going from 24 to 48 fps — again nothing to do with the enlarger. Third, and decisively, upscaling *does* soften, and a mild upscale softens much less than an aggressive one.

That third point turns out to determine the whole production route.

## The quant that was supposed to matter

The third suspect was precision. If Q4 destroys faces, the reasoning went, int8 should rescue them. A head-to-head was run on a street-musician scene — same prompt, same seed, same 50-step euler, same pipeline on both sides.

| Metric | int8 (with our chunk patch) | Q4_K_M (GGUF) | Result |
|---|---|---|---|
| Render time | 6,393 s (**107 min**) | 3,122 s (**52 min**) | Q4 — **2.05× faster** |
| Native resolution it fit | 576×320 (0.184 MP) | 704×384 (0.270 MP) | Q4 — **+47% pixels** |
| Peak VRAM | 7.5 GB | 7.06 GB | Q4 — lower |
| Quality, by eye | ~85 | ~85 | **tie** |
| Teeth on the singing shot | clean | clean | both held |

<div class="callout warn"><span class="t">Read that table one axis at a time</span>
<p><b>Speed is a real, decisive win for Q4</b> — and stronger than it looks, because int8 ran at <em>lower</em> resolution and was still twice as slow. <b>Quality is a tie, not a Q4 victory.</b> An earlier write-up scored it 84 against 87, which overstated a gap that sits inside eyeball noise and is <em>confounded</em>: the two clips ran at different native resolutions and are different generated images. If anything, int8 is the higher-fidelity reference — the patched int8 path is bit-identical to unpatched int8, while Q4 is four bits. Q4 <em>matches</em> it; it does not beat it.</p>
<p>Caveats worth keeping: <b>n = 1 scene, one seed</b>, and part of the 2× is self-inflicted, since the chunk patch added loop overhead to int8. This is a strong signal and a better default, not a proven verdict.</p></div>

The practical consequence is the opposite of the intuition that started the search. Precision did not buy face quality. It bought **resolution headroom and time** — and resolution headroom is the lever that *does* buy face quality, which is why the Q4 result mattered at all.

## The scoreboard

| Lever | Helps? | Evidence |
|---|---|---|
| **Big face framing** | ✅ yes | close-up native frames have sharp eyes; wide crowds at ~20 px per face melt |
| **Native resolution** | ✅ yes | native 480p base frame is crisp; the same content upscaled hard is softer |
| **Enough steps for the content** | ✅ yes | 4 / 23 / 49 by scene; 3 steps on a wide vista renders mud after 5.5 h |
| Full steps rather than Turbo, for hero shots | ✅ yes | Turbo's distillation under-renders teeth; 20-step euler forms them |
| Frame interpolation for judder | ✅ yes | 24 → 48 fps measured 1.8× smoother |
| Face restoration on big faces | ✅ yes | rebuilds teeth better than the alternative tried |
| Realism-People LoRA at 480p | ❌ no | controlled ablation — softened, did not sharpen |
| int8 over Q4 | ≈ tie | benchmark tie on quality; Q4 wins speed and headroom |
| Aggressive upscaling | ❌ no | softens; a mild 1.54× lift is the version that works |

## What this chapter predicted, and what happened next

Two claims here were written when the box had one card and a 480p native ceiling. Both have since been overtaken, and both are more useful kept than deleted.

> *"On 8GB (where native res is capped), the LoRA can't reach the resolution where it would help. Dead end."*

<div class="callout truth"><span class="t">The premise expired; the conclusion was never re-tested</span>
<p>The native ceiling is no longer 480p. This build now renders <b>native 1280×704</b> — 124 frames at 23 steps in 55 minutes, and 345 frames at 23 steps in about 44 hours ([ch.46](46-the-first-15-seconds.html)). The exact condition the LoRA needed to deliver its high-frequency detail now exists on the box.</p>
<p>The honest position: <b>the LoRA has not been re-run at 720p.</b> The measurement that exists says it hurts at 480p, and the reason it hurt has been removed. Calling it a dead end today would be repeating the mistake this chapter was written to correct — asserting an outcome instead of rendering it.</p></div>

> *"Multi-GPU — ❌ no (quality) — speed only, can't enlarge a single render."*

<div class="callout danger"><span class="t">This one was simply wrong</span>
<p>Three cards <em>can</em> enlarge a single render, and that is exactly what they were eventually used for. Splitting one video's token sequence across three GPUs put <b>1280×704 × 345 frames</b> — a size no single 8 GB card can hold — inside reach ([ch.45](45-three-gpu-sequence-parallelism.html)). The claim was true of the multi-GPU technique available at the time, which parked <em>weights</em> on a second card; it was false as a statement about multiple GPUs in general.</p>
<p>Note what the correction does <em>not</em> change: extra cards still buy no quality per pixel. They buy <b>more pixels</b> — and more pixels is the chapter's own number-one lever. The old row was wrong about the mechanism and right about the physics.</p></div>

<div class="callout spec"><span class="t">The honest lesson</span>
<p>Real effort went into a multi-GPU experiment, a LoRA, and a 21 GB int8 download, all chasing a quality bump — and the answer was <b>framing, resolution, and enough steps</b> the whole time, provable with two controlled renders. When quality is the goal: frame the subject big, render at the target resolution, give the scene the steps its content demands, lift gently if at all, and accept the slow render. The simple levers beat every expensive one, and measuring first would have saved a 21 GB download.</p></div>

Method note: every claim here is a same-seed, single-variable render on the box. The negative results — the LoRA, int8, the early multi-GPU verdict — are documented as fully as the positive ones, including the two that later turned out to be wrong.
