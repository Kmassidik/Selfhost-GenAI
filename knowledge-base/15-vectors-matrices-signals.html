# Vectors, Matrices, or Signals?

<p class="lede">All three, one after another, and it is the same numbers the whole way. A <b>vector</b> is what one item means. A <b>matrix</b> is many of those items stacked — or a learned transformation waiting to act on them. A <b>tensor</b> is the general case with any number of axes. A <b>signal</b> is what those numbers become at the very end, when one axis is finally interpreted as time. Nothing converts between these worlds; the data is simply reshaped, and the shape at each moment is what tells you the role the numbers are playing.</p>

Here is a real shape from this build. Encoding an 832×480 clip of 124 frames produces a visual latent of

$$\mathbf{z} \;\in\; \mathbb{R}^{1 \times 24 \times 37 \times 30 \times 52}$$

Five numbers, and every one of them is a different kind of thing: a batch, a channel count, a count of compressed frames, a height, a width. Learning to read that line — to know instantly which axis is time and which is meaning — is most of what this chapter is for. The rest of it is watching that same block of numbers change costume six times between a sentence and an `.mp4`.

## The single unifying object: the tensor

Everything below is one data type. PyTorch has exactly one container for numbers — `torch.Tensor` — and the words *vector*, *matrix* and *signal* are human labels for tensors of particular ranks used in particular ways.

<div class="callout spec"><span class="t">Rank is just "how many axes"</span>
<table>
<tr><th>Rank</th><th>Common name</th><th>Written</th><th>Example in this pipeline</th></tr>
<tr><td>0</td><td>scalar</td><td><code>()</code></td><td>the guidance value, the current timestep</td></tr>
<tr><td>1</td><td><b>vector</b></td><td><code>(d,)</code></td><td>one token's embedding; the shared timestep embedding, 2688 wide</td></tr>
<tr><td>2</td><td><b>matrix</b></td><td><code>(rows, cols)</code></td><td>the hidden state (one row per token); every weight matrix</td></tr>
<tr><td>3</td><td>batched matrix</td><td><code>(B, rows, cols)</code></td><td>attention scores, per head</td></tr>
<tr><td>5</td><td>tensor</td><td><code>(B, C, F, H, W)</code></td><td>the video latent — <code>(1, 24, 37, 30, 52)</code></td></tr>
</table>
<p>A vector is not a different kind of thing from a matrix. It is a matrix with one axis missing — and half the bugs in this field come from a missing or extra axis of size 1.</p></div>

The useful mental move is to stop asking what type something is and start asking **what each axis counts**. An axis of length 52 that counts latent columns and an axis of length 52 that counts audio samples are the same integer and completely different facts.

## ① One item becomes a vector

The tokenizer turns text into integers. Integers are only names — id `4471` is no closer to id `4472` than to id `9`. Meaning appears at the next step, when an **embedding table** $E$ replaces each id with a learned row of numbers:

$$\mathbf{x}^{(0)} \;=\; E[\mathbf{t}] \;\in\; \mathbb{R}^{d}$$

That row is a **vector**: a fixed-length list where each slot is a learned feature and the *direction* of the whole thing is the meaning. Two words with similar roles end up pointing in similar directions; the distance between them is a real, computable number.

**The structural analogy that holds:** a vector is a bank of faders on a mixing desk. There is no single fader labelled "cat" — the meaning is the whole pattern of positions across every fader at once. Move a few and you get something adjacent; move many and you get something unrelated. This is why the same object can encode a word, a patch of video, or a moment in time: the axes are not named in advance, they are whatever the training made useful.

<div class="callout spec"><span class="t">The widths in this model, from <code>transformer/config.json</code></span>
<table>
<tr><th>Vector</th><th>Width</th><th>What one of them describes</th></tr>
<tr><td>text feature, from the encoder</td><td><code>text_dim</code> 5120</td><td>one text token, as Qwen3-VL-32B left it at layer 50</td></tr>
<tr><td>the residual stream inside a block</td><td><code>hidden_size</code> 5376</td><td>one token of the packed sequence</td></tr>
<tr><td>one attention head's view</td><td><code>attention_head_dim</code> 128</td><td>one narrow slice of that token</td></tr>
<tr><td>the timestep embedding</td><td><code>time_embed_dim</code> 2688</td><td><b>the whole render's current noise level</b> — one vector, shared by every token</td></tr>
</table>
<p>That last row is worth pausing on. Almost everything in a transformer is <em>per token</em>. The timestep embedding is not: it is a single 2688-wide vector broadcast to all rows at once, which is exactly why it is cheap to send and why sharding a sequence across cards does not have to shard it (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>).</p></div>

## ② Stack the items and you have a matrix

The model never looks at one token alone. Every row of the sequence is processed together, so the natural container is a **matrix**: one row per item, one column per feature.

$$\mathbf{X} \;=\; \begin{bmatrix} \text{---}\ \mathbf{x}_1\ \text{---} \\ \text{---}\ \mathbf{x}_2\ \text{---} \\ \vdots \\ \text{---}\ \mathbf{x}_L\ \text{---} \end{bmatrix} \;\in\; \mathbb{R}^{L \times 5376}$$

Rows are *things*, columns are *features of things*. That convention is not a law of mathematics, it is a house style — but it is the house style of essentially every deep-learning library, and reading a shape from left to right as "how many, of what width" gets you a long way.

### The second, sneakier use of matrices

A matrix is also a **transformation**. The model's knowledge is not stored as a list of facts; it is stored as matrices that turn one vector into another. $W_Q, W_K, W_V$, the two feed-forward matrices, the modulation projections — these are all learned linear maps.

<div class="callout truth"><span class="t">Why "matrix multiply" is the only operation that matters</span>
<p>A single output number is a <b>dot product</b>: multiply a row by a column, element by element, and add up. That is it. Every attention projection, every feed-forward layer, every convolution in the decoder ultimately reduces to millions of these running in parallel — which is precisely the shape of work a GPU exists to do (<a href="31-what-the-gpu-does.html">ch.31</a>). The spec sheet number "448 GB/s" and the phrase "thousands of cores" both mean <em>this operation, at once, at scale</em>.</p></div>

The config gives the exact widths this build uses. Inside a block, the 5376-wide stream is projected out to **56 heads × 128 dimensions = 7168** numbers for the attention step, then projected back down to 5376. The feed-forward network widens it a different way — `ffn_dim` **14336**, then back. All of that lives in about **395 million parameters per block**, and there are **50 blocks**, which is where the roughly 20 billion numbers in the model file come from.

## ③ Attention: a matrix whose two axes are both tokens

The famous step is three matrix multiplies followed by a fourth that is different in kind:

$$\mathbf{Q} = \mathbf{X}W_Q, \qquad \mathbf{K} = \mathbf{X}W_K, \qquad \mathbf{V} = \mathbf{X}W_V$$

$$\mathbf{S} \;=\; \frac{\mathbf{Q}\mathbf{K}^{\top}}{\sqrt{d_k}} \;\in\; \mathbb{R}^{N \times N}, \qquad \mathrm{Attn}(\mathbf{X}) \;=\; \mathrm{softmax}(\mathbf{S})\,\mathbf{V}$$

Look at the shape of $\mathbf{S}$ and the whole cost model of video generation falls out. Its rows are tokens and **so are its columns**. It is the only object in the pipeline whose two axes count the same thing, and its size is therefore $N^2$ — every token paired with every other token.

Everything else in a transformer block is *per token*: the norms, the modulation, the residual adds, the feed-forward. Attention is the sole line that mixes rows. That single fact is what makes long clips expensive, what makes FlashAttention worth having ([ch.34](34-open-use-close-flashattention.html)), and what makes splitting a sequence across three cards a tractable idea ([ch.45](45-three-gpu-sequence-parallelism.html)) — everything but attention can just be done locally on each card's slice.

## ④ The video is a five-axis tensor, then a matrix again

At this point the data stops being a sentence. A clip has independent axes that a matrix cannot express, so it lives as a rank-5 tensor:

$$\mathbf{z} \;\in\; \mathbb{R}^{B \times C \times F' \times H' \times W'} \;=\; \mathbb{R}^{1 \times 24 \times 37 \times 30 \times 52}$$

- $B = 1$ — one clip at a time.
- $C = 24$ — the VAE's `latent_channels`. Not red/green/blue; 24 learned channels whose meaning is whatever compresses best. The audio VAE uses 32.
- $F' = 37$ — compressed frames, standing in for 124 real ones.
- $H' = 30,\ W' = 52$ — compressed space. The VAE's spatial compression is **÷16**, and $832/16 = 52$, $480/16 = 30$ exactly.

**The analogy that carries real structure:** a matrix is a spreadsheet. A video latent is a filing cabinet of spreadsheets — one drawer per channel, one sheet per compressed frame, rows and columns inside each sheet. The tensor notation is just the address format for that cabinet.

But attention cannot read a filing cabinet. It needs rows. So the block **patchifies**: `patch_size` is `[1, 2, 2]`, meaning one frame deep, two latent cells tall, two wide, and each such patch becomes a single row of the hidden state.

<div class="callout warn"><span class="t">The 848-pixel trap — a shape bug in the wild</span>
<p>Asking for a width of <b>848</b> on this build fails. Not slowly, not with a memory error — with a shape mismatch that names two integers and no cause. The arithmetic: 848 ÷ 16 = <b>53</b> latent columns, 53 is odd, and a 2 × 2 patch cannot tile an odd number of columns. Use a width whose sixteenth is even: <b>832</b> gives 52, and 52 ÷ 2 = 26.</p>
<p>This is the practical payoff of the whole chapter. A shape error is never mystical. It is two axes that were supposed to count the same thing and did not, and the fix is always found by writing the division out.</p></div>

### Where positions come from

One more thing hides in the shapes. Flattening 37 × 15 × 26 into 14,430 rows throws away *where* each patch was — the matrix has no idea that row 27 sat next to row 28 in space and row 417 sat behind it in time. Position is put back with **rotary embeddings**: each pair of numbers in a token's vector is rotated by an angle that depends on its position, using a frequency ladder set by `rope_theta` = 10000.

A rotation is a matrix acting on a vector. So even "where am I in the video" is expressed in the same currency as everything else.

## ⑤ The output is a signal

The last stage decodes the latent back into things that mean something physical, and here a new idea appears that was not present anywhere upstream: **one axis becomes a clock**.

A **signal** is a tensor where an axis is time and the values are a measurable quantity — air pressure, brightness. Nothing about the storage changes. What changes is that the spacing between adjacent entries is now a duration, and that duration has a name: the **sample rate**.

**Audio.** A 1-D array per channel, at **32 kHz stereo**. The axis is literally time:

$$\mathbf{A}[k] \;=\; \text{amplitude at sample } k, \qquad \Delta t \;=\; \tfrac{1}{32{,}000}\ \text{s}$$

One second of one channel is 32,000 numbers. A full-length 15-second clip is 32,000 × 15 = 480,000 numbers per channel — and that entire waveform is smaller than a single frame of 832×480 colour video. Sound is cheap; pictures are not.

**Video.** A stack of images at **24 fps**, so the shape is height × width × colour × frame, and the frame axis is the clock. The 124-frame clips in this project are 124 ÷ 24 ≈ 5.2 seconds; the 345-frame ones are the model's full 15-second range.

<div class="callout truth"><span class="t">Why "signal" is a genuinely different word</span>
<p>Upstream, an axis of length 37 counts <em>compressed frames</em> — an internal bookkeeping unit with no duration attached. Downstream, an axis of length 345 counts <em>frames on a clock</em>, and the number 24 turns it into seconds. Same container, same dtype, same GPU. What changed is that the index now maps to the physical world, which is exactly what makes it playable, seekable, and comparable to a microphone recording.</p></div>

## The honest punchline

The model never decides between a vector and a matrix and a signal. It computes one long stream of tensors, and the shape at each moment is simply the most convenient arrangement for the operation about to happen:

- **rank 1** when reasoning about one thing, or broadcasting one fact to everything,
- **rank 2** when reasoning about many things at once, or applying a learned transformation,
- **rank 4 or 5** when the data has genuinely independent spatial and temporal extent,
- **rank 1 over time** when it finally has to leave the machine and be heard.

When a shape stops making sense, there is exactly one question worth asking: **what is each axis counting?** Token, feature, head, frame, row, column, sample. Every shape error in this project — the 848-pixel trap included — was answered by writing that list out and finding the axis that had quietly started counting something else.

## Where to go deeper

- **3Blue1Brown, *Essence of Linear Algebra*** — the series that makes a matrix feel like a transformation rather than a grid of numbers. The single best preparation for §②.
- **Karpathy's *micrograd*** — a few hundred lines in which vectors flow through matrices as concrete Python floats and a gradient appears at the end.
- **PyTorch `Tensor.shape`, `view`, `permute` and `einsum`** — reshape one array between rank 1, 2 and 5 and watch the meaning change while the bytes do not.
- **Any *Signals and Systems* introduction** — for why a 1-D array with a sample rate is a different object from a 1-D array without one. Chapter 14 §10 has the fuller reading list.
