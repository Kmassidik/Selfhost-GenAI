# H3 Hardware &amp; Budget Audit

<p class="lede">The minimum to run the full MiniMax-H3 is <b>one 24 GB card and about 64 GB of system RAM</b> — a used RTX 3090 at roughly $900 — and the minimum to run a pruned variant is a card someone probably already owns. That is the money answer, and it is the easy half. The hard half is that hardware is only the first currency: the second is wall-clock, and this chapter prices every row in both.</p>

The reason the second currency matters is visible in one comparison from this box's own logs. Fifteen seconds of native 720p video is not impossible on three 8 GB cards — it renders, it exists, it is beautiful. It costs about **44 hours**. The same fifteen seconds by the practical route costs **2.6 hours**. No amount of money spent on the first route buys back the difference; only a different route does.

<div class="callout truth"><span class="t">The headline, quotable to anyone</span>
<p><b>The cheapest way to run the FULL 33 B model is one 24 GB card plus about 64 GB of RAM</b> — an int8 <em>streaming</em> recipe, where encode and denoise run as separate passes so the two enormous halves never coexist in memory. Roughly 16 minutes per 5-second 480p clip with synchronised stereo audio. A used RTX 3090 at about $900 clears it.</p>
<p>Everything cheaper is a pruned model or a slower slog. Everything faster is more VRAM, or rented time. And everything on this page assumes used-market and rental prices as of September 2026 — re-verify before buying.</p></div>

## The two knots that decide the floor

Every budget below 24 GB fights the same two facts, and they are worth stating precisely because most confusion about H3 hardware comes from conflating them.

**First: the model is two enormous halves, and together they exceed most consumer RAM.** A 32-billion-parameter text and vision encoder produces the conditioning; a separate transformer does the denoising. At native precision the pair is around 124 GB. They therefore must run in separate passes — encode, write to disk, denoise — never resident together.

**Second: neither half fits a consumer GPU whole.** So each half is either quantized down, streamed block by block through the card, or both.

<div class="callout spec"><span class="t">Why the two-phase split is a hardware saving, not a code style</span>
<p>The phase boundary is what converts a 124 GB RAM requirement into a 26 GB one. It also produces a second saving that matters more day to day: <b>encode once, render many.</b> A scene's embeddings are fixed, while steps, resolution, engine and seed are not — so one encode pass feeds dozens of re-renders and the encoder is never paid for again (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>).</p>
<p>This is why the audit table's RAM column reads 32 to 64 GB and not 128. The budget question "how much RAM do I need?" has no answer until the pipeline shape is known.</p></div>

## The second currency: hours

Hardware sets what is *possible*. The step count and the resolution set what it *costs*, and the cost is paid in wall-clock. These are the measured denoise times from this box's own render logs, taken from the sampler's own progress output and therefore excluding VAE decode:

| Configuration | Seconds per step | 23 steps | 49 steps |
|---|---|---|---|
| 512×288 × 345 frames (15 s) | **81 s** | 0.5 h | 1.1 h |
| 1280×704 × 124 frames (5 s) | **143 s** | 0.9 h | 1.9 h |
| 832×480 × 345 frames (15 s) | **193 s** | 1.2 h | **2.6 h** |
| 1280×704 × 345 frames (15 s), 3-GPU sharded | **6600 s** | **~44 h** | **~90 h** |

Add roughly 25 to 50 minutes of VAE decode to each. The step column is not a detail — steps are the single largest multiplier in the whole budget, and the number a scene needs is a property of **the scene**: a tight close-up converges in **4** steps, a character mid-shot in **23**, a wide vista with a small distant subject in **49**.

<div class="callout warn"><span class="t">The row that breaks the pattern, and why</span>
<p>Going from 832×480 × 345 to 1280×704 × 345 is <b>2.26× the tokens</b>. Attention is quadratic in sequence length, so pure scaling predicts about <b>5×</b> the time. Measured: <b>34×</b>.</p>
<p>The three-GPU sequence-parallel path therefore carries roughly a <b>7× overhead beyond the mathematics</b> — hand-rolled fp32 ring attention running in Python loops, plus a deep copy of every block onto every card on every step. It buys memory and sells speed, and it is the reason the 44-hour figure exists at all. A budget built by extrapolating the quadratic would have been wrong by a factor of seven (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>).</p></div>

<div class="callout truth"><span class="t">Take the upscale</span>
<p><b>Roughly 35× cheaper for a result most viewers cannot distinguish.</b> A well-sampled 832×480 lifted 1.54× beats an under-sampled 1280×704 every time — and mild upscales preserve detail where aggressive ones go soft (<a href="17-what-actually-improves-quality.html">ch.17</a>).</p>
<p>Native 720p at 15 seconds is therefore best understood as <b>a capability this box has proven, not a workflow it should use.</b> Keep it for the one hero shot that justifies a weekend of GPU time.</p></div>

The evidence for the under-sampling half of that claim is on disk too. The same 1280×704 × 345 configuration at **3 steps** completed in about 5.5 hours and the result was **mud** — not a slightly worse version of the 23-step render, but an unusable one. Steps cannot be traded away to buy resolution; below a scene's threshold the render is simply wasted.

## What an hour of GPU time actually is

Converting the table into per-second-of-video figures makes the trade concrete. These are derived from the measured numbers above, not separately observed:

| Route | Cards busy | Denoise per second of finished video | GPU energy for the whole 15 s |
|---|---|---|---|
| 832×480 × 49 steps, then upscale | 1 | ~10.4 min | ~0.5 kWh |
| Native 1280×704 × 23 steps, sharded | 3 | ~2.9 h | ~26 kWh |

The energy column is simply the busy cards held at their 200 W power limit for the duration, and it counts nothing else — not the dual-Xeon platform, not the drives, not the cooling. It is a floor, not an estimate of a bill. But the ratio is the point: the roughly **seventeen-fold difference in time becomes a fiftyfold difference in electricity**, because the slow route also occupies three cards instead of one. And while it runs, those three cards can render nothing else — the opportunity cost is the entire machine for two days.

<div class="callout spec"><span class="t">Three things money buys, and they are not interchangeable</span>
<ol>
<li><b>Capacity (VRAM).</b> Decides what fits — and once streaming is in play, decides how much has to be re-fetched from RAM on every step rather than staying resident.</li>
<li><b>Bandwidth (GB/s on the card).</b> Decides how long each step takes, because denoise on this class of hardware is memory-bound rather than arithmetic-bound. A newer card with the same bandwidth renders at the same speed (<a href="39-choosing-the-next-card.html">ch.39</a>).</li>
<li><b>Count (how many cards).</b> Decides throughput — how many independent shots run at once. It does <em>not</em> decide latency: three cards on one render was measured 34× slower than one card on a smaller render, not three times faster.</li>
</ol>
<p>Almost every disappointed upgrade comes from buying one of these expecting another. The most common is buying count and expecting latency.</p></div>

<div class="callout truth"><span class="t">What the extreme floor turned out to be</span>
<p>The original version of this chapter described the 8 GB row as "pruned ~20 B, W4A8 plus heavy offload plus low resolution, minutes per clip, 480p" and marked the full-model attempt as <em>in progress</em>. Two thirds of that has held up and one third has not.</p>
<p><b>Held:</b> the model is pruned, the offload is heavy, and the clips take a long time. <b>Did not hold:</b> "low resolution." Native <b>1280×704 at 345 frames</b> renders on these cards. The 8 GB floor is not a resolution ceiling — it is a <b>time</b> ceiling, and those are different budget categories entirely.</p></div>

## Then and now — the same box, two engines

It is worth putting the earliest measurements beside the current ones, because the hardware line moved without the hardware changing.

| | Early phase — one card, ComfyUI, 60 GB RAM | Now — three cards, our own pipeline, 125 GB RAM |
|---|---|---|
| Longest clip | 512×288 × 15 s, ~17.5 min at ~24 steps | 1280×704 × 15 s, ~44 h at 23 steps |
| Highest native resolution | 1024×576 for a 3-second clip, then upscaled | 1280×704 for a 15-second clip, no upscale needed |
| The stated rule | "short and sharp, or long and soft — never both" | both, at a price measured in days |
| The binding constraint | VRAM | wall-clock |

That first row is not a like-for-like comparison and should not be read as one — different engine, different card count, different quantization path. What it does show honestly is where the *ceiling* was and where it went. The early rule of thumb, "roughly one minute of render per second of a 15-second clip," was a true and useful statement about that configuration, and it is off by a factor of a hundred for the 720p sharded path.

## Reading the table as a budget calculator

<div class="callout spec"><span class="t">Pick the cheapest row that clears the bar</span>
<ul>
<li><b>"Run the real full model, cheaply, slowness accepted"</b> → a used RTX 3090 at about $900: int8 streaming, 480p, roughly 16 minutes per clip. The honest floor for the full model with head-room.</li>
<li><b>"Native 768p at reasonable speed"</b> → a used RTX 4090 at about $2,000, W4A4 resident.</li>
<li><b>"Already on 8 GB, or on a laptop"</b> → a pruned model, at zero additional cost. Expect 480p as the comfortable tier and long waits above it.</li>
<li><b>"Several 8 GB cards already in the chassis"</b> → run independent shots in parallel first. Sequence parallelism is for the shot that will not fit at all, and it costs an order of magnitude.</li>
<li><b>"Production speed at 768p, at scale"</b> → rent 4 × L40S at about $4/hr rather than buying.</li>
<li><b>"One-off — a 768p hero clip, or a trained LoRA"</b> → rent a 4090 or an A100 for an hour or two, at $1–5.</li>
</ul></div>

<div class="callout warn"><span class="t">The arithmetic that decides buy versus rent</span>
<p>A used 3090 at $900 is about <b>225 hours</b> of a $4/hr rented four-card L40S node. Anyone who will not run 225 hours of rendering should probably not buy the card — and anyone who will run several times that should not be renting.</p>
<p>The catch, and it is a real one: rented time is <em>fast</em> time. Two hundred hours on a rack is not the same quantity of work as two hundred hours on three 3060 Ti. Compare hours only after converting them through the seconds-per-step table above, or the comparison flatters whichever side is being argued for.</p></div>

## What this audit deliberately does not price

Three costs sit outside the table and each has been paid here in full.

**Failure.** One decode run completed 6 hours 10 minutes of denoise and then died on the first line of decode, because the device resolution picked `cuda:0` while the sharded forward returned latents on CPU. Six hours, gone, for a one-line device mismatch. The fix that came out of it — dump latents to disk before decode is allowed to fail — saved the next six hours the same night. A budget with no allowance for re-runs is a fiction.

**Traps that cost days rather than dollars.** A width of 848 pixels divides by 16 to give 53, an odd number, so 2×2 patching fails with a shape error that never once mentions resolution. Use widths where the division by 16 lands even — 832 gives 52. That single fact is worth more than a hardware upgrade to anyone about to lose an afternoon to it.

**The platform around the cards.** This box runs 125 GB of DDR3-1600 across four sticks, a dual Xeon E5-2665 board with PCIe 3.0 ×16 slots, and 879 GB of disk. The RAM is what makes streaming possible at all, and the disk is what makes encode-once-render-many possible. Neither shows up in a GPU price comparison, and a build that skimps on either will underperform its card.
