# Long Video on a Small Card

<p class="lede">Long video on a small card is made by refusing to render it long: a piece at a time, written to disk, each one conditioned on the last. The card never holds more than one piece, so length stops costing memory and starts costing wall-clock and disk — which are the two things a small machine has plenty of. The whole difficulty moves to the seam, and the measured finding is sharper than expected: <b>a chained seam holds the scene together and loses the person.</b></p>

That result is worth stating twice, because it is not the failure anyone predicts. Chained clips do not fall apart into jump cuts. The street stays the same street, the rain keeps falling at the same angle, the palette holds. What drifts is the face — and only a certain kind of face.

<div class="callout truth"><span class="t">The one-line truth</span>
<p>The length wall is beaten with <b>time</b>, not VRAM: render a piece, write it out, render the next, repeat. A ten-minute video and a five-second clip have the same peak memory. What that buys is unlimited length; what it costs is a continuity problem that gets harder the more human the subject is.</p></div>

## First, which ceiling is which

Before any chunking, one confusion has to be cleared up, because this chapter used to contain it. There are **two** separate ceilings on clip length and they belong to different parts of the system.

The hardware ceiling was real and it moved. A single 8 GB card once OOM'd at 345 frames; tiling every per-token operation put a full 15 seconds at 480p onto one card, and splitting the sequence across three cards put 15 seconds of native 1280×704 within reach ([ch.44](44-building-dalang.html), [ch.45](45-three-gpu-sequence-parallelism.html), [ch.46](46-the-first-15-seconds.html)).

The model ceiling did not move, and it cannot be moved by any amount of hardware. **H3 generates 4 to 15 seconds at 24 fps** because that is the range it was trained on. A longer single take is not a memory request; it is a request for behaviour the weights were never shown.

<div class="callout danger"><span class="t">Correcting this chapter's own earlier claim</span>
<p>An earlier version of this page listed the single-shot maximum as "capped, about 14 s, and by the 8 GB wall" — bundling the two ceilings into one. That was wrong in a way that mattered, because it implied a bigger card would buy a longer take.</p>
<p>It would not. <b>The 15-second limit is the model's trained range, not a hardware limit.</b> Anything longer than that is an editing problem regardless of how much VRAM is available — which is exactly why chunking is not a poverty workaround. Every H3 user needs it, on any hardware, to exceed fifteen seconds.</p></div>

## The idea: chunk, condition, repeat

Render five seconds. Write it to disk. Render the next five, starting from where the last one ended. Continue to any length. Because the GPU only ever holds **one chunk's activations**, it never OOMs regardless of the final runtime.

The flatness is measurable rather than theoretical. A 124-frame chunk at 832×480 is **15,129 tokens and about 5.72 GB of peak VRAM** on a card with 7.66 GB usable. Twelve of those chunks make a minute of video, and the twelfth costs exactly what the first did — 5.72 GB — while a single 60-second render would need roughly twelve times the activation and fit nowhere at all.

<div class="callout spec"><span class="t">What a chunk costs, worked through</span>
<p>At 832×480 × 124 frames a <b>tight close-up converges in 4 steps and denoises in about 2 minutes.</b> Twelve such chunks is a little over a minute of finished video for roughly half an hour of denoise.</p>
<p>Hold the caveat firmly, though: 4 steps is the close-up number. The same chunk length holding a wide vista with a small distant subject needs <b>49</b> steps, and the cost rises with it. Step count is a property of the scene, not of the chunking (<a href="47-the-scorecard.html">ch.47</a>). Chunking makes long video <em>possible</em>; it does not make it cheap.</p></div>

## Two ways to chunk, and only one of them works

| | How | Result |
|---|---|---|
| ❌ Independent chunks | render separate clips and glue them together | nothing tells chunk 2 what chunk 1 looked like — different framing, different motion, a hard jump cut at every seam |
| ✅ Conditioned chunks | each chunk *continues from* the previous | scene, framing and motion carry across, and the seam can be hidden |

The independent version is the obvious first attempt and it fails instantly. Conditioning is the whole game — and the form the conditioning takes decides what survives.

## Why last-frame-only conditioning breaks

The cheap fix is to hand the **final frame** of chunk 1 to chunk 2 as its starting image. H3's FL2VA variant accepts exactly that: text, plus an optional first and last frame. It half-works, and it fails in two specific ways.

<div class="callout warn"><span class="t">A single frame carries no motion, and no sound at all</span>
<ul>
<li><b>A still frame has no velocity.</b> Video is frames plus how they move, and motion lives in the <em>difference</em> between consecutive frames. One frozen frame is a pose with zero velocity, so the next chunk has to guess which way everything was travelling. The result is a hitch at every seam — a head that was bobbing restarts from standstill every few seconds.</li>
<li><b>Audio has no last frame.</b> A waveform cannot anchor to a still image; there is no single-picture handle for sound to continue from. So the audio has nothing to continue and produces a click, a dropped beat, or a restarted voice at the join. This is worse for H3 specifically, because it generates picture and 32 kHz stereo sound <b>jointly</b> — the seam that breaks the audio is the same seam in the video.</li>
</ul></div>

The structural picture is a **relay handover**. A baton passed at a standing start loses everything the first runner had built up; the receiving runner has to accelerate from zero while the clock keeps running. Real relays solve this with an *exchange zone* — a stretch of track where both runners are moving together at speed before the baton changes hands. The fix for chunked video is the same fix.

## The real fix: an overlap window in latent space

Condition on an **overlap window** — the last second or so of the previous chunk, which is many frames rather than one — and carry it as **latents** rather than decoded pixels.

- **Many frames carry motion.** Across a window, the frame-to-frame change *is* the velocity. The new chunk knows not only where things are but which way they are going, and the stutter disappears.
- **Latents carry richer temporal state than decoded pixels.** The latent for an 832×480 × 124-frame clip has the observed shape `(1, 24, 37, 30, 52)` — 24 channels, 37 temporal slots, and a 30 × 52 spatial grid, which is exactly 480 ÷ 16 by 832 ÷ 16. Handing over a slice of that gives the next chunk the model's own working representation, including the recent state of the audio stream, rather than a flattened picture of it.
- **Crossfade the overlap** so the shared second dissolves from one chunk into the next.

This is what rolling or sliding-window diffusion and history-conditioning do, and it is where the general technique is headed.

## What actually survives the seam — the measured finding

Here is where the theory meets the render logs, and where the surprise is. Chained FL2VA clips were built into a **60-second film** on this box, using the Q4 engine as the default because it renders about twice as fast as the patched int8 path — a choice that matters much more when a minute of video means a dozen separate renders.

The continuity held far better than the pessimistic account above predicts, in every respect except one.

<div class="callout truth"><span class="t">The finding: the scene survives, the person does not</span>
<p>Chaining FL2VA clips <b>holds a scene together well</b>. Layout, palette, lighting and framing carry across the seam convincingly enough that a viewer reads the result as one place.</p>
<p>What it does not hold is <b>identity</b>. A photoreal human face visibly drifts between clips — the same description, the same seed policy, a subtly different person. <b>Stylised characters hold far better</b>, because there is less for the eye to check. Nothing in FL2VA's inputs anchors who the subject is, so nothing is holding the face steady except the words in the prompt.</p></div>

## Why identity is the thing that drifts

The mechanism is worth working through, because it explains both halves of the finding at once — why photoreal faces fail and why stylised ones do not.

**A last frame is a pixel constraint at one instant, not an identity constraint.** It tells the model what the image looked like; it does not tell the model *who that is*. From that starting image plus the text, the next chunk re-derives the person from scratch. The derivation is statistical, so it lands near the same face — near, not on.

**Identity lives in the frequencies that survive least.** The training notes for a face-focused LoRA put the physics plainly: *"skin texture, pores, fine hair live in high spatial frequencies, and at a lower resolution the latents barely carry them."* That is the whole explanation. A recognisable human face is carried by micro-geometry — the exact spacing between eye and brow, the particular asymmetry of a mouth — and those are high-frequency details. The VAE compresses space by a factor of 16 in each direction, so a 480-pixel-tall frame becomes a 30-slot latent grid. High-frequency identity information is precisely what a ÷16 compression discards first.

**A stylised character is defined by low frequencies.** A silhouette, a hair colour, a coat shape, a mask, a palette — large, coarse features that survive compression intact and that a prompt can name exactly. Those are the features chaining preserves. So the same mechanism that loses a real face keeps a cartoon one, and the difference is not about how "hard" the subject is but about which frequency band its identity lives in.

**Errors accumulate.** Each chunk copies the previous chunk's small deviations and adds its own. The picture is a photocopy of a photocopy: the layout of the page survives twenty generations, the fine print does not. An overlap window slows that accumulation; it does not stop it. This is the price of any autoregressive scheme.

## What production actually does instead

While the identity anchor is not in place, there is a cheaper answer that works today, and it is worth knowing because it costs nothing at all: **stop asking one continuous take to be long, and cut instead.**

A long film has never been one continuous shot. It is many short shots on a timeline, and the model's 4-to-15-second range is a perfectly reasonable shot length. Cutting between shots does three useful things at once:

1. **It hides the seam by making it a cut.** A dissolve or a hard cut is a *legitimate* discontinuity. A viewer forgives at an edit point what they would notice inside a take.
2. **It lets identity be re-specified rather than carried.** The same character description, word for word, in every shot's prompt produces the same statistical face — not identical, but consistent enough to read as one person across cuts, because the audience is not comparing adjacent frames.
3. **It makes the shot list parallel.** Independent shots run on independent cards. Three cards render three shots at once with no interconnect traffic at all — throughput, which is the one thing multiple 8 GB cards are unambiguously good at ([ch.37](37-the-production-line.html), [ch.38](38-making-the-movie.html)).

<div class="callout warn"><span class="t">The plumbing detail that will cost an afternoon</span>
<p>Chained conditioning requires the resolution to land on the patch grid. A width of <b>848</b> divides by 16 to give 53 — odd — so the 2×2 patching fails with a shape error that never mentions resolution at all. Use widths where the division by 16 lands even: <b>832 gives 52</b>. This was found the hard way while getting first-frame chaining to line up.</p></div>

## What stays genuinely hard

- **Drift accumulates.** The twentieth chunk is measurably worse than the first — colours shift, the face wanders. An overlap window slows this; nothing removes it.
- **The audio seam is the open problem.** For a model that generates picture and sound jointly, this is the honest limit of chunked long video today. A waveform can be overlap-added or crossfaded across the shared window, but coherence — a beat that stays on tempo, a voice that keeps its timbre — is not guaranteed by any of it.
- **Identity needs the other model.** Everything else in this chapter is technique. That one is a download.

## The trade, stated plainly

| | Single shot | Chunk and chain |
|---|---|---|
| VRAM | grows with frame count | flat — about 5.72 GB per 124-frame chunk at 832×480, at any final length |
| Maximum length | 15 s, set by the model's trained range | effectively unlimited |
| Motion and audio continuity | seamless, made in one pass | seams and drift; audio is the hard part |
| Scene continuity across joins | not applicable | **holds well** |
| Identity across joins | not applicable | **drifts for photoreal faces; holds for stylised ones** |
| Cost | one render | one render per chunk, and step count is set by the scene |

Single-shot wins on coherence and hits a hard fifteen-second ceiling. Chunking wins on length and never OOMs, at the cost of seams, slow drift, and a face that will not stay the same face. Past fifteen seconds there is no third option — on any card.
