# int8 vs Q4 vs fp16 — Three Ways to Store the Same Model

<p class="lede">The same MiniMax-H3 can be stored at three different precisions — native <b>int8</b>, a 4-bit <b>Q4_K_M</b> GGUF, and full-precision <b>bf16/fp16</b> with no quantization at all — and on identical scenes all three produce a picture the eye cannot tell apart. What separates them is not quality. It is speed, memory, and how many pixels each one leaves room for.</p>

That finding was not the one this experiment set out to confirm. It set out to answer "how much does 4-bit cost in image quality?" The answer turned out to be *nothing measurable*, and the interesting question underneath it turned out to be about matrix multiplication, not about bits.

<div class="callout truth"><span class="t">The three contenders in one line</span>
<p><b>bf16</b> = 2 bytes per weight, the precision the model shipped in, ~66 GB for the transformer. <b>int8</b> = 1 byte per weight, the reference build this project ships on, 20 GB after pruning — plus a chunk-patch of ours that freed VRAM. <b>Q4_K_M</b> = half a byte per weight, ~11 GB, an off-the-shelf GGUF that, surprisingly, loads on H3 at all. One model, three levels of squeeze.</p></div>

## What a quantized weight actually is

Before any benchmark makes sense, it helps to know what is physically different in the file.

A weight in the original model is a bf16 number — sixteen bits of floating point, capable of representing a very wide range of magnitudes with a few significant digits. Quantization throws that away and replaces it with a small integer plus a shared **scale**. Instead of storing a number, the file stores an *index into a ladder*, and one scale value per group of weights that says how far apart the rungs are.

The "K_M" in `Q4_K_M` refers to a k-quant scheme: rather than one scale for a whole tensor, the weights are cut into small blocks that each keep their own scale, and the layers known to matter most are given slightly more bits than the rest. That mixed allocation is why a 4-bit file holds up far better than a naive uniform 4-bit round would.

The key intuition is that a weight's absolute precision does not matter. What matters is whether the *rounding error* it introduces survives fifty transformer blocks and dozens of denoise steps, or gets averaged away. Hold that thought — it is the whole conclusion of this chapter.

Every column except the last one leans the same way, and it is the wrong way round from what the names suggest. The *smaller*, *coarser* model rendered *more* pixels in *half* the time using *less* memory.

## The surprise: the smaller model is the faster one

The expectation is that fewer bits means either slower (more unpacking work) or worse (less information). Neither happened. Understanding why is the single most useful thing this experiment produced, and it has nothing to do with quantization theory and everything to do with which kernel actually runs.

<div class="callout warn"><span class="t">Why "int8" is secretly slow on a consumer GPU</span>
<p>The int8 path <b>dequantizes the 8-bit weights back to bf16 and runs a bf16 matrix multiply</b> — it never actually reaches the card's fast INT8 tensor cores. So "int8" pays the shrink cost <em>without</em> collecting the speed reward. On top of that, the memory-saving chunk-patch splits the matmul into row-blocks, adding loop overhead on every linear layer in every one of fifty blocks. <b>Q4-GGUF instead dequantizes to fp16 and runs one standard matmul</b> — the well-trodden, heavily optimised path — so it is roughly 2× faster and also skips the 2.24 GB int8 working buffer, which is why it fits a <em>higher</em> resolution at <em>lower</em> VRAM.</p>
<p>This is not a local quirk: it reproduces a 2026 arXiv result, <em>Native INT8 Compute for Diffusion Transformers on Consumer GPUs</em>, on this machine.</p></div>

There is a real irony here worth naming, because it connects straight back to [ch.04](04-software-stack.html). Ampere — the generation these cards belong to — has genuine int8 tensor-core hardware. It is one of the few things the silicon does exceptionally well. And the "int8" software path never calls it. The format name on the file describes how the weights are *stored*, not how they are *multiplied*, and those are two independent decisions. A format only pays off when the kernel that consumes it is written for the hardware in the machine.

## File size is a bandwidth number, not just a capacity number

There is a second reason the smaller model is faster, and it is easy to miss because it lives outside the GPU.

None of these models fit in 8 GB of VRAM. They are streamed: one transformer block is copied in, used, and evicted, fifty times per denoise step ([ch.07](07-optimization-720p.html)). So the size of the file on disk is also the amount of data crossing the bus *every step*.

Fifty blocks at about 0.4 GB each is 20 GB per step. A 23-step render therefore drags roughly **460 GB** across the bus. That is not a rounding error in the wall-clock; on a machine whose model does not fit, the file size *is* a running cost, paid once per step, forever.

This reframes the whole comparison. Q4 was not faster because 4-bit arithmetic is fast — the arithmetic happens in fp16 either way. Q4 was faster because there was less of it to carry, and because what did arrive went through a better-optimised kernel.

## Adding the third contender: fp16, the top of the ladder

The int8-versus-Q4 test left one question hanging: what does the model look like with *no* quantization at all? Later an `H3_F16` toggle was wired in — plain bf16 weights, zero quant — and the same kind of shot was run. This is the highest precision the model ships in. If precision were a quality dial, this is where it maxes out.

<div class="callout truth"><span class="t">fp16 measured: same picture, heavier and slower</span>
<p>The bf16 render came out <b>indistinguishable from int8</b> — same face, same detail, nothing the eye could find. What it cost was entirely real: each transformer block is <b>~1.29 GB in bf16 against ~0.65 GB in int8</b>, and the whole transformer is <b>~66 GB against ~33 GB</b> — so it offloads twice as much from RAM on every step and renders <em>slower</em>, for <b>zero visible gain</b>. The best-precision option was, in practice, the worst choice available.</p></div>

That result is what turns two data points into a shape. int8 versus Q4 alone could be read as "4-bit happens to be good enough." Adding bf16 at the other end shows something stronger: quality did not improve going *up* either.

<div class="callout warn"><span class="t">Why more bits do not buy quality</span>
<p>Two reasons, and both are properties of <em>diffusion</em> rather than of quantization.</p>
<p><b>Diffusion self-corrects.</b> The image is refined over dozens of denoise steps, each one asking the same question again of a slightly cleaner input. A tiny rounding error in one step's weights nudges the trajectory a little; the next step, looking at where the latent actually is, corrects toward the same destination. Errors that are small and roughly unbiased get averaged out rather than accumulated. This is exactly why a language model — which commits to a token and can never revisit it — is far more sensitive to quantization than a diffusion model is.</p>
<p><b>The output is far coarser than the weights.</b> The fourth decimal place of a bf16 weight has to survive fifty blocks and then be squeezed through a VAE that compresses space 16-fold, before landing in an 8-bit pixel. It does not arrive. Precision above int8 is memory spent on detail that has nowhere to go.</p></div>

## Where the first verdict was too generous

The first version of this chapter reported a quality score of "84 vs 87" and called it a Q4 win. That was wrong, and the way it was wrong is instructive.

<div class="callout spec"><span class="t">Read each axis separately — this is the honest part</span>
<p><b>Speed:</b> Q4 wins, decisively and for real. It was faster <em>despite</em> rendering 47% more pixels.<br/>
<b>VRAM and resolution:</b> Q4 wins — more native pixels at lower peak memory.<br/>
<b>Quality:</b> a <b>TIE</b>, not a Q4 win. A three-point gap on an eyeball scale is inside the noise, and it was <em>confounded</em>: the two clips ran at different native resolutions and are different generated images. If anything, <b>int8 is the higher-fidelity reference</b> — it is bit-identical to raw int8 — and Q4 <em>matches</em> it rather than beating it.</p></div>

The failure was not the measurement. It was comparing two runs that differed in more than one variable and then attributing the difference to the variable under study. The resolution advantage that made Q4 interesting is the same resolution advantage that made its quality number unreadable.

<div class="callout warn"><span class="t">Do not over-read any of this</span>
<p><b>n = 1 scene, one seed.</b> A strong signal, not a proven verdict across crowds, fast motion, or other subjects. The "2× faster" is against the <em>patched</em> int8 specifically — raw int8 would be quicker but hungrier for VRAM. And "quality" here is a human eyeball, not PSNR or LPIPS. Everything above is worth acting on and not worth defending as a law.</p></div>

## So which one gets used

<table>
<tr><th>Goal</th><th>Pick</th><th>Why</th></tr>
<tr><td>A no-quant reference to compare against</td><td><b>fp16 / bf16</b></td><td>The top of the ladder — but double the VRAM and double the offload traffic for a quality <em>tie</em>. Rarely worth it outside a controlled comparison.</td></tr>
<tr><td>Everyday rendering, batches, the films</td><td><b>Q4_K_M</b></td><td>Fastest, fits higher native resolution, quality indistinguishable.</td></tr>
<tr><td>Balanced default — the production line</td><td><b>int8</b></td><td>A hair more fidelity headroom than Q4, still fits, and it is what the films actually shipped on.</td></tr>
<tr><td>Understanding the machine</td><td><b>all three</b></td><td>The int8 patch <em>found</em> the bottleneck, Q4 was the better path it revealed, and fp16 proved precision was never the lever.</td></tr>
</table>

int8 remained the production default despite losing on speed, and that is a deliberate choice rather than an oversight. It is the format the model officially ships in, it is bit-identical to the reference, and the rest of the pipeline — the sharding, the offloading, the decode fixes — was built and debugged against it. Swapping the weight format underneath a stack that has been tuned around it is the kind of change that trades a known cost for an unknown one.

## The takeaway

<div class="callout truth"><span class="t">Precision is a plateau, not a dial</span>
<p><b>All three precisions look the same — so choose by speed and VRAM, never by "quality."</b> Q4 is the fastest and lightest, int8 the balanced middle the films shipped on, fp16 the heaviest with nothing to show for it. The fight picked early on — sweating Q4 against int8 as though fidelity hung on it — turned out to be a fight that did not matter. That is not wasted work; that <em>is</em> the finding, and it took three measured runs to earn it.</p>
<p>The effort belongs elsewhere: in framing, resolution and the finishing line ([ch.17](17-what-actually-improves-quality.html)). And the VRAM belongs to capacity, not to bits — every gigabyte not spent on precision is a gigabyte available for pixels and frames, which are the things that <em>do</em> move quality ([ch.39](39-choosing-the-next-card.html)).</p></div>

Two threads run out of this chapter. The number formats themselves — what bf16, fp8, int8 and fp4 actually encode, and which silicon implements which — are laid out in [ch.18](18-number-formats-precision.html). The 2.24 GB int32 buffer and the row-blocking that removed it are derived in full, with the proof that the result is bit-identical, in [ch.14](14-the-math-behind-it.html).
