# Anatomy of H3

<p class="lede">Inside MiniMax-H3 are <b>four separate files</b>: a 26 GB model that reads the prompt, a 20 GB model that generates, and two small translators that convert between pixels, sound and the compressed form everything in the middle actually works on. The generator itself is not a monolith — it is <b>fifty identical blocks of roughly 395 million parameters each</b>, and that number can be derived from a config file, checked against the size on disk, and watched going past in a render log.</p>

This chapter does the counting. Not estimates — every figure here either comes straight out of `transformer/config.json` and the VAE configs on this machine, or is multiplication performed on those figures in front of the reader.

## What arrives when you download it

Four directories. The first surprise is which one is biggest.

<table>
<tr><th>Part</th><th>What it does</th><th>On disk</th></tr>
<tr><td><b>Text/vision encoder</b><br/>Qwen3-VL-32B, tapped at layer 50</td><td>Reads the prompt and any reference images, and turns them into a representation of meaning</td><td><b>26 GB</b></td></tr>
<tr><td><b>Omni-transformer (DiT)</b><br/>int8, pruned</td><td>The generator. Denoises the joint video-plus-audio latent, once per sampling step</td><td><b>20 GB</b></td></tr>
<tr><td><b>Visual VAE</b></td><td>Converts between real pixels and the 24-channel latent — ÷16 in space, roughly ÷4 in time</td><td>4.9 GB</td></tr>
<tr><td><b>Audio VAE</b></td><td>The same for sound: 32 kHz stereo to and from a 32-channel latent</td><td>0.6 GB</td></tr>
</table>

The part that *reads the sentence* is larger than the part that *makes the video*. Twenty-six gigabytes against twenty. That ratio is not sloppiness; it is the central design decision in the whole system, and everything about how the pipeline is structured follows from it.

<div class="callout truth"><span class="t">H3 is not one model — it is two brains and two translators</span>
<p>The headline says "33 B". What is actually on disk is a <b>32-billion-parameter vision-language model</b> wired to a video generator of comparable scale, plus 5.5 GB of codecs. It is closer to two systems in a trench coat than to one large network, and the practical consequence is severe: on hardware this size, <b>the reader and the generator can never be in memory at the same time.</b></p></div>

### An honest note on the encoder's size

A 32-billion-parameter model at two bytes per parameter would be about 64 GB. The encoder directory here is 26 GB. Something has been left out or compressed — the obvious candidate being the layers past the tap point, which are never executed and therefore never need to exist. We did not audit the file to confirm which, so treat 26 GB as the measured fact and the reason as inference.

## Why a 32 B model just to read a sentence

The instinct is that reading is the easy half. It is not, and the reason is worth stating carefully.

Consider what a real prompt has to carry: *"a lone figure walks away down a rain-slick neon street, camera following gently."* For a generator to obey that, something must already know that rain-slick implies reflections, that neon implies coloured light spilling onto wet ground, that *walks away* fixes the camera behind the subject, that *gently* rules out handheld shake. None of that is in the words. It is in the understanding of the words.

<div class="callout spec"><span class="t">The director and the crew</span>
<p>The encoder is the <b>director</b>; the transformer is the <b>crew</b>. The director reads the script, understands the whole intention — mood, blocking, camera, the reference photographs — and turns it into a precise brief. The crew executes that brief, frame by frame, with enormous technical skill and no independent judgement about what the film means.</p>
<p><b>A poor director produces a poor film regardless of the crew.</b> So H3 hires a director who could hold a conversation on their own, and uses that intelligence purely as a comprehension engine. The picture only obeys nuance that the reader grasped first.</p></div>

And it does not take the director's *conclusion*. H3 reaches inside the encoder and taps the hidden states at **layer 50**, discarding whatever the model would have gone on to say. A language model's last layer is specialised for its own task — predicting the next word. Its middle layers hold something more useful to an outsider: a general representation of meaning, before it is narrowed toward producing text.

That tap point is a hard interface. Change the encoder, or tap a different layer, and the numbers arriving at the generator are meaningless to it.

## The two phases — forced by two numbers

Twenty-six plus twenty is forty-six gigabytes of weights. The whole machine has 24 GB of VRAM across three cards and 125 GB of system RAM, and the render also needs room for latents, activations and the CUDA context. So the two are never allowed to meet.

There is a pleasant side effect. Because the conditioning is written to a file, prompt understanding becomes **reusable**: encode a scene once and it can be re-rendered at any resolution, step count or seed without paying the 26 GB encoder again. The architecture built around this is [ch.48](48-the-pipeline-without-comfyui.html).

Everything below is read from `transformer/config.json` on this machine.

<div class="callout spec"><span class="t">Every field, and what it governs</span>

Three of these interlock in ways that show up as observable behaviour, so they get their own sections.

## `patch_size: [1, 2, 2]` — how a video becomes a sequence

A transformer does not consume grids. It consumes a **sequence of tokens**, and something has to turn a five-dimensional stack of latent numbers into that sequence. `patch_size` is that something.

Take the latent measured off disk from a crashed 832×480, 124-frame render: shape `(1, 24, 37, 30, 52)` — one clip, 24 channels, 37 latent frames, 30 tall, 52 wide. Group it into patches of 1 frame × 2 × 2 and the grid collapses:

Fourteen thousand four hundred and thirty tokens. That number is the single most important quantity in this entire guide, because attention relates every token to every other one: **14,430 × 14,430 ≈ 208 million pairs**, computed 56 times over — once per head — in every block, in every step.

### The token budget — the one table that explains the whole project

Two shapes were read straight off saved latents on this machine:

```
1280x704 x 345 frames  ->  (1, 24, 102, 44, 80)
 832x480  x 124 frames  ->  (1, 24,  37, 30, 52)
```

From those, the rule for any configuration:

```
tokens = (W / 32) x (H / 32) x latent_frames
latent_frames ~= round(frames / 3.4)        124 -> 37,  345 -> 102   (both measured)
```

The `/32` is the VAE's 16x spatial compression followed by the model's 2x2 patching.

That last column is the entire story of this project.

**720p at 5 seconds fits.** **480p at 15 seconds fits**, with nothing to spare — 39,780 tokens is the largest sequence ever rendered on a single card here. **720p at 15 seconds is 2.26× over**, and no setting closes that gap: not quantization, not chunking, not offloading. Those shrink weights and scratch buffers. The activation belonging to 89,760 tokens has to exist, all at once, for the whole step.

So the choice on one card was always **resolution or duration, never both**.

<div class="callout truth"><span class="t">What three cards actually change</span>
<table>
<tr><th></th><th>Tokens held per card</th><th>Under the ~39,780 ceiling?</th></tr>
<tr><td>One card, whole sequence</td><td>89,760</td><td>❌ no</td></tr>
<tr><td>Three cards, sequence ÷ 3</td><td><b>29,920</b></td><td>✅ yes, comfortably</td></tr>
</table>
<p>Nothing was made smaller. The sequence was <b>divided</b>. Each card owns a third of the tokens and runs every per-token operation locally; only attention needs every token to see every other one, and for that the cards pass slices around a ring (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>).</p>
<p><b>"8 GB" stopped meaning <em>per render</em> and started meaning <em>per device</em>.</b> That one reframing is what produced a 14.375-second native 720p clip on hardware that could not hold it.</p></div>

<div class="callout warn"><span class="t">And the bill for dividing it</span>
<p>2.26× the tokens should cost about <b>5×</b> the time under quadratic attention. Measured: <b>35×</b> — 193 s/step at 832×480×345 against 6,849 s/step at 1280×704×345. The extra ~7× is what the division itself costs: ring traffic for every attention layer, three processes each streaming weights, and synchronisation between cards. Capability was bought with speed.</p></div>

<div class="callout truth"><span class="t">The arithmetic predicts the measured cost</span>
<p>Run the same patch arithmetic at 1280×704: 1280 ÷ 16 = 80 and 704 ÷ 16 = 44, halve both for the 2×2 patch, and each latent frame yields 40 × 22 = <b>880 tokens</b> against 390 at 832×480. That is <b>2.26×</b> the sequence — exactly the ratio measured on the sharded 15-second path.</p>
<p>Squaring it for attention gives ~5× the pair count. The measured wall-clock difference between those two renders was <b>34×</b>. So roughly <b>7× beyond what the mathematics accounts for</b> is pure overhead in the three-GPU path (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>) — not the model being expensive, but our way of splitting it. That gap is only visible <em>because</em> the token count can be derived from a config file.</p></div>

Audio rides alongside with its own 32 channels, joining the same sequence and passing through the same 50 blocks. That is what "omni-modal" means concretely: not two models glued together, but one stack carrying picture and sound in a single sequence, which is why the voice and the lips are born synchronised rather than aligned afterwards.

## Inside one block — where all 20 GB lives

Fifty blocks, and they are the same shape. Understand one and the model is understood.

A block does three things to the token sequence: modulate it by the current noise level, let every token look at every other token, then push each token through a wide feed-forward path. Each of those has weights, and the weights can be counted exactly.

### The count, line by line

<table>
<tr><th>Component</th><th>Arithmetic</th><th>Parameters</th></tr>
<tr><td>Attention — Q, K, V and output projections</td><td>4 × 5376 × 7168</td><td>154,140,672</td></tr>
<tr><td>Feed-forward — up and down</td><td>2 × 5376 × 14336</td><td>154,140,672</td></tr>
<tr><td>Adaptive-norm modulation</td><td>2688 × 6 × 5376</td><td>86,704,128</td></tr>
<tr><td><b>One block</b></td><td></td><td><b>394,985,472 ≈ 395 M</b></td></tr>
<tr><td><b>All fifty</b></td><td>395 M × 50</td><td><b>≈ 19.75 billion</b></td></tr>
</table>

Twenty billion parameters at one byte each — which is exactly what int8 gives — is **20 GB**, the size of the file on disk. **The arithmetic closes.** Nothing is hand-waved: a config file, four multiplications, and the number matches `ls -l`.

### What the count reveals about the design

Three things fall out of that table that would be invisible from a description.

**Attention and the feed-forward cost exactly the same.** 154.1 M each, to the digit. That is not a coincidence; `ffn_dim` 14336 is precisely twice the attention width of 7168, which makes the two paths balance. Whoever configured this model chose that deliberately.

**Attention runs wider than the residual stream.** The tokens are 5,376 numbers wide, but attention projects them up to 7,168 (56 heads × 128) before mixing and back down after. The model spends parameters buying itself more room to think in, specifically at the moment when tokens are allowed to see each other.

**The noise level gets 87 million parameters of its own, per block.** `time_embed_dim` 2688 is exactly half of `hidden_size` 5376, and it fans out into six vectors of width 5376 — shift, scale and gate for the attention sub-layer, and the same three for the feed-forward. That is what a DiT-style adaptive norm needs, and the multiplication confirms it: 2688 × 32,256 = 86,704,128. Which means **"how noisy is this latent right now" is not a small side input.** It reconfigures every block, and it is why the same weights behave like a composition engine at step 1 and a texture engine at step 20.

<div class="callout truth"><span class="t">What 395 M per block means for every render</span>
<p>Twenty billion parameters spread over 50 blocks is roughly <b>0.4 GB per block</b>. That is the slice copied from system RAM into VRAM for every block, of every step.</p>
<p>One step reads all 50 — the entire 20 GB model. A 23-step render therefore drags about <b>460 GB</b> across the PCIe bus: the whole model, fetched from scratch, twenty-three times over, while the card never holds more than 0.4 GB of it at once (<a href="19-what-a-model-is.html">ch.19</a>).</p></div>

### The gap between 20 billion and 33 billion

H3 is published as a 33-billion-parameter model, and the bf16 transformer file is about **66 GB** — which is 33 billion at two bytes each, so that number is internally consistent. The int8 file we run is **20 GB**, and the config describes a block stack of about 20 billion parameters.

Those two facts do not reconcile by quantization alone. Requantizing 33 B from bf16 to int8 would give 33 GB, not 20. The file is labelled **int8 and pruned**, so roughly a third of the parameters are simply not present in the build on this disk. Which parameters were removed, and what that costs in quality, is not something we measured. What we can say precisely is: **what streams across PCIe on every step is the 50-block stack, and that stack is ~20 GB.**

## The VAEs — and why their configs must match the transformer's

The two translators are small, run once at the end, and are the least glamorous part of the system. They are also where two of the most expensive failures in this project happened.

<div class="callout spec"><span class="t">The VAE configs, and the interlock</span>
<table>
<tr><th>Field</th><th>Value</th><th>Consequence</th></tr>
<tr><td>video <code>latent_channels</code></td><td><b>24</b></td><td>identical to the transformer's <code>in_channels</code> — the interface between them</td></tr>
<tr><td>audio <code>latent_channels</code></td><td><b>32</b></td><td>identical to <code>audio_in_channels</code></td></tr>
<tr><td>spatial compression</td><td><b>÷16</b></td><td>1280 → 80 latent cells wide; 832 → 52; 848 → 53, and 53 is odd</td></tr>
<tr><td><code>clip_length</code></td><td>17</td><td>decoding happens in temporal chunks, not all at once</td></tr>
<tr><td><code>token_drop</code></td><td>3</td><td>overlap discarded between chunks to keep the seam invisible</td></tr>
<tr><td>tiling</td><td><b>on by default</b>, 256×256 with 64 px overlap</td><td>each frame is decoded in overlapping tiles so a full frame never has to fit in VRAM</td></tr>
</table>
<p>The channel counts matching exactly is the point. The VAE's output <em>is</em> the transformer's input; there is no adapter between them. Swap in a VAE with a different <code>latent_channels</code> and nothing lines up.</p></div>

The temporal side is where the numbers stop being tidy: 124 real frames became **37 latent frames** in the measured latent, a little under 4× compression, with the exact mapping set by that `clip_length` 17 and `token_drop` 3 chunking rather than by a clean divisor.

<div class="callout danger"><span class="t">The rule those two failures wrote</span>
<p>A cheap stage must never be able to destroy an expensive one. Denoise costs hours; decode costs minutes. For one night, a bug in the minutes-long stage could delete the hours-long one — and did, twice, in slightly different ways (<a href="46-the-first-15-seconds.html">ch.46</a>).</p>
<p>Two related traps sit in the same neighbourhood: <code>VAEDecodeTiled</code> is incompatible with H3 because its latent is a NestedTensor, and <code>use_stream=True</code> on offloading pins tens of gigabytes until the kernel kills the process with no traceback at all.</p></div>

## Two transformer variants, and the one that matters for faces

H3 ships the generator in two versions. They take different inputs, which means they are different 20 GB downloads — not a toggle.

<table>
<tr><th>Variant</th><th>Takes in</th><th>Good for</th></tr>
<tr><td><b>FL2VA</b> — the one this project runs</td><td>Text, plus optionally a first and/or last frame image</td><td>Text-to-video, image-to-video, chaining clips by their end frames</td></tr>
<tr><td><b>Ref2VA</b></td><td>Multiple reference images (up to 9), reference audio, even reference video</td><td>Locking a specific character's appearance; generating video to fit an existing audio track</td></tr>
</table>

<div class="callout warn"><span class="t">Why the identity drift in long clips is an anatomy problem</span>
<p>Chaining FL2VA clips holds a <em>scene</em> together well — but a photoreal human face visibly drifts between clips, because nothing in FL2VA's inputs anchors identity. Stylised characters hold far better, since there is less for the eye to check. The anchor that would fix it is exactly what Ref2VA provides, and it cannot be reached from FL2VA by changing parameters. The encoder and both VAEs are shared, so the marginal cost is one more 20 GB file (<a href="33-long-video-small-card.html">ch.33</a>).</p></div>

## What it costs to hold, to run, and to make

<div class="callout truth"><span class="t">The three costs, honestly separated</span>
<ul>
<li><b>To hold it:</b> about 51.5 GB of disk for all four parts as we run them, against 879 GB of disk with 585 GB free. Storage is the one resource this build has in comfortable surplus.</li>
<li><b>To run it:</b> three cards at a 200 W limit each, for as long as the render takes. The measured <code>an1</code> render — 1280×704, 124 frames, 23 steps — took <b>55 minutes</b>. That is the entire marginal cost of a clip: some hours of a machine already owned.</li>
<li><b>To make it:</b> a datacentre, and money we do not have a figure for. Paid once, by MiniMax, and then given away as a file anyone can download.</li>
</ul>
<p>The asymmetry is the whole reason this project is possible. The expensive half is already paid. What remains is a logistics problem on hardware that was never intended for it.</p></div>

<div class="callout truth"><span class="t">The takeaways</span>
<ol>
<li><b>Four files, two of them large:</b> a 26 GB reader and a 20 GB generator, with 5.5 GB of translators. The reader being bigger is deliberate.</li>
<li><b>The two large parts never coexist</b> — encode in one process, write conditioning to disk, exit, then generate in another. That split is what makes 46 GB of weights runnable on 24 GB of VRAM.</li>
<li><b>The generator is 50 copies of one shape</b>, ~395 M parameters each: 154 M attention, 154 M feed-forward, 87 M for the noise-level modulation.</li>
<li><b>The arithmetic closes.</b> 395 M × 50 ≈ 20 B, at one byte per parameter under int8, is the 20 GB file — and it also predicts the 2.26× token ratio measured on the 720p path.</li>
<li><b>The configs interlock.</b> 24 video channels and 32 audio channels appear identically in the VAE and the transformer; ÷16 spatial compression is what makes 848 pixels fail and 832 work.</li>
</ol></div>
