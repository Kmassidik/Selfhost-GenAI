# From 2017 CV to Modern GenAI

<p class="lede">The distance between a 2017 computer-vision practitioner and a 2026 generative-AI one is four additive ideas — attention, diffusion, latent diffusion, and text-to-image alignment — sitting on top of a foundation that did not change at all. Nothing learned in the Haar-cascade and bounding-box era was invalidated. A wing was added to the house; the frame is the same frame.</p>

That claim is worth testing rather than taking on faith, so this chapter does two things: it names precisely what carried over, and it names precisely what is new — with the new parts grounded in the actual configuration of the model this guide runs.

## The foundation that did not move

Start with the unglamorous half, because it is the larger half.

<div class="callout truth"><span class="t">A 2017 skill set, mapped onto 2026</span>
<table>
<tr><th>The 2017 skill</th><th>Where it lives now</th></tr>
<tr><td><b>Backpropagation</b></td><td>Completely unchanged. It trained the 20-billion-parameter transformer in H3, it trained the 26 GB encoder, and it trained both VAEs. Still the engine of everything.</td></tr>
<tr><td><b>Convolutional networks</b></td><td><b>The VAE is a CNN.</b> The part of H3 that turns a latent grid back into pixels is a convolutional decoder, with residual connections and normalisation that would look entirely familiar. It is 4.9 GB of the model and it is <em>not</em> new territory.</td></tr>
<tr><td><b>Haar → hand-crafted features → learned features</b></td><td>The same arc, continued one step further. Transformers simply learn even more general features, with even less structure imposed by hand. "Less hand-engineering, more learned-from-data" is the entire history of the field in one line.</td></tr>
<tr><td><b>Bounding-box detection</b><br/>(image → class + rectangle)</td><td><b>Discriminative</b> work: <em>what is in this image?</em> Generative work flips the arrow: <em>make an image that has this in it.</em> Same gradients, same optimisers, opposite direction.</td></tr>
<tr><td><b>Building datasets by hand</b></td><td>The most underrated skill of 2026. Foundation models are overwhelmingly a story about data quality and scale, and anyone who has personally labelled a dataset already respects the part most newcomers skip.</td></tr>
<tr><td><b>Overfitting, augmentation, train/val discipline</b></td><td>Identical. The scale changed; the failure modes did not.</td></tr>
</table></div>

The intuitions that take years to build — what a gradient actually does, why a loss curve looks the way it does, why the data is usually the problem — transfer whole. What is missing is a small, learnable, *additive* set of ideas.

## The fork

The year matters. "Attention Is All You Need" was published in **2017**, the same period when the practical centre of computer vision was detection: Faster R-CNN, YOLO, SSD. Two tracks ran forward from that point and only one of them made the news.

## The one conceptual flip

Before the four ideas, there is a single change of orientation that makes all four easier, and it can be stated in one line.

A detector estimates the probability of a **label given the data**. A generator estimates the probability of the **data given a label**. Same networks, same backprop, same hardware; the ends of the arrow swap places.

The practical consequence of the flip is a change of loss function that surprises people. A detector's loss is a classification objective over a small set of categories. A diffusion model's loss is **mean squared error on a predicted noise field** — a regression, of exactly the kind used for bounding-box coordinate refinement in 2016. The thing that generates photorealistic video is trained with an older, simpler loss than the thing that draws rectangles.

<div class="callout truth"><span class="t">Why generative is the harder problem</span>
<p>A detector only has to learn <em>the boundary</em> between categories. A generator has to learn <em>the whole distribution</em> — everything that a plausible frame could look like — well enough to draw a new sample from it. That is much more to represent, which is why generative models are so much larger and so much slower than the classifiers that came before. H3's transformer alone is <b>20 billion parameters</b>, and its original bf16 weights were about <b>66 GB</b> before quantization brought them down to 20 (<a href="01-what-is-genai.html">ch.01</a>).</p></div>

## Idea 1 · Attention, and what it gave up to get global reach

This is the big one, and it is worth understanding as an engineering trade rather than a magic trick.

A convolution has **locality baked in**. A 3×3 kernel can only see three cells at a time, and that assumption — *what matters is nearby* — is exactly right for images and is the reason CNNs were so data-efficient. The cost is reach. Context arrives only through depth: stack layers and the receptive field grows, one ring at a time.

Attention makes the opposite bet. It assumes nothing about what is near what, and instead compares **every element with every other element** in a single layer, learning how much each one should weigh the others. Global context is available immediately. The price is that the number of pairs grows with the square of the sequence length.

That trade is not academic here. It is the reason the whole later half of this guide exists: splitting the sequence across three cards, streaming weights from RAM, choosing resolutions carefully. All of it is downstream of *attention compares every pair*.

<div class="callout spec"><span class="t">A transformer, in the concrete — H3's own config</span>
<p>Abstractions land better with real numbers attached. The generator in this project is a stack of <b>50 identical blocks</b>. Inside each block: attention with <b>56 heads</b> of <b>128</b> dimensions each, operating on token vectors of width <b>5376</b>, followed by a feed-forward network that expands 5376 → <b>14336</b> → 5376. Nothing else. Fifty copies of that, plus normalisation, is the entire architecture (<a href="03-how-h3-works.html">ch.03</a>).</p>
<p>It is genuinely simpler than a modern detection head. The complexity is in the scale, not the design.</p></div>

**Where to start:** Jay Alammar's *The Illustrated Transformer* for the picture, Andrej Karpathy's *Let's build GPT* for the code, and the original *Attention Is All You Need* (2017) once the shape is familiar. For anyone who already thinks in gradients, Karpathy's *Neural Networks: Zero to Hero* series is close to ideal — it rebuilds backprop and then transformers from scratch, in code.

## Idea 2 · Diffusion, or: training a network to undo damage

The generative half of the field spent 2014–2019 on **GANs** — a generator and a critic trained in opposition. Sharp results, notoriously unstable training, and hard to steer with text. Around 2020, diffusion displaced them almost completely, and the reason is worth appreciating: diffusion replaced an *adversarial* objective with a *supervised* one.

The training recipe is almost embarrassingly simple:

1. Take a real image. Add a known amount of random static.
2. Show the network the damaged image and the amount of damage.
3. Ask it to predict the static that was added.
4. Mean squared error against the static that actually was added. Backprop.

There is no critic, no minimax game, no mode collapse. It is ordinary supervised regression, on a target that is free to generate — which is why it trains stably at scale where GANs did not.

Generation then runs the recipe backwards: start from static the network has never seen, ask what part of it is noise, remove a fraction, repeat. Because the network learned a *direction* rather than any particular image, following that direction from novel static arrives somewhere plausible that never existed ([ch.01](01-what-is-genai.html), [ch.08](08-how-a-prompt-becomes-video.html)).

<div class="callout warn"><span class="t">The intuition that trips people who know regression well</span>
<p>The obvious question from a supervised-learning background: if the network is only trained to reconstruct, why does it not simply reproduce training images? Because the starting point is different every time. A fixed <code>seed</code> reproduces a result exactly — same static, same trajectory, same output — which is the clearest demonstration that the only randomness in the whole process was at the start.</p></div>

**Where to start:** Lilian Weng's *What are Diffusion Models?* is the best single survey; the DDPM paper (Ho et al., 2020) is the primary source.

---

## Idea 3 · Latent diffusion — where the old CNN skills reappear

Diffusion on raw pixels is ruinously expensive, and this is where the 2017 toolkit walks back onto the stage.

The fix, from Rombach et al. (2022), is to train an autoencoder that compresses images into a small latent grid, run the entire diffusion process *in that grid*, and decode only at the very end. That autoencoder is a **VAE**, and a VAE is a convolutional network — encoder down, decoder up, residual blocks in between. Anyone who has built a segmentation U-Net has built most of one.

In H3 the numbers are these: the visual VAE compresses **16× in each spatial dimension** and roughly 4× in time, into **24 latent channels**. An 832×480 clip of 124 frames becomes a tensor of shape `(1, 24, 37, 30, 52)` — about 1.4 million numbers where the pixels were about 149 million. The decoder that reverses this is 4.9 GB, works in 256×256 tiles with a 64-pixel overlap, and is the only part of the pipeline that ever touches a pixel.

<div class="callout truth"><span class="t">The division of labour, stated plainly</span>
<p><b>The convolutional part handles perception.</b> Turning light into a compact code and back is a local, texture-level job, and convolutions are extremely good at it — good enough that this component has barely changed in character since 2017.</p>
<p><b>The attention part handles composition.</b> Deciding that the figure in frame 1 is the same figure in frame 124, and that the mouth shape matches the sound at that instant, is a long-range relational job, and that is precisely what convolutions were bad at.</p>
<p>Latent diffusion is not one idea beating another. It is two architectures each doing what it is best at, in series.</p></div>

**Where to start:** the Latent Diffusion paper (Rombach et al., 2022), then the HuggingFace `diffusers` introduction notebook — which is the fastest way to get hands on the loop rather than reading about it.

---

## Idea 4 · Alignment — how words got a grip on pixels

The last gap is the one that looks most like magic: how does *"a woman singing"* become something a pixel generator can obey?

The answer is **contrastive training**, and CLIP (2021) is the canonical version. Train two encoders — one for images, one for text — on an enormous set of image-caption pairs, with an objective that pulls matching pairs together in a shared space and pushes non-matching pairs apart. What emerges is a space where the text vector for "a golden retriever on a beach" sits near the image vectors of golden retrievers on beaches. Once that space exists, a text vector is a usable steering signal.

H3 goes considerably further than CLIP. Instead of a purpose-built text encoder it uses a full **32-billion-parameter vision-language model**, Qwen3-VL-32B, at **26 GB** — the largest single file in the system, larger than the generator it steers. And it does not use that model's final output; it reaches in and taps the hidden states at **layer 50**, on the reasoning that a language model's last layer is specialised for predicting words while its middle layers hold a more general representation of meaning ([ch.03](03-how-h3-works.html)).

<div class="callout spec"><span class="t">The detail that reframes the whole field</span>
<p>Twenty-six gigabytes of the model exist to <em>read the prompt</em>. Twenty gigabytes exist to <em>make the video</em>. More capacity is spent on comprehension than on generation — which is a fair summary of what changed between 2017 and now. The hard problem was never drawing; it was understanding what to draw.</p></div>

**Where to start:** the CLIP paper (2021), or any illustrated explainer of it. The contrastive objective is a half-page of maths and worth reading in the original.

---

## The bonus idea: flow matching

<div class="callout spec"><span class="t">H3-specific, and safe to defer</span>
<p>H3 is a <b>flow-matching</b> (rectified flow) model — the 2022–2023 evolution of diffusion. Rather than learning to reverse a noising process one noisy step at a time, it learns a <em>velocity field</em>: at any point between noise and data, which direction and how fast. The trajectories are straighter, which means fewer steps are needed to traverse them.</p>
<p>Practically, it changes what the network predicts and what the scheduler does with the prediction. It does not change the shape of the loop, the cost model, or anything else in this guide. Skim it after the four ideas above.</p></div>

## What is genuinely new, and is not in any paper

There is a second gap, smaller but less discussed, and this guide is largely a record of crossing it.

In 2017, running a model was the easy part. Training was where the difficulty and the hardware budget went; inference was a forward pass on a card that comfortably held the weights. That relationship has inverted for anyone outside a large lab. Nobody with consumer hardware is training a 20-billion-parameter video model. **Running one is now the hard, interesting, and entirely attackable problem.**

<div class="callout spec"><span class="t">The skills that did not exist as skills in 2017</span>
<table>
<tr><th>Skill</th><th>Why it exists now</th></tr>
<tr><td><b>Quantization</b></td><td>The weights do not fit. int8 took H3's transformer from ~66 GB to 20 GB with quality intact (<a href="13-int8-vs-q4.html">ch.13</a>).</td></tr>
<tr><td><b>Weight offloading</b></td><td>Even 20 GB does not fit. Blocks live in system RAM and are streamed in one at a time — about 0.4 GB per block, which means a 23-step render moves roughly <b>460 GB</b> across PCIe (<a href="02-your-hardware.html">ch.02</a>).</td></tr>
<tr><td><b>Sequence parallelism</b></td><td>A long clip's attention sequence does not fit on one card, so the sequence itself is split across cards (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>).</td></tr>
<tr><td><b>Scheduling and process discipline</b></td><td>The 26 GB encoder and the 20 GB generator are never resident at the same time; the encoder writes its output and exits (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>).</td></tr>
<tr><td><b>Reading a failure honestly</b></td><td>Some of the most expensive lessons here were bugs that looked like hardware limits — including a decode that ran out of memory because finished results were never moved off the GPU (<a href="46-the-first-15-seconds.html">ch.46</a>).</td></tr>
</table></div>

None of these appear in the four papers above. They are systems engineering, and they reward exactly the temperament that builds a dataset by hand: patience, instrumentation, and a refusal to accept a number without measuring it.

## The honest reframe

<div class="callout truth"><span class="t">The foundation was the hard part, and it was already done</span>
<p>Someone who trained a detector from scratch and built their own dataset understands <b>the machine</b>. Someone who learned the field in 2026 through an API understands <b>the interface</b>. Those are not the same thing, and the first one is far harder to acquire late.</p>
<p>The field did not leave anyone behind; it added a wing to a house whose frame was already sound. Four ideas, a few weeks each, and the papers stop being opaque. The measurements in the rest of this guide are the proof that the crossing is finishable — every number in it was produced by someone doing exactly this, on three consumer graphics cards.</p></div>
