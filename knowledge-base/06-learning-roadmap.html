# Your Learning Roadmap

<p class="lede">The route from "I got a model to run" to "I understand it and can build my own pipeline" has <b>five stages</b>, and each one ends with a checkpoint that can be tested rather than felt. This chapter lays them out, maps every other chapter of this guide onto them, and — because it is the oldest chapter here — shows the three places where its own original advice turned out to be wrong.</p>

That last part is the useful bit. This roadmap was written on day one, when the box had a single 8 GB card and the engine was ComfyUI. Both of those are gone now. Rather than quietly deleting the predictions, they are kept below with what actually happened next to them, because being wrong in a documented way is the fastest teaching material this project produced.

Nobody starts at Stage 0 and marches to Stage 4. What happens in practice is that a problem drags you back two stages to fill a gap, and then you climb again knowing why the gap mattered. That is the normal shape of it.

## Where the original roadmap was wrong

Three of the concrete recommendations in the first draft of this chapter have since been disproved on this hardware. All three are worth reading, because each failure is more instructive than the advice was.

<div class="callout danger"><span class="t">Prediction 1 — "install SageAttention and measure the render-time drop"</span>
<p>The original text said, word for word: <em>"Install SageAttention in your ComfyUI env and measure the render-time drop on the same ocean prompt. Real, measurable optimization."</em></p>
<p><b>What happened:</b> SageAttention produces <b>pure noise</b> on H3. Not a slower picture, not a worse picture — no picture. There was no render-time drop to measure because there was no render. It stays off.</p>
<p><b>The lesson:</b> an optimisation that is standard for one model family can be silently invalid for another. The only way to know is to run it and look at the output, which is exactly why the measurement habit matters more than the specific technique.</p></div>

<div class="callout danger"><span class="t">Prediction 2 — "learn the ComfyUI UI, load our saved workflow"</span>
<p>The original text pointed at a saved ComfyUI workflow file as the thing to study.</p>
<p><b>What happened:</b> <b>ComfyUI has been removed from the box entirely.</b> The pipeline is now ours, written directly against diffusers and torch, because the framework's abstractions were hiding exactly the decisions that needed changing — where weights live, when they move, which device a tensor is on (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>).</p>
<p><b>The lesson:</b> a framework is a fine place to start and a poor place to stay if the goal is understanding. Learn the tool, then learn what it was doing for you, then decide whether you still want it doing it.</p></div>

<div class="callout danger"><span class="t">Prediction 3 — "long or 2K video: rent a cloud GPU, an 8 GB card can't hold it"</span>
<p>The original text listed long video under <em>"Rent a bigger cloud GPU — your 8 GB card can't hold it."</em></p>
<p><b>What happened:</b> fifteen seconds of <b>native 1280×704 video with sound</b> now renders on this box, on three 8 GB cards, by splitting one sequence across them (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>). It is slow — the measured <code>g4final</code> run is roughly <b>44 hours</b> at 23 steps — but "can't hold it" was simply false.</p>
<p><b>The lesson:</b> most walls that look like hardware limits are engineering limits. The genuine hardware-independent ceiling in this project is the model's <b>15-second trained range</b>, and that one really does not move.</p></div>

## Stage 0 · Foundations — the why

**Goal:** be comfortable with the ideas in the first chapters without hand-waving over any of them.

The concepts that everything else stands on are small in number: what a parameter is, what inference is as opposed to training, why diffusion starts from noise, and why attention costs what it costs.

- **3Blue1Brown — Neural Networks** (video series): the best visual intuition for what a network *is*.
- **Jay Alammar — The Illustrated Transformer** (blog): attention, explained with pictures.
- **Computerphile — Stable Diffusion** (video): diffusion in plain language.
- In this guide: [ch.01](01-what-is-genai.html) for generative vs discriminative and the diffusion loop, [ch.19](19-what-a-model-is.html) for what a model physically is, [ch.15](15-vectors-matrices-signals.html) and [ch.18](18-number-formats-precision.html) for shapes and number formats.

<div class="callout spec"><span class="t">Checkpoint</span><p>Explain to someone else, without notes: what a parameter is, why inference and training need such different hardware, and why a diffusion model cannot jump to the finished picture in one step. If the last one is shaky, re-read the step mechanics in <a href="01-what-is-genai.html">ch.01</a>.</p></div>

## Stage 1 · Run one, on purpose

**Goal:** run and modify a model without following a script blindly — which means predicting the effect of a change *before* making it.

The single highest-value habit at this stage is finding the **cheapest render that still shows the thing being tested**. On this box the smoke test is 512×320 at 5 frames, which finishes in about **57 seconds**. A four-step 832×480 clip takes roughly **two minutes**. Those are the units of iteration. Nothing is learned faster by testing an idea on a 55-minute render.

- Change **one thing at a time** — seed, steps, resolution, prompt — and write down the prediction first.
- Read model cards properly: which files are needed, which variant, which quantization.
- In this guide: [ch.03](03-how-h3-works.html) for the four parts, [ch.04](04-software-stack.html) for the stack under them, [ch.08](08-how-a-prompt-becomes-video.html) and [ch.22](22-pipeline-in-detail.html) for the full path from sentence to file.

<div class="callout spec"><span class="t">Project</span><p>Render the same prompt at several step counts and record wall-clock time and result for each. The measured version of this experiment is below, and it is the most useful table in the whole guide.</p></div>

## Stage 2 · Memory and fit

**Goal:** understand the resource game that is already being played, well enough to predict whether something will run before starting it.

This is where most self-hosting actually happens. The questions are always the same three: how big are the weights, where do they sit, and what has to move per step.

- Master the distinction between **GPU, VRAM and system RAM**, and what offloading really costs — not conceptually, in gigabytes of traffic.
- Learn **quantization** by comparing the same model at different precisions and looking at the output, not the benchmark.
- Work out, on paper, how many tokens a given resolution produces — then check it against the log.
- In this guide: [ch.02](02-your-hardware.html) for the offload trick, [ch.29](29-where-numbers-live.html) for where every byte sits, [ch.13](13-int8-vs-q4.html) for the precision comparison on this box, [ch.12](12-pushing-past-8gb.html) for how the limit was pushed.

<div class="callout spec"><span class="t">Checkpoint</span><p>Given a model's parameter count and a target precision, state the file size; given the number of layers, state how much crosses PCIe per sampling step. For H3 that is 20 GB over 50 blocks — about 0.4 GB per block, and roughly <b>460 GB</b> of traffic across a 23-step render.</p></div>

## Stage 3 · Read the architecture

**Goal:** open a `config.json` and predict the model's behaviour and size from it.

This is the stage that turns a model from a black box into a parts list. The test is arithmetic: the config should let you derive the file size, and the derivation should match `ls -l`.

- Study **VAEs**, **latent diffusion** and **flow matching** — H3's scheduler is `FLOW_AV`.
- Read the model card end to end, now that the vocabulary is in place.
- Run a model in fifteen lines of `diffusers` so the pipeline is visible without a framework's abstractions on top.
- Optional and excellent: **Andrej Karpathy — "Let's build GPT"**, which demystifies transformers by writing one.
- In this guide: [ch.28](28-anatomy-of-h3.html) for the full parameter count, [ch.23](23-math-from-scratch.html) for the mathematics, [ch.34](34-open-use-close-flashattention.html) for what an attention kernel does, [ch.40](40-lora-how-it-works.html) for how a model gets adapted without retraining.

<div class="callout spec"><span class="t">Project</span><p>Take any diffusion transformer's config and compute its parameters per block by hand, then multiply by the layer count and compare with the size on disk. For H3: 4 × 5376 × 7168 for attention, 2 × 5376 × 14336 for the feed-forward, 2688 × 6 × 5376 for the modulation — about 395 M per block, × 50 blocks ≈ 20 B, which at one byte per parameter is the 20 GB file. When that closes, the model is no longer mysterious.</p></div>

## Stage 4 · Scale and serve

**Goal:** run it as infrastructure rather than as a science experiment — reproducibly, unattended, and across more than one card.

- **Split work across GPUs.** Splitting one sequence across three cards is what made 15 seconds of native 720p possible here; it is also where the overhead lives, and being honest about that overhead is part of the skill.
- **Make renders reproducible.** Seed, resolution, frame count, step count and prompt hash recorded for every output — otherwise a good result cannot be recovered.
- **Protect expensive stages from cheap ones.** Denoise costs hours; decode costs minutes. Checkpoint the latent before decoding, always.
- **Run jobs detached** and inspect logs afterwards, rather than watching them.
- In this guide: [ch.45](45-three-gpu-sequence-parallelism.html) and [ch.36](36-splitting-the-video-cp.html) for the multi-GPU work, [ch.48](48-the-pipeline-without-comfyui.html) for the pipeline architecture, [ch.37](37-the-production-line.html) for running it as a production line, [ch.47](47-the-scorecard.html) for the honest final accounting.

<div class="callout spec"><span class="t">Checkpoint</span><p>Hand the notes for a finished render to someone who was not there, and have them reproduce the same output. If they cannot, the missing information is the next thing to fix.</p></div>

## The traps a roadmap cannot teach

Some things are only learned by hitting them. These all cost real time on this build, and every one of them is written up where it happened.

<div class="callout warn"><span class="t">Measured, all of them</span>
<table>
<tr><th>Trap</th><th>What actually happens</th></tr>
<tr><td><b>SageAttention</b></td><td>Produces pure noise on H3. Keep it off.</td></tr>
<tr><td><b>The 848-pixel width</b></td><td>848 ÷ 16 = 53, which is odd, so 2×2 patching fails with a shape error that never mentions resolution. Use widths where ÷16 is even — 832 gives 52.</td></tr>
<tr><td><b><code>use_stream=True</code> on offloading</b></td><td>Pins tens of gigabytes until the kernel kills the process with no traceback at all. Keep it <code>False</code>.</td></tr>
<tr><td><b><code>VAEDecodeTiled</code></b></td><td>Incompatible — H3's latent is a NestedTensor.</td></tr>
<tr><td><b>LoRA at 480p</b></td><td>Softened the image. The base model was sharper.</td></tr>
<tr><td><b>Ring-3 context parallelism</b></td><td>Out of memory: offload re-copied the weights per process.</td></tr>
<tr><td><b>On-screen text</b></td><td>Not achievable with any current video diffusion model. Letters come out as plausible-looking marks.</td></tr>
<tr><td><b>Faces across chained clips</b></td><td>Photoreal identity drifts between clips. Stylised characters hold far better.</td></tr>
</table></div>

## What to actually do next

<table>
<tr><th>To…</th><th>What it takes</th></tr>
<tr><td>Build intuition fastest</td><td>Iterate on the ~57-second smoke render, not on hour-long clips. Change one variable per run.</td></tr>
<tr><td>Understand where the time goes</td><td>Derive the token count for a resolution by hand, then square it and compare with the measured s/step</td></tr>
<tr><td>Lock a character's appearance across shots</td><td>The <b>Ref2VA</b> transformer — a separate 20 GB file, not a setting. The encoder and both VAEs are shared.</td></tr>
<tr><td>Stop losing work to crashes</td><td>Checkpoint the latent before decode. Two separate decode bugs destroyed completed denoise runs.</td></tr>
<tr><td>Decide whether native 720p × 15 s is worth it</td><td>Read the cost comparison in <a href="47-the-scorecard.html">ch.47</a> — it works, and it is roughly 35× more expensive than upscaling for a difference most viewers cannot see.</td></tr>
</table>

<div class="callout truth"><span class="t">The mindset that carried this project</span>
<p>Every finding in this guide came from changing one variable and watching what happened — including, and especially, the findings that contradicted what we expected. The models will change; this chapter's own advice already has. What does not change is the habit: predict, alter one thing, measure, write it down, and be willing to publish the prediction that failed.</p></div>
