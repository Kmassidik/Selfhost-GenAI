# Is It Really Ours?

<p class="lede">Yes — but only the plumbing, and the plumbing is smaller than it feels. Everything this project built is the <b>systems layer</b>: ways to run somebody else's trained weights on hardware that should not be able to hold them. That work is real, it is genuinely ours, and it does not change what the model is able to generate.</p>

Here is the whole tension in one line of Python:

```python
decoded_chunks.append(chunk.to("cpu", copy=True))
```

That line is the difference between a 720p decode that dies and a 720p decode that finishes. It dropped GPU residency during decode from **7729 MiB to 5639 MiB**, with byte-identical output ([ch.46](46-the-first-15-seconds.html)). Nobody else wrote it. It is also *one line*, and it taught the model nothing.

Holding both of those facts at once — this is ours, and this is small — is the honest position. Most of this chapter is an attempt to be precise about it rather than modest about it, because vague modesty and vague pride are equally useless when the next question is *what to build next*.

<div class="callout truth"><span class="t">Two words to fix before anything else</span>
<p><b>Training</b> is the one-time run that <em>makes</em> a model: feed it millions of clips and it slowly settles on the weights that turn noise into a face. <b>Inference</b> is every run after that: take the finished weights and generate one video. The thing that gets run then splits in two. The <b>generative core</b> is the model itself — its architecture, its weights, what it is capable of producing at all — and every bit of that was decided during training. The <b>systems layer</b> is the engine that runs those weights: the scheduling, the memory management, the kernels, the pipeline. This chapter is one question with a sharp edge: <b>which of those two did this project actually build?</b></p></div>

## Two different questions a machine answers

A refinery is a useful way to hold this apart. The chemistry decides what molecules can be made at all — that is settled by the process, not by the pipework. The pipework decides throughput: how much of it can be made, how fast, at what cost, and whether the plant runs at all on a given site. A brilliant pipe-fitter never invents a new molecule. A plant with no pipework produces nothing.

So there are two separate questions, and it is easy to answer one while believing the other has been answered:

- **What is possible?** — fixed at training time. 4–15 seconds, 24 fps, 32 kHz stereo, eleven languages, short side 768 by default ([ch.03](03-how-h3-works.html)). Nothing done on this box moved any of that by a millimetre.
- **What is reachable?** — decided by the systems layer. In August the answer was *one 8 GB card, 512×288, and 15 seconds only if the picture was soft*. Now it is *three cards, 1280×704, 345 frames, natively* ([ch.46](46-the-first-15-seconds.html)).

## 1 · What was actually built

Seven things, named honestly. All seven are systems-layer work — ways to run someone else's model cheaper, or at all, on 8 GB cards.

<div class="callout spec"><span class="t">The four inventions</span>
<ul>
<li><b>The idle-GPU weight cache</b> — a scheduler for consumer boxes with no NVLink: the cards not currently computing pin prefetched int8 blocks and cut the streaming wait, still 100% int8. A <em>scheduler</em>, not new maths. → <a href="32-thinking-like-a-circuit.html">ch.32</a></li>
<li><b>The 8 GB streaming memory scheduler</b> — int8 block-streaming that runs a 33-billion-parameter model on an 8 GB card by keeping one layer's weights resident and feeding the rest from RAM. Changes what <em>fits</em>, not what the model is. → <a href="29-where-numbers-live.html">ch.29</a></li>
<li><b>Fused rotary and chunked attention / FFN kernels</b> — our own kernels for long video on tiny VRAM: fuse <code>_apply_rotary_emb</code>, tile attention and the SwiGLU feed-forward over the sequence so peak memory goes flat in $N$. → <a href="34-open-use-close-flashattention.html">ch.34</a></li>
<li><b>Chunk-and-chain orchestration</b> — render a few seconds at a time and stitch, to beat the single-context length wall. → <a href="33-long-video-small-card.html">ch.33</a></li>
</ul></div>

<div class="callout spec"><span class="t">And three small ones the render logs forced out</span>
<ul>
<li><b>The decode device fix</b> — the sharded forward returns latents on CPU while <code>_execution_device</code> answers <code>cuda:0</code>, so the first line of decode throws. Present in <em>both</em> decode steps, at <code>decoders.py:185</code> and <code>:245</code>. → <a href="46-the-first-15-seconds.html">ch.46</a></li>
<li><b>The latent-backup rule</b> — write the latents to disk the instant denoise hands them over, before anything downstream can fail. Cost: 69 MB. → <a href="46-the-first-15-seconds.html">ch.46</a></li>
<li><b>The VAE chunk offload</b> — finished pixel chunks were accumulating on the GPU inside <code>_decode</code>; moving them to CPU on append dropped decode residency from 7729 to 5639 MiB with identical arithmetic. → <a href="46-the-first-15-seconds.html">ch.46</a></li>
</ul>
<p>Every one of the seven is a way to <em>run</em> H3. Not one of them is H3.</p></div>

## 2 · The honest critique, stated plainly

<div class="callout warn"><span class="t">All of it is logic around the core, not the core</span>
<p>The core — the architecture, the maths, <em>what the model can generate at all</em> — was forged in MiniMax's training run, on hardware and data this project will never touch. Memory scheduling does not change what is <b>possible</b>; it changes what runs on a $750 box. Fusing a rotary kernel does not teach the model a new kind of motion; it stops the card running out of memory while it computes a motion the weights already knew. This is real engineering, and it is plumbing, not physics. If MiniMax had never trained H3, there would be nothing here to schedule.</p></div>

The sharpest version of the critique is this: none of the seven changed a single weight. Every render on this box produces frames that a datacentre running the same checkpoint would also produce. The work moved *where* the computation can happen and *how much it costs*, never *what it computes*.

## 3 · The bar — when does systems work count as core work?

Here is the part that cuts both ways, and it is the most useful idea in the chapter.

**vLLM's reputation rests on PagedAttention. SGLang's rests on RadixAttention. Both are "just" systems logic too** — and both are famous. So systems work *can* be core-worthy. The bar is not *whether the weights were touched.* The bar is **whether a new algorithm was invented.**

In one line each: **PagedAttention** is vLLM's memory algorithm, which pages an LLM's key/value cache the way an operating system pages RAM, taking fragmentation from 60–80% down to under 4%. **RadixAttention** is SGLang's algorithm for *reusing* that cache across requests which share a prefix. Neither touched a weight. Both changed the field.

That is the proof that the weights are not the only place ownership lives. It also sets an uncomfortable standard for this project's own list: a *scheduler* clears the bar only if the scheduling idea itself is new. The idle-GPU weight cache is the one candidate on the list — and [ch.32](32-thinking-like-a-circuit.html) is where its ceiling gets measured rather than assumed.

## 5 · Where ideas beat money

<div class="callout truth"><span class="t">The biggest leaps in this field were algorithms, not bigger clusters</span>
<p>Look at what actually moved diffusion forward. <b>Flow matching. Consistency models. LCM. Rectified flow. SVDQuant.</b> Not one of them was "we had more GPUs." Every one was an <b>idea</b>, proven at small scale, that then generalised to the big models. That is the door an individual can walk through: MiniMax's cluster is not a prerequisite for MiniMax's <em>insight</em>. The insight is free. Only the final validation costs money — and the validation is the cheap half.</p></div>

This is not optimism, it is a structural feature of the field. An architecture idea is expressed in a few hundred lines and tested at a scale that fits on a hobbyist's card; the expensive part is scaling a *proven* idea, and scaling proven ideas is exactly what funded labs are good at. The asymmetry runs in the small builder's favour at the one stage that matters most.

## 6 · The three core moves that could actually be attempted

Rung 3 is not abstract. Three concrete shots at it, in order of feasibility.

- **Step distillation, 49 steps down to about 4.** Teach a student model to jump in ~4 steps what the teacher does in 49. This changes the **generative maths itself**, not the plumbing. The measured step counts on this box make the prize obvious: a wide vista with a small distant subject needs **49 steps**; that same content at 1280×704 × 345 frames costs about **90 hours** of denoise ([ch.47](47-the-scorecard.html)). Cutting the step count by an order of magnitude does not make the box faster — it makes the *job* smaller. Needs one modest rented training run. **The bet.**
- **A real long-video continuity method.** Solve the chunk-and-chain seam, drift and audio-state problem ([ch.33](33-long-video-small-card.html)) with a genuinely new *conditioning* algorithm rather than a bigger overlap window. An open research problem; identity drift on photoreal faces across chained clips is a measured failure here, not a theoretical one.
- **A new compression method, SVDQuant-class.** *Invent* a better way to compress a model rather than *apply* an existing quantization. Provable at small scale, then generalised — the same shape as every win in §5.

## 7 · The honest cost

<div class="callout spec"><span class="t">Ideas are free; validating them costs GPU-hours</span>
<p>The asymmetry is the whole point. <b>Systems work runs on this box today</b> — the streaming scheduler, the kernels, chunk-and-chain, the three-GPU sharded forward, all of it ran on 8 GB cards that were already bought. <b>Core work needs a rented run to prove the idea.</b> A distillation run means renting a few large GPUs briefly: build the dataset here for free, rent the training ([ch.20](20-how-far-we-can-go.html)). Nobody buys the cluster; what gets rented is the twenty minutes of it that physics will not give away. The idea is the hard part and it is free. The proof is the easy part and it is rented.</p></div>

## 8 · Can this engine beat ComfyUI? Yes — by a number smaller than it sounds

Worth stating precisely, because the exciting version of this claim is false.

Our fused int8 GEMM kernel **beat ComfyUI's path by about 3× on the matmul specifically** ([ch.21](21-build-vs-buy.html)). But matmuls are only about **12% of the forward pass**, and about **9.5% end-to-end** ([ch.20](20-how-far-we-can-go.html)). Amdahl's law does the rest of the arithmetic. With $p$ the fraction of the work sped up and $s$ the speedup on that fraction ([`math-model`](14-the-math-behind-it.html)):

$$\text{overall} = \frac{1}{(1-p) + p/s} = \frac{1}{0.905 + 0.095/3} \approx 1.07\times$$

<div class="callout warn"><span class="t">What the 3× is, and what it is not</span>
<p>It is <b>proof that a hand-built engine can outperform a prebuilt tool on a kernel that matters</b> — the foundation of the whole "build the engine" argument. It is <b>not</b> a finished victory, and the claim "we beat ComfyUI 3×" should never be made. The measured position is: 3× on roughly a tenth of the work, which is about <b>1.07× end to end</b>. One brick, not a building.</p></div>

And the counter-example is on the box too, which is what makes it honest. When the int8 path was benchmarked head-to-head against a **Q4_K_M GGUF** on the same scene, Q4 finished in **52 minutes against int8's 107** — a **2.05× win for the path we did not write**, at *lower* peak VRAM (7.06 GB vs 7.5 GB) and *higher* native resolution (704×384 vs 576×320), with quality a tie by eye ([ch.13](13-int8-vs-q4.html)). Part of that gap is self-inflicted: our own chunking patch added per-row loop overhead to int8. Owning the code cuts both ways.

## 9 · The smallest honest unit of ownership

The most defensible thing on the list is also the smallest, and it is worth looking at closely because it shows what "ours" means when the claim is precise.

Profiling the 8 GB wall found that roughly **88%** of the real-tensor peak was not weights at all — it was the int8 GEMM's working buffers, with a single `fast_int8_mm` temporary of **2.24 GB** ([`math-model`](14-the-math-behind-it.html)). That temporary is the full $[M,N]$ int32 output materialised in one shot. But the rows of an int8 linear are independent — each row has its own scale — so the product can be computed in row blocks and never materialised whole:

$$\mathbf{Y}[R_i,:] = \big(\mathbf{X}_8[R_i,:]\,W_8^\top\big)\cdot(s_{R_i}\,s_w), \qquad \bigcup_i R_i = \{1..M\}$$

<div class="callout truth"><span class="t">A patch small enough to verify completely</span>
<p>Peak memory fell from <b>5.9 GB to 3.9 GB</b>, and the output was proven <b>bit-identical</b> — not "close", not "within tolerance", but <code>torch.equal</code> returning true. The two gigabytes bought resolution: <b>576×320 → 768×448</b>, which is $344064 / 184320 = \mathbf{1.87\times}$ the pixels on the same card.</p>
<p>That is the shape of every honest claim in this chapter. It is provably correct, it is provably ours, it is measured in gigabytes rather than in capability — and it cost speed elsewhere. Ownership at this scale comes with a receipt on both sides.</p></div>

## 10 · The verdict

<div class="callout truth"><span class="t">The engine is the vehicle; the core is the soul</span>
<p>The systems engine is the <b>vehicle</b>; the algorithmic core is the <b>soul</b>. The cheap consumer engine gets built because it makes experiments cheap — and then it gets used to chase the one algorithmic idea that would genuinely be ours. The two are not rivals, they are a sequence. <b>The plumbing earns the right to attempt the physics.</b> Without the engine, every experiment costs rental money. With it, the box becomes a lab, and a lab is where a new idea gets proven before anybody will fund the run that scales it.</p></div>

<div class="callout truth"><span class="t">The takeaways</span>
<ol>
<li><b>Everything built here is the systems layer</b> — streaming scheduler, idle-GPU cache, fused and chunked kernels, chunk-and-chain, plus three small render-log fixes. Ways to <em>run</em> H3, never H3 itself. Plumbing, not physics.</li>
<li><b>The capability envelope never moved.</b> What grew was the reachable region inside it: 512×288 on one card to native 1280×704 × 345 frames on three.</li>
<li><b>Systems work can still be core-worthy.</b> PagedAttention and RadixAttention were "just" systems logic — but they were <em>new algorithms</em>. The bar is whether a new algorithm was invented, not whether the weights were touched.</li>
<li><b>The ladder has four rungs</b> — inference systems, model surgery, new algorithm, train from scratch. Rung 1 to rung 3 is an ideas jump; only rung 4 needs a fortune.</li>
<li><b>Ideas beat money at the one stage that matters.</b> Flow matching, consistency models, LCM, rectified flow, SVDQuant were insights proven small, not larger clusters.</li>
<li><b>The bet is step distillation</b> — 49 steps to about 4 changes the generative maths, and the 90-hour native-720p figure shows exactly what it would be worth.</li>
<li><b>The ComfyUI win is 3× on ~9.5% of the work</b>, which Amdahl turns into about <b>1.07×</b> end to end. Meanwhile a Q4 path we did not write beat our int8 path <b>2.05×</b>. Owning the code cuts both ways.</li>
<li><b>The most defensible claim is the smallest one</b> — a row-blocked int8 matmul, bit-identical by <code>torch.equal</code>, 5.9 GB down to 3.9 GB, 1.87× the pixels. Provable, ours, and modest.</li>
</ol></div>
