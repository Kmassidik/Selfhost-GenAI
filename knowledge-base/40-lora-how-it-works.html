# LoRA — A Frozen Giant, a Tiny Nudge

<p class="lede"><b>A LoRA is a small trained correction — here a 126 MB file — that gets added to a frozen model's weights, letting a 20 GB transformer take on a new look without anyone retraining it or redistributing it.</b> It is one of the most elegant ideas in the open-model world, the reason a public library of thousands of styles exists at all, and it is also the subject of the most useful negative result in this guide: the one we tested at 480p made the image <em>softer</em> than the base model.</p>

Both halves of that sentence are the chapter. The mechanism is beautiful and worth understanding in full. The measurement says it did not help here, and the reason it did not help is a property of the *pipeline*, not of the adapter — which makes it a much more interesting failure than a bad file would have been.

<div class="callout truth"><span class="t">The one-line version</span>
<p><b>Freeze the giant model; learn a small, low-rank nudge that is added on top.</b> The base transformer never changes — only the nudge is trained and shipped. That is why an adapter teaching H3 "realistic faces" is <b>126 MB</b> rather than the 20 GB of the int8 transformer, or the ~66 GB it occupies in its original bf16.</p></div>

## 1 · The problem it solves

Suppose the goal is more convincing human faces. The brute-force route is a **full fine-tune**: keep training every weight in the transformer on new footage. Three things make that impossible outside a lab.

The first is compute — updating a model this size requires holding weights, gradients and optimizer state simultaneously, several times the memory of inference. The second is distribution: the result is *a whole new model*, tens of gigabytes, shipped in full for every variation. The third is combinatorial. If there are a thousand desirable styles, full fine-tuning produces a thousand complete models, and no shared base to reason about.

LoRA — **Lo**w-**R**ank **A**daptation — dissolves all three at once, and it does so by asking a sharper question than "how do we make training cheaper?" The question it asks is: **how much of a model actually needs to change to teach it one new thing?**

The answer, empirically, is: a startlingly thin slice.

## 2 · The idea

Freeze the entire base model. Beside each weight matrix worth influencing, bolt on a **small parallel path** that is trained while the base sits perfectly still. At inference the layer's output is the frozen path **plus** the small learned path.

Only `A` and `B` are ever learned. The giant `W` never moves — not during training, not at inference. That single constraint is what makes everything else cheap.

## 3 · The maths — why the nudge is so small

Take one weight matrix $W$ of size $d \times k$. In H3 a large attention projection is roughly $5376 \times 16128$ — about **86 million** numbers. A full fine-tune would learn a change $\Delta W$ of that *same* 86-million size, which is exactly the problem.

LoRA forces the change to be **low-rank** — expressible as a product of two skinny matrices:

$$\Delta W = B\,A, \qquad B \in \mathbb{R}^{d \times r},\; A \in \mathbb{R}^{r \times k},\; r \ll d,k$$

So instead of $d \times k$ free numbers there are only $r\,(d+k)$. At rank $r = 32$:

$$32 \times (5376 + 16128) \;\approx\; 688{,}000 \text{ numbers} \;\;\Longrightarrow\;\; \text{about } 125\times \text{ smaller than 86 M.}$$

At inference the effective weight is the frozen one plus the scaled nudge:

$$W_{\text{eff}} \;=\; W + \frac{\alpha}{r}\, B A$$

### What the rank actually constrains

The rank is not a size setting. It is a **bandwidth limit on what the adapter is allowed to say.**

The clearest way to see it: $A$ takes the layer's full 16,128-dimensional input and squeezes it into **32 numbers**. $B$ takes those 32 numbers and sprays them back across 5,376 outputs. Everything the adapter has learned about this layer — every correction to every one of 86 million weights — must pass through that 32-wide waist.

The structural picture is a switchboard between two cities. One city has 16,128 residents, the other 5,376. Between them run exactly 32 trunk lines. Any pattern of communication is possible, but only 32 independent conversations can be in flight; everything else has to be expressed as a combination of those 32. Raise the rank and more trunk lines open. Lower it and the adapter has to be more general — and generality is exactly what stops it from overwriting the base model's own competence.

<div class="callout spec"><span class="t">What each symbol controls</span>
<ul>
<li><b>$r$ — the rank.</b> How much the adapter is <em>permitted</em> to change. Small $r$ is a thin nudge with little capacity to override the original; large $r$ is a fat one that can.</li>
<li><b>$\alpha$ — the scale, fixed at training time.</b> The $\alpha/r$ factor normalizes strength so that changing the rank does not silently change how loud the adapter is.</li>
<li><b>The strength knob set at load time</b> multiplies the whole $BA$ term. It turns the effect up or down without retraining — and, as section 6 shows, its correct value is sometimes zero.</li>
</ul></div>

<div class="callout warn"><span class="t">Why low rank is <em>enough</em> — the non-obvious part</span>
<p>The result that makes LoRA work is not the compression; it is that the compression costs almost nothing in practice. A new skill — "keep skin texture", "ink the outlines" — turns out not to require moving 86 million numbers independently. It is a <b>systematic bias applied across many inputs</b>, not 86 million separate facts, and a systematic bias has low <em>intrinsic dimension</em>. A rank-32 sketch of <em>which direction to push</em> captures it.</p>
<p>This is also the honest boundary of the technique. Anything that genuinely <em>is</em> 86 million independent facts — a new language, a new physics — will not fit through 32 trunk lines, and no amount of training will make it.</p></div>

## 4 · Where the adapters attach, and what that reveals

Open the realism adapter — 208 tensors — and the maths is on disk in plain sight:

```
diffusion_model.blocks.0.attn.qkv_proj.lora_A.weight   ← the A  (r × k)
diffusion_model.blocks.0.attn.qkv_proj.lora_B.weight   ← the B  (d × r)
diffusion_model.blocks.0.attn.out_proj.lora_A.weight
diffusion_model.blocks.0.attn.out_proj.lora_B.weight
... one A/B pair per adapted matrix, across all 50 blocks
```

Two facts fall out of that listing.

The first is that every entry is literally an `A` or a `B`. The $\Delta W = BA$ decomposition is not a training-time convenience that gets collapsed before shipping — it *is* the shipped artefact. The file never contains a weight; it contains the two factors of a change to a weight.

The second is more interesting: it adapts **only the attention projections** — `qkv_proj` and `out_proj` — and leaves the feed-forward network untouched. In a 50-block transformer where the feed-forward inflates every token through a 14,336-wide intermediate ([ch.34](34-open-use-close-flashattention.html)), that is a deliberate omission. "Realism" is being taught as a change in **how the model attends** — which regions of the frame inform which others — rather than as a change in what the model knows. Detail and coherence are attention-side properties, so that is where the lever was placed.

## 5 · The rank knob, in three real files

Three H3 adapters were pulled onto the box. Rank maps straight onto strength — the same $r$ that appears in the maths:

| Adapter | Trigger | Rank $r$ | Effect | Size |
|---|---|---|---|---|
| **Realism-People** | `r34l1sm` | **32** | photoreal faces, natural skin, film lighting | 126 MB |
| **Studio-1939** (light) | `gulliv3r,` | **16** | subtle painterly storybook texture | ~tens of MB |
| **Studio-1939** (strong) | `gulliv3r,` | **64** | bold cel-shaded, inked outlines | larger |

The same style shipped at $r=16$ *and* $r=64$ tells the whole story: **rank 16 whispers the look, rank 64 shouts it** and can override H3's photoreal default outright. The rank is a real, tunable dial, not an abstraction — and the file size follows it linearly, because $r(d+k)$ is linear in $r$.

<div class="callout warn"><span class="t">Two adapters can fight</span>
<p>These two pull in opposite directions — <code>r34l1sm</code> toward photoreal, <code>gulliv3r</code> toward hand-painted cartoon. Stacked, their $\Delta W$ terms add, and adding two corrections that point opposite ways produces something closer to neither than to either. <b>Choose one per project.</b></p></div>

## 6 · The measurement: at 480p, the base model was sharper

Now the part that matters more than any of the above.

The realism adapter was tested on this box against the same scene with the adapter off. The result went the wrong way:

<div class="callout danger"><span class="t">The result</span>
<p><b>At 480p, the LoRA softened the image. The base model was sharper.</b> Not a subtle preference — a visible loss of detail in the direction the adapter was supposed to add it. The adapter was set aside, and the base model is what renders.</p></div>

It would be easy to record that as "bad file" and move on. That reading is wrong, and the adapter's own authors said so before we ever ran it. From its training notes:

> *"Skin texture, pores, fine hair live in **high spatial frequencies**, and at a lower [resolution] the latents barely carry them."*

That sentence is the whole explanation, and it is worth unpacking rather than quoting.

### Why resolution is a hard floor on what a LoRA can deliver

The transformer never touches pixels. It works on a **latent** — a compressed grid, spatially **16× smaller** in each direction than the frame ([ch.03](03-how-h3-works.html)). So:

| Frame | Latent grid per frame | Latent cells |
|---|---|---|
| 832 × 480 | **52 × 30** | 1,560 |
| 1280 × 704 | **80 × 44** | 3,520 |

Every latent cell stands in for a **16 × 16 block of pixels**. Pore-level skin texture, individual strands of hair, the fine structure of an iris — these vary over one to three pixels. In a representation whose smallest unit spans sixteen, there is simply **nowhere for that variation to be written down.** It is not that the model declines to draw it; the canvas has no place to put it.

That is a sampling limit, not a modelling limit, and it applies identically to the base model and to any adapter. What differs is how each one *behaves* when asked for detail the canvas cannot hold.

### The honest mechanism

Here the record has to be careful about what was measured and what is inference. **The measurement is the softening.** The explanation below is the best account of it, and it rests on the adapter authors' own statement of the resolution dependence.

The adapter shifts the attention projections toward the statistics of its training data — footage where skin has visible texture and light behaves like a film set. At a resolution where those statistics cannot be represented, the model is being pushed toward an output the latent cannot encode. The nearest representable thing to "finely textured skin" on a grid that cannot resolve texture is **evenly lit, smooth skin**. The base model, carrying no such pull, keeps whatever local contrast the grid *can* carry. So the adapter's push, correct at the resolution it was trained for, becomes a smoothing operator at 480p.

The compounding version of this is the point the original research note made: more resolution and a face-tuned adapter are **two levers that multiply**. Resolution supplies the places to put detail; the adapter fills them coherently. Neither alone is the fix, and applied in the wrong order the adapter is worse than nothing.

<div class="callout warn"><span class="t">Caveats, stated as plainly as the result</span>
<p>This is <b>one scene, one adapter, one resolution, judged by eye</b> — the same class of evidence as the int8-versus-Q4 comparison, with the same limits (<a href="13-int8-vs-q4.html">ch.13</a>). No perceptual metric was computed. It is a strong signal about <em>this</em> adapter in <em>this</em> pipeline, not a verdict on realism adapters generally. The prediction it makes is testable and has not yet been tested: at native 1280×704 — where the latent has 2.26× the cells — the same adapter should stop softening and start helping. That render has not been run.</p></div>

## 7 · The same file format, a completely different job

There is a second adapter in this project's history that behaves nothing like a style, and it is the clearest evidence that "LoRA" names a *mechanism*, not a *kind of effect*.

The **Turbo** adapter for H3 does not change how anything looks. It changes how many steps the sampler needs: from a base of about 20 down to **4–8**, roughly a 5× reduction in sampling cost. It does this by **distillation** — retraining the velocity field so that the trajectory from noise to image is *straight enough* that a coarse 4-step Euler integration lands accurately, where the base field would need many small steps to follow its curve ([ch.23](23-math-from-scratch.html)).

$$\frac{d\mathbf{z}_t}{dt} = v_\theta(\mathbf{z}_t, t, \mathbf{c}) \qquad\longrightarrow\qquad v_\theta' \text{ such that } S = 4\text{–}6 \text{ suffices}$$

Same $\Delta W = BA$ decomposition, same file format, same load path. Entirely different target: not the look of the output but the **geometry of the path** used to reach it.

<div class="callout truth"><span class="t">And it too is a trade, not an upgrade</span>
<p>Measured on this project: Turbo is about <b>5× faster and trades away fine detail</b> — teeth and small features were where it showed. The standing rule that came out of it: <b>Turbo for drafts and motion tests, full-step sampling for hero shots.</b></p>
<p>There was also a second-order lesson. At 1080p, once Turbo had removed most of the sampling cost, the <b>4× upscale of 362 frames became the new bottleneck</b> — the fixed tail of the pipeline dominated what was left. Amdahl's law arriving in person: killing the largest cost promotes the next one, and a 5× lever on 80% of the work is not a 5× lever on the job.</p></div>

Two adapters, two directions, one shape. Whatever a LoRA is doing, it is spending its 32 trunk lines on *something*, and something else pays.

## 8 · How they are made, and why there are thousands

The recipe every one of these followed:

1. **Curate a focused dataset.** The realism adapter used 176 hand-picked live-action clips of people, captioned. Studio-1939 used public-domain frames from a 1939 animated feature.
2. **Freeze the base; attach empty `A`/`B` adapters** to the chosen matrices and pick a rank.
3. **Bind a trigger word** — `r34l1sm`, `gulliv3r,` — so the style activates only when typed. The adapter learns to key its behaviour off that token, which is what makes it a switch rather than a permanent change of personality.
4. **Train only `A` and `B`** with the ordinary diffusion loss on the clips — around 1,500 steps for the realism one.
5. Ship the `.safetensors`.

<div class="callout truth"><span class="t">Why the ecosystem overflows with them</span>
<p>Training one costs a <b>few hours on a rented 4090 or A100 — a couple of dollars</b> (<a href="39-choosing-the-next-card.html">ch.39</a>). Anyone with a small dataset and one cloud GPU can teach a very large model a new trick <em>without owning it, retraining it, or shipping it.</em> Step 2 is why: the frozen base is a shared public good, and everyone's contribution is a 126 MB diff against it.</p>
<p>The realism card records one finding worth more than the rest of the recipe: <b>training resolution mattered more than rank or step count</b> for fine detail. The data, not the knob, is usually the lever — and that is the same fact that section 6 met from the other side.</p></div>

## 9 · Wiring one into this engine

The pipeline here is not the stock `pipe.load_lora_weights()` path; phase B assembles a partial pipeline and runs a custom denoise ([ch.48](48-the-pipeline-without-comfyui.html)). Adding an adapter therefore means merging the nudge into the transformer weights directly. Two details decide whether that works.

<div class="callout spec"><span class="t">The two things to get right</span>
<ol>
<li><b>Key remap.</b> The file names its layers <code>diffusion_model.blocks.N.attn.*</code>, the native / ComfyUI convention. The <code>diffusers</code> transformer calls the same layers <code>transformer_blocks.N.attn.*</code>. A small name-translation table has to bridge the two before anything is merged — the classic ComfyUI-versus-diffusers mismatch, and a silent one: mismatched keys are usually skipped rather than raised, so a botched remap produces a render that simply ignores the adapter.</li>
<li><b>Merge before quantizing.</b> Compute $W_{\text{eff}} = W + \frac{\alpha}{r}BA$ on the <b>bf16</b> weights first, <em>then</em> quantize to int8 and offload. Merging a bf16 delta into weights that are already int8 means dequantizing, adding, and re-quantizing every matrix — lossy, fiddly, and done at exactly the moment the memory budget is tightest.</li>
</ol></div>

There is a cost the order makes explicit. Merging rewrites the transformer, so the 20 GB int8 file has to be **regenerated and re-saved** — a one-time expense per adapter and per strength setting. This is not a knob that can be turned at render time in a streaming engine: the weights are streamed block by block from RAM during the forward pass ([ch.29](29-where-numbers-live.html)), and applying a delta per block per step would pay the cost fifty times a step. Bake it in once, or do not use it.

## 10 · The honest limits

<div class="callout danger"><span class="t">A LoRA changes <em>style</em>, not the machine</span>
<p>It can push faces toward photoreal or the whole frame toward ink. It <b>cannot</b> add resolution, extend the 15-second trained range of the model, reduce VRAM, or make a render faster (except the Turbo case, which buys speed by spending detail). Those ceilings belong to the model and the hardware (<a href="20-how-far-we-can-go.html">ch.20</a>, <a href="39-choosing-the-next-card.html">ch.39</a>).</p>
<p>And it will not rescue bad framing. Step count is a property of the <em>scene</em> — a tight close-up settles in 4 steps, a wide vista with a small distant subject needs 49 — and a subject too small in frame is short of pixels before any adapter is loaded. Framing remains the master lever (<a href="17-what-actually-improves-quality.html">ch.17</a>). A LoRA is a taste adjustment on a fixed engine: powerful, cheap, bounded, and — as section 6 records — occasionally negative.</p></div>

<div class="callout spec"><span class="t">The chapter in seven lines</span>
<ol>
<li><b>Freeze the giant, learn a tiny nudge.</b> The base never changes; only $BA$ ships — 126 MB against a 20 GB transformer.</li>
<li><b>The maths is low-rank:</b> $\Delta W = BA$, so $W_{\text{eff}} = W + \frac{\alpha}{r}BA$. Rank 32 cuts 86 M numbers to 688 K, about 125×.</li>
<li><b>Rank is a bandwidth limit,</b> not a size setting — every correction squeezes through a 32-wide waist. Rank 16 whispers, rank 64 shouts.</li>
<li><b>It is visible in the file</b> — <code>lora_A</code> / <code>lora_B</code> pairs, here on the attention projections only, with the feed-forward untouched.</li>
<li><b>At 480p it made the picture softer than the base model.</b> The latent grid is 52 × 30 and cannot carry the high-frequency detail the adapter was trained to add, so the push toward texture resolves as smoothing.</li>
<li><b>The same format carries entirely different jobs</b> — the Turbo adapter re-shapes the sampling trajectory for 4–8 steps instead of ~20, and pays for it in fine detail.</li>
<li><b>In this engine:</b> remap the keys, merge on bf16 <em>before</em> quantizing, and accept that the 20 GB file is rewritten once per adapter.</li>
</ol></div>
