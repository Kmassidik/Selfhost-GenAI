# Self-Hosting Generative AI

<p class="lede">It started with one graphics card that was too small for the job.</p>

A single RTX 3060 Ti holds **8 GB**. MiniMax-H3 is a **33-billion-parameter** video model whose quantized weights come to roughly 46 GB — nearly six times too large to fit. The sensible move was to rent a bigger machine. We didn't. We spent months finding out exactly how far a consumer box could be pushed, and wrote down what happened.

It ends with three cards rendering **fifteen seconds of native 720p video with sound** — a thing that should not fit on 24 GB, and does.

<div class="callout truth"><span class="t">The arc, measured at both ends</span>
<table class="arc">
<tr><th></th><th>Where we started</th><th>Where we are now</th></tr>
<tr><td>GPU</td><td>1× RTX 3060 Ti — 8 GB</td><td><b>3× RTX 3060 Ti — 24 GB</b></td></tr>
<tr><td>CPU / RAM</td><td>24 cores / 60 GB</td><td>2× Xeon E5-2665, 32 threads / <b>125 GB</b></td></tr>
<tr><td>Disk</td><td>148 GB</td><td>879 GB</td></tr>
<tr><td>Engine</td><td>ComfyUI 0.30</td><td><b>Our own pipeline — no framework</b></td></tr>
<tr><td>Longest render</td><td>3 s at 768×448</td><td><b>14.4 s at native 1280×704</b></td></tr>
<tr><td>Time for that render</td><td>348 s</td><td>44 h</td></tr>
</table>
</div>

Read that last row carefully, because it is the honest shape of this whole project: we became far **more capable** and far **slower**. Every wall we broke cost time on the other side. That trade — cheap hardware, patient output — is what self-hosting actually means, and nothing here pretends otherwise.

## What makes this different

Every number was measured on the machine described above. Every failure is written down next to the fix: the six hours lost to two tensors on different devices, the memory wall that turned out to be a bug, the LoRA that made the picture worse, the parallelism scheme that ran out of RAM. If a thing was slow, it says slow.

<div class="callout spec"><span class="t">Three findings that cost the most to learn</span>
<ol>
<li><b>Step count is a property of the scene, not the model.</b> A close-up portrait resolves in 4 steps. A wide vista with a distant subject needs 49. Getting this wrong wasted a 5½-hour render.</li>
<li><b>Cheap stages must never be able to destroy expensive ones.</b> Denoise costs hours, decode costs minutes — and for one night, a decode bug could delete a completed denoise.</li>
<li><b>Most walls are bugs.</b> "It runs out of memory at 720p" sounded like hardware. It was finished data left in the wrong place.</li>
</ol>
</div>
