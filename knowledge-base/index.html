# Self-Hosting Generative AI

<p class="lede">A from-scratch guide to running big AI models on your own machine — written from the exact build we did together on your box: a consumer GPU, an open-source video model, and every trap we hit along the way.</p>

This is not a generic tutorial. Every number in here was **measured on your hardware**, every gotcha actually happened, and nothing is rounded up to look better than it is. If a thing was slow, it says slow. If 8 GB is small for the job, it says so.

## The honest specs of what we built

<div class="callout truth"><span class="t">The machine — measured, not marketing</span>
<table>
<tr><th>Part</th><th>What it actually is</th></tr>
<tr><td>GPU</td><td>NVIDIA GeForce RTX 3060 Ti — <b>8 GB VRAM</b>, Ampere (sm_86)</td></tr>
<tr><td>Driver / CUDA</td><td>595.84 / CUDA 13.2</td></tr>
<tr><td>CPU / RAM</td><td>24 cores / <b>60 GB RAM</b></td></tr>
<tr><td>Disk</td><td>148 GB NVMe (≈100 GB free after models)</td></tr>
<tr><td>OS</td><td>Ubuntu 26.04</td></tr>
<tr><td>Model</td><td>MiniMax-H3 — a <b>33-billion-parameter</b> text/image→video+audio diffusion model</td></tr>
<tr><td>Engine</td><td>ComfyUI 0.30 + PyTorch 2.11 (CUDA 12.8 build)</td></tr>
</table>
</div>

<div class="callout warn"><span class="t">The reality of running a 33B model on 8 GB</span>
<p>The model's weights total <b>~46 GB</b> (quantized). Your GPU has <b>8 GB</b>. It only works because we stream the weights from your 60 GB of system RAM through the GPU a slice at a time. It <b>works</b> — you have real clips with sound to prove it — but it is <b>not fast</b>: a 3-second clip took <b>348 seconds (≈5.8 minutes)</b> to render. That trade (cheap hardware, slow output) is the whole story of consumer self-hosting, and this guide explains exactly why.</p>
</div>
