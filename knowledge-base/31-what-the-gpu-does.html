<span class="kicker">Chapter 31 · The arithmetic under everything</span>

# What the GPU Is Actually Doing

<p class="lede">The chip multiplies two numbers and adds the result to a running total. That is the entire operation — the same one a pocket calculator performs — executed on the order of a quadrillion times per denoise step. There is no thinking in the instruction. Everything that looks like understanding lives in the <em>values</em> of the numbers being multiplied.</p>

That claim sounds like a simplification made for teaching. It is not. This chapter works one multiply-add by hand, counts how many of them a real step contains using the model's own config file, and then shows the place where this project's intuition about that arithmetic turned out to be **measurably wrong** — a case where the format that should have been faster was half the speed.

<div class="callout truth"><span class="t">The one-line version</span>
<p>A render is <b>$a \times b + c$</b>, repeated until the numbers land somewhere meaningful. Attention, diffusion, the face emerging from noise — all of it is that one line, run at enormous scale, on a specific pile of learned values.</p></div>

## What is on the card at this instant

Freeze a render mid-block. Two kinds of numbers occupy the card, and they behave completely differently.

## The one operation

Every layer does the same core thing: for each output number, multiply each input by a weight and sum the products. That is a **dot product**, and a whole layer's worth of them stacked side by side is a matrix multiplication — a *matmul*, or GEMM:

$$\text{out}_i = \sum_j x_j \cdot W_{ij}$$

In words: *output number $i$ is the sum, over every input $j$, of that input times its weight.* Multiply, add, multiply, add.

<div class="callout spec"><span class="t">One output number, worked by hand</span>
<p>Four numbers from the latent, and one row of weights reconstructed from int8 <span>$q=[12,-40,3,88]$</span> at scale <span>$s=0.01$</span>:</p>
<pre>
x = [ 0.50, -0.20,  1.30,  0.00]
W = [ 0.12, -0.40,  0.03,  0.88]     (= [12,-40,3,88] × 0.01)
    ----------------------------------------------------------
out =  0.50·0.12  +  (-0.20)·(-0.40)  +  1.30·0.03  +  0.00·0.88
    =    0.060    +      0.080        +    0.039     +    0
    =  0.179
</pre>
<p>Four multiplies, three adds, one number out. A ten-year-old with a calculator produces the same 0.179, and the card produces it no differently — only in parallel with several thousand others.</p></div>

## How many multiplies, exactly

The count is not a guess. It falls out of two numbers already established: the size of the model, and the number of tokens in the clip.

### Where the parameters are inside one block

### How many tokens a clip becomes

The video is compressed before it ever reaches the transformer. The visual VAE reduces each spatial dimension by **16**, and the transformer then groups latents into patches of 1 frame × 2 × 2, which divides each spatial dimension by 2 again.

So for a 1280×704 frame: $1280/16 = 80$ and $704/16 = 44$ latent cells, then patching gives $40 \times 22 = 880$ tokens per latent frame. A 124-frame clip becomes 37 latent frames — the same 37 that appears in the observed latent shape `(1, 24, 37, 30, 52)` for an 832×480 clip of the same length — so:

$$880 \ \text{tokens/frame} \times 37 \ \text{frames} \;\approx\; 32{,}600 \ \text{tokens}$$

<div class="callout spec"><span class="t">The forward-pass rule, and its honest limit</span>
<p>A useful approximation for the cost of one forward pass:</p>
$$\text{operations} \approx 2 \times N_{\text{params}} \times N_{\text{tokens}}$$
<p>The <b>2</b> counts the multiply and the add separately; each parameter is touched about once per token. For a 5-second 720p clip that is roughly $2 \times 20\times10^{9} \times 32{,}600 \approx 1.3\times10^{15}$ multiply-adds <b>per step</b>.</p>
<p><b>It is a lower bound, and it is the reason long clips hurt.</b> The rule counts weight arithmetic only; attention also compares every token with every other token, a term that grows with the <em>square</em> of the token count and is invisible in this formula. At 32,600 tokens that term is a minor addition. Triple the clip length and it stops being minor — which is exactly the effect measured in <a href="30-the-render-live.html">ch.30</a>, where 2.26× the tokens cost 34× the time.</p></div>

## Why the storage format changes the speed — and the case where it did not

The multiply-add is the same operation whatever format the operands arrive in. What changes is **how many of them fit through the silicon per clock**, and that is a property of which hardware unit runs the instruction.

<div class="callout spec"><span class="t">What int8 is supposed to do</span>
<p>In a native int8 path, the tensor cores multiply the raw <b>integers</b> — $q_x \times q_W$ — and accumulate in <b>int32</b>. The floating-point scales are applied <b>once at the end</b>, not per multiply. Eight-bit integer multiply-accumulates are cheap, and many more of them fit per clock than 16-bit ones. On this Ampere hardware (sm_86) that instruction exists and is called <b>IMMA</b>.</p></div>

That is the theory this project believed. The measurement disagreed.

<div class="callout warn"><span class="t">Measured head-to-head, one scene, same pipeline</span>
<table>
<tr><th>Metric</th><th>int8 (convrot + our patch)</th><th>Q4_K_M (GGUF)</th></tr>
<tr><td>Render time</td><td>6393 s (107 min)</td><td><b>3122 s (52 min)</b> — 2.05× faster</td></tr>
<tr><td>Native resolution it fit</td><td>576×320</td><td><b>704×384</b> — 47% more pixels</td></tr>
<tr><td>Peak VRAM</td><td>7.5 GB</td><td><b>7.06 GB</b></td></tr>
<tr><td>Quality, by eye</td><td colspan="2"><b>Indistinguishable</b> — the gap is inside eyeball noise, and the two clips ran at different native resolutions, so it was never a clean A/B</td></tr>
</table>
<p>The four-bit format was twice as fast as the eight-bit one, <em>while rendering more pixels</em>. If bit-width alone set throughput, that result is impossible.</p></div>

The explanation is in what each path actually asks the silicon to do.

  <text x="634" y="168" fill="#c98f8f" font-size="11" font-family="Inter,sans-serif">the integer cores are</text>
  <text x="634" y="184" fill="#c98f8f" font-size="11" font-family="Inter,sans-serif">never engaged at all</text>

  <text x="20" y="252" fill="#aab4c5" font-size="11.5" font-family="Inter,sans-serif">added per-row loop overhead on top. The Q4 path dequantizes to fp16 and runs one standard matmul: fewer detours, 2× the speed.</text>
</svg>

<div class="callout truth"><span class="t">The lesson, which is bigger than this one benchmark</span>
<p>A quantization format has <b>two</b> separate jobs: shrinking the bytes, and engaging a faster arithmetic unit. They are independent, and only the first is guaranteed by the file. Whether the second happens depends on the kernel that reads the file — and on this box, the production int8 path did the first and skipped the second.</p>
<p>The measured 2.05× also sidestepped the other cost from <a href="29-where-numbers-live.html">ch.29</a>: no 2.24 GB integer temporary, which is why Q4 fit 47% more pixels at lower peak VRAM. Two apparently unrelated wins, one cause.</p></div>

<div class="callout warn"><span class="t">The caveats, stated as loudly as the result</span>
<p><b>n = 1.</b> One scene, one seed, one eyeball. A strong signal, not a proven verdict across crowds or fast motion, and no perceptual metric was computed.</p>
<p><b>Part of the gap is self-inflicted.</b> The comparison is Q4 against <em>our patched</em> int8, and the patch that saved 2 GB added loop overhead. Unpatched int8 would be faster and would not have fit the higher resolution.</p>
<p><b>int8 remains the fidelity reference.</b> It is bit-identical to the unpatched int8 path; Q4 is four-bit and <em>matches</em> it rather than beating it (<a href="13-int8-vs-q4.html">ch.13</a>).</p></div>

## What the card is doing, block by block

Zoom back out to the live loop. For each of the 50 blocks, in order:

<table>
<tr><th>Stage</th><th>Who</th><th>What happens</th></tr>
<tr><td>stream</td><td>PCIe</td><td>The block's weights are copied from RAM into VRAM — about 0.4 GB</td></tr>
<tr><td>attention</td><td>tensor cores</td><td>$Q\cdot K^\top \rightarrow \text{softmax} \rightarrow \cdot\, V$ — all of it dot products</td></tr>
<tr><td>feed-forward</td><td>tensor cores</td><td>Two large matmuls with one nonlinearity between them</td></tr>
<tr><td>hand off</td><td>—</td><td>The activation becomes the next block's input and stays on the card</td></tr>
<tr><td>wait?</td><td>depends</td><td><b>Sometimes.</b> On the streamed single-card path a card was measured dropping to about <b>52 W</b> between bursts; on the sharded 720p run the working card measured <b>100% utilisation</b></td></tr>
</table>

That last row used to read as a single fact in this guide, and it was wrong to state it that way.

<div class="callout truth"><span class="t">Memory-bound or compute-bound is a property of the job, not the card</span>
<p>An earlier version of this chapter asserted flatly that the card is memory-bound and idles at low wattage between blocks. That reading is <b>real</b> — it was measured, on a small clip streamed to one card, where each block's arithmetic finishes long before the next 0.4 GB arrives, leaving the chip at a red light.</p>
<p>It is also <b>not general</b>. On <code>g4final</code> — 1280×704 × 345 frames across three cards — the card doing the work sat at <b>100% utilisation</b>, because a clip that large gives each block enough arithmetic to cover the transfer behind it. Same weights, same streaming design, opposite bound.</p>
<p>The rule that survives both observations: <b>a card near its power limit is compute-bound; a card well under it, mid-render, is waiting on the bus.</b> Which one a given render will be is a question to measure — separating kernel time from copy time on one known-good render — not to assume from the hardware (<a href="32-thinking-like-a-circuit.html">ch.32</a>).</p></div>

The practical consequence is a fork in the optimisation road. If a render is transfer-bound, the lever is prefetch and better copies — and no amount of faster silicon helps. If it is compute-bound, the lever is a better kernel or more cards computing at once, and the bus is irrelevant. Building the wrong one is how weeks disappear.

## Where the intelligence actually is

<div class="callout truth"><span class="t">It is arithmetic all the way down</span>
<p>The operation is <b>dumb</b>. A calculator does it. Nothing in $a\times b + c$ knows anything about faces, motion or light.</p>
<p><b>All of the capability lives in the values</b> — the specific twenty billion numbers, set by training. Keep the numbers and change the operation and nothing works; keep the operation and change the numbers and it becomes a different model entirely. The operation is the loom; the weights are the thread.</p>
<p>A face emerges from pure noise because a chain of matrix multiplies <b>drags random floats, step by step, toward the exact floats that decode into that face</b> — steered only by learned values, one multiply-add at a time. Nothing was imagined. Numbers were multiplied and added until they landed on the ones that mean "a face".</p></div>

<div class="callout warn"><span class="t">Which is why the hardware deserves less credit than it gets</span>
<p>A graphics card is not clever; it is <em>fast</em>. A bigger card buys more multiply-adds per second, not a better model. Capability was frozen the moment training ended — the card replays that arithmetic quickly and adds nothing to it.</p>
<p>This is why every genuine quality lever in this guide is about the numbers rather than the silicon: which weights, which precision, how many steps, how the shot is framed (<a href="17-what-actually-improves-quality.html">ch.17</a>). The one exception is capacity — hardware decides what <em>fits</em>, and fitting is what <a href="45-three-gpu-sequence-parallelism.html">ch.45</a> is about.</p></div>

<div class="callout truth"><span class="t">Five things that are now countable</span>
<ol>
<li><b>The whole operation is $a\times b+c$</b> — worked by hand above to 0.179, and identical at scale.</li>
<li><b>Every layer is a matmul:</b> $\text{out}_i = \sum_j x_j \cdot W_{ij}$, with 395 M parameters per block and 50 blocks.</li>
<li><b>The cost is a product, not a mystery:</b> ~32,600 tokens × 20 billion parameters × 2 ≈ $1.3\times10^{15}$ multiply-adds per step — a lower bound that ignores attention's quadratic term.</li>
<li><b>A format shrinks bytes and engages a unit, and those are separate.</b> Measured, the production int8 path dequantized to bf16 and never used the integer cores; Q4 rendered the same scene <b>2.05× faster</b> at higher resolution.</li>
<li><b>Compute-bound versus transfer-bound is a property of the workload.</b> ~52 W between bursts on a small streamed clip; 100% utilisation on the large sharded one. Measure before designing.</li>
</ol></div>
