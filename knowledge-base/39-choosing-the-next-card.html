<span class="kicker">Chapter 39 · The buyer's guide — capacity, rate, and a conclusion that had to be rewritten</span>

# Choosing the Next Card

<p class="lede">A bigger card now buys <b>time, not capability</b> — and that is a change from what this chapter originally said. Native 720p at 15 seconds renders on the three 8 GB cards already in the box; it just costs about <b>44 hours</b>. So the buying question stopped being "what can this hardware not do" and became "what is worth waiting for."</p>

That reframing is the whole chapter, and it is worth being precise about how much moved. Here is what renders on three RTX 3060 Ti cards today, every row a file that exists ([ch.47](47-the-scorecard.html)):

| Resolution × frames | Duration | Steps | Denoise | Verdict |
|---|---|---|---|---|
| 512×288 × 345 | 15 s | 49 | 66 min | **beautiful** |
| 832×480 × 124 | 5 s | 4–50 | minutes to 1 h | the workhorse |
| **1280×704** × 124 | 5 s | 23 | 55 min | **beautiful** |
| **1280×704** × 345 | **15 s** | 23 | **~44 h** | renders natively |

Nothing in that table is out of reach. One row of it costs two days.

<div class="callout truth"><span class="t">The one-line version</span>
<p>Buying decisions on this workload split into two questions that are usually merged into one. <b>Capacity</b> — does the job fit — is now answered by three small cards and the engine that splits work across them. <b>Rate</b> — how long the job takes — is not. Every remaining reason to buy hardware is a rate reason, and rate is worth much less per dollar than capacity was.</p></div>

The workshop version: a bigger bench and a faster machine tool solve different problems. For a year the bench was too small, so everything looked like a bench problem. Bolting three small benches together solved it. What is left to buy is spindle speed, and a faster spindle does not make anything *possible* — it makes work *finish sooner*.

## 1 · What a card can no longer buy

The original version of this chapter was written when native 720p was out of reach, and it recommended a 24 GB card partly on the grounds that some things simply needed one. That reasoning is now dead, and it is instructive to see exactly what killed it.

It was not a purchase. It was three pieces of software:

- **Tiling every per-token operation** put a full 15 seconds at 480p, and 5 seconds at native 720p, on a *single* 8 GB card ([ch.44](44-building-dalang.html)).
- **Sequence parallelism** split one 93,000-token sequence across three cards, holding what no single card can ([ch.45](45-three-gpu-sequence-parallelism.html)).
- **One line in the VAE decoder** — moving finished pixel chunks to CPU instead of letting them accumulate on the GPU — turned a decode that ran out of memory at 720p into one that finished, dropping residency from 7729 to 5639 MiB ([ch.46](46-the-first-15-seconds.html)).

<div class="callout warn"><span class="t">A wall is a hypothesis, not a verdict</span>
<p>That last one deserves attention from anyone about to spend money. "It runs out of memory at 720p" sounds exactly like a hardware ceiling, and it invites a purchase. It was <b>finished output loitering in the wrong memory</b> — an accumulation bug, not a capacity limit. Before concluding that a job does not fit, check whether something inside it is holding data it no longer needs. The cheapest upgrade measured in this whole project was a single line of Python.</p></div>

## 2 · The thing everyone gets backwards: VRAM is not "a bigger quant"

The tempting logic runs: *we run int8 now; more VRAM would let us run a bigger, better quant.* That is backwards in two separate ways.

**First, more bits means more memory, not less.** Quantization *shrinks* a model. The arithmetic ladder, at bytes per parameter:

| Precision | Bytes / param | For 20 billion parameters | Direction |
|---|---|---|---|
| **fp16 / bf16** — highest precision | 2 | ~40 GB | biggest |
| **int8** — what this box runs | 1 | **20 GB** | middle |
| **int4 / Q4** — most compressed | 0.5 | ~10 GB | smallest |

The middle row is not arithmetic, it is the file. The shipped int8 transformer measures **20 GB** on disk, and the parameter count derived from its own config — about 395 M parameters per block across 50 blocks — comes to roughly **20 billion**, which at one byte each closes exactly ([ch.03](03-how-h3-works.html)). The original bf16 release of the transformer is about **66 GB**, larger than the ladder suggests because the shipped int8 build is also pruned.

So int8 is a *middle* rung, not a ceiling. A "bigger" quant needs **more** VRAM. Small VRAM pushes a build *down* the ladder toward int4 — the opposite of being stuck at int8 and needing room to climb.

**Second, the higher precision was already run, and it changed nothing.**

<div class="callout truth"><span class="t">Precision is not the quality lever — measured</span>
<p><b>int8, Q4 and fp16 are indistinguishable on this model.</b> In a head-to-head on the same scene, the higher-precision render was not visibly better; what moves quality is <b>framing, face size and step count</b> ([ch.17](17-what-actually-improves-quality.html)), not the number format. Buying VRAM in order to run a better quant buys the <em>exact quality already in hand.</em></p></div>

This is where the original chapter's arithmetic needs redoing with the measured file sizes rather than the estimated ones.

The claim to test is that a 24 GB card holds the whole model with no offload, eliminating per-step streaming. The pieces: the int8 transformer is **20 GB**, and a render's activation working set was measured at about **5.7 GB** at roughly 25,000 tokens ([ch.36](36-splitting-the-video-cp.html)).

Read the top bar carefully, because it reverses the old advice: **20 + 5.7 = 25.7 GB does not fit a 24 GB card.** A single 24 GB card running int8 would *still* stream weights. The "zero offload" promise only holds for a Q4 build, where the arithmetic is roughly 10 GB of weights plus the same activation — and no Q4 build of this pruned transformer has been measured here, so that row is arithmetic, not a measurement.

The bottom bar is the important one anyway. On an 8 GB card, weights are not what fills the card: **one streamed block is about 0.65 GB** ([ch.36](36-splitting-the-video-cp.html)), and roughly **88%** of the peak was activation and matmul working buffers, not resident weights ([ch.14](14-the-math-behind-it.html)). The whole "fit the model" framing was aimed at the smaller half of the problem all along.

## 4 · The number that sets render speed — and the measurement that corrected it

This chapter used to say, plainly, that denoise is memory-bound and therefore memory bandwidth sets render speed. Profiling on the box says otherwise, and the honest thing is to show both.

<div class="callout warn"><span class="t">What was claimed, and what was measured</span>
<p><b>The claim:</b> "denoising is memory-bound — the wall-clock is dominated by moving weights, not by doing maths — so a card with double the bandwidth renders each step roughly twice as fast."</p>
<p><b>The measurement:</b> at the configuration profiled, the box ran at <b>SM 100%</b> with about <b>8 seconds per step</b>, and streaming the whole model from RAM accounted for roughly <b>1 to 1.5 seconds</b> of that. Eliminating <em>all</em> streaming would therefore cap the win at about <b>1.1–1.15×</b>. The shader cores are saturated; the transfer is largely hidden behind them.</p></div>

This does not make bandwidth irrelevant — a card with more bandwidth generally also has more shader cores, and the two arrive together. It does mean the *reason* to want a bigger card is not the one the old text gave. **Killing offload is not where the hours are.** The hours are in doing the arithmetic, fifty blocks at a time, once per step.

## 5 · The speed-up that actually happened was software

The one measured 2× on this box did not come from a card. It came from changing which kernel does the multiply.

The same scene, the same pipeline, the same seed, int8 against a **Q4_K_M** build ([ch.13](13-int8-vs-q4.html)):

| Metric | int8 (with our patch) | Q4_K_M | Result |
|---|---|---|---|
| Render time | 6393 s (**107 min**) | 3122 s (**52 min**) | **Q4, 2.05× faster** |
| Native resolution | 576×320 | 704×384 | **Q4, 47% more pixels** |
| Peak VRAM | 7.5 GB | 7.06 GB | **Q4, lower** |
| Quality by eye | ~85 | ~85 | **tie, within noise** |

Q4 was faster *while rendering at a higher resolution*, which makes the gap stronger than the headline. The mechanism is specific and worth knowing, because it is the kind of thing a spec sheet cannot tell anyone: the production int8 path **dequantizes back to bf16** and never engages the INT8 tensor cores at all, while the Q4 path dequantizes to fp16 and runs one ordinary matmul — and it sidesteps the 2.24 GB `fast_int8_mm` temporary entirely, which is also why it fits more pixels at lower VRAM ([ch.14](14-the-math-behind-it.html)).

<div class="callout warn"><span class="t">The caveats, so this is not over-read</span>
<p><b>One scene, one seed.</b> A strong signal, not a verdict across crowds, fast motion or other subjects. <b>Part of the gap is self-inflicted:</b> our own row-blocking patch added per-row loop overhead to int8, so this is "Q4 versus <em>our patched</em> int8", not "Q4 versus raw int8". And <b>quality was judged by eye</b>, with no PSNR or LPIPS. Honest read: <b>indistinguishable</b>, with int8 the higher-fidelity reference that Q4 matches rather than beats.</p></div>

The lesson for a buyer stands regardless of the caveats. A software change produced a **2.05×** on this workload. The measured ceiling from abolishing all weight streaming is about **1.15×**. It is worth being sure the software is finished before concluding the hardware is the problem.

## 6 · So what does a bigger card actually buy?

Time, at a knowable exchange rate. The measured cost of denoise, per step, on this box:

| Configuration | s/step | 23 steps | 49 steps |
|---|---|---|---|
| 512×288 × 345 | 81 s | 0.5 h | 1.1 h |
| 1280×704 × 124 | 143 s | 0.9 h | 1.9 h |
| 832×480 × 345 | 193 s | 1.2 h | **2.6 h** |
| 1280×704 × 345, three cards sharded | **6600 s** | **42 h** | **90 h** |

A card that were genuinely twice as fast end to end would turn 44 hours into 22, and 2.6 hours into 1.3. That is the entire purchase, stated honestly: **the same films, sooner.**

<div class="callout spec"><span class="t">Two cheaper levers hit the same number harder</span>
<p>Look at the last row against the third. Going from 832×480×345 to 1280×704×345 is <b>2.26× the tokens</b>, and quadratic attention predicts about <b>5×</b> the time. Measured: <b>34×</b>. The three-card sharded path carries roughly <b>7× overhead beyond the mathematics</b> — hand-rolled ring attention in Python loops, plus a copy of every block to every card, every step ([ch.45](45-three-gpu-sequence-parallelism.html)). That overhead is <em>ours</em>, and optimising it is free.</p>
<p>And the step count is a property of the <b>scene</b>, not the model: 4 steps for a tight close-up, 23 for a character mid-shot, 49 for a wide vista with a small distant subject ([ch.47](47-the-scorecard.html)). Cutting a habitual 49 to a justified 23 halves the bill on hardware already owned.</p></div>

Against that, the route the measurements actually recommend costs nothing at all:

| Route | Denoise | Output |
|---|---|---|
| **832×480 × 345 at 49 steps, then a 1.54× upscale** | **2.6 h** | 15 s, 720p-class, well-sampled |
| Native 1280×704 × 345 at 49 steps | **90 h** | 15 s, true native |

Roughly **35× cheaper** for a difference most viewers cannot see. Before spending money to make the 90-hour route into a 45-hour route, it is worth noticing that the 2.6-hour route already exists.

## 7 · The three vendors, for this exact workload

Everything above is vendor-neutral. The *software* is not — this whole stack is CUDA.

| | **NVIDIA** (used 3090) | **AMD** (RX 7900 XTX) | **Intel** (Arc Pro B60) |
|---|---|---|---|
| VRAM | 24 GB | 24 GB | 24 GB |
| Bandwidth | **936 GB/s** | ~960 GB/s | **456 GB/s** |
| Price | ~$700 used | ~$900 | ~$600 new |
| Software stack | **CUDA — this code runs unchanged** | ROCm; a port, and the 7900 XTX is the one supported consumer card | oneAPI / SYCL / IPEX, thinnest for diffusion video |
| Runs H3 today | yes | with porting work | pioneer territory |
| Best for | **running this pipeline** | learning ROCm, and capable | cheap LLM inference |

For reference, the cards in the box run at about **448 GB/s** each — and so does an RTX 5060 Ti 16 GB. Newer silicon, identical bandwidth. Model year is not the number to read.

<div class="callout danger"><span class="t">Two traps</span>
<ol>
<li><b>Cross-vendor cannot pool.</b> Two NVIDIA cards plus two AMD cards is <em>not</em> a four-GPU box. CUDA and ROCm are separate worlds — no shared memory, no cross-vendor collective, no ring. It is two independent rigs sharing a chassis, and everything in <a href="36-splitting-the-video-cp.html">ch.36</a> and <a href="45-three-gpu-sequence-parallelism.html">ch.45</a> assumes one world.</li>
<li><b>A 24 GB card with slow memory is the wrong trade.</b> The Intel B60 holds 24 GB at 456 GB/s. Capacity without rate is precisely the axis that is no longer the constraint here.</li>
</ol></div>

## 8 · To learn a non-CUDA stack, spend nothing first

If the goal is not "run this pipeline better" but "learn AMD or Intel as a skill," there is no reason to buy hardware to find out whether it is enjoyable. The **AMD AI Developer Program** provides **$100 of free AMD Developer Cloud credits** on **Instinct MI300X** GPUs — 192 GB of VRAM, ROCm and PyTorch pre-installed, no setup. Learn ROCm on properly supported hardware for free, then decide whether to buy a Radeon.

The consumer AMD reality is worth knowing before committing: only the 7900 XTX is fully supported, and cards like the 6700 XT need the `HSA_OVERRIDE_GFX_VERSION=10.3.0` spoof and can segfault on newer ROCm. Cheap, and rough.

## 9 · The recommendation, by goal

<div class="callout truth"><span class="t">Buy for the actual goal</span>
<ol>
<li><b>"Finish the same work sooner."</b> A used <b>RTX 3090, 24 GB</b>, around $700. More bandwidth and more shader cores than a 3060 Ti, 24 GB of capacity, and this stack runs on it unchanged. Buy it for the clock, not for a capability — the capabilities already exist.</li>
<li><b>"New, warranted, low power, same speed accepted."</b> An <b>RTX 5060 Ti 16 GB</b>. Double the VRAM of one 3060 Ti at the same 448 GB/s, so per-step speed is unchanged.</li>
<li><b>"Learn a non-NVIDIA stack."</b> The <b>free AMD MI300X cloud</b> first, at zero cost. A 7900 XTX only if it becomes a habit.</li>
<li><b>"Cheapest 24 GB for LLM inference."</b> The Intel B60 — but not for this video pipeline.</li>
<li><b>"Spend nothing."</b> Genuinely competitive with all of the above, on the evidence in this chapter: fix the 7× overhead in the sharded path, budget steps by scene instead of by habit, and take the 832×480-plus-upscale route that is already about 35× cheaper.</li>
</ol></div>

<div class="callout truth"><span class="t">The takeaways</span>
<ol>
<li><b>The conclusion changed.</b> Native 720p × 15 s renders on three 8 GB cards, at about 44 hours. A bigger card buys <b>time</b>, not capability.</li>
<li><b>Capacity and rate are different purchases.</b> Capacity was solved in software — tiling, sequence parallelism, and one line in the VAE decoder. Rate was not.</li>
<li><b>More VRAM is not a bigger quant.</b> More bits means more memory. int8 is a middle rung; small VRAM pushes downward toward int4, not upward.</li>
<li><b>Precision is not the quality lever</b> — int8, Q4 and fp16 are indistinguishable here. Framing, face size and steps are what move quality.</li>
<li><b>24 GB would not make the int8 model resident.</b> 20 GB of weights plus about 5.7 GB of activation is 25.7 GB. The old "zero offload" promise only holds for a Q4 build.</li>
<li><b>"Memory-bound" was the wrong diagnosis.</b> Measured at SM 100% and about 8 s per step with roughly 1–1.5 s of streaming, abolishing all offload caps out near <b>1.1–1.15×</b>.</li>
<li><b>The only measured 2× came from software</b> — a Q4 kernel path, 52 minutes against 107, at higher resolution and lower VRAM, quality a tie. With caveats: one scene, one seed, and a patched int8 baseline.</li>
<li><b>CUDA is the moat.</b> This stack runs unchanged only on NVIDIA, and cross-vendor cards cannot pool into one job.</li>
<li><b>The cheapest upgrade in this project was one line of Python.</b> Check the software before concluding the hardware is the problem.</li>
</ol></div>
