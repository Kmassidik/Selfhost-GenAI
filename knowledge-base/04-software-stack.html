# The Software Stack

<p class="lede">Nothing in this system talks directly to anything else. Between a sentence and a spinning graphics card sit six layers of software, each one translating for the layer above it — and when a setup breaks, it is almost never the model. It is two neighbouring layers disagreeing about a version number.</p>

Learning to read the stack is the difference between "it doesn't work" and "PyTorch was built against CUDA 12.8 and my driver only exposes 12.1."

Notice the pairing between the two grey layers. The driver exposes **CUDA 13.2**, while PyTorch was built against **CUDA 12.8**. That mismatch is fine — and understanding *why* saves hours.

<div class="callout spec"><span class="t">The version rule that matters</span>
<p><b>A newer driver runs older CUDA builds. An older driver cannot run newer ones.</b></p>
<p>So the check is never "do these match?" but "is the driver's CUDA version <em>at least</em> what PyTorch was built for?" 13.2 ≥ 12.8, so it runs. Had the driver been on 12.1, the same PyTorch would have failed at import with a message about the CUDA runtime — and that error names the wrong culprit, which is why people reinstall PyTorch when they should be updating a driver.</p></div>

## The stack changed — and that is the story

This chapter was first written when ComfyUI ran everything. It no longer does.

<div class="callout truth"><span class="t">Then and now</span>
<table class="arc">
<tr><th>Layer</th><th>At the start</th><th>Now</th></tr>
<tr><td>Orchestration</td><td>ComfyUI 0.30 + custom node packs</td><td><b>Our own two-phase pipeline</b></td></tr>
<tr><td>Library</td><td>ComfyUI's own loaders</td><td>diffusers 0.40 + torchao 0.18</td></tr>
<tr><td>Offloading</td><td>ComfyUI "DynamicVRAM"</td><td><b>Explicit group offloading we control</b></td></tr>
<tr><td>PyTorch</td><td colspan="2" style="text-align:center">2.11 + cu128 — unchanged throughout</td></tr>
<tr><td>Driver / CUDA</td><td colspan="2" style="text-align:center">595.84 / 13.2 — unchanged throughout</td></tr>
</table>
<p>The bottom half never moved. Everything that changed sits in the top two layers — which is exactly what a well-layered stack is supposed to allow. We replaced the orchestration without touching the driver, CUDA, or PyTorch once.</p></div>

## Why a separate Python

The system shipped **Python 3.14** — new enough that PyTorch had no prebuilt package for it. Rather than fight the system interpreter and risk breaking OS tooling, we installed an isolated **Python 3.12** using `uv`.

<div class="callout spec"><span class="t">The principle: isolate everything</span>
<p>A <b>virtual environment</b> is a sandboxed Python with its own packages. The golden rule of self-hosting: <b>never install AI packages into the system Python.</b> One project, one environment. Versions stop colliding, and cleanup becomes a single directory delete.</p></div>

## Two file formats: safetensors vs GGUF

Weights arrive in different containers, and choosing wrong cost a **20 GB re-download**.

<table>
<tr><th></th><th>safetensors</th><th>GGUF</th></tr>
<tr><td>Built for</td><td>PyTorch, diffusers</td><td><code>llama.cpp</code>, <code>stable-diffusion.cpp</code></td></tr>
<tr><td>What happened</td><td>Loaded first try</td><td>Rejected: <em>"Unknown model architecture"</em></td></tr>
</table>

The GGUF we downloaded was genuinely MiniMax-H3 — but built for a different runtime. The loader could open the container and still not recognise what was inside.

<div class="callout warn"><span class="t">The lesson</span>
<p>"MiniMax-H3" plus "GGUF" is not enough information. The <b>loader</b> has to understand that specific architecture, in that specific container. Prefer whatever format the official repository publishes <em>for your engine</em>. Later a different Q4 GGUF <em>did</em> work, from a repo that targeted our stack (<a href="13-int8-vs-q4.html">ch.13</a>) — proving the format was never the problem. The pairing was.</p></div>

## Quantization: how 66 GB becomes 20 GB

The transformer in its original precision — bf16, 16 bits per number — is about **66 GB**. We run a **20 GB** version. The technique is **quantization**: store each weight in fewer bits.

<table>
<tr><th>Precision</th><th>Bits per weight</th><th>Size</th><th>On Ampere (sm_86)?</th></tr>
<tr><td>bf16 (original)</td><td>16</td><td>~66 GB</td><td>Far too large</td></tr>
<tr><td><b>int8 — what we use</b></td><td>8</td><td><b>~20 GB</b> (pruned)</td><td>✅ Native int8 hardware</td></tr>
<tr><td>fp8</td><td>8</td><td>~21 GB</td><td>⚠️ Emulated — needs Ada or Hopper</td></tr>
<tr><td>fp4 / nvfp4</td><td>4</td><td>~13 GB</td><td>❌ Needs Blackwell</td></tr>
</table>

<div class="callout truth"><span class="t">Why int8 and not the smaller fp4</span>
<p>Smaller is not automatically better. Ampere has fast <b>int8</b> hardware and <b>no</b> native fp8 or fp4. A workflow that defaults to an fp4 encoder will run — by emulating the format in software, slowly — while a format the silicon actually implements runs at full speed.</p>
<p><b>Match the quantization format to the GPU generation</b>, not to the smallest file. "Just grab the smallest download" is how people end up with a model that fits and crawls.</p></div>

### Your own logs prove this every run

Look at the first two lines of any render log on this machine:

```
Failed to load .../torchao/_C_cutlass_90a.abi3.so
Failed to load .../torchao/_C_mxfp8.cpython-310-x86_64-linux-gnu.so
Unable to import `torchao` Tensor objects.
```

Those look alarming and are completely harmless. Read the filenames:

- **`cutlass_90a`** — `90a` means **sm_90a**, the compute capability of **Hopper** datacentre cards. We are on sm_86.
- **`mxfp8`** — microscaling FP8, a **Blackwell**-era format.

torchao ships kernels for every GPU generation and tries them all at import. On Ampere, the Hopper and Blackwell ones cannot load, so it says so and falls back to what our silicon does support. **Two error messages, every render, that are simply the library discovering which decade of hardware it is running on.**

<div class="callout warn"><span class="t">Version drift is real — and quiet</span>
<p>The model's own config records <code>_diffusers_version: 0.36.0.dev0</code>. The installed library is <b>0.40.0.dev0</b>. It works, but that gap is exactly where subtle breakage lives — a renamed argument, a changed default, a function body that moved.</p>
<p>This matters concretely here: some of our fixes are patches that copy upstream function bodies and change one line (<a href="46-the-first-15-seconds.html">ch.46</a>). An upgrade cannot revert them — but it can silently <em>outdate</em> them. <b>Pin your versions, and re-check any patch after upgrading.</b></p></div>
