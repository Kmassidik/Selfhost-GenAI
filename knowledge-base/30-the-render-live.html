# The Render, Live

<p class="lede">A render is a relay: the disk hands the model to system RAM, RAM hands one block at a time to a graphics card over PCIe, the card does the arithmetic and hands the result back, and fifty of those hand-offs make one step. Everything slow about this machine is a consequence of how many times that relay runs.</p>

The measured render `g4final` — 1280×704, 345 frames, 23 steps — took about **44 hours**, at **6845 seconds per step**. Almost two days of a machine doing one thing. It is tempting to imagine something enormously complicated happening in there. What is actually happening is the same short sequence, **1,150 times**: fetch a block, multiply, discard, fetch the next.

This chapter follows that sequence from the moment a render is launched to the moment an `.mp4` appears, and says at each point which component is busy and which is waiting.

## The cast

Six components take part, and only one of them does arithmetic.

<table>
<tr><th>Component</th><th>This build</th><th>Its job in a render</th></tr>
<tr><td><b>Disk</b></td><td>879 GB, 585 GB free</td><td>Holds the model files at rest. Read once at the start; written once at the end. Idle for everything in between</td></tr>
<tr><td><b>System RAM</b></td><td>125 GB DDR3-1600</td><td>Holds the whole model for the duration. This is the <em>source</em> every streamed block is copied from</td></tr>
<tr><td><b>PCIe</b></td><td>3.0 ×16, ~12 GB/s in practice</td><td>The road between RAM and a card. Every block drives across it, every step</td></tr>
<tr><td><b>CPU</b></td><td>2 × Xeon E5-2665 — 16 cores, 32 threads</td><td>Chooses the next block, issues the copies, assembles inputs, runs ffmpeg at the end. <b>Never does the denoising arithmetic</b></td></tr>
<tr><td><b>GPU chips</b></td><td>3 × RTX 3060 Ti, 200 W each</td><td>The arithmetic — attention and feed-forward for every block, then the VAE decode</td></tr>
<tr><td><b>VRAM</b></td><td>8 GB per card, 448 GB/s</td><td>Holds only what a chip needs right now: one block (~0.4 GB) plus the video in progress</td></tr>
</table>

The structural analogy that survives contact with the details is a **kitchen with a pantry down the corridor**. The chef is the chip; the countertop is VRAM; the pantry is RAM; the corridor is PCIe. The pantry is enormous and the countertop is tiny, so nothing is ever "in the kitchen" for long — ingredients are carried in for one dish and cleared away. The corridor is what costs time, and the corridor does not get shorter when the chef gets faster.

Note the last road on that diagram. Card-to-card transfer on this board runs at about **4.9 GB/s** — slower than pulling the same block from system RAM at ~12 GB/s. On hardware with NVLink the ranking is reversed, and a great deal of multi-GPU folk wisdom assumes the reversed order. Here it does not hold, and that single inequality shapes every design decision downstream (<a href="24-pcie-nvlink-interconnect.html">ch.24</a>).

## Phase A — reading the prompt, in its own process

The encoder is 26 GB and the transformer is 20 GB. Rather than negotiate for space between them, the pipeline never lets them meet.

A first process loads **only** the encoder blocks, reads the prompt, writes what it understood to a `.pt` file on disk, and exits. A second process then starts, loads **only** the transformer, and reads that file back. The 26 GB never enters the second process at all.

<div class="callout truth"><span class="t">A side effect that turned out to matter more than the memory saving</span>
<p>Prompt understanding is <b>reusable</b>. The embeddings for a scene are fixed; steps, resolution, seed and engine are not. Encode a scene once and it can be re-rendered indefinitely — at 480p to check the motion, at 720p for the final — without paying the encoder again.</p>
<p>In practice this is why the working directory accumulates dozens of embedding files that get re-rendered constantly, and why the "cost of a render" in this guide almost never includes the encoder (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>).</p></div>

## Phase B — the loop, where all the hours are

The second process loads the int8 transformer, installs block-level offloading, and starts denoising. From here to the end, one pattern repeats.

For each of the **50 blocks**, in order:

1. The CPU issues a copy of that block's weights — about **0.4 GB** — from RAM into VRAM.
2. The chip runs the block: attention, then the feed-forward network, then the residual adds.
3. The result — the activation — stays on the card and becomes the input to the next block.
4. The block's weights are freed. Their copy in RAM was never touched.

When block 49 finishes, that is **one step**, and the whole thing begins again at block 0.

<div class="callout spec"><span class="t">The traffic, stated once</span>
<p>Fifty blocks of 0.4 GB is <b>20 GB moved per step</b> — the whole model. A 23-step render moves about <b>460 GB</b> across PCIe; a 49-step render moves about <b>980 GB</b>. None of it is new data. It is the same twenty gigabytes, fetched again and again, because 8 GB of VRAM cannot keep it and 0.4 GB is what fits.</p></div>

### One dangerous switch in this phase

Offloading has an option to overlap copies with compute by pinning host memory. On this box it is left **off**, deliberately.

<div class="callout danger"><span class="t">`use_stream=True` kills the process with no traceback</span>
<p>Enabled, it pins tens of gigabytes of host RAM, the kernel's out-of-memory killer takes the process, and nothing is written to any log — the render simply ceases. The setting stays <code>False</code>. Transfers are slower and the render survives, which on a job measured in days is the only trade that matters.</p></div>

## Phase C — decode, once

When the last step ends, the latent is finished but unwatchable: 24 channels of numbers that mean nothing outside the model. The visual VAE expands it into pixels and the audio VAE into 32 kHz stereo. This happens **once**, and it is cheap relative to the loop — but it is where two of this project's most expensive failures happened, because "cheap" and "safe" are different words.

The decode does not run on the whole clip at once. It works in **clips of latent frames**, and spatially it tiles at 256×256 with 64 pixels of overlap so that neighbouring tiles blend rather than seam.

<div class="callout danger"><span class="t">Two real decode failures, both after the expensive part was done</span>
<p><b>`g4j`</b> completed <b>6 hours 10 minutes</b> of denoise and then died on the <em>first line</em> of decode: the pipeline resolved its device as <code>cuda:0</code> while the sharded forward had returned latents on the CPU. Both decode entry points carried the same bug (<code>decoders.py:185</code> and <code>:245</code>). Six hours of correct arithmetic, discarded by a device-placement mismatch.</p>
<p><b>`g4k`</b> ran out of memory at <code>[vae] clip 14</code>. The cause was not capacity: the decode appended every finished pixel chunk — about <b>216 MB</b> each at 1280×704 — to a list that lived on the GPU. Chunk fourteen had nowhere to go. Moving finished chunks to CPU memory on append fixed it. An accumulation bug, not a wall.</p>
<p>Both are the reason the pipeline now dumps latents to disk <em>before</em> decode is allowed to run, and why a separate tool can rebuild the video from a dump (<a href="48-the-pipeline-without-comfyui.html">ch.48</a>). On a two-day render, the recovery path is part of the design.</p></div>

Two readings are worth making explicit.

**Step count is a property of the scene, not the machine.** A tight close-up resolves in **4** steps; a character mid-shot needs about **23**; a wide vista with a small distant subject needs **49**. `g4k` is the counter-example that proves it: three steps at full 720p, five and a half hours of real compute, and the output was mud. Steps cannot be economised by asking nicely.

**The cost of length is not linear.** `cp15sd` renders fifteen seconds at 512×288 in 81 seconds per step. `g4final` renders the same fifteen seconds at 1280×704 in 6845 seconds per step — 2.26× the tokens for **34×** the time. Attention's quadratic term predicts roughly 5×, so the sharded three-card path carries something like **7× overhead beyond the mathematics**. That overhead is the subject of <a href="45-three-gpu-sequence-parallelism.html">ch.45</a>, and it is the honest reason native 720p×15 s is described here as a proven capability rather than a workflow (<a href="47-the-scorecard.html">ch.47</a>).

## Reading the machine while it runs

Two numbers from `nvidia-smi` say more about a render than any log line: **utilisation** and **power draw**. A chip only pulls near its power limit when its arithmetic units are genuinely busy, so wattage is a live readout of which wall the job is hitting.

The honest answer is that this build has produced *both* readings, on different work, and the difference is the useful part.

<div class="callout truth"><span class="t">What a low reading means, and what it does not</span>
<p>On the streamed single-card path, a card was measured drawing about <b>100 W of its 200 W limit</b>, with utilisation flickering between 100% and the low tens. That is not a card being lazy. It is a card <b>waiting for data</b> — most of the interval spent idle while PCIe drags the next 0.4 GB block over from RAM, spiking only during the compute burst. Low power, flickering utilisation and slow steps are one symptom with one name: <b>waiting on the bus</b>.</p>
<p>On the three-card sharded run behind <code>g4final</code>, the card doing the work measured <b>100% utilisation</b>. Same hardware, same streaming design, different bound — because at 1280×704 × 345 frames there is vastly more arithmetic per block to hide the transfer behind.</p>
<p>So the rule is real but conditional: a chip pinned near its power limit is <b>compute-bound</b>; a chip well under it, mid-render, is <b>waiting on data</b>. What is <em>not</em> safe is deciding in advance which one a given render will be. This project has asserted both and been half right each time.</p></div>

That last sentence is not rhetorical modesty. A design study for the three-card engine reasoned from "the chip is pegged" that streaming was worth only a small fraction of step time, while the live single-card power reading pointed the other way. Both observations were real; they came from different workloads. The conclusion that survived is procedural: **separate kernel time from copy time on one known-good render before designing anything around the answer** (<a href="32-thinking-like-a-circuit.html">ch.32</a>).

## The whole run, in one place

<div class="callout truth"><span class="t">Five phases, and which component owns each</span>
<ol>
<li><b>Load</b> — disk to RAM, once. Disk and CPU busy, the cards idle. Minutes.</li>
<li><b>Encode</b> — the 26 GB encoder reads the prompt in its own process and writes embeddings to disk, then exits. Reusable forever after.</li>
<li><b>Denoise</b> — for every step, for every one of 50 blocks: copy 0.4 GB in, compute, discard. PCIe and the chips alternating. <b>Hours to days, and 99% of the wall-clock.</b></li>
<li><b>Decode</b> — once. Latent to pixels in overlapping tiles, and to 32 kHz stereo. Cheap, and historically the most dangerous phase on this build.</li>
<li><b>Save</b> — the CPU muxes frames and audio into an <code>.mp4</code>. Seconds.</li>
</ol>
<p>One sentence to carry: <b>the model lives in RAM and only visits the cards.</b> Everything expensive follows from how often it has to visit.</p></div>
