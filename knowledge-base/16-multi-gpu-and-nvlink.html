# Multi-GPU &amp; NVLink

<p class="lede">Three consumer graphics cards with no NVLink can render a job that no single one of them could hold — and they cannot make any job faster. Which of those two things is on offer is decided entirely by the wire between the cards, and on this machine that wire was measured at <b>4.9 GB/s</b> while the memory <em>inside</em> each card runs at about <b>448 GB/s</b>. Roughly ninety times slower, and that ratio is the whole chapter.</p>

This chapter was originally written with two cards in the box and a flat conclusion at the top. It is worth reading that conclusion again before anything else, because half of it was wrong and the other half explains everything that happened next.

> *"Two consumer GPUs can run two renders in parallel (2× throughput) — but they cannot combine into one bigger/faster render, because our cards have no NVLink and talk over slow PCIe. It's a hardware-class limit, not a setting we missed."*

<div class="callout truth"><span class="t">What actually happened</span>
<table>
<tr><th></th><th>Predicted here</th><th>Measured later</th></tr>
<tr><td>One render across several cards</td><td>"cannot combine"</td><td><b>Done.</b> Native 1280×704 at 15 s, all three cards holding one sequence (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>, <a href="46-the-first-15-seconds.html">ch.46</a>)</td></tr>
<tr><td>Cost of doing it</td><td>—</td><td>2.26× the tokens cost <b>34× the time</b></td></tr>
<tr><td>Would it be <em>faster</em>?</td><td>no</td><td><b>Correct.</b> It is slower than one card, per unit of work</td></tr>
<tr><td>Reason given</td><td>the interconnect</td><td><b>Correct</b>, and the size of the penalty is exactly the size of the interconnect gap</td></tr>
</table>
<p>The prediction confused <em>impossible</em> with <em>expensive</em>. The wire does not forbid splitting a render; it prices it. What it genuinely forbids is <b>speed</b>. Everything below is the mechanism behind that distinction.</p></div>

## What NVLink is, and why the cards here do not have it

**NVLink is a physical high-speed bridge that wires GPUs directly to each other.** It is hardware: dedicated lanes on the silicon plus, on the consumer cards that ever shipped with it, a plastic-and-copper **bridge connector** clipped across the tops of two boards. Drivers and NCCL *use* it. No software creates it.

<div class="callout spec"><span class="t">The roads analogy, and where it stops being a metaphor</span>
<p><b>PCIe</b> is the public road every device uses to reach the rest of the computer — through the motherboard slot, shared with everything else. <b>NVLink</b> is a private bridge built directly between two GPUs, bypassing the public road entirely.</p>
<p>The analogy stops being decorative at one specific point: on a public road, two cars going between neighbouring houses still have to drive out to the main junction and back. That is not a figure of speech here. Traffic from GPU 0 to GPU 1 on this box literally goes <b>GPU 0 → host RAM → GPU 1</b>, two hops through the CPU, because direct peer-to-peer access is off.</p></div>

<div class="callout warn"><span class="t">These cards physically cannot have it</span>
<p>The RTX 3060 Ti has <b>no NVLink connector at all</b>. NVIDIA shipped NVLink on a handful of high-end consumer cards — the <b>3090</b> was the last — and then removed it entirely; the 4090 has none. So the three cards in this machine can only talk over PCIe. Even if every layer of software above them supported splitting a render perfectly, the fast link that makes splitting cheap does not exist on this silicon.</p></div>

## The topology, measured

A forty-line PyTorch script, run on this hardware, no framework in the way:

<div class="callout truth"><span class="t">What the wire actually does here</span>
<table>
<tr><td><b>GPU ↔ GPU bandwidth</b></td><td><b>4.9 GB/s</b>, both directions</td></tr>
<tr><td>Direct peer-to-peer access</td><td><b>No</b> — traffic routes GPU → host RAM → GPU, two hops</td></tr>
<tr><td>Topology class</td><td><code>PHB</code> — the cards meet <em>at the CPU host bridge</em>, not on a shared PCIe switch</td></tr>
<tr><td>IOMMU</td><td>enabled (<code>DMAR</code>) — actively blocks direct GPU-to-GPU DMA</td></tr>
<tr><td>Link</td><td>PCIe 3.0 ×16 (reported at a lower generation when idle; it ramps under load)</td></tr>
<tr><td>For comparison</td><td>NVLink moves 300–900 GB/s — <b>60 to 180× more</b></td></tr>
<tr><td>And for scale</td><td>VRAM <em>inside</em> one card: <b>448 GB/s</b></td></tr>
</table>
<p>Peer-to-peer is off for two independent reasons, either of which is sufficient: the <code>PHB</code> topology and the enabled IOMMU. Turning the IOMMU off is testable, but the topology would likely still forbid P2P — and even a best-case direct PCIe 3.0 path is an order of magnitude under NVLink. This is not a configuration anyone overlooked. It is the wiring.</p></div>

### Why one of them is free and the other is not

In the left-hand arrangement the cards never speak. Each holds a whole model and a whole job; the interconnect carries only the weight stream from RAM that a single card would need anyway. Nothing about NVLink, PHB or IOMMU applies. This is why "two cards, two renders" worked from the first day and still works.

The right-hand arrangement is different in kind. Inside a transformer block, **every operation is per-token except one**: the norms, the modulation, the residual adds and the whole feed-forward network act on each row independently, so each card can do its own third locally. Attention is the one line where every row must see every other row. So once per attention layer, each card has to obtain what the other two are holding — and there are **50 layers**, repeated for every step of the schedule.

That is the traffic the wire has to carry, and the wire is the slowest component in the machine by two orders of magnitude.

<div class="callout danger"><span class="t">The number to remember</span>
<p><b>2.26× the tokens cost 34× the time.</b> Quadratic attention accounts for about 5× of that. The remaining <b>~7×</b> is the cost of doing the work on three cards that can only reach each other at 4.9 GB/s — the gather traffic per attention layer, and three separate processes each streaming their own copy of the weights from system RAM.</p></div>

### Where the extra 7× comes from

Three contributions, all of them structural rather than accidental:

1. **Gather traffic.** Each attention layer requires each card to see the other cards' slices. On a 448 GB/s bridge this would be nearly free. At 4.9 GB/s it is not, and it happens 50 times a step, every step.
2. **Weight streaming, times three.** The model does not fit on any card, so weights are streamed from RAM as usual — about **0.4 GB per block**, roughly **460 GB of PCIe traffic for a 23-step render** on a single card. Three processes each do their own streaming, on the same bus that is also carrying the gather traffic. They contend.
3. **Synchronisation.** Every gather is a barrier. The slowest card sets the pace for all three, at every one of the 50 layers, at every step. Idle time is invisible in a utilisation graph and very visible on a clock.

<div class="callout warn"><span class="t">The failure that proves point 2 — ring-3 context parallelism</span>
<p>An earlier attempt to run three-way context parallelism <b>ran out of memory</b>, and not on the GPU side of the problem: <b>offloading re-copied the weights per process</b>. Three processes, three full staging copies, and system RAM ran out before the cards did. The fix is architectural — share the staged weights, or accept fewer processes — and the lesson generalises: on a streaming design, adding a card multiplies the <em>host</em> cost too, not only the GPU cost.</p></div>

## The bugs that only exist above one card

Splitting a render introduces a class of failure that simply cannot occur on a single GPU: **every tensor now has a residence**, and most library code was written assuming there is only one place to be.

<div class="callout danger"><span class="t"><code>g4j</code> — six hours of denoise, killed on the first line of decode</span>
<p>The render finished <b>6 h 10 m</b> of denoising correctly, then died immediately when decoding began. The cause: <code>_execution_device</code> resolved to <code>cuda:0</code>, while the sharded forward pass had returned its latents on the <b>CPU</b>. The decoder tried to use one and was handed the other. The same bug sat in <b>both</b> decode paths — <code>decoders.py:185</code> and <code>decoders.py:245</code>.</p>
<p>Nothing about this is a hardware limit, and nothing about it would have happened on one card. It is the price of a code path where "the device" stopped being a single answer.</p></div>

The practical rule that came out of it: on a multi-card path, **assume nothing about where a tensor is**. Check, move, and check again — particularly at the seams between components written by different people.

## Is single-render multi-GPU a real technique elsewhere?

Yes, and it is well documented. [xDiT](https://arxiv.org/pdf/2411.01738) parallelises diffusion across GPUs and reports 3.9× on CogVideoX and 8.4× on eight A100s. Those are published figures from data-centre hardware with fast interconnects — exactly the conditions this box lacks. When the original version of this chapter checked, xDiT did not support MiniMax-H3 either, which is part of why the path here was built from scratch ([ch.36](36-splitting-the-video-cp.html), [ch.45](45-three-gpu-sequence-parallelism.html)) rather than adopted.

The contrast is the useful part: **on a fast link, splitting a render buys speed. On this link, splitting a render buys capacity and charges speed for it.**

<tr><td>More finished clips per day</td><td>three independent renders, one per card</td><td><b>Works.</b> No card-to-card traffic at all; the only shared resource is system RAM and the PCIe bus</td></tr>

<tr><td>A sharper image</td><td>—</td><td>Not a hardware question at all. Step count and prompt do more (<a href="17-what-actually-improves-quality.html">ch.17</a>)</td></tr>

## And the honest economics

Capability is not the same as workflow. Native 720p at 15 seconds **works** and costs roughly **44 hours** at 23 steps — about 90 at 49. The same 15 seconds rendered at 832×480 with 49 steps is **2.6 hours of denoise**, then a 1.54× upscale to 720p: roughly **35× cheaper** for a difference most viewers cannot see.

<div class="callout truth"><span class="t">The three-card verdict</span>
<p>Three cards without NVLink give <b>throughput for free</b> and <b>capability at a price</b>. They never give speed. The 15-second native-720p render is a <b>proven capability, not a production workflow</b> — the thing that makes it worth having is knowing the ceiling exists, not living at it.</p>
<p>And the reasoning generalises past this hardware. Before adding a card to any machine, ask which of the two arrangements the goal needs. If the answer is throughput, the wire does not matter and almost any card helps. If the answer is one bigger job, the wire is the entire question — and the specification to check is not the GPU's, it is the link's.</p></div>
