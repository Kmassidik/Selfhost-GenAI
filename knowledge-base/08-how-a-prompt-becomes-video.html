# How a Prompt Becomes a Video

<p class="lede">A prompt becomes a video by being read once into a block of numbers, and then used — over and over, for every one of the render's steps — to steer the gradual removal of noise from a small grid of random static, which a pair of decoders finally expands into frames and sound. Nothing is retrieved. Every frame is invented on the spot.</p>

Take one sentence — *"a woman singing"* — and follow it all the way through. It is worth doing slowly, because almost every cost this project measured is a consequence of *where* along this path the data becomes heavy.

## The one idea to hold onto

The model is **not** a search engine. It never looks up a video of a woman singing, and there is no library of clips inside it to look up. It starts from **pure random numbers** and, guided by the meaning of the sentence, **removes what it judges to be noise** until what remains happens to look like a woman singing.

That sounds like a technicality. It is the reason for everything else. A search engine's cost scales with the size of its index; a generator's cost scales with how much it has to invent. Fifteen seconds of video is three times as much invention as five seconds — and, because of how the invention works, far more than three times the cost.

## ① The words become meaning (the Encoder)

The sentence is first chopped into **tokens** — roughly, pieces of words — and each token becomes an integer index. Those integers become vectors, and the vectors flow through the **text/vision encoder**. In H3 that encoder is **Qwen3-VL-32B**, a full 32-billion-parameter vision-language model, and at **26 GB** it is the largest single file in the whole system.

Twenty-six gigabytes to read a four-word sentence looks absurd until you ask what the sentence has to carry. "Singing" has to imply a mouth that opens and closes in time with a sound that does not exist yet. "A woman" has to imply a coherent human body that stays the same body for the whole clip. None of that is *in* the words. It is in the understanding of the words, and understanding is what costs 26 GB.

The encoder's job is not to store the sentence; it is to turn it into a position in a very high-dimensional space of meaning. What comes out is a block of numbers called the **conditioning** — the instruction sheet the generator will consult on every single step of the render.

<div class="callout spec"><span class="t">Two details that matter downstream</span>
<p><b>The tap is at layer 50, not the end.</b> H3 does not take the encoder's final output. A language model's last layer is specialised for its own job — predicting the next word — while its middle layers hold a more general representation of meaning. H3 reaches in and takes the hidden states halfway up the stack (<a href="03-how-h3-works.html">ch.03</a>).</p>
<p><b>The encoder runs in its own process and then exits.</b> 26 GB of encoder and 20 GB of generator do not comfortably coexist on 24 GB of total VRAM, so on this build they are never in memory at the same time. The encoder reads, writes its conditioning to disk, and dies. Only then does the generator load. That has a pleasant consequence: a prompt encoded once can be re-rendered at any resolution, any step count, any seed, without paying the 26 GB again.</p></div>

<div class="callout spec"><span class="t">What about reference images? (the ref2va path)</span>
<p>A reference image — a face, a character — is <b>not pasted into the video</b>. It rides through the <b>encoder</b> as extra conditioning, right beside the text, and steers the denoise loop toward <em>this specific face</em>. That is how identity stays locked across a whole scene or across a band's members (<b>ref2va</b>). Feeding the <em>last frame of one clip as the first frame of the next</em> (<b>fl2va</b>) is the same trick through a different door — it pins the starting pixels instead of the identity.</p>
<p>Either way, references become <em>numbers that bias the noise removal</em>, never pixels that get copied. This is also why chained fl2va clips hold a scene together but let a photoreal face drift: nothing in that path is anchoring identity, only continuity (<a href="33-long-video-small-card.html">ch.33</a>).</p></div>

## ② The blank canvas is static (the Noise)

The generator does **not** start from a black screen or an empty buffer. It starts from a block of pure random numbers drawn from a bell curve — television static — but in a compressed form called **latent space**.

Working on real pixels would be hopeless. A single 1280×704 frame is about 2.7 million numbers, and a fifteen-second clip is 345 of them. So the video is squished: **16× smaller in each spatial dimension** and roughly **4× in time**. What the transformer actually sees is a small coded grid.

That grid is not abstract. When one of our renders crashed mid-flight, the saved latent for an 832×480 clip of 124 frames had shape:

```
(1, 24, 37, 30, 52)
 │   │   │   │   └── 52 wide   = 832 ÷ 16
 │   │   │   └────── 30 tall   = 480 ÷ 16
 │   │   └────────── 37 latent frames, from 124 real ones
 │   └────────────── 24 latent channels (not red, green, blue)
 └────────────────── one clip
```

That is about **1.4 million numbers**. Compare it to the finished pixels — 832 × 480 × 3 × 124 is roughly 149 million — and the compression is about a hundredfold. This is the only reason a model of this size can touch video at all.

<div class="callout truth"><span class="t">A latent is not a small picture</span>
<p>The temptation is to imagine the latent as a thumbnail. It is not. Those <b>24 channels</b> are not colours; they are whatever the VAE found convenient to encode during its own training, and a human looking at any one of them sees nothing recognisable. Only the decoder knows how to turn them back into light. Everything from here until the very last stage happens in this uninterpretable space.</p></div>

<div class="callout warn"><span class="t">The 848-pixel trap</span>
<p>Before entering the transformer, latent cells are grouped into patches of <code>[1, 2, 2]</code> — one frame by two by two. Four neighbouring cells become one token, cutting the sequence length by four. That means the latent grid must have <b>even</b> width and height.</p>
<p>848 ÷ 16 = 53, which is odd, and patching fails with a shape error deep inside the model that never mentions resolution. 832 ÷ 16 = 52, which is even, and works. Choose widths and heights where the number after dividing by 16 is even. This cost real debugging time.</p></div>

## ③ The sculptor removes the noise (the DiT — the heart)

Now the **Omni-Transformer** — the DiT, 20 GB of int8 weights across 50 blocks — goes to work. Its loop is short enough to state in four lines:

1. Look at the current noisy latent, at *which* noise level it is at, and at the conditioning from ①.
2. Push all of that through 50 transformer blocks in sequence.
3. Out comes a **prediction of which part of the latent is noise** — a grid the same shape as the input.
4. The scheduler subtracts a *fraction* of that prediction. Repeat.

Picture fog clearing into a figure. Early steps set composition — where things are, what is roughly happening. Late steps set detail — edges, texture, the light on a cheekbone.

<div class="callout spec"><span class="t">What actually changed after one step</span>
<p>The latent has exactly the same shape it started with — <code>(1, 24, 37, 30, 52)</code>, still about 1.4 million numbers. Nothing got bigger. Nothing became an image. The numbers are simply <b>slightly less random</b> and slightly more like a video that matches the conditioning. That is the entire operation, and it is all a step ever does.</p></div>

### Three properties of this loop explain every measurement in this guide

**Video and audio are sculpted together.** H3 denoises the picture latent *and* the sound latent as one shared sequence, through the same 50 blocks. The video contributes 24 latent channels, the audio contributes its own 32. That is what "omni-modal" means concretely: not two models glued together with a lip-sync pass on the end, but one stack carrying both. The singing voice and the mouth movements are born synchronised because they were never separate things to synchronise.

**Every token looks at every other token.** This is attention, and it is where the money goes. To keep frame 40 consistent with frame 1, and the shape of the mouth matched to the sound at that instant, each patch of each frame must weigh its relationship to all the others across space *and* time.

Fourteen thousand video tokens is already a long sequence, and it is for a five-second clip at 832×480. Triple the length and raise the resolution and the pair count climbs quadratically — which is the wall the whole project keeps running into. Measured on this build, the same scene at native 1280×704 took **55 minutes at five seconds** and roughly **44 hours at fifteen**. Three times the length, nearly fifty times the cost, because on top of the quadratic maths the longer sequence also forced a slower way of splitting work across cards ([ch.45](45-three-gpu-sequence-parallelism.html)).

**Each step is one full pass of the entire model.** Twenty billion parameters spread over 50 blocks is about **0.4 GB per block**, and on this build those blocks live in system RAM and are copied into VRAM one at a time. One step therefore reads the whole 20 GB. A 23-step render drags roughly **460 GB** across the PCIe bus — the entire model, pulled over from system memory twenty-three times ([ch.02](02-your-hardware.html)).

### How many steps, and why the answer is not about the model

The step count is the main quality dial in this guide, and the surprising thing we measured is that the right value is a property of the **scene**, not of H3.

<div class="callout spec"><span class="t">Measured on this build</span>
<table>
<tr><th>Content</th><th>Steps needed</th></tr>
<tr><td>Tight close-up</td><td><b>4</b></td></tr>
<tr><td>Character, mid-shot</td><td><b>23</b></td></tr>
<tr><td>Wide vista with a small distant subject</td><td><b>49</b></td></tr>
</table>
<p>A close-up is mostly one large, simple subject; composition settles almost immediately. A wide landscape has fine detail everywhere <em>and</em> a subject occupying a handful of latent cells, and it needs an order of magnitude more corrections to resolve.</p></div>

<div class="callout danger"><span class="t">What too few steps actually produces</span>
<p>Not a blurry version of the right picture — <b>mud</b>. A wide landscape rendered at 1280×704 for fourteen seconds with only <b>3 steps</b> ran for about five and a half hours and produced an unusable clip. Stopping early does not give an unfinished image; it gives one whose composition was never settled in the first place, because the early steps are exactly the ones that decide where things are.</p>
<p>The same failure at the other end of the scale is instructive: 832×480 for fifteen seconds at <b>49 steps</b> took 66 minutes and came out beautiful. Resolution was not the deciding factor. Step count was.</p></div>

<div class="callout warn"><span class="t">Two shortcuts that did not survive contact</span>
<p><b>Step-reducing LoRAs.</b> At 480p, a LoRA visibly softened the image; the base model at full step count was sharper. Fewer steps is not free quality.</p>
<p><b>SageAttention.</b> A faster attention kernel that works elsewhere produces <b>pure noise</b> on H3. It stays off.</p></div>

## ④ The dream is decoded into reality (the VAEs)

After the last step there is a **clean latent** — meaning the model believes no noise is left to remove — and it is still 1.4 million uninterpretable numbers. Two decoders expand it into something a person can perceive:

- **Visual VAE** (4.9 GB) blows the latent grid back up into RGB frames, undoing the 16× spatial and ~4× temporal compression.
- **Audio VAE** (0.6 GB) turns the 32-channel audio latent into a **32 kHz stereo waveform**.

This stage runs **once**, at the very end, and it is short compared to the loop. But it is not free, and it is not safe. Decoding hundreds of full-resolution frames means holding a lot of pixels at once, and the memory cost scales with frame count rather than with step count — a completely different curve from everything before it. The visual VAE therefore ships with **tiling on by default**, decoding in 256×256 patches with a 64-pixel overlap so that neighbouring tiles agree at their seams.

<div class="callout danger"><span class="t">Two renders died here, after all the expensive work was done</span>
<p>This stage is where the project lost the most time, and both failures are worth knowing because neither was a capacity wall.</p>
<p><b>The device bug.</b> One render completed <b>6 hours 10 minutes</b> of denoise and then died on the <em>first line</em> of decode: the pipeline resolved its execution device to <code>cuda:0</code> while the sharded forward pass had returned latents on the CPU. Two lines of code, both in the decode path, and six hours of finished work with nowhere to go.</p>
<p><b>The accumulation bug.</b> Another render reached <code>[vae] clip 14</code> and ran out of memory — not because the frames were too big, but because the decoder appended every <em>finished</em> pixel chunk to a list that lived on the GPU, roughly 216 MB at a time. The fix was to move each finished chunk to CPU on append. The card was never short of memory for the actual decode; it was short of memory for the pile of results nobody had put away.</p>
<p>The general lesson: the loop and the decode are separate stages, and verifying one proves nothing about the other (<a href="46-the-first-15-seconds.html">ch.46</a>).</p></div>

---

## ⑤ The last mile (mux, and the upscale decision)

The frames and the waveform get **muxed** into a single MP4 with the audio in step. That is the end of the model's involvement.

What happens next is a choice, and it is one of the most consequential in the whole project. Native 720p at fifteen seconds *works* — it is proven, and it costs about 44 hours at 23 steps. The same fifteen seconds rendered at 832×480 with 49 steps takes about **2.6 hours** of denoise and can then be upscaled 1.54× to 720p. That is roughly **35× cheaper** for a difference most viewers cannot see.

<div class="callout truth"><span class="t">A proven capability is not the same as a workflow</span>
<p>Native 720p × 15 s is a real result and it belongs in the scorecard. It is not how films get made on this hardware. The production path is: render small with <em>enough steps</em>, then upscale. Step count buys structure; resolution mostly buys sharpness, and sharpness is the part an upscaler can add afterwards (<a href="07-optimization-720p.html">ch.07</a>).</p></div>

---

## The whole story, in one breath

> A sentence becomes a **coordinate in meaning-space** (the encoder, 26 GB, run once and then evicted). A block of **static** in compressed space is **repeatedly nudged** toward that meaning by a 20 GB transformer whose 50 blocks are streamed from RAM on every step, and inside which every video and audio token weighs every other. The result is a **clean compressed description of a video**, which two decoders **expand into pixels and sound**. Mux, and optionally upscale.

Every number this project chased is a consequence of where in that journey the data is heaviest. The 26 GB encoder sets a fixed cost that does not care how long the clip is. The loop sets a cost that scales quadratically with tokens and linearly with steps. The decode sets a cost that scales with frame count and nothing else. Three different curves, three different failure modes — and once the shape of each is clear, the cost profile stops being mysterious.

---

## The pixel question: regression, not classification

There is one idea left, and it is the most commonly missed. Anyone who knows how a language model produces text will assume an image model works the same way. It does not.

<table>
<tr><th></th><th>LLM (text)</th><th>Image/video model</th></tr>
<tr><td>Final act</td><td><b>Classification</b> — logits over a ~50k vocabulary → softmax → <b>sample one discrete token</b></td><td><b>Regression</b> — directly <b>compute continuous numbers</b>, all at once</td></tr>
<tr><td>Output type</td><td>a discrete symbol, one of ~50,000</td><td>continuous values; there is no vocabulary</td></tr>
<tr><td>Where randomness enters</td><td>every token is drawn from a distribution</td><td>only the <b>initial noise seed</b>; the rest is deterministic arithmetic</td></tr>
</table>

**There is no softmax over 0–255. The network never picks a pixel value from a distribution.** It regresses continuous numbers, and the conversion to bytes at the end is a rescale that a pocket calculator could do.

**Why the difference is fundamental.** Words are discrete symbols: token 128 and token 129 are unrelated, so the only sensible operation is to *classify*. Pixels are a continuous signal: 128 and 129 are nearly the same shade, so the sensible operation is to *regress*. Diffusion trains the network to predict the continuous noise to remove, which is a mean-squared-error regression target — never a per-pixel classification over 256 categories.

<div class="callout warn"><span class="t">One word, two meanings</span>
<p><b>"Sampling"</b> means different things on either side of this divide. In a language model it means drawing a token from a probability distribution, and it is the source of that model's randomness. In diffusion it means <em>the denoising loop itself</em> — integrating a trajectory — and it has nothing to do with per-pixel probability.</p>
<p>Which is why the same seed and the same prompt give the same video, frame for frame. The only randomness in the entire render was the block of static it started from.</p></div>

## What this journey does not include

- **No retrieval.** Nothing is looked up, because there is nothing to look up.
- **No notion of truth.** The objective is plausibility. A confident wrong output is the system working as designed.
- **No reliable text.** Readable on-screen lettering is out of reach for any current video diffusion model; letters come out as plausible-looking marks.
- **No guarantee of identity across clips.** A photoreal face rendered twice will drift; stylised characters hold far better.
