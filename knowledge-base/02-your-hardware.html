# Your Hardware &amp; the Offload Trick

<p class="lede">A graphics card is two separate things that get blurred into one word: a <b>processor</b> that does arithmetic, and a small pool of <b>memory</b> attached to it. Almost every confusion about running large models on small hardware comes from mixing those up.</p>

The model we run needs about 46 GB. The card this project started on had 8 GB. Understanding exactly which 8 GB, and what the other 38 were doing, is the whole chapter.

## Four things people blur together

<table>
<tr><th>Component</th><th>What it is</th><th>The starting machine</th><th>Analogy</th></tr>
<tr><td><b>GPU</b> (the chip)</td><td>The processor that does the math — thousands of small cores multiplying numbers in parallel</td><td>RTX 3060 Ti</td><td>The <b>chef</b></td></tr>
<tr><td><b>VRAM</b></td><td>Memory <em>on</em> the graphics board. Extremely fast, physically close to the chip, and small</td><td><b>8 GB</b></td><td>The <b>countertop</b> — small, right next to the chef</td></tr>
<tr><td><b>System RAM</b></td><td>The computer's main memory. Much bigger, several times slower, and on the far side of a cable</td><td><b>60 GB</b></td><td>The <b>pantry</b> next door</td></tr>
<tr><td><b>Disk</b> (NVMe)</td><td>Permanent storage. Huge, slowest by far. Where model files sit at rest</td><td>148 GB</td><td>The <b>delivery truck</b> outside</td></tr>
</table>

<div class="callout truth"><span class="t">"Is it the VRAM doing the work, or the GPU?"</span>
<p>Both, always, together — but they do different jobs. <b>The GPU chip does all the computing. VRAM is the workbench it computes on.</b> Nothing is calculated "in" VRAM; numbers are simply kept there because the chip can reach them fast.</p>
<p>Measured on a live render: <b>100% GPU utilisation, 198.5 W of a 200 W limit, SM clock 1770 MHz</b>. That is the chip flat out. A CPU-only run would show the GPU at 0%. The 5 GB of VRAM in use was just the working set sitting on the bench.</p></div>

### Why the difference matters

Speed and distance are the whole story. VRAM sits millimetres from the chip on the same board, and on this card delivers roughly **448 GB/s**. System RAM is across a PCIe cable and an order of magnitude slower to reach. Disk is slower again.

So the design goal is never "get everything into VRAM" — it is **make sure whatever the chip needs next is already on the bench.**

## The problem: the model does not fit

The quantized model is about **46 GB**. The countertop is **8 GB**. There is no arrangement of those numbers that works directly.

## The fix: stream the weights

The trick is to stop insisting the model lives in VRAM. Keep all the weights in system RAM, and copy each **layer** onto the card just before it is needed. Compute that layer, free the space, fetch the next.

The GPU never holds more than a slice, so peak VRAM depends on the size of one layer — not the size of the model.

In the early days of this project that streaming was done by ComfyUI, which called it *DynamicVRAM offloading*. Its logs showed the weights parked in RAM waiting their turn:

```
Model MiniMaxH3     ... 19995 MB Staged   (the 20 GB transformer)
Model MiniMaxH3TE   ... 25882 MB Staged   (the 26 GB text encoder)
```

*Staged* meant "in RAM, ready to stream". VRAM stayed near 5 GB while 46 GB of model sat behind it. We later dropped ComfyUI entirely and did the streaming ourselves ([ch.48](48-the-pipeline-without-comfyui.html)) — but the mechanism is the same one, and it is the single idea that makes any of this possible.

<div class="callout warn"><span class="t">Why it works, and why it is slow</span>
<p>Copying weights across PCIe before every layer is traffic the chip has to wait on. That is the bargain: you trade <b>speed</b> for the ability to run a model far larger than your VRAM. When you see the card sitting at low utilisation mid-render, it is usually not idle — it is waiting for the next slice to arrive.</p></div>

## Following one render, from launch

The mechanism above is easier to believe once you watch it happen. These are real log lines from one of our renders, in order, with what is physically happening at each point.

### Phase 1 — loading, about 3½ minutes

You start the program. Nothing touches the GPU yet.

```
Loading checkpoint shards: 100%|██████████| 14/14 [02:00<00:00,  8.61s/it]
[h3den] transformer int8 em RAM em 121s
[h3den] restante carregado: ['scheduler','audio_scheduler','vae','video_processor','audio_vae']
[h3den] fase B pronta em 206s
```

Read those carefully, because the important word is in the third line: **`em RAM`** — *in RAM*.

The 46 GB of weights are read from disk in fourteen chunks and placed in **system memory**. Not on the graphics card. If you ran `nvidia-smi` during these two minutes you would see the GPU sitting at roughly **35 MiB used, 0% utilisation** — completely idle while the machine does nothing but shovel files into RAM.

<div class="callout spec"><span class="t">Where the model is at each moment</span>
<table>
<tr><th>Moment</th><th>Disk</th><th>System RAM</th><th>VRAM</th></tr>
<tr><td>Before launch</td><td>all 46 GB</td><td>—</td><td>—</td></tr>
<tr><td>After ~2 min</td><td>all 46 GB (still there)</td><td><b>all 46 GB</b></td><td>~35 MiB (empty)</td></tr>
<tr><td>During the render</td><td>unchanged</td><td>all 46 GB</td><td><b>one layer at a time</b></td></tr>
</table>
<p>The weights are never <em>moved</em> to the GPU. They are <b>copied</b> there in slices, over and over, for the entire render — and the copy is thrown away each time.</p></div>

### Phase 2 — the loop, about 44 hours

Now the card finally does something. This is the whole rest of the render:

```
[g4]   block 0/50
[g4]   block 10/50
[g4]   block 20/50
```

Fifty blocks make up the model. For each one: copy its weights from RAM to VRAM, compute, discard, fetch the next. When block 49 finishes, that is **one step** — and the whole thing starts again at block 0 for the next step.

Measured on this build: **138 seconds per block**, so about **115 minutes per step**, and 23 steps comes to roughly **44 hours**.

That picture is the point. **Loading the model is a rounding error.** It happens once and takes minutes; the streaming happens 50 times per step, 23 steps in a row, for two days. Which is why nobody optimises the load and everybody optimises the loop.

### Phase 3 — decode, then the file

When the last step ends, the video decoder runs — once — turning the finished latent into pixels, a chunk of frames at a time:

```
[vae] clip 1
[vae] clip 2
...
[h3den] audio salvo (32000Hz)
[h3den] saida: h3-lab/render.mp4
```

Then an `.mp4` and a `.wav` exist on disk, and the GPU goes back to 35 MiB.

<div class="callout truth"><span class="t">The whole run in four lines</span>
<ol>
<li><b>Load</b> — 46 GB of weights from disk into system RAM. Minutes. GPU idle.</li>
<li><b>Loop</b> — for every step, for every one of 50 blocks: copy a slice to VRAM, compute, throw it away. Hours to days. GPU pinned.</li>
<li><b>Decode</b> — expand the finished latent into real pixels. Once.</li>
<li><b>Write</b> — save the video and audio files.</li>
</ol>
<p>If you remember one thing: <b>the model lives in RAM and only visits VRAM.</b> The graphics card never holds it.</p></div>

## What this chapter originally predicted — and what actually happened

Written when this project ran on one card, this chapter made a forecast. It is worth keeping, because it turned out to be wrong in an instructive way.

> *"15 s (H3's max) — likely near/over 8 GB, may not fit. On this card, short clips are the sweet spot. Long, high-res video is where you'd want a 24 GB+ GPU."*

<div class="callout truth"><span class="t">The verdict, measured later</span>
<table>
<tr><th></th><th>Predicted here</th><th>What actually happened</th></tr>
<tr><td>15 s at high resolution</td><td>"may not fit"</td><td><b>Rendered at native 1280×704</b></td></tr>
<tr><td>Hardware needed</td><td>"a 24 GB+ GPU"</td><td><b>Three 8 GB cards</b></td></tr>
<tr><td>Cost</td><td>—</td><td>44 hours</td></tr>
</table>
<p>The prediction was right that <b>8 GB of VRAM cannot hold it</b>, and wrong that this made it impossible. What changed was not the hardware's capacity but how the work was divided across it — splitting one video's activations across three cards (<a href="45-three-gpu-sequence-parallelism.html">ch.45</a>). The reasoning was sound; the assumption that one card must hold one render was not.</p></div>

This is the pattern worth taking from the chapter: **memory limits are usually about arrangement, not capacity.** Twice more in this guide something looked like a hardware wall and turned out to be a question of where data was being kept ([ch.46](46-the-first-15-seconds.html)).

## What fills VRAM during a render

Two things, and only one of them can be streamed away.

1. **The model slice** — roughly fixed, because it is one layer at a time.
2. **The video latent** — the thing being denoised. It grows with resolution × frames, must stay resident for the whole step, and **cannot be offloaded the way weights can.**

That second item is the real ceiling. Measured points from this build:

<table>
<tr><th>Clip</th><th>Resolution × frames</th><th>Render time</th></tr>
<tr><td>Smoke test</td><td>512×320 × 5 frames (0.2 s)</td><td>~57 s</td></tr>
<tr><td>Ocean demo</td><td>768×448 × 73 frames (3.0 s)</td><td>348 s (5.8 min)</td></tr>
<tr><td>Short 720p</td><td>1280×704 × 124 frames (5.2 s)</td><td>55 min</td></tr>
<tr><td>Long 720p</td><td>1280×704 × 345 frames (14.4 s)</td><td><b>44 h</b></td></tr>
</table>

Compare the last two rows: 2.8× the frames cost **48× the time**. That is attention's quadratic cost from [Chapter 1](01-what-is-genai.html) showing up as wall-clock, plus the overhead of splitting across cards. It is why the honest advice on this hardware is still *short clips, or long clips at lower resolution then upscaled* — not because longer is impossible, but because of what it costs ([ch.47](47-the-scorecard.html)).
