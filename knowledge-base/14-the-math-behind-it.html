# The Math Behind It All

<p class="lede">Every number this build fought over — the 6.5 GB memory floor, the $2.24$ GB int8 buffer, the $1.87\times$ resolution win, the 20 GB model file, the $34\times$ jump in cost from 480p to 720p — comes out of about a dozen equations. This chapter derives all of them, in order, from a prompt to a finished file.</p>

None of this is decorative. Each formula below was written down *because* something on the machine cost more than expected, and the formula is what explained it. Read the sections that answer a question actually being asked; the rest will still be here.

<div class="callout spec"><span class="t">How to read the math</span>
<p>Block equations are <code>$$ … $$</code>, inline math is <code>$…$</code> — rendered live by <b>KaTeX</b>, bundled locally so it works offline. Notation is consistent throughout: $d$ is the hidden dimension, $N$ is sequence length, bold symbols are tensors, $\theta$ is the set of model weights, and $S$ is the number of sampling steps.</p></div>

---

## 0 · The whole pipeline as one chain

A prompt $P$ becomes tokens, then a meaning-vector, then a latent, then pixels and sound. The full chain in symbols:

$$
P \;\xrightarrow{\;\text{tok},\;E\;}\; \mathbf{x}^{(0)} \;\xrightarrow{\;f_{1:50}\;}\; \mathbf{c}
\quad\xrightarrow[\;\text{Euler, } S \text{ steps}\;]{\;\dot{\mathbf{z}} = v_\theta(\mathbf{z},t,\mathbf{c})\;}\quad
\mathbf{z}_0 \;\xrightarrow{\;\text{VAE}\;}\; \big(\mathbf{V},\ \mathbf{A}\big)
$$

Three arrows, three completely different kinds of cost. The first is a one-off. The second runs $S$ times and dominates the wall clock. The third runs once, and is where the most expensive failures of this project happened, because it runs *after* everything else has been paid for.

---

## 1 · Text becomes meaning

A tokenizer chops the string into integer tokens, then an embedding table $E$ looks each one up:

$$
\mathbf{t} = \mathrm{tok}(P) \in \mathbb{N}^{L}, \qquad
\mathbf{x}^{(0)} = E[\mathbf{t}] \in \mathbb{R}^{L \times d}
$$

The encoder — Qwen3-VL-32B, 26 GB on disk — is a stack of transformer layers $f_\ell$, and H3 taps the hidden state at layer 50 rather than reading the final output:

$$
\mathbf{x}^{(\ell)} = f_\ell\big(\mathbf{x}^{(\ell-1)}\big),\ \ \ell = 1\dots 50
\qquad\Longrightarrow\qquad
\mathbf{c} = \mathbf{x}^{(50)} \in \mathbb{R}^{L \times d}
$$

That tap is worth pausing on. The last layer of a language model is specialised for predicting the next token; a middle layer holds a more general representation of *meaning*. H3 wants the meaning, not the prediction, so it reaches in and takes the intermediate state.

Each layer is attention plus a feed-forward network, with residual connections around both:

$$
f_\ell(\mathbf{x}) = \mathbf{x} + \mathrm{FFN}\big(\mathbf{x} + \mathrm{Attn}(\mathbf{x})\big)
$$

**Attention** — the core operation, and the origin of the famous quadratic cost:

$$
\mathrm{Attn}(\mathbf{x}) = \mathrm{softmax}\!\left(\frac{\mathbf{Q}\mathbf{K}^{\top}}{\sqrt{d_k}}\right)\mathbf{V},
\qquad
\mathbf{Q} = \mathbf{x}W_Q,\ \ \mathbf{K} = \mathbf{x}W_K,\ \ \mathbf{V} = \mathbf{x}W_V
$$

The score matrix $\mathbf{Q}\mathbf{K}^{\top} \in \mathbb{R}^{N \times N}$ is why compute scales as $\mathcal{O}(N^2)$: every element compared against every other. The $\sqrt{d_k}$ divisor is not cosmetic — without it the dot products grow with dimension, the softmax saturates, and gradients vanish during training.

The feed-forward part is applied to each token independently and is usually the larger of the two in parameters:

$$
\mathrm{FFN}(\mathbf{x}) = \sigma\big(\mathbf{x}W_1 + b_1\big)W_2 + b_2, \qquad W_1 \in \mathbb{R}^{d \times d_{\text{ffn}}}
$$

This whole stage runs **once**, before any denoising, and $\mathbf{c}$ is then reused by every step. Its cost is fixed, and that matters later when Amdahl's law arrives.

---

## 2 · The canvas is noise, in latent space

Video and audio are never generated in raw pixels. They live in a compressed **latent** grid, and generation starts from pure Gaussian noise:

$$
\mathbf{z}_1 \sim \mathcal{N}(\mathbf{0}, \mathbf{I}), \qquad
\mathbf{z}_1 \in \mathbb{R}^{C \times F' \times H' \times W'}
$$

The VAE compresses space by a factor of 16 in each direction, which is the only reason a model this size can touch video at all:

$$
H' = \frac{H}{16}, \qquad W' = \frac{W}{16}
$$

Time compresses too, by roughly a factor of four — but only roughly, and the difference is measurable. The video VAE works in clips of 17 frames with 3 dropped at the seams, so the latent frame count is not a clean division.

<div class="callout warn"><span class="t">Where the naive formula and the measurement disagree</span>
<p>For an 832×480 clip of 124 frames, the measured latent shape is <code>(1, 24, 37, 30, 52)</code>. Spatially the formula is exact: $480/16 = 30$ and $832/16 = 52$. Temporally, $124/4 = 31$, but the real answer is <b>37</b>. The extra latent frames come from how clips are chunked and overlapped, not from a different compression ratio. Treat $F' \approx F/4$ as a planning estimate and the measured shape as the truth.</p></div>

### From latent to tokens — the number that sets every price

The transformer does not see the latent grid. It sees a **sequence**, produced by cutting the grid into patches. The config sets `patch_size` to $[1,2,2]$: no grouping in time, $2\times2$ in space.

$$
N \;=\; F' \times \frac{H'}{2} \times \frac{W'}{2}
$$

Fourteen thousand tokens is the whole story of this build in one number. It is what makes a step take minutes instead of milliseconds, and it is what makes doubling the resolution far worse than doubling the cost.

### The channels line up, which is a useful check

Two config values are worth cross-checking against the VAE, because a mismatch here is the kind of error that produces a shape exception four layers deep. The transformer declares `in_channels` = 24 and `audio_in_channels` = 32. The video VAE declares `latent_channels` = 24 and the audio VAE `latent_channels` = 32. They agree exactly, which confirms that the DiT consumes VAE latents directly — no adapter, no reprojection.

One value does *not* line up, and that is deliberate. `text_dim` is **5120**, while `hidden_size` is **5376**. The encoder's output width and the transformer's working width are different numbers, so the conditioning $\mathbf{c}$ has to pass through a projection $\mathbb{R}^{5120} \to \mathbb{R}^{5376}$ before it can be attended to. That is what `num_refiner_layers` = 2 is for: a short adapter stack that reshapes the text representation into something the DiT's own geometry can use.

---

## 2b · Position — how a token knows where it is

Attention has no inherent notion of order. The softmax over $\mathbf{Q}\mathbf{K}^{\top}$ is a comparison of content, and if the sequence were shuffled the mathematics would not notice. For text that is merely wrong; for video, where a token's meaning is inseparable from *which frame and which corner of the picture* it came from, it would be fatal.

The fix is **rotary position embedding**. Rather than adding a position vector to the token, RoPE *rotates* each pair of dimensions in $\mathbf{Q}$ and $\mathbf{K}$ by an angle proportional to position, using a geometric series of frequencies set by `rope_theta` = 10000:

$$
\omega_j = \frac{1}{10000^{\,2j/d_k}}, \qquad j = 0 \dots \tfrac{d_k}{2}-1
$$

Low $j$ gives fast rotation — fine positional detail; high $j$ gives slow rotation — coarse, long-range position. With $d_k = 128$ there are 64 such frequency pairs per head, and `rope_theta` is the 10000 that sets how quickly the frequencies decay.

The property that makes this work is that a dot product between two rotated vectors depends only on the *difference* of their angles:

$$
\big\langle R(\omega m)\,\mathbf{q},\ R(\omega n)\,\mathbf{k}\big\rangle = g\big(\mathbf{q},\ \mathbf{k},\ m-n\big)
$$

So attention scores become functions of **relative** position, without any position ever being stored in the value being attended over. For video the rotation is applied across three axes — frame, height and width — so a token carries where it is in time and where it is on the canvas simultaneously.

<div class="callout spec"><span class="t">Why this matters practically</span>
<p>Relative positioning is a large part of why the same weights handle 512×288 and 1280×704 without retraining: the model never learned "position 4 371", only "seven patches to the left, two frames back". It is also why resolution is constrained by patch arithmetic rather than by a learned position table — and why the <a href="07-optimization-720p.html">848-pixel trap</a> is a shape error rather than a quality regression.</p></div>

---

## 3 · Flow matching — generation is an ODE

H3 is a **flow-matching** model. It does not "remove one notch of noise" the way classic DDPM does. It learns a **velocity field** $v_\theta$, and generating means **integrating an ordinary differential equation** from noise at $t=1$ to data at $t=0$, steered the whole way by the meaning $\mathbf{c}$:

$$
\boxed{\;\frac{d\mathbf{z}_t}{dt} = v_\theta(\mathbf{z}_t,\ t,\ \mathbf{c})\;}
\qquad \mathbf{z}_1 = \text{noise} \;\longrightarrow\; \mathbf{z}_0 = \text{clean latent}
$$

The training objective explains why this is a *regression* problem and not a classification one. Along the straight path $\mathbf{z}_t = t\,\mathbf{z}_1 + (1-t)\,\mathbf{z}_0$ between a real sample and a noise sample, the correct velocity is the constant $\mathbf{z}_1 - \mathbf{z}_0$, and the model is trained to predict exactly that:

$$
\mathcal{L} = \mathbb{E}_{t,\mathbf{z}_0,\mathbf{z}_1}\Big\|\, v_\theta(\mathbf{z}_t, t, \mathbf{c}) - (\mathbf{z}_1 - \mathbf{z}_0)\,\Big\|^2
$$

A squared error against a target vector. No probabilities over pixels, no discrete choices anywhere. And $v_\theta$ is the entire transformer — a DiT running over the packed video-and-audio latent sequence.

---

## 4 · Sampling is discretising that ODE

Split $t \in [0,1]$ into $S$ steps. The `euler` sampler is literally Euler's method, and each step is one full forward pass through all fifty blocks:

$$
\mathbf{z}_{t-\Delta t} = \mathbf{z}_t - \Delta t \cdot v_\theta(\mathbf{z}_t, t, \mathbf{c}), \qquad \Delta t = \frac{1}{S}
$$

The true cost driver is the **number of function evaluations**:

$$
\mathrm{NFE} = S \times (\text{solver order})
$$

Euler is first order, so its local error is $\mathcal{O}(\Delta t)$ — big steps miss the curve. That single fact explains the most expensive failure in the render log.

<div class="callout truth"><span class="t">The 5½-hour lesson</span>
<p>The <code>g4k</code> render was 1280×704 × 345 frames at <b>3 steps</b>. It cost about five and a half hours and produced an unusable clip. The intuition that fewer steps means "the same picture, rougher" is wrong for an ODE solver: too few steps do not blur the destination, they <em>change</em> it. Composition never resolves because the trajectory left the neighbourhood of the correct solution in the first chord.</p></div>

Step count is therefore not a quality slider to turn down when a render is expensive. It is a property of the **scene**: a tight close-up settles at $S=4$, a character mid-shot at $S=23$, a wide vista with a small distant subject needs $S=49$. Scenes with fine detail spread everywhere and a small subject have a more curved trajectory, and a more curved trajectory needs shorter chords.

There is a way to cheat this, in principle. A distilled variant learns a *different, straighter* velocity field $v_\theta \to v'_\theta$, one whose trajectory is close enough to a straight line that four or six Euler steps are accurate. That is not integrating the same ODE more crudely — it is **changing the ODE** into one well-conditioned for coarse solvers. On this build such a distillation was never wired in; the one LoRA that was actually tried, at 480p, softened the image rather than sharpening it ([ch.40](40-lora-how-it-works.html)).

## 5 · Latent → pixels and sound

Two decoders expand $\mathbf{z}_0$. Both outputs are **continuous** — a regression — and are then rescaled into integers:

$$
\mathbf{V} = \left\lfloor \big(\tanh(\mathrm{Dec}_{\text{vid}}(\mathbf{z}_0)) + 1\big)\cdot 127.5 \right\rceil \in [0,255],
\qquad
\mathbf{A} = \left\lfloor \mathrm{Dec}_{\text{aud}}(\mathbf{z}_0)\cdot 32767 \right\rceil \in [-32768,\ 32767]
$$

The "0–255" is a rescale of a continuous value, not a probability distribution over colours. There is no softmax anywhere near a pixel.

That rounding step is also where a great deal of precision quietly dies. A weight stored to four decimal places has to survive fifty blocks and a sixteen-fold spatial expansion before landing in one of 256 integer levels. This is half the reason quantization is nearly free on a diffusion model ([ch.13](13-int8-vs-q4.html)).

### The audio branch shares the same ODE

H3 does not generate a picture and then score it. Video and audio latents are **packed into one sequence** and denoised together by the same velocity field. That is why `audio_in_channels` = 32 sits alongside `in_channels` = 24 in the same transformer config: one model, two kinds of token, one trajectory.

The consequence is structural rather than cosmetic. Because both modalities are inside the same $\mathbf{z}_t$, every attention operation lets an audio token see the video tokens and vice versa, at every step, in every block. Sound and picture are not merely synchronised at the end — they are constrained by each other throughout the integration. A footstep and the foot landing are the same decision, made once.

It also means the audio is not free. Audio tokens add to $N$, and $N$ is the quantity that attention squares. Every cost in §6 is being paid for a joint video-and-audio sequence, not a video-only one.

The two decoders then run separately: $\mathrm{Dec}_{\text{vid}}$ produces frames at 24 fps, $\mathrm{Dec}_{\text{aud}}$ produces 32 kHz stereo, and the two are muxed into a single file. Only at that final stage do the modalities stop being one tensor.

## 6 · The cost model

### 6.1 Where the parameters are

The transformer config gives everything needed to count parameters exactly. With `hidden_size` $d = 5376$, `num_attention_heads` $h = 56$, `attention_head_dim` $d_k = 128$, `ffn_dim` $d_{\text{ffn}} = 14336$ and `time_embed_dim` $d_t = 2688$:

$$
d_{\text{attn}} = h \cdot d_k = 56 \times 128 = 7168
$$

Note that $7168 > 5376$: attention widens the stream by a third before projecting it back down. The three projections $W_Q, W_K, W_V$ plus the output projection therefore give

$$
P_{\text{attn}} = 4 \cdot d \cdot d_{\text{attn}} = 4 \times 5376 \times 7168 = 154{,}140{,}672
$$

The feed-forward network is two matrices, up and down:

$$
P_{\text{ffn}} = 2 \cdot d \cdot d_{\text{ffn}} = 2 \times 5376 \times 14336 = 154{,}140{,}672
$$

And the modulation that injects the timestep — six shift, scale and gate vectors of width $d$, produced from the time embedding:

$$
P_{\text{mod}} = 6 \cdot d_t \cdot d = 6 \times 2688 \times 5376 = 86{,}704{,}128
$$

Divide the other way and each block is about $0.4$ GB. Fifty of them stream in and out of VRAM on every step, so a 23-step render moves roughly

$$
50 \times 0.4\ \text{GB} \times 23 = 460\ \text{GB}
$$

across the bus. On a machine where the model does not fit, **file size is a per-step bandwidth cost**, not just a capacity number.

### 6.2 Time

Total wall-clock splits into a sampling term that scales with NFE, plus fixed serial costs:

$$
T_{\text{total}} = \underbrace{\mathrm{NFE}\cdot T_{\text{fwd}}(N)}_{\text{sampling}} \;+\; \underbrace{T_{\text{enc}} + T_{\text{dec}} + T_{\text{up}}}_{\text{fixed}}
$$

$T_{\text{fwd}}$ grows with sequence length $N$, and $N$ is proportional to resolution × frames — so resolution and length set **both** speed and memory at once, through attention's $\mathcal{O}(N^2)$.

### 6.3 The prediction, and the measurement that beat it

This is where theory meets the render log, and loses.

Compare 832×480 with 1280×704 at the same 345 frames. The latent frame count is identical, so only the spatial patch count changes:

$$
\frac{N_{720}}{N_{480}} = \frac{(704/32)\times(1280/32)}{(480/32)\times(832/32)} = \frac{22 \times 40}{15 \times 26} = \frac{880}{390} = 2.26
$$

Quadratic attention therefore predicts

$$
\left(\frac{N_{720}}{N_{480}}\right)^{2} = 2.26^{2} \approx 5.1\times
$$

The measured cost was **34×**.

<div class="callout truth"><span class="t">Where the missing factor went</span>
<p>$34 / 5.1 \approx 7$. Something outside the mathematics multiplies the cost sevenfold, and it is the sharded three-card path: cards exchanging slices of the sequence, waiting for each other, and recomputing what they cannot hold ([ch.45](45-three-gpu-sequence-parallelism.html)). Quadratic attention is the <em>floor</em> on what a resolution increase costs. The implementation decides how far above that floor the real number lands.</p></div>

This is also the honest answer to "would one 24 GB card be the same as three 8 GB cards?" Mathematically the token count is identical. Practically, the $7\times$ says no.

### 6.4 Amdahl's law bounds every speedup

A faster sampler cannot speed up what is not sampling. With $p$ the fraction of time spent sampling and $s$ the speedup applied to it:

$$
\text{speedup} = \frac{1}{(1-p) + \dfrac{p}{s}}
$$

If sampling were $p = 0.6$ of the wall clock and a distilled sampler delivered $s = 5$:

$$
\text{speedup} = \frac{1}{0.4 + 0.6/5} = \frac{1}{0.52} \approx 1.9\times
$$

A five-fold win on the dominant phase becomes a shade under two-fold overall. And the ceiling as $s \to \infty$ is $1/(1-p) = 2.5\times$ — no sampler, however good, can beat that while the fixed costs stand.

> **Corollary.** Once sampling is cheap, the fixed serial costs — encoder streaming, VAE decode, upscale — become the new wall. Optimising a phase that occupies 10% of the time can never return more than about 11%.

This is why the decode stage deserves more attention than its share of the wall clock suggests. It is not the biggest cost, but it is where two renders died after all the expensive work was already done ([ch.46](46-the-first-15-seconds.html)).

---

## 7 · Peak memory, and the buffer that was the whole 8 GB wall

Profiling on the single-card build decomposed resident VRAM as a fixed part plus a part that grows with frame count:

$$
M_{\text{peak}} = \underbrace{M_{\text{fixed}}}_{\approx\,6.5\text{ GB}} + M_{\text{frames}}(F)
$$

Of the real-tensor portion, about **88%** turned out to be a *single temporary*: the output of an int8 matrix multiply, accumulated in int32 before being scaled back down. For an $[M,N]$ output that is

$$
M_{\text{int8mm}} = M \times N \times \underbrace{4\ \text{bytes}}_{\text{int32}} \approx 2.24\ \text{GB, allocated in one shot}
$$

Two and a quarter gigabytes, on an eight gigabyte card, for a value that is consumed immediately and thrown away.

---

## 8 · The exact optimization, and why it is bit-identical

The int8 linear layer computes $\mathbf{Y} = \mathrm{dequant}(\mathbf{X}_8 W_8^{\top})\cdot s$. The crucial structural fact is that **each row has its own scale $s_i$, and rows never interact**. Row $i$ of the output depends only on row $i$ of the input. So the computation can be blocked over row groups $R_i$, never materialising the full $[M,N]$ tensor:

$$
\mathbf{Y}[R_i,:] = \big(\mathbf{X}_8[R_i,:]\; W_8^{\top}\big) \cdot (s_{R_i}\, s_w),
\qquad \bigcup_i R_i = \{1 \dots M\}
$$

That $\Delta Q = 0$ is the part worth insisting on. This is not an approximation, a trade-off, or a quality setting. It is a rearrangement of the *order* in which identical arithmetic happens, and the proof is not an eyeball comparison — it is bitwise equality of the output tensors.

<div class="callout truth"><span class="t">The most reusable idea in this chapter</span>
<p>Before assuming a memory wall is a capacity problem, look for a temporary. The 8 GB ceiling was not fifty blocks of weights; it was one intermediate tensor that did not need to exist all at once. The same shape of bug reappeared later at 1280×704, where the decoder appended every finished pixel chunk — about 216 MB each — to a GPU-resident list and OOMed at clip 14. Also not a capacity wall. Also a one-line fix ([ch.46](46-the-first-15-seconds.html)).</p></div>

## 9 · What freed memory buys

Headroom is only worth having if it converts into something visible. On the single-card build, roughly 2 GB of freed VRAM went straight into pixels:

$$
\frac{\text{pixels}_{\text{after}}}{\text{pixels}_{\text{before}}}
= \frac{768 \times 448}{576 \times 320}
= \frac{344{,}064}{184{,}320}
= \boxed{1.87\times}
$$

And because $N \propto$ pixels, that $1.87\times$ in area is also $1.87\times$ in sequence length — which, by §6, costs about $3.5\times$ in attention work. Memory bought resolution; resolution charged for it in time. There is no free direction on this graph.

---

## 10 · The six facts worth memorising

1. **Sampling is solving an ODE.** Each step is one full forward pass through 20 billion parameters; $\mathrm{NFE} = S \times$ solver order. Too few steps do not blur the answer, they change it.
2. **Attention is $\mathcal{O}(N^2)$**, and $N$ is resolution × frames — so resolution costs in speed *and* memory simultaneously.
3. **The model file is a bandwidth budget.** 20 GB streamed 50 blocks at a time, 23 times, is 460 GB across the bus per render.
4. **Amdahl governs every speedup.** A $5\times$ win on 60% of the work yields about $1.9\times$ overall, and can never exceed $2.5\times$.
5. **The 8 GB wall was one temporary.** A $2.24$ GB int32 accumulation, chunked over rows, bit-identical, freeing about 2 GB.
6. **Theory sets the floor, not the price.** Attention predicted $5\times$ for the jump to 720p. The implementation charged $34\times$.

## 11 · Where to learn this properly

The derivations above are compressed. These are the sources that make them feel obvious rather than memorised.

**Courses, in difficulty order.** 3Blue1Brown's *Neural Networks* and *Essence of Calculus* build the intuition underneath everything here — gradients, vectors, the chain rule. Karpathy's *Zero to Hero* and `micrograd` construct an autograd engine and a small GPT from nothing, which turns attention from a formula into a hundred lines of code. *How Diffusion Models Work* covers the denoising loop and noise schedules directly.

**Papers, abstract and maths first.** Lipman et al., *Flow Matching for Generative Modeling* (2022) is the exact framework §3 describes. Liu et al. on *Rectified Flow* explains why a trajectory can be straightened so that few Euler steps stay accurate — the theory behind step distillation. Ho et al., *DDPM* (2020) is the ancestor worth reading for contrast. Vaswani et al., *Attention Is All You Need* (2017) is where the $\mathcal{O}(N^2)$ comes from, and Peebles & Xie, *Scalable Diffusion Models with Transformers* (2023) is the DiT backbone H3 uses. For quantization, *LLM.int8()* and the GPTQ line of work.

**Chapters here that go further.** [Ch.15](15-vectors-matrices-signals.html) takes the linear algebra slowly. [Ch.23](23-math-from-scratch.html) rebuilds the mathematics from scratch for readers who want it without the shortcuts. [Ch.34](34-open-use-close-flashattention.html) explains how FlashAttention avoids the 23 GB matrix from §2.

<div class="callout spec"><span class="t">One exercise worth doing by hand</span>
<p>Re-derive <b>§8</b> on paper. Write out the int8 matmul for a tiny $2 \times 2$ case with two different row scales, then split it into two single-row blocks and confirm that every output value is unchanged. It takes about ten minutes and it is the difference between believing the optimization and knowing it.</p></div>
