# Pushing for 720p on 8 GB

<p class="lede">720p was never a question of whether the model could <em>draw</em> it — the answer to that was always yes. It was a question of whether an 8 GB card could hold the working set while it drew. It could not. Three cards later it can, and the result is stranger than a plain yes or no: native 720p works, a fifteen-second clip costs about <b>44 hours</b>, and it is still almost never the right way to obtain a 720p file.</p>

This chapter was written twice. The first version was an investigation that ended in a firm prediction. The second version has to report that the prediction was wrong in the most interesting possible way — not because the reasoning was bad, but because the machine changed underneath it. Both versions are kept, because the gap between them is the actual lesson.

## The core truth: a *fit* problem, not a *capability* problem

MiniMax-H3's native trained canvas is **1344×768**. 720p is comfortably inside it. The model has never been the obstacle.

The obstacle is that a diffusion step is not one operation but a chain of fifty transformer blocks, and while that chain runs, two very different kinds of memory are in play. The **weights** are read-only and used once per block, so they can be fetched, used, and thrown away. The **latent and its activations** are the thing being computed on. They are written to, read back, and carried forward from block to block. They cannot leave the card in the middle of a step, because the next block needs them.

<div class="callout truth"><span class="t">What offloading can and cannot do</span>
<p>Group offloading — whether ComfyUI's "DynamicVRAM" or the explicit diffusers version this build now uses — streams <b>weights</b> in and out of VRAM. It does <b>nothing</b> for the live activation and latent working set, which must stay resident mid-computation. That resident set, driven by <code>width × height × frames</code>, is the true ceiling. This is why no library swap fixes it, and why every "just use X instead" suggestion missed the point.</p></div>

The practical consequence is that resolution and clip length are not two independent dials. They multiply into a single number — the size of the resident tensor — and that number is what either fits or does not. Doubling the frame count costs exactly what doubling the pixel count costs.

Three of those rejections have never needed revising. The first is arithmetic — a different library does not change the resident set. The third is a category error that is worth naming: caching schemes skip redundant work *between* steps, so they shorten a render that already fits. They cannot make one that does not fit start fitting.

The second is worth a warning of its own.

<div class="callout danger"><span class="t">The SageAttention trap</span>
<p>SageAttention is a normal go-to for saving attention memory, and on most models it is a free win. On H3 it is not. Attention routes through an int8 path that produces <b>pure noise</b> — a 55-minute render that completes without a single error message and contains nothing. Research caught this before a run was wasted on it. Keep it off. The general lesson is larger than the specific bug: on a model this new, a "known good" trick is only known good on the models people have tried it on.</p></div>

## What actually worked on 8 GB

With the escape routes closed, the single-card build leaned on four levers applied together.

<table>
<tr><th>Lever</th><th>What it does</th><th>Outcome</th></tr>
<tr><td><b>Tiled VAE decode</b></td><td>Decodes the video in spatial tiles and temporal chunks, so the decode step — the usual OOM point at high resolution — is bounded by tile size rather than by the whole clip</td><td>Right idea, wrong implementation — see below</td></tr>
<tr><td><b><code>--disable-smart-memory</code></b></td><td>Stops the engine caching in a way that triggered the H3 low-VRAM decode crash</td><td>On, in the service file</td></tr>
<tr><td><b><code>--reserve-vram 0.6</code></b></td><td>Leaves headroom so the OS and the decoder are not squeezed out of the last few hundred megabytes</td><td>On — measurably fewer OOMs</td></tr>
<tr><td><b><code>expandable_segments</code></b></td><td>A PyTorch allocator setting that reduces fragmentation, so a large allocation can still find a contiguous home late in a run</td><td>On, as an environment variable</td></tr>
</table>

Together these brought generation at **1024×576** down to roughly **5.7 GB of VRAM** — comfortable headroom on a card where 720p had been OOMing outright.

<div class="callout warn"><span class="t">The tiled-decode detail that had to be corrected</span>
<p>The original plan named a specific node, <code>VAEDecodeTiled</code>, with tile 128 and overlap 32. That node turned out to be <b>incompatible with H3</b>: H3's latent is a NestedTensor, and the node cannot take one. The idea survived; the implementation did not. What actually does the tiling is the VAE's <em>own</em> built-in support, which is <b>on by default</b> at 256×256 tiles with 64 px of overlap. The lever was already in the model. It just had to stop being fought.</p></div>

That correction is a small example of a pattern that repeats through this whole guide. The mechanism was reasoned about correctly — bound the decode by tile size, not by clip size — and the first concrete component chosen to deliver it was wrong. Being right about the mechanism is what makes the second attempt cheap.

## The prediction

Here is what the first version of this chapter concluded, quoted exactly:

> **Native max ≈ 1024×576** for a short clip. Native 1280×720 is not reliable on 8 GB.
>
> **720p output is achieved by upscaling** — a real, production-standard route to a genuine 720p file.
>
> For long *and* high-res, the honest answer is a bigger GPU (24 GB+) or a rented cloud one.

Every sentence of that was correct for the machine it described. The last one turned out to be a prophecy — 24 GB did arrive, just not in the shape anyone pictured. It arrived as **three** 8 GB cards, and splitting one video across three cards is a very different animal from having one big card ([ch.45](45-three-gpu-sequence-parallelism.html)).

## What actually happened

Native 1280×704 works. Not marginally, not as a curiosity — it produces clips described in the render log as *beautiful*.

<div class="callout spec"><span class="t">The measured renders that overturned the prediction</span>
<table>
<tr><th>Scene</th><th>Resolution × frames</th><th>Steps</th><th>Time</th><th>s/step</th><th>Result</th></tr>
<tr><td><code>an1</code></td><td><b>1280×704</b> × 124 (5 s)</td><td>23</td><td>3295 s (55 min)</td><td>143 s</td><td><b>beautiful</b></td></tr>
<tr><td><code>e720hq</code></td><td>1280×704 × 124</td><td>23</td><td>3486 s (58 min)</td><td>152 s</td><td>good</td></tr>
<tr><td><code>g4k</code></td><td>1280×704 × 345 (14.4 s)</td><td>3</td><td>~5.5 h</td><td>6600 s</td><td><b>mud</b></td></tr>
<tr><td><code>g4final</code></td><td>1280×704 × 345</td><td>23</td><td>~44 h</td><td>6845 s</td><td>in progress</td></tr>
</table>
<p>The prediction said 1280×720 was not reliable. On one card it was not. On three, it is a routine capability with a brutal price tag.</p></div>

Notice the shape of that table. Going from 124 frames to 345 at the same resolution does not triple the per-step cost — it multiplies it by roughly **48**, from 143 s to 6845 s. That is the quadratic cost of attention plus the extra overhead of coordinating three cards, and it is the single most important number in the entire build.

Notice also `g4k`. It is the same 345-frame shot at 3 steps instead of 23, and it cost five and a half hours to produce something unusable. **Steps are not a quality slider that can be turned down when a render is expensive.** Step count is a property of the *scene*: a tight close-up settles at 4, a character mid-shot at 23, a wide vista with a small distant subject needs 49. A wide 720p shot at 3 steps is not a rough version of the same clip. Its composition never had time to resolve, so it is mud.

<p>Native 720p × 15 s <b>works</b> and costs about <b>44 hours</b> at 23 steps, or something closer to 90 at 49. The same fifteen seconds at 832×480 and 49 steps is <b>2.6 hours of denoise</b>, followed by a 1.54× upscale — roughly <b>35× cheaper</b> for a difference most viewers cannot see. Proving the machine can do a thing and choosing to do it that way are separate decisions, and conflating them is how a render queue turns into a two-day wait for one shot.</p></div>

The original chapter got the *shape* of this right and the numbers wrong. It proposed generating at 1024×576 and upscaling 4× before downsampling to 720p. The route that survived generates lower still, at 832×480, spends the savings on more denoise steps, and upscales by a modest 1.54×. Fewer pixels, better-resolved pixels, a gentler upscale. That reordering — buying sampling quality with resolution — is the most transferable finding in this chapter.

The VAE compresses space by a factor of 16, and the transformer then groups the result into 2×2 patches — `patch_size` is `[1,2,2]` in the config. So a dimension has to survive *two* divisions. 848 ÷ 16 = 53, which is odd, and the patching fails with a tensor-shape mismatch that mentions only tensor dimensions. Hours can go into debugging the wrong layer. The rule is small and worth memorising: **after dividing by 16, the result must still be even.**

## Things from the first version that did not survive

Three more items from the original chapter deserve an honest update.

**The Turbo-LoRA.** The first version identified a distilled LoRA that cuts sampling from around 20 steps to 4–6 — roughly a 5× speedup — and called it "the single biggest speed win available." It was never wired into this pipeline. The one LoRA that *was* tried, at 480p, **softened the image**; the base model was sharper. That is one experiment on one scene, not a verdict on LoRAs in general ([ch.40](40-lora-how-it-works.html)), but it is the only measurement this build has, and it points the other way from the prediction. There is also a ceiling on how much a sampling speedup can buy: once denoise is cheap, the fixed costs — encoding, decoding, upscaling — become the wall ([ch.14](14-the-math-behind-it.html)).

**"A bigger GPU (24 GB+)."** 24 GB arrived, as three cards. Splitting a single video's sequence across three cards is not equivalent to one 24 GB card: going from 832×480×345 to 1280×704×345 is 2.26× the tokens, and quadratic attention predicts about 5× the time. The measured cost was **34×**. The sharded path therefore carries roughly **7× of overhead** beyond what the mathematics accounts for — communication between cards, redundant work, and synchronisation. Capacity was bought. Efficiency was not.

**Two settings that must stay off.** `ring-3` context parallelism OOMs, because offloading re-copies weights per process. And `use_stream=True` on offloading pins tens of gigabytes and gets the process OOM-killed by the kernel with no traceback at all — the worst failure mode there is, because there is nothing to read afterwards.

## What is still true

<div class="callout warn"><span class="t">Limits that have not moved</span>
<ul>
<li><b>2K is not available locally in any stack.</b> It requires a regenerate-2K model that has not been open-sourced — API only.</li>
<li><b>Readable on-screen text remains impossible.</b> No current video diffusion model spells; letters come out as plausible-looking marks.</li>
<li><b>Identity drifts across chained clips</b> for photoreal faces. Stylised characters hold far better ([ch.33](33-long-video-small-card.html)).</li>
<li><b>The 15-second ceiling is the model's trained range</b>, not a hardware limit. More VRAM would not extend it.</li>
</ul>
</div>

And the decode stage remains the most dangerous part of a long render, because it runs last. `g4k` denoised for hours and then hit an OOM at clip 14 of the decode — not a capacity wall, but an accumulation bug: every finished pixel chunk was being appended to a GPU-resident list, each around 216 MB at 1280×704. A sibling run, `g4j`, completed **6 hours 10 minutes** of denoise and died on the first line of decode over a device mismatch. Both were one-line fixes. Both cost most of a day ([ch.46](46-the-first-15-seconds.html)).

## The method, which outlasted every number in this chapter

<div class="callout truth"><span class="t">What the two versions of this chapter have in common</span>
<p>Do not accept "it can't" and do not assume "it can". Find the specific mechanism — here, that the resident activation set is what does not fit, and that offloading only ever touched weights — then verify it on the actual hardware, then build the pipeline the constraint allows. The mechanism held perfectly. The <em>conclusion</em> drawn from it expired the moment the hardware changed, which is exactly what a well-reasoned conclusion is supposed to do.</p></div>
